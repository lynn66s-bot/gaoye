<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>高業極速刷題</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky bar (subject tabs → chapter chips with progress → level/filter) ; one question card ; number grid. */
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#18212b; --muted:#5f6c79; --line:#dbe1e7; --chip:#e9edf1;
  --brand:#1f5fa8; --brand-soft:#e4eef9;
  --ok:#1f8a55; --ok-soft:#e2f4ea; --no:#c4362f; --no-soft:#fbe6e4; --warn:#a86a00; --warn-soft:#fdf1da;
  --doing:#3b6fb0; --doing-soft:#eaf1fa;
  --done:#0f7a5c; --done-soft:#dcf3ea; --gold:#c08a12;
  --star:#e0a100;
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --card:#171e26; --ink:#e6ebf0; --muted:#98a5b2; --line:#2a3440; --chip:#202a35;
  --brand:#7fb2ec; --brand-soft:#1b2a3c; --ok:#5fcf95; --ok-soft:#14301f; --no:#ff8a80; --no-soft:#3a1c1a; --warn:#f2b84b; --warn-soft:#352812;
  --doing:#8fb8ea; --doing-soft:#1a2738; --done:#4fd1a5; --done-soft:#0f2e25; --gold:#f0c45a; --star:#ffc93c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --card:#171e26; --ink:#e6ebf0; --muted:#98a5b2; --line:#2a3440; --chip:#202a35;
  --brand:#7fb2ec; --brand-soft:#1b2a3c; --ok:#5fcf95; --ok-soft:#14301f; --no:#ff8a80; --no-soft:#3a1c1a; --warn:#f2b84b; --warn-soft:#352812;
  --doing:#8fb8ea; --doing-soft:#1a2738; --done:#4fd1a5; --done-soft:#0f2e25; --gold:#f0c45a; --star:#ffc93c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6}
button{font-family:inherit}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.in{max-width:760px;margin:0 auto;padding-left:16px;padding-right:16px}
.bar .in{padding-block:10px;display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:18px;font-weight:900;margin:0;letter-spacing:.02em}
h1 span{color:var(--brand)}
.tabs{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:10px}
.tab{border:0;background:transparent;color:var(--muted);font:700 14px var(--f);padding:6px 12px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sync{margin-left:auto;font:500 12px var(--f);color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--ok)} .sync.wait{color:var(--warn)} .sync.err{color:var(--no)}

/* chapter chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:9px;margin-top:-7px;padding-bottom:3px;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;display:grid;gap:0;justify-items:start;border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:6px 11px 5px;cursor:pointer;min-width:84px;text-align:left;align-content:start;position:relative}
.chipb .cn{font:600 11px var(--f);opacity:.85;white-space:nowrap}
.chipb .ct{font:700 14px/1.3 var(--f);max-width:8.2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-block:1px 2px}
.chipb .cp{font:600 11px var(--m);font-variant-numeric:tabular-nums;white-space:nowrap}
.chipb.doing{border-color:color-mix(in srgb,var(--doing) 45%,var(--line));background:var(--doing-soft);color:var(--doing)}
.chipb.done{border-color:var(--done);background:var(--done-soft);color:var(--done)}
.chipb.done::after{content:"✓";position:absolute;top:-7px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#fff;font:900 11px/18px var(--f);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chipb.fav{color:var(--star);background:color-mix(in srgb,var(--star) 8%,var(--card));border-color:color-mix(in srgb,var(--star) 55%,var(--line))}
.chipb[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:1px}
.chipb.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}

.chead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.chead b{font-size:15px}
.badge{font:700 12px var(--f);border-radius:999px;padding:1px 9px;white-space:nowrap}
.badge.idle{background:var(--chip);color:var(--muted)}
.badge.doing{background:var(--doing-soft);color:var(--doing)}
.badge.done{background:var(--done-soft);color:var(--done)}

.sw{display:flex;align-items:center;gap:6px;font:500 14px var(--f);cursor:pointer;user-select:none}
.sw input{appearance:none;width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.sw input::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked{background:var(--no)}
.sw input:checked::after{left:18px}
.stats{display:flex;align-items:center;gap:10px;font:500 13px var(--m);color:var(--muted);font-variant-numeric:tabular-nums}
.track{flex:1;height:6px;background:var(--chip);border-radius:3px;overflow:hidden;min-width:60px}
.fill{height:100%;background:var(--brand);width:0;transition:width .25s}
.fill.done{background:var(--done)}

main.in{padding-block:16px 40px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;min-width:0;position:relative}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);padding-right:44px}
.qno{font:600 13px var(--m);color:var(--brand)}
.tag{background:var(--chip);border-radius:4px;padding:1px 8px}
.hot{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 8px;font-weight:700}
.from{color:var(--muted)}
.star{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.star[aria-pressed="true"]{color:var(--star);border-color:var(--star);background:color-mix(in srgb,var(--star) 12%,var(--card))}
.star:active{transform:scale(.92)}
.stem{font-size:18px;font-weight:700;margin:0;line-height:1.55}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:16px var(--f);color:var(--ink);cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
.opt:disabled{cursor:default}
.let{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:600 13px var(--m);color:var(--muted);margin-top:1px}
.opt .tx{min-width:0}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-soft)}
.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.verdict{font-weight:900;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.panel{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.pi{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;border-radius:8px;padding:10px 12px}
.pi b{white-space:nowrap;font-size:14px}
.pi p{margin:0;font-size:15px;min-width:0}
.pi.f{background:var(--brand-soft)} .pi.f b{color:var(--brand)}
.pi.t{background:var(--chip)}
.pi.w{background:var(--warn-soft)} .pi.w b{color:var(--warn)}
.nav{display:flex;justify-content:space-between;gap:8px}
.btn{font:700 15px var(--f);padding:10px 18px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--card);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
:is(.btn,.opt,.tab,.cell,.chipb,.star,.sw input):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);font:600 13px var(--m);color:var(--muted);cursor:pointer;position:relative}
.cell.cur{border:2px solid var(--brand);color:var(--brand)}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.cell.no{background:var(--no-soft);color:var(--no);border-color:var(--no)}
.cell.fv::after{content:"★";position:absolute;top:-6px;right:-3px;font-size:11px;color:var(--star)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.gh h2{font-size:15px;color:var(--ink);margin:0}
.link{background:none;border:0;color:var(--brand);font:500 14px var(--f);cursor:pointer;padding:0}
.empty{text-align:center;display:grid;gap:10px;justify-items:center;padding-block:20px}
.empty .big{font:600 40px var(--m);color:var(--ok)}
.empty p{margin:0;color:var(--muted)}
.clear{text-align:center;display:grid;gap:6px;justify-items:center;padding:14px;border-radius:12px;background:var(--done-soft);color:var(--done);border:1.5px solid var(--done)}
.clear .medal{font-size:30px;line-height:1}
.clear b{font-size:16px}
@media (max-width:480px){.stem{font-size:17px}.card{padding:16px}}
@media (prefers-reduced-motion:reduce){.fill,.sw input,.sw input::after{transition:none}.chipb.pop{animation:none}}

/* 錯題階梯警示 */
:root{--e1:#e07b00;--e1-soft:#fff0d6;--e2:#d62b22;--e2-soft:#fde3e0;--e3:#6a1fa3;--e3-soft:#f1e5fb;--hotc:#d9480f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--e1:#ffad42;--e1-soft:#3a2a10;--e2:#ff6b5e;--e2-soft:#3d1a17;--e3:#c48bff;--e3-soft:#2c1940;--hotc:#ff8a4c}}
:root[data-theme="dark"]{--e1:#ffad42;--e1-soft:#3a2a10;--e2:#ff6b5e;--e2-soft:#3d1a17;--e3:#c48bff;--e3-soft:#2c1940;--hotc:#ff8a4c}
.cell.e1{background:var(--e1-soft);color:var(--e1);border:2px solid var(--e1)}
.cell.e2{background:var(--e2-soft);color:var(--e2);border:2px solid var(--e2)}
.cell.e3{background:var(--e3);color:#fff;border:2px solid var(--e3);box-shadow:0 0 0 2px var(--e3-soft),0 0 10px color-mix(in srgb,var(--e3) 70%,transparent);font-weight:800}
.cell.cur{outline:2.5px solid var(--brand);outline-offset:2px}
.card.q{transition:border-color .2s,box-shadow .2s}
.card.q.e1{border:2.5px solid var(--e1)}
.card.q.e2{border:2.5px solid var(--e2)}
.card.q.e3{border:3px solid var(--e3);box-shadow:0 0 0 3px var(--e3-soft),0 0 22px color-mix(in srgb,var(--e3) 45%,transparent)}
.errt{justify-self:start;font:800 13px var(--f);border-radius:6px;padding:3px 10px;margin-bottom:-4px}
.errt.e1{background:var(--e1-soft);color:var(--e1)}
.errt.e2{background:var(--e2-soft);color:var(--e2)}
.errt.e3{background:var(--e3);color:#fff}
.chipb.hotc{color:var(--muted)}
.chipb.hotc.on{color:var(--hotc);border-color:color-mix(in srgb,var(--hotc) 60%,var(--line));background:color-mix(in srgb,var(--hotc) 10%,var(--card))}
.badge.hotb{background:color-mix(in srgb,var(--hotc) 14%,var(--card));color:var(--hotc);white-space:normal}
.hotmsg{font:700 14px var(--f);border-radius:8px;padding:8px 12px;background:var(--e1-soft);color:var(--e1)}
.hotmsg.out{background:var(--ok-soft);color:var(--ok)}
.hotmsg.bad{background:var(--e2-soft);color:var(--e2)}
.resume{justify-self:start;font:700 13px var(--f);color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:3px 10px;margin-bottom:-6px}
.wipe{display:grid;justify-items:center;gap:6px;padding-top:8px}
.wipeb{font:700 14px var(--f);color:var(--no);background:transparent;border:1.5px dashed color-mix(in srgb,var(--no) 55%,var(--line));border-radius:10px;padding:9px 16px;cursor:pointer}
.wipeb.armed{background:var(--no);color:#fff;border-style:solid;border-color:var(--no)}
.wipe small{color:var(--muted);font-size:12px;text-align:center}
#wipemsg{color:var(--ok);font-size:13px;font-weight:700;min-height:1em}
.expb{font:700 13px var(--f);border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.expb:hover{border-color:var(--brand);color:var(--brand)}
.expmsg{margin:0;font-weight:700;color:var(--ok)}
.exptext{width:100%;min-height:180px;max-height:45vh;font:13px/1.6 var(--m),var(--f);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}

/* ===== 沉浸模式 ===== */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;border-bottom:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(-104%);visibility:hidden;transition:transform .26s ease,visibility 0s .26s}
.bar.open{transform:none;visibility:visible;transition:transform .26s ease,visibility 0s}
.bar .in{padding-block:12px 14px}
.bar .r1{padding-right:52px}
.bar:not(.pinned) .more{display:none}
.chips{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.more{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.stats{flex-wrap:wrap;gap:4px 12px}
.expb{margin-left:auto;padding:8px 14px;font-size:14px;border-color:var(--brand);color:var(--brand)}
.expbox{display:grid;gap:6px}.expbox[hidden]{display:none}
.sw-ok input:checked{background:var(--ok)}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(10,14,20,.38)}
.burger{position:fixed;z-index:40;top:max(10px,env(safe-area-inset-top));right:12px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;opacity:.6;transition:opacity .2s;display:grid;place-items:center}
.burger:hover,.burger[aria-expanded="true"]{opacity:1}
.ptop{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;background:transparent}
.ptop .fill{height:100%;background:var(--brand);width:0;transition:width .25s}
.ptop .fill.done{background:var(--done)}
main.in{padding-top:62px;min-height:100vh;align-content:start}
@media (min-width:900px){main.in{padding-top:34px}}
.nav .btn{font-size:14px;padding:8px 16px}
.nav .btn:not(.ghost){background:transparent;color:var(--muted);border-color:var(--line)}
.quick{display:flex;gap:10px;align-items:baseline;border-radius:10px;padding:10px 12px;background:var(--ok-soft);position:relative;overflow:hidden}
.quick .verdict{flex:none}
.quick p{margin:0;font-size:15px;min-width:0}
.cd{position:absolute;left:0;bottom:0;height:3px;background:var(--ok);width:100%;transform-origin:left;animation:cd .8s linear forwards}
@keyframes cd{to{transform:scaleX(0)}}
.hint{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.hint kbd{font:600 11px var(--m);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--card)}
.hint .ht{display:none}
@media (hover:none),(pointer:coarse){.hint .hk{display:none}.hint .ht{display:inline}}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));z-index:50;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--card);font:700 14px var(--f);padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.card.q{cursor:default}
@media (prefers-reduced-motion:reduce){.bar,.toast,.ptop .fill{transition:none}.cd{animation:none}}
.syncbox{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.syncbox h2{font-size:15px;margin:0}
.syncbox[hidden]{display:none}
.note{margin:0;font-size:13px;color:var(--muted)}
.tin{flex:1;min-width:0;font:14px var(--m);padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.pcode{min-height:70px}
</style>

<div class="ptop" aria-hidden="true"><div class="fill" id="fill"></div></div>
<button class="burger" id="burger" type="button" aria-label="開啟選單" aria-expanded="false" aria-controls="bar">☰</button>
<div class="scrim" id="scrim" hidden></div>
<aside class="bar" id="bar" aria-label="控制面板"><div class="in">
  <div class="row r1">
    <h1>高業<span>極速刷題</span></h1>
    <div class="tabs" role="tablist" id="tabs"></div>
    <span class="sync" id="sync"></span>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="章節"></div>
  <div class="chead" id="chead"></div>
  <div class="row">
    <div class="tabs" role="tablist" id="lvTabs"><button class="tab" role="tab" type="button" data-l="k" aria-selected="true">重點題</button><button class="tab" role="tab" type="button" data-l="all" aria-selected="false">含進階題</button></div>
    <label class="sw" for="wrongOnly"><input type="checkbox" id="wrongOnly">只看錯題</label>
    <label class="sw sw-ok" for="autoNext"><input type="checkbox" id="autoNext">答對自動跳題</label>
  </div>
  <div class="row">
    <div class="stats"><span id="prog">0 / 0</span><span id="rate">正確率 —</span><span id="wcount"></span></div>
    <button class="expb" id="export" type="button">📋 一鍵複製錯題紀錄</button>
  </div>
  <section class="expbox" id="expbox" hidden>
    <p id="expmsg" class="expmsg" role="status"></p>
    <textarea id="exptext" class="exptext" readonly></textarea>
  </section>
  <div class="more">
    <section class="syncbox" id="ghbox" hidden>
      <h2>☁️ 雲端同步（GitHub）</h2>
      <div id="ghoff"><p class="note">貼上 GitHub 同步密碼，三台裝置的紀錄就會互通。每台裝置只要貼一次。</p>
        <div class="row"><input type="password" id="ghtok" class="tin" placeholder="貼上 ghp_ 開頭的同步密碼" autocomplete="off"><button class="expb" id="ghgo" type="button">連結</button></div></div>
      <div id="ghon" hidden><p class="note">✅ 已連結 <b id="ghwho"></b>，紀錄會自動同步。<button class="link" id="ghunlink" type="button">取消連結</button></p></div>
      <p class="note" id="ghmsg" role="status"></p>
    </section>
    <section class="syncbox">
      <h2>📦 進度碼（搬移紀錄用）</h2>
      <p class="note">在舊網址按「匯出」，到新網址貼上後按「匯入」，錯題、收藏、中斷點都會搬過去。</p>
      <textarea id="pcode" class="exptext pcode" placeholder="進度碼會出現在這裡，或把進度碼貼在這裡"></textarea>

 {f:3,s:"114-1",tag:"折溢價",q:"一債券票面利率 7%，面額 2,000 元，10 年後到期，每年付息一次，目前殖利率為 7%，此債券目前價格為：",o:["2,200 元","2,000 元","1,000 元","1,800 元"],a:1,
  fl:"票面利率 ＝ 殖利率 ➔ 平價 ➔ 價格 ＝ 面額。",th:"票面利率和市場要求的報酬一樣，不用打折也不用加價。",tr:"看到 10 年、每年付息，就以為要慢慢算，其實一秒可選。"},
 {f:2,s:"112-2",tag:"存續期間",q:"三年期、每年付息一次並重設票息的浮動利率債券，發行三個月後市場指標利率下跌，信用風險不變，此債券的存續期間約為多少？",o:["0.68 年","0.75 年","1.50 年","2.75 年"],a:1,
  fl:"浮動利率債 ➔ 存續期間 ＝ 距下次重設日。",th:"每年重設一次，已經過了 3 個月，離下次重設還有 9 個月，也就是 0.75 年。",tr:"不用理會指標利率變多少，那是干擾資訊。"},
 {f:2,s:"113-1",tag:"利率期限結構",q:"若殖利率曲線為正斜率，在流動性偏好理論中，投資人認為：",o:["短期債券比長期債券有較高的報酬率","長短期債券有相同的報酬率","長期債券比短期債券有較高的報酬率","以上皆有可能"],a:2,
  fl:"流動性偏好 ➔ 長期債流動性差 ➔ 要多給報酬。",th:"錢被綁得越久，越需要補償，所以長期利率較高，曲線向上。",tr:"「相同報酬」是預期理論的說法，不是流動性偏好。"},
 {f:2,s:"113-2",tag:"折溢價",q:"假設期望殖利率固定不變，債券愈趨近到期日時：甲.折價債券價格會趨近債券面額；乙.溢價債券價格會趨近債券面額；丙.溢價債券價格會遠離債券面額",o:["僅甲、乙","僅甲、丙","僅乙、丙","甲、乙、丙"],a:0,
  fl:"快到期 ➔ 不管折價溢價，價格都回到面額。",th:"到期時一定是還面額，所以價格會逐漸向面額靠攏。",tr:"丙說「遠離」，方向完全相反。"},
 {f:2,s:"113-3",tag:"馬凱爾",q:"下列敘述何者「不正確」？",o:["短期利率波動幅度會大於長期利率","當市場利率高於債券票面利率時，債券將折價發行","當市場利率高於票面利率時，公司較不可能將債券贖回","短期債券對利率變動之敏感度高於長期債券"],a:3,
  fl:"敏感度 ➔ 長期債 ＞ 短期債。",th:"長期債的存續期間較長，對利率較敏感。",tr:"D 把長短期對調了。注意 A 說的是「利率本身」的波動，這是對的。"},
 {f:2,s:"114-1",tag:"存續期間",q:"下列何者是影響債券存續期間的因素？甲.到期期間；乙.票面利率；丙.到期收益率；丁.票面值",o:["僅甲、丙","僅乙、丙、丁","僅甲、乙、丙","甲、乙、丙、丁皆是"],a:2,
  fl:"存續期間三因素 ➔ 到期期間、票面利率、殖利率；面額無關。",th:"到期越長，存續期間越長；票面利率和殖利率越高，越早回本，存續期間越短。",tr:"面額只是放大縮小金額，不影響回本時間。"},
 {f:2,s:"114-2",tag:"存續期間",q:"在債券投資時，利用存續期間之觀念，可規避：",o:["匯率風險","通貨膨脹風險","贖回風險","利率風險"],a:3,
  fl:"存續期間、免疫策略 ➔ 規避利率風險。",th:"讓投資組合的存續期間等於持有期間，利率漲跌造成的價格損益和再投資損益會互相抵銷。",tr:"免疫策略不能消除違約風險或匯率風險。"},
 {f:2,s:"114-2",tag:"存續期間",q:"下列何種債券有可能出現到期期間越長，存續期間反而縮短的情況？",o:["平價債券","深度溢價債券","深度折價債券","以上皆非"],a:2,
  fl:"到期越長存續期間反而變短 ➔ 深度折價債券。",th:"這是公式推導的特例，不需理解，直接背。",tr:"把「折價」和「溢價」看清楚。"},
 {f:2,s:"115-1",tag:"馬凱爾",q:"甲、乙兩種相同票面利率、面額及殖利率的政府債券，均屬溢價債券，甲尚餘 4 年到期、乙尚餘 2 年到期，則：",o:["甲債券溢價額較乙債券溢價額大","甲債券溢價額與乙債券溢價額相等","甲債券溢價額較乙債券溢價額小","無法比較"],a:0,
  fl:"到期越長 ➔ 離面額越遠 ➔ 溢價額越大。",th:"越接近到期，價格越靠近面額；離到期越遠，溢價越多。",tr:"看到「相同條件」就選相等，是陷阱。"},
 {f:2,s:"115-1",tag:"存續期間",q:"下列敘述何者正確？",o:["債券到期期限愈短，利率風險愈大","債券的存續期間愈長，利率風險愈高","債券的票面利率愈低，利率風險愈低","低票面利率債券之利率敏感性低於高票面利率債券"],a:1,
  fl:"存續期間越長 ➔ 利率風險越高。",th:"存續期間就是衡量利率風險的指標。票面利率越低，存續期間越長，風險越高。",tr:"A、C、D 都把方向說反了。"},
 {f:2,s:"115-2",tag:"折溢價",q:"10 年到期公債，票面利率 8%，目前到期殖利率 12%，若利率維持不變，一年後此債券價格將：",o:["上漲","下跌","不變","無法判定"],a:0,
  fl:"殖利率 ＞ 票面利率 ➔ 折價 ➔ 隨時間上漲回面額。",th:"折價債券越接近到期，價格越往面額靠，所以會上漲。",tr:"看到利率「12% 很高」就選下跌，但題目說利率不變。"},
 {f:2,s:"115-2",tag:"利率期限結構",q:"在利率期限結構的市場區隔理論中，如果長期利率下跌，則短期利率將：",o:["上漲","不受影響","下跌","選項 A、B、C 皆非"],a:1,

 {f:2,s:"115-1",tag:"利率期限結構",q:"利率期限結構是利用下列何者導出？",o:["可轉換公司債","永續債券","無風險零息公債","特別股"],a:2,
  fl:"殖利率曲線 ➔ 無風險零息公債。",th:"用沒有違約風險、中間不付息的公債，才能單純看出期限和利率的關係。",tr:"永續債券沒有到期日，畫不出期限。"},
 {f:2,s:"111-1",tag:"債券評價",q:"甲債券 6 個月的折現因子為 0.97，6 個月後該債券價格為 15,000 元，目前該債券的價格為多少？",o:["14,700 元","14,550 元","15,000 元","16,000 元"],a:1,

 {lv:"a",f:1,s:"114-2",tag:"存續期間",q:"債券（面額 100 元）價格對殖利率的一階導數 dP/dY ＝ －49 元，當利率上升 100bp，債券價格將：",o:["下跌 0.49 元","下跌 4.9 元","上漲 0.49 元","上漲 4.9 元"],a:0,

 {lv:"a",f:1,s:"114-2",tag:"存續期間",q:"關於債券存續期間的意涵，下列描述何者為「非」？",o:["表示債券的到期期間","衡量債券各期現金流入的平均到期期間","是債券價格變動對利率變動的敏感程度","存續期間越長，表示債券的利率風險越高"],a:0,
  fl:"存續期間 ≠ 到期期間（只有零息債才相等）。",th:"存續期間是平均回本時間。付息債每年都拿到利息，回本比到期日早。",tr:"A 把兩個概念劃上等號。"},
 {lv:"a",f:1,s:"113-3",tag:"存續期間",q:"債券之免疫投資策略主要是在規避何種風險？",o:["違約風險","利率風險","贖回風險","流動性風險"],a:1,
  fl:"免疫策略 ➔ 利率風險。",th:"讓存續期間等於持有期間，利率漲跌的影響會互相抵銷。",tr:"免疫策略只能處理利率，其他風險都不能規避。"}

 {f:2,s:"113-3",tag:"公司行為",q:"何者會改變公司之每股淨值？甲.盈餘轉增資；乙.發放現金股利；丙.依規定提撥法定盈餘公積；丁.股票分割",o:["僅甲、丙","僅乙、丙、丁","僅甲、乙、丁","甲、乙、丙、丁均會"],a:2,
  fl:"提撥法定盈餘公積 ➔ 只是權益內部搬家，每股淨值不變。",th:"盈餘轉增資和股票分割讓股數變多，現金股利讓淨值變少，三者都會改變每股淨值。",tr:"丙看起來動到盈餘，其實權益總額和股數都沒變。"},
 {f:2,s:"113-3",tag:"股利模式",q:"甲公司未來兩年不發股利，第三年底發每股 3 元，之後每年成長 4%，要求報酬率 10%，目前每股合理價格為？",o:["50 元","52 元","41.32 元","42.98 元"],a:2,
  fl:"延後發股利 ➔ 先算第 2 年底價格，再折回今天。",th:"第 2 年底股價 = 3 ÷（10% − 4%）= 50 元，再折現 2 年：50 ÷ 1.1² ≈ 41.32 元。",tr:"50 元是第 2 年底的價格，忘了折現就會選錯。"},
 {f:2,s:"114-1",tag:"報酬率",q:"小王兩年投資某股票，第一年從 120 元漲到 170 元，第二年又跌回 120 元，何者較能合理評估平均年報酬率？",o:["算術平均法，0%","算術平均法，6.3%","幾何平均法，0%","幾何平均法，6.3%"],a:2,
  fl:"真實平均報酬 ➔ 幾何平均；回到原價 ➔ 0%。",th:"兩年後股價回到 120 元，實際上沒賺沒賠，幾何平均才會算出 0%。",tr:"算術平均會算出約 6.3%，高估了報酬。"},
 {f:2,s:"114-1",tag:"股票類型",q:"保守的投資人應該投資下列哪一種股票？",o:["高本益比股票","低本益比股票","低淨值市價比股票","高市價現金流量比股票"],a:1,
  fl:"保守 ➔ 價值股 ➔ 低本益比、低市價淨值比。",th:"低本益比代表股價相對便宜，下跌空間比較小。",tr:"「低淨值市價比」等於「高市價淨值比」，是成長股，別看反。"},
 {f:2,s:"114-1",tag:"股利模式",q:"某公司每股發放股利 2 元，股利零成長，必要報酬率 8%，每股預期價值為：",o:["20 元","30 元","33.3 元","25 元"],a:3,
  fl:"零成長 ➔ 股利 ÷ 要求報酬率。",th:"2 ÷ 8% = 25 元。",tr:"一步就能算出來，不要想太多。"},
 {f:2,s:"114-1",tag:"公司行為",q:"公司採權益法評價之長期股權投資，若獲配發現金股利，對當年度報表的影響何者正確？",o:["流動比率增加","流動比率減少","流動比率不變","無法判斷"],a:0,
  fl:"權益法收到現金股利 ➔ 現金增加、長期投資減少 ➔ 流動比率上升。",th:"現金是流動資產，長期投資是非流動資產。流動資產增加、流動負債不變，比率就上升。",tr:"權益法收到股利不算收入，但現金確實增加了。"},
 {f:2,s:"114-2",tag:"報酬率",q:"以 45 元買入甲公司股票，第一年發現金股利 0.3 元，第二年每張配發 200 股，第三年初至少要以每股多少元賣出，報酬率才大於 20%？",o:["42 元","43 元","44 元","45 元"],a:3,x:1,
  fl:"每張配 200 股 ➔ 股數變 1.2 倍。",th:"賣價 × 1.2 + 0.3 − 45 ＞ 45 × 20% = 9，賣價 ＞ 44.75，取 45 元。",tr:"多步驟計算，時間不夠可以放生。"},
 {f:2,s:"114-2",tag:"除權息",q:"國內上市股票現金增資除權參考價的計算，必須考慮哪些因素？甲.除權日之收盤價；乙.現金增資發行價格；丙.現金增資配股率",o:["僅甲、乙","僅甲、丙","僅乙、丙","甲、乙、丙都不需要考慮"],a:2,
  fl:"除權參考價 ➔ 用「除權前一日」收盤價，不是除權日。",th:"公式：（除權前一日收盤價 + 認購價 × 配股率）÷（1 + 配股率）。",tr:"甲寫「除權日」是陷阱，正確是除權「前一日」。"},
 {f:2,s:"114-2",tag:"基本分析",q:"以基本分析評估公司真實價值時，須考量的因素有：甲.總體經濟面；乙.各類產業環境；丙.個別公司特質；丁.歷史股價；戊.歷史成交量",o:["僅甲、乙","僅甲、乙、丙","僅丁、戊","甲、乙、丙、丁、戊"],a:1,
  fl:"基本分析 ➔ 總經、產業、公司；歷史價量屬技術分析。",th:"基本分析找的是公司真正值多少錢，看的是經濟、產業和公司本身。",tr:"歷史股價和成交量是技術分析的工具。"},
 {f:2,s:"114-3",tag:"股利模式",q:"要求報酬率均為 12%，兩股票明年都發 2 元股利，甲每年成長 9%、乙成長 8%，甲股票價格應較乙：",o:["高","低","相同","無法計算"],a:0,
  fl:"其他條件相同 ➔ 成長率越高，股價越高。",th:"甲：2 ÷ 3% ≈ 66.7；乙：2 ÷ 4% = 50。",tr:"不用真的算，成長率高的分母小，股價一定比較高。"},
 {f:2,s:"115-1",tag:"股價指數",q:"下列何種股價指數最能模擬市場投資組合？",o:["股價簡單平均","交易量加權股價指數","市場價值加權股價指數","股價幾何平均"],a:2,
  fl:"模擬市場 ➔ 市值加權。",th:"市場投資組合的權重就是每家公司市值占比，市值加權指數最接近。",tr:"臺灣加權股價指數就是市值加權，不是交易量加權。"},
 {f:2,s:"115-1",tag:"股利模式",q:"甲公司今年已發放現金股利 10,000 元，股利每年成長 2%，必要報酬率 8%，該公司股東權益總值應為多少？",o:["130,000 元","62,500 元","45,000 元","170,000 元"],a:3,
  fl:"整家公司價值 ➔ 總股利代入高登模式。",th:"10,000 × 1.02 ÷（8% − 2%）= 10,200 ÷ 6% = 170,000 元。",tr:"忘了乘 1.02 會算出約 166,667，選項裡沒有，代表一定要乘。"},
 {f:2,s:"115-1",tag:"基本分析",q:"基本分析常利用下列何種數值來評估普通股的價值？",o:["每股盈餘","過去成交量","市場成交量","歷史成交價格"],a:0,
  fl:"基本分析 ➔ 每股盈餘（EPS）。",th:"基本分析看公司賺多少錢，EPS 是最直接的指標。",tr:"成交量和價格都是技術分析看的東西。"},
 {f:2,s:"115-1",tag:"基本分析",q:"哪一比率常被認為是影響股票報酬率的基本面因素？甲.本益比；乙.淨值市價比；丙.公司規模大小",o:["僅甲、乙","僅乙、丙","僅甲、丙","甲、乙、丙"],a:3,
  fl:"基本面因素 ➔ 本益比、淨值市價比、公司規模全選。",th:"這三個都是學術上常用來解釋股票報酬差異的因素。",tr:"三個都對時不要少選。"},
 {f:2,s:"115-1",tag:"除權息",q:"某股票除權交易日前一天收盤價為 100 元，盈餘轉增資配股率 15%，資本公積轉增資配股率 10%，除權參考價為：",o:["64 元","72 元","69.5 元","80 元"],a:3,
  fl:"除權參考價 ➔ 股價 ÷（1 + 總配股率）。",th:"總配股率 = 15% + 10% = 25%，100 ÷ 1.25 = 80 元。",tr:"兩種配股率要先加總，不能只用其中一個。"},
 {f:2,s:"113-3",tag:"股價指數",q:"在 S&P500 的採樣股中，市值愈大的股票，其價格波動對指數的影響將如何？",o:["愈小","沒影響","愈大","無法直接判斷"],a:2,
  fl:"市值加權指數 ➔ 市值越大，影響越大。",th:"S&P500 是市值加權，大公司權重高，股價一動指數就跟著動。",tr:"道瓊是價格加權，S&P500 是市值加權，別搞混。"},
 {f:2,s:"115-2",tag:"評價比率",q:"甲公司股票淨值市價比（book-to-market ratio）是 5 倍，每股淨值是 20 元，則該股票市價為多少元？",o:["45","5","4","15"],a:2,
  fl:"淨值市價比 ➔ 淨值 ÷ 市價。",th:"20 ÷ 市價 = 5，市價 = 4 元。",tr:"這是「淨值市價比」，分子分母和「市價淨值比」相反。"},
 {f:2,s:"114-3",tag:"基本分析",q:"當國外大型塑膠廠發生火災時，對國內生產同產品之塑膠類股股價的影響為何？",o:["上漲","下跌","不受影響","不一定"],a:0,
  fl:"競爭對手停工 ➔ 國內同業受惠 ➔ 上漲。",th:"國外產能減少，供給變少，國內同業的訂單和價格都會變好。",tr:"看到「火災」就想到利空，但受災的是競爭對手。"},
 {f:2,s:"114-3",tag:"基本分析",q:"理論上，提高上市公司董監事持股比率，對一般股東的權益具有：",o:["不具作用","負面作用","正面作用","選項 A、B、C 皆非"],a:2,
  fl:"董監持股高 ➔ 和股東利益一致 ➔ 正面。",th:"董監自己持股多，公司股價表現就和自己的財富綁在一起，比較會認真經營。",tr:"不要想成大股東會欺負小股東，題目問的是理論上。"},
 {f:2,s:"114-1",tag:"股票類型",q:"創業投資事業的基金管理團隊通常將資金投資於哪一階段的公司？",o:["具有成長潛力的草創期公司","穩定營運的擴張期公司","產品已廣為接受的成熟期公司","市場已有替代商品出現的衰退期公司"],a:0,
  fl:"創投 ➔ 草創期。",th:"創投承擔高風險，投資剛起步、有潛力的公司，換取高報酬。",tr:"擴張期看起來比較安全，但不是創投的主要標的。"},
 {f:2,s:"114-1",tag:"基本分析",q:"估計股票之盈餘成長率，較不可能用到下列哪一比率？",o:["流動性比率","財務槓桿比率","資產營運能力比率","獲利能力比率"],a:0,
  fl:"盈餘成長 ➔ 杜邦分析（獲利、週轉、槓桿）；流動性無關。",th:"成長率 = ROE × 保留率，ROE 拆開就是獲利能力、資產週轉和財務槓桿。",tr:"流動比率看的是短期償債能力，跟成長無關。"},
 {f:2,s:"115-2",tag:"基本分析",q:"分析個別企業之財務比率，一般而言相關數據必須與哪些母體比較？甲.整體經濟；乙.產業平均；丙.主要同業",o:["僅甲、乙","僅乙、丙","僅甲、丙","甲、乙及丙最好都比較"],a:3,
  fl:"比較對象 ➔ 全部都要比。",th:"財務比率要放在大環境、產業和同業的脈絡下看，才知道好壞。",tr:"「最好都比較」聽起來太完美，但這題就是全選。"},
 {f:2,s:"111-2",tag:"公司行為",q:"上市公司買回自己之股份配給員工認購時，一定會使公司之：",o:["每股淨值減少","淨值總額增加","發行股數不變","每股淨值增加"],a:2,
  fl:"庫藏股轉讓員工 ➔ 發行股數不變。",th:"庫藏股只是把已發行的股票買回來再賣出，不會新增或註銷股份。",tr:"「流通在外股數」會變，但「發行股數」不變。"},
 {lv:"a",f:1,s:"115-2",tag:"本益比",q:"某公司最近一年每股稅前盈餘 6 元，所得稅率 40%，目前股價 36 元，本益比是多少倍？",o:["10","18","12.5","11"],a:0,
  fl:"本益比分母 ➔ 稅後 EPS。",th:"稅後 EPS = 6 × 60% = 3.6 元，36 ÷ 3.6 = 10 倍。",tr:"用稅前 6 元會算出 6 倍，選項沒有；別忘了扣稅。"},
 {lv:"a",f:1,s:"115-2",tag:"股票類型",q:"下列哪一種股票較適合保守型投資人投資？",o:["積極成長型股票","價值型股票","小型股","高本益比股票"],a:1,
  fl:"保守 ➔ 價值型。",th:"價值股低本益比、高股利，股價波動較小。",tr:"高本益比代表成長股，風險較高。"},
 {lv:"a",f:1,s:"115-2",tag:"公司行為",q:"公司執行高股票股利政策時，可能會造成怎樣的影響？",o:["股本不變","盈餘被稀釋","EPS 上升","股本減少"],a:1,
  fl:"發股票股利 ➔ 股數變多 ➔ EPS 被稀釋。",th:"賺的錢沒變，但分給更多股，每股盈餘就下降。",tr:"股本會增加，不是不變或減少。"},
 {lv:"a",f:1,s:"115-1",tag:"股利模式",q:"某公司今年每股稅前盈餘 10 元，所得稅率 25%，盈餘保留比率 30%，今年每股可配多少現金股利？",o:["4.50 元","3.15 元","5.25 元","1.85 元"],a:2,
  fl:"股利 ➔ 稅後 EPS ×（1 − 保留率）。",th:"稅後 = 10 × 75% = 7.5 元，發放 70%：7.5 × 0.7 = 5.25 元。",tr:"忘了扣稅會算出 7 元。"},
 {lv:"a",f:1,s:"114-2",tag:"股利模式",q:"某公司的預期權益報酬率是 5%，股利政策為發放 40% 現金股利，在無外部融資下，預期盈餘成長率是：",o:["8.33%","2%","3%","10%"],a:2,
  fl:"成長率 ➔ ROE × 保留率。",th:"保留率 = 1 − 40% = 60%，5% × 60% = 3%。",tr:"用發放率 40% 去乘會算出 2%，是陷阱。"},
 {lv:"a",f:1,s:"114-1",tag:"股利模式",q:"股利折現模式中的股利：",o:["僅包括現金股利","僅包括股票股利","同時包括現金股利與股票股利","即等於每股盈餘"],a:0,
  fl:"股利折現 ➔ 只算現金股利。",th:"投資人真正拿到的現金流量才能折現，股票股利只是把股份切細。",tr:"直覺會想全包，但股票股利不算。"},
 {lv:"a",f:1,s:"115-2",tag:"股價指數",q:"有關指數編製，下列何者錯誤？",o:["臺灣證券交易所發行量加權股價指數採用市值加權的方式","臺灣證券交易所發行量加權股價指數採用算術平均公式計算股價平均數","臺灣指數公司編製的市值型指數利用自編的自由流通量係數進行指數編製","富時臺灣指數系列是採用自由流通量係數進行市值調整"],a:1,
  fl:"加權指數 ➔ 市值加權，不是算術平均。",th:"加權指數按市值占比計算，大公司影響大，不是把股價直接平均。",tr:"A 和 B 互相矛盾，其中錯的就是答案。"},
 {lv:"a",f:1,s:"114-3",tag:"股票類型",q:"價值型股票通常具有什麼特性？",o:["低本益比","高市價淨值比","低股利率","高週轉率"],a:0,
  fl:"價值股 ➔ 低本益比、低市價淨值比、高股利率。",th:"價值股是被市場低估的股票，所以各種評價倍數都偏低。",tr:"B、C 都是成長股的特性。"}
];
const CH5=[
 {f:4,s:"113-3",tag:"DMI",q:"何者為 DMI 的買進訊號？",o:["K 線由下往上突破 D 線","DIF 線由下往上突破 DEM 線","＋DI 線由下往上突破－DI 線","＋DI 線由上向下跌破－DI 線"],a:2,
  fl:"DMI 買進 ➔ ＋DI 由下往上穿過－DI。",th:"＋DI 代表上漲力道，－DI 代表下跌力道。上漲力道超過下跌力道就是買點。",tr:"A 是 KD、B 是 MACD 的買點，題目問 DMI。"},
 {f:3,s:"111-3",tag:"RSI",q:"在 RSI 中，下列何者「不是」使用 RSI 的限制？",o:["RSI 有鈍化現象","RSI 值僅考慮收盤價，若有很長上下影線，無法真正反映大盤走勢","RSI 在股價行情暴跌時，一般反應遲緩","期數愈短愈不具敏感性"],a:3,
  fl:"RSI ➔ 期數越短越「敏感」，D 說反了。",th:"天數越短，每天的漲跌影響越大，RSI 擺動越劇烈。",tr:"反向題，要找「不是限制」的那個，也就是錯誤敘述。"},
 {f:3,s:"112-1",tag:"道氏理論",q:"關於道氏理論之敘述何者「不正確」？",o:["基本波動是指股價長期變動趨勢","次級波動即一般所謂之盤整","日常波動通常由當天利多或利空消息造成，經過一段時間後影響力會消失","道氏理論可以預期長期股價趨勢以及趨勢可持續多久"],a:3,
  fl:"道氏理論 ➔ 能看方向，不能看持續多久、不能選股。",th:"道氏理論用指數判斷長期趨勢方向，但無法告訴你趨勢會持續多久，也無法告訴你該買哪支股票。",tr:"D 多加了「可持續多久」，就變成錯的。"},
 {f:3,s:"114-3",tag:"道氏理論",q:"道氏理論雖然對股市長期市場變動指明了方向，但不能指示下列何者？",o:["利用線路來確認趨勢","利用平均數來確認趨勢","股價變動趨勢如海浪有漲潮及退潮","應購買何種股票"],a:3,
  fl:"道氏理論不能 ➔ 告訴你買哪支股票。",th:"道氏理論只看大盤指數，不分析個股。",tr:"其他三個都是道氏理論本身的內容。"},
 {f:3,s:"115-2",tag:"均線",q:"當股價突破五日均線時，要成為好的買點不應該出現下列哪項特徵？",o:["股價呈現實體長紅 K 線","五日均線往上揚","成交量放大","股價 K 線有長長上影線"],a:3,
  fl:"長上影線 ➔ 上方賣壓重 ➔ 不是好買點。",th:"長上影線代表盤中衝高後被賣回來，上面有人在倒貨。",tr:"題目問「不應該」出現的特徵。"},
 {f:3,s:"115-2",tag:"MACD",q:"下列有關 MACD 之敘述何者「不正確」？",o:["MACD 是收斂與發散的移動平均線","其功能在於運用短期與長期移動平均線間之關係，來研判買賣時機","其值大於零時表示熊市","當市場行情有所轉折時，DIF 之絕對值均會縮小"],a:2,
  fl:"MACD 大於零 ➔ 牛市（多頭），不是熊市。",th:"DIF = 短期均線 − 長期均線。大於零代表短期比長期強，是多頭。",tr:"C 把牛市偷換成熊市。"},
 {f:2,s:"110-2",tag:"成交量",q:"今天股價下跌 98 點，昨天累積型 OBV 為 26,052 萬張，今天成交張數 138 萬張，今天累積型 OBV 為多少？",o:["25,914 萬","25,147 萬","26,188 萬","26,090 萬"],a:0,
  fl:"OBV ➔ 上漲加成交量、下跌減成交量。",th:"今天下跌，所以 26,052 − 138 = 25,914 萬張。",tr:"下跌要「減」，加起來會選到 26,188。"},
 {f:2,s:"111-2",tag:"MACD",q:"有關 MACD 中 DIF 線及 MACD 線之敘述，何者「不正確」？",o:["為 0 至 100","DIF 線為快速線","MACD 線為慢速線","DIF 線由下往上突破 MACD 線為買進訊號"],a:0,
  fl:"MACD ➔ 可以是負數，沒有 0～100 的範圍。",th:"0～100 是 RSI、KD 的範圍。MACD 是兩條均線的差，可正可負。",tr:"把 RSI 和 KD 的特性套到 MACD 上。"},
 {f:2,s:"112-1",tag:"市場寬幅",q:"騰落指標（ADL）＝累計上漲家數（UP）－累計下跌家數（DOWN）。已知 ADL＝270 家，DOWN 為 2,480 家，求 UP？",o:["2,140 家","2,410 家","2,480 家","2,750 家"],a:3,
  fl:"ADL ＝ UP − DOWN ➔ UP ＝ ADL + DOWN。",th:"270 + 2,480 = 2,750 家。",tr:"用減的會算出 2,210，選項沒有。"},
 {f:2,s:"112-3",tag:"均線",q:"有關移動平均線之敘述，何者不正確？",o:["分析成交價及成交量判斷買賣時機","是利用統計學上移動平均的原理","可利用移動平均線之間的轉折點及交叉現象，研判大盤指數走勢","移動平均線代表不同期間投資人之持股平均成本"],a:0,
  fl:"移動平均線 ➔ 只用價格，不用成交量。",th:"均線是把一段時間的收盤價平均起來。",tr:"A 多加了「成交量」。"},
 {f:2,s:"112-3",tag:"技術分析",q:"下列有關「技術分析」的敘述中，何者為錯誤？",o:["技術分析是利用過去價格與交易量等訊息判斷股價走勢","技術分析常使用圖形及指標判斷價格走勢","一般技術分析認為股價具有主要與次要趨勢","如果股價報酬率為「隨機漫步」，使用技術分析才有意義"],a:3,
  fl:"隨機漫步 ➔ 技術分析「沒有」意義。",th:"隨機漫步代表過去走勢無法預測未來，技術分析就失效了。",tr:"D 把「沒有意義」改成「才有意義」。"},
 {f:2,s:"113-1",tag:"KD",q:"在 KD 中，何者為牛市背離現象？",o:["大盤創新低點，RSI 值並沒有創新低點","大盤創新低點，DIF 值並沒有創新低點","大盤創新低點，ADX 值並沒有創新低點","大盤創新低點，K 值並沒有創新低點"],a:3,
  fl:"KD 牛市背離 ➔ 股價創新低、K 值沒創新低。",th:"股價還在跌，但指標已經不跌了，代表下跌力道減弱，可能反轉向上。",tr:"題目指定 KD，所以要選有「K 值」的那個。"},
 {f:2,s:"113-2",tag:"KD",q:"KD 線的理論基礎，在股價下跌時，當日收盤價會朝何方向接近？",o:["開盤價","收盤價","最低價","最高價"],a:2,
  fl:"KD ➔ 漲時收盤靠近最高價，跌時收盤靠近最低價。",th:"下跌趨勢中，收盤價通常收在當天低點附近。",tr:"上漲時要選最高價，看清楚題目問漲還是跌。"},
 {f:2,s:"113-3",tag:"KD",q:"計算 KD 值時，須用到下列何組資料？",o:["開盤價、最高價、最低價","最高價、最低價、成交量","最高價、最低價、漲跌家數","最高價、最低價、收盤價"],a:3,
  fl:"KD ➔ 最高、最低、收盤；不用開盤價。",th:"KD 衡量收盤價落在一段期間高低點的什麼位置。",tr:"有開盤價的選項就刪。"},
 {f:2,s:"113-3",tag:"KD",q:"有關 KD 值之敘述，何者不正確？",o:["D 值在 80 以上時超買、20 以下時超賣","當 K 線傾斜角度趨於陡峭時，為警告訊號，表示行情可能回軟或止跌","當股價走勢創新高或新低時，KD 線未能創新高或新低為背離現象","KD 線一般以短線投資為主，但仍可使用於中長線"],a:1,
  fl:"K 線變「平緩」才是警告訊號，不是陡峭。",th:"K 線斜率變平，代表動能減弱，行情可能反轉。",tr:"B 把「平緩」換成「陡峭」。"},
 {f:2,s:"113-3",tag:"型態",q:"在上升趨勢中盤中有新高點出現後，當天以最低價收盤，是下列何種反轉型態？",o:["W 底","頭肩底","底部一日反轉","頂部一日反轉"],a:3,
  fl:"上升中創新高後收最低 ➔ 頂部一日反轉。",th:"一天之內從新高跌到最低收，代表多頭力竭，是頭部訊號。",tr:"上升趨勢中出現的是「頂部」，不是底部。"},
 {f:2,s:"114-1",tag:"成交量",q:"對能量潮指標 OBV 的描述，何者不正確？",o:["OBV 利用成交量的累算，來研判股市人氣是否匯集或渙散","OBV 為 1963 年葛蘭碧提出","累積 OBV 線可與大盤指數研判背離現象","當日大盤下跌時，今日 OBV 值要加上今日成交股數"],a:3,
  fl:"大盤下跌 ➔ OBV「減」成交量。",th:"上漲日加成交量，下跌日減成交量。",tr:"D 把「減」改成「加」。"},
 {f:2,s:"114-2",tag:"技術分析",q:"下列何者「不是」技術分析的假設？",o:["可依據股價的線路圖預測股價未來的走勢","不同的研究人員對相同的線路圖只能有相同的解釋","歷史會重演","股價是由供需雙方所決定"],a:1,
  fl:"技術分析 ➔ 同一張圖，不同人可以有不同解讀。",th:"技術分析很主觀，同樣的圖形，每個人看法可能不同。",tr:"「只能有相同的解釋」太絕對。"},
 {f:2,s:"114-3",tag:"成交量",q:"掌握底部量及頭部量，可用何項技術指標？",o:["OBV","TAPI","平均量","ADL"],a:2,
  fl:"底部量、頭部量 ➔ 平均量。",th:"平均量能看出成交量相對高低，判斷是否到了頭部或底部。",tr:"OBV 看人氣累積，不是看底部量和頭部量。"},
 {f:2,s:"115-1",tag:"KD",q:"KD 指標中，D 線代表：",o:["慢速隨機指標","K 值會大於 100","快速隨機指標","K 值會小於 0"],a:0,
  fl:"K 快、D 慢。",th:"D 值是 K 值再平滑一次，所以反應比較慢。",tr:"KD 都在 0～100 之間，B、D 是假選項。"},
 {f:2,s:"115-1",tag:"型態",q:"當股價完成上升三角形整理後，通常會：",o:["上漲","下跌","繼續整理","不一定"],a:0,
  fl:"上升三角形 ➔ 上漲；下降三角形 ➔ 下跌。",th:"上升三角形是上漲過程中的盤整，整理完會延續原本的漲勢。",tr:"「整理」兩個字容易讓人選繼續整理。"},
 {f:2,s:"115-2",tag:"乖離率",q:"若今日股價指數為 80，24 日移動平均數為 100，乖離率為何？",o:["－2%","－8%","－20%","8%"],a:2,
  fl:"乖離率 ➔（今日價 − 均價）÷ 均價。",th:"(80 − 100) ÷ 100 = −20%。",tr:"分母用均價 100，不是今日價。"},
 {f:2,s:"115-2",tag:"道氏理論",q:"下列敘述何者不是道氏理論的缺點？",o:["技術指標有鈍化的現象","道氏理論的買賣訊號往往落後於大盤約 20% 至 25%","道氏理論只告訴投資人市場趨勢，不能告訴投資人買進何種股票","投資人不能接受指數將反映所有新聞和統計的基本觀念"],a:0,
  fl:"鈍化 ➔ KD、RSI 的缺點，不是道氏理論。",th:"道氏理論的缺點是訊號落後、不能選股。鈍化是 0～100 擺盪指標的問題。",tr:"反向題，選不屬於道氏理論的缺點。"},
 {f:2,s:"111-2",tag:"市場寬幅",q:"有關 OBOS 指標之敘述，何者「不正確」？",o:["為時間之技術指標","OBOS 是超買超賣指標，運用一段時間內漲跌家數累積差來測量大盤氣勢","大盤持續上漲而 OBOS 反轉向下，表示大盤可能作頭下跌，為賣出訊號","大盤持續下探但 OBOS 反轉向上，即為買進訊號"],a:0,
  fl:"OBOS ➔ 用漲跌家數，是市場寬幅指標，不是時間指標。",th:"OBOS = 上漲家數 − 下跌家數，衡量整體市場的強弱。",tr:"A 的「時間之技術指標」是捏造的分類。"},
 {f:2,s:"114-1",tag:"價格指標",q:"動量指標（MTM）是運用股價變動的何種觀念來測量股價變動的趨勢？",o:["相對速度","加速度","絕對速度","靜態觀念"],a:1,
  fl:"MTM ➔ 加速度。",th:"動量指標看的是漲跌速度有沒有在加快或減慢。",tr:"直接背，不用推理。"},
 {lv:"a",f:1,s:"114-1",tag:"均線",q:"投資者預期某公司股票「黃金交叉」出現時，可採以下何項策略？",o:["買進股票","借券賣空","走勢不定，尚須觀望","賣出持有股票"],a:0,
  fl:"黃金交叉 ➔ 買；死亡交叉 ➔ 賣。",th:"短期均線由下往上穿過長期均線，代表多頭啟動。",tr:"別把黃金交叉和死亡交叉記反。"},
 {lv:"a",f:1,s:"114-2",tag:"型態",q:"在整理型態中較常發生的缺口為何？",o:["普通缺口","逃逸缺口","竭盡缺口","突破缺口"],a:0,
  fl:"整理 ➔ 普通缺口；行情中段 ➔ 逃逸缺口；末端 ➔ 竭盡缺口。",th:"盤整時偶爾跳空，通常很快被補掉，就是普通缺口。",tr:"突破缺口出現在型態完成、開始新趨勢時。"},
 {lv:"a",f:1,s:"114-2",tag:"RSI",q:"在 RSI 公式中，對 RS 的定義下列何者「正確」？",o:["上漲總幅度平均值／上漲和下跌總幅度平均值","上漲總幅度平均值／下跌總幅度平均值","下跌總幅度平均值／上漲和下跌總幅度平均值","下跌總幅度平均值／上漲總幅度平均值"],a:1,
  fl:"RS ➔ 上漲平均 ÷ 下跌平均。",th:"RS 比較漲的力道和跌的力道，再代入 RSI 公式換成 0～100。",tr:"A 是 RSI 最後的結果形式，不是 RS。"},
 {lv:"a",f:1,s:"114-2",tag:"DMI",q:"大盤盤整時，DMI 中的 ADX 值如何？",o:["ADX 越大","ADX 越小","ADX 等於 0","ADX 沒有任何意義"],a:1,
  fl:"ADX ➔ 有趨勢時變大，盤整時變小。",th:"ADX 衡量趨勢強度，不分漲跌。",tr:"等於 0 太絕對。"},
 {lv:"a",f:1,s:"114-3",tag:"K線",q:"關於日 K 線，下列何者描述「不正確」？",o:["上影線的最高點表示當天的最高價","下影線的最低點表示當天的最低價","開盤價低於收盤價，為黑色實體","開盤價高於收盤價，為黑色實體"],a:2,
  fl:"收盤 ＞ 開盤 ➔ 紅 K（陽線）；收盤 ＜ 開盤 ➔ 黑 K（陰線）。",th:"開低收高代表當天上漲，是紅色實體。",tr:"C 和 D 只差高低兩字，看清楚。"},
 {lv:"a",f:1,s:"115-1",tag:"乖離率",q:"技術指標在 0 至 100 之間會有鈍化現象，但下列何者沒有此現象？",o:["KD","RSI","WMS%R","BIAS"],a:3,
  fl:"沒有鈍化 ➔ 乖離率 BIAS（沒有上下限）。",th:"BIAS 是價格和均線的差距比例，可以無限大或無限小。",tr:"KD、RSI、威廉指標都有 0～100 的範圍，會鈍化。"},
 {lv:"a",f:1,s:"115-2",tag:"型態",q:"根據型態理論，下列何種型態表示股價將有可能上漲？甲.頭肩頂；乙.雙重底（W 底）；丙.上升三角形；丁.下降三角形",o:["僅甲","僅甲、乙","僅乙、丙","僅甲、乙、丙"],a:2,
  fl:"看漲 ➔ W 底、上升三角形；看跌 ➔ 頭肩頂、M 頭、下降三角形。",th:"「底」和「上升」都是好訊號。",tr:"頭肩「頂」是賣出訊號，別被「頭」字混淆。"},
 {lv:"a",f:1,s:"115-2",tag:"型態",q:"在頭肩頂中，頭部價格為 100 元，頸線價格為 80 元，以測量等幅計算出下跌的低點滿足區應為多少？",o:["75 元","70 元","65 元","60 元"],a:3,
  fl:"等幅測量 ➔ 頸線 −（頭部 − 頸線）。",th:"頭部到頸線差 20 元，從頸線再往下 20 元：80 − 20 = 60 元。",tr:"只往下跌一半的距離會選到 70 元。"}
];
const CH6=[
 {f:5,s:"115-2",tag:"投資策略",q:"當投資者判斷市場處於空頭行情時，不應採取下列何者策略？",o:["增加固定收益證券之比重","提高投資組合之貝它係數","增加現金比重","降低風險性資產比重"],a:1,
  fl:"空頭 ➔ 降低 β；多頭 ➔ 提高 β。",th:"β 越高，跟著大盤漲跌越多。空頭時要降低 β，跌得比較少。",tr:"題目問「不應」採取，選提高 β 的那個。"},
 {f:4,s:"114-2",tag:"β係數",q:"哪種類股在股市多頭行情時，漲幅較大？",o:["績優大型股","低貝它大型股","低貝它小型股","高貝它小型股"],a:3,
  fl:"多頭漲最多 ➔ 高 β 小型股。",th:"高 β 對大盤最敏感；小型股波動又比大型股大。",tr:"「績優」聽起來好，但多頭時漲得最多的不是它。"},
 {f:3,s:"111-2",tag:"績效指標",q:"基金 J 的 β＝1，崔納指標 3%，詹森 α 為 1%。同期間基金 K 的 β＝1.2，崔納指標 2.5%，基金 K 的詹森 α 為多少？",o:["0.4%","0.6%","0.8%","1.0%"],a:1,x:1,
  fl:"先用 J 反推市場風險溢酬，再算 K 的 α。",th:"J 的超額報酬 = 3% × 1 = 3%，α = 3% − 市場溢酬 × 1 = 1%，市場溢酬 = 2%。K 的超額報酬 = 2.5% × 1.2 = 3%，α = 3% − 2% × 1.2 = 0.6%。",tr:"多步驟計算，時間不夠可以放生。"},
 {f:3,s:"114-2",tag:"績效指標",q:"某基金年化報酬率 12%，年化標準差 8%，β 係數為 2，無風險利率 2%，該基金的崔納指標為：",o:["6%","5%","1.5","1.25"],a:1,
  fl:"崔納 ➔（報酬 − 無風險利率）÷ β。",th:"(12% − 2%) ÷ 2 = 5%。",tr:"用標準差 8% 去除是夏普指標，會算出 1.25。"},
 {f:3,s:"114-3",tag:"CAPM",q:"零 β（zero-beta）證券的期望報酬是：",o:["市場報酬率","零報酬率","負的報酬率","無風險利率"],a:3,
  fl:"β ＝ 0 ➔ 無風險利率；β ＝ 1 ➔ 市場報酬率。",th:"CAPM：Rf + 0 ×（Rm − Rf）= Rf。",tr:"β 是零，報酬不是零。"},
 {f:3,s:"115-1",tag:"風險指標",q:"變異數及貝它係數都可用來衡量風險，兩者不同之處在於：",o:["貝它係數衡量系統及非系統風險","貝它係數只衡量系統風險，但變異數衡量總風險","貝它係數只衡量非系統風險，但變異數衡量總風險","貝它係數衡量系統及非系統風險，但變異數只衡量系統風險"],a:1,
  fl:"β ➔ 系統風險；變異數、標準差 ➔ 總風險。",th:"β 只看跟大盤連動的部分，變異數看全部的波動。",tr:"C 把 β 說成非系統風險。"},
 {f:3,s:"115-2",tag:"CAPM",q:"在 CAPM 中，市場預期報酬 18%，甲股票 β 值為 0，無風險利率 6%，該股票預期報酬率為何？",o:["6%","12%","14%","16%"],a:0,
  fl:"β ＝ 0 ➔ 預期報酬 ＝ 無風險利率。",th:"6% + 0 × (18% − 6%) = 6%。",tr:"18% 是干擾資訊。"},
 {f:2,s:"110-2",tag:"CAPM",q:"市場投資組合期望報酬 12%、標準差 20%，無風險利率 2%。效率投資組合 P 的標準差為 30%，P 的期望報酬為：",o:["17.0%","18.0%","20.0%","24.5%"],a:0,
  fl:"效率組合 ➔ β ＝ 自己的標準差 ÷ 市場標準差。",th:"效率組合和市場完全相關，β = 30% ÷ 20% = 1.5。2% + 1.5 × 10% = 17%。",tr:"直接用 30% 去比會選錯，要先換算 β。"},
 {f:2,s:"111-1",tag:"市場組合",q:"有關市場投資組合之敘述，何者「不正確」？",o:["包括市場上所有的資產或證券的投資組合","通常以大盤股價指數衡量市場投資組合價格","貝它係數為 1 之投資組合","市場投資組合可以避免系統風險"],a:3,
  fl:"市場組合 ➔ 避免的是「非系統」風險。",th:"市場組合已經分散到極限，只剩系統風險，所以 β = 1。",tr:"D 把「非系統」偷換成「系統」。"},
 {f:2,s:"111-2",tag:"CAPM",q:"甲、乙、丙股票 β 係數相同，但報酬率標準差依序為甲、乙、丙由大到小。根據 CAPM，哪一個股票期望報酬率最高？",o:["甲","乙","丙","三者相同"],a:3,
  fl:"CAPM 只看 β ➔ β 相同，報酬就相同。",th:"CAPM 認為非系統風險可以分散，不會得到報酬補償。",tr:"標準差不同是干擾資訊。"},
 {f:2,s:"112-2",tag:"CAPM",q:"何者「不是」基本 CAPM 模型之假設或結果？",o:["投資人皆同意所有股票之標準差相同","證券市場線有正的斜率","存在無風險利率","所有投資人對相同之投資組合有相同之期望報酬"],a:0,
  fl:"CAPM 沒有假設「所有股票標準差相同」。",th:"CAPM 假設投資人對報酬和風險有相同預期，但不同股票的風險當然不同。",tr:"A 和 D 很像，差別在 A 說所有股票都一樣。"},
 {f:2,s:"113-3",tag:"風險指標",q:"甲股票標準差 0.25，甲和乙的共變異數是 0.005，相關係數 0.5，則乙股票的標準差為：",o:["0.125","0.04","0.15","0.02"],a:1,
  fl:"共變異數 ＝ 相關係數 × 甲標準差 × 乙標準差。",th:"0.005 = 0.5 × 0.25 × 乙，乙 = 0.005 ÷ 0.125 = 0.04。",tr:"小數點容易算錯，慢慢來。"},
 {f:2,s:"114-1",tag:"風險指標",q:"甲股票標準差 0.3，乙股票標準差 0.2，相關係數 0.5，則甲和乙的共變數為：",o:["0.04","0.03","0.02","0.01"],a:1,
  fl:"共變數 ➔ 相關係數 × 兩個標準差。",th:"0.5 × 0.3 × 0.2 = 0.03。",tr:"一步就能算，不要多除。"},
 {f:2,s:"114-2",tag:"績效指標",q:"對一小額投資者而言，欲挑選一種基金投資，應以何種績效指標最為合適？",o:["夏普績效指標","崔納績效指標","詹森績效指標","以上皆非"],a:0,
  fl:"小額投資、只買一檔基金 ➔ 夏普（看總風險）。",th:"只買一檔基金，風險沒有被分散，要看總風險，所以用夏普。",tr:"崔納適合已經充分分散的投資組合。"},
 {f:2,s:"114-2",tag:"CAPM",q:"無風險利率 1%，市場期望報酬 11%，股票與市場的共變異數 0.108，市場變異數 0.09，該股票期望報酬率為多少？",o:["7.8%","10%","10.9%","13%"],a:3,
  fl:"β ＝ 共變異數 ÷ 市場變異數，再代入 CAPM。",th:"β = 0.108 ÷ 0.09 = 1.2。1% + 1.2 × 10% = 13%。",tr:"股票自己的變異數 0.16 是干擾資訊。"},
 {f:2,s:"114-2",tag:"CAPM",q:"某證券與市場相關係數 0.75，標準差 20%，市場平均報酬 15%、標準差 25%，無風險利率 10%，此資產期望報酬為何？",o:["13.00%","13.75%","16.00%","15.00%"],a:0,
  fl:"β ＝ 相關係數 × 自己標準差 ÷ 市場標準差。",th:"β = 0.75 × 20% ÷ 25% = 0.6。10% + 0.6 × 5% = 13%。",tr:"忘了乘相關係數會算出 β = 0.8。"},
 {f:2,s:"114-3",tag:"市場組合",q:"下列對市場投資組合之描述，何者「正確」？甲.β 值等於 1；乙.期望報酬率較任何個別證券低；丙.報酬率標準差較任何個別證券低；丁.包含了市場上所有的證券",o:["僅甲、乙、丁","僅甲、丙、丁","僅甲、丁","僅丙、丁"],a:2,
  fl:"市場組合 ➔ β ＝ 1、包含所有證券。",th:"市場組合是平均值，一定有證券報酬或風險比它低。",tr:"乙、丙用「任何」把話說死了。"},
 {f:2,s:"114-3",tag:"CAPM",q:"稻禾公司股價 200 元，預期一年後漲到 222 元，無風險利率 2%，β 為 1.5，市場投資組合之預期報酬率應為多少？",o:["8%","9%","10%","11%"],a:0,
  fl:"先算報酬率，再代入 CAPM 反推 Rm。",th:"報酬率 = 22 ÷ 200 = 11%。11% = 2% + 1.5 ×（Rm − 2%），Rm = 8%。",tr:"11% 是個股報酬，不是市場報酬。"},
 {f:2,s:"114-3",tag:"績效指標",q:"在投資組合績效評估中，崔納指標的計算方式為：",o:["超額報酬／非系統風險","超額報酬／總風險","超額報酬／系統風險","超額報酬／無風險利率"],a:2,
  fl:"崔納 ➔ 除以 β（系統風險）；夏普 ➔ 除以標準差（總風險）。",th:"記法：崔納（Treynor）的 T 像 β 的那條線。",tr:"B 是夏普指標。"},
 {f:2,s:"114-3",tag:"CAPM",q:"某證券期望報酬率 12.5%，β 值為 1.15，市場組合期望報酬率 10%，無風險利率 5%，根據 CAPM 此證券為：",o:["正常訂價","價格高估","價格低估","選項 A、B、C 皆非"],a:2,
  fl:"實際報酬 ＞ CAPM 報酬 ➔ 價格低估 ➔ 買進。",th:"CAPM 報酬 = 5% + 1.15 × 5% = 10.75%，實際 12.5% 比較高，代表股價太便宜。",tr:"報酬高 = 價格低，方向別記反。"},
 {f:2,s:"115-1",tag:"CAPM",q:"其他條件不變，根據 CAPM，如果市場所有投資人預期通貨膨脹將會升高，則：",o:["市場風險溢酬將會增加","證券市場線之斜率將會變大","所有證券之貝它係數將會提高","所有證券之期望報酬率將會提高"],a:3,
  fl:"通膨 ➔ 無風險利率上升 ➔ SML 平行上移 ➔ 所有報酬提高。",th:"通膨讓 Rf 上升，截距上移，斜率不變。",tr:"斜率變大是投資人變保守，不是通膨。"},
 {f:2,s:"115-2",tag:"APT",q:"由無風險利率和風險溢酬組成，描述預期報酬率和「多個」因子存在線性關係的理論是：",o:["套利定價理論（APT）","投資組合理論","資本資產定價模式（CAPM）","效率市場理論"],a:0,

 {f:2,s:"115-2",tag:"績效指標",q:"某投資組合過去 10 年平均年報酬率 12%，標準差 50%，無風險利率 4%，β 為 1.2，其夏普指數為多少？",o:["0.8","0.16","1.6","1.25"],a:1,

 {f:2,s:"112-3",tag:"風險指標",q:"甲、乙兩股票預期報酬率 10%、20%，標準差 15%、45%，相關係數為 -1，若要讓投資組合標準差降為零，兩股票投資比重應為：",o:["甲 75%，乙 25%","甲 25%，乙 75%","甲 66.67%，乙 33.33%","甲 50%，乙 50%"],a:0,

 {f:2,s:"111-3",tag:"景氣指標",q:"下列何者「不」屬於領先指標？",o:["核發建照面積","外銷訂單指數","失業率","實質貨幣總計數"],a:2,
  fl:"失業率 ➔ 落後指標。",th:"景氣變差後，公司過一段時間才會裁員，所以失業率是落後的。",tr:"建照、訂單、貨幣供給都是領先指標。"},
 {f:2,s:"112-2",tag:"匯率",q:"我國的貨幣若貶值，會造成：甲.進口衰退；乙.出口衰退；丙.國際貿易逆差",o:["僅甲","僅乙","僅甲、丙","僅乙、丙"],a:0,
  fl:"貶值 ➔ 進口變貴（衰退）、出口變便宜（成長）。",th:"貶值時外國東西變貴，進口減少；本國產品在國外變便宜，出口增加。",tr:"逆差是貶值的原因，不是結果。"},
 {f:2,s:"112-3",tag:"景氣指標",q:"為何「股價指數」是景氣指標中的重要領先指標？",o:["因為股價反映出預期的公司盈利與股利","因為股價反映出即時性經濟活動","因為股價會受市場心理因素影響","因為股價會受金融情勢的影響"],a:0,
  fl:"股價領先 ➔ 反映「預期」的公司獲利。",th:"股價是市場對未來的預期，所以會走在景氣前面。",tr:"「即時性」是同時指標的特性。"},
 {f:2,s:"112-3",tag:"匯率",q:"新臺幣貶值幅度遠大於經濟成長率，以美元計算之每人 GNP 會：",o:["增加","減少","不變","無關係"],a:1,
  fl:"美元計 GDP 成長 ≈ 臺幣計成長 − 貶值幅度。",th:"經濟成長抵不過貶值，換成美元就變少了。",tr:"題目說「遠大於」，一定是減少。"},
 {f:2,s:"112-3",tag:"貨幣政策",q:"中央銀行調降存款準備率，釋出強力貨幣 125 億元，貨幣乘數為 5，則貨幣供給將增加：",o:["600 億元","625 億元","125 億元","25 億元"],a:1,
  fl:"貨幣供給增加 ➔ 強力貨幣 × 貨幣乘數。",th:"125 億 × 5 = 625 億元。",tr:"用除的會得到 25 億。"},
 {f:2,s:"112-3",tag:"景氣指標",q:"「貨幣供給」是景氣指標的：",o:["落後指標","同時指標","領先指標","綜合指標"],a:2,
  fl:"貨幣供給（M1B）➔ 領先指標。",th:"市場上的錢變多，之後投資和消費才會增加。",tr:"直接背。"},
 {f:2,s:"113-2",tag:"貨幣政策",q:"中央銀行提高重貼現率以避免景氣過熱，可能的效果有：甲.基本放款利率上升；乙.債券利率下降；丙.公司成長減緩；丁.股價下跌",o:["僅甲及乙","僅甲、丙及丁","僅丙及丁","甲、乙、丙、丁"],a:1,
  fl:"升息 ➔ 利率全面上升、成長放緩、股價下跌。",th:"重貼現率是銀行跟央行借錢的利率。調高後，銀行放款利率、債券利率都會上升。",tr:"乙說債券利率「下降」，方向錯了。"},
 {f:2,s:"114-1",tag:"貨幣政策",q:"中央銀行在公開市場上買入國庫券是屬於：",o:["擴張性的貨幣政策","擴張性的財政政策","緊縮性的貨幣政策","緊縮性的財政政策"],a:0,
  fl:"央行買 ➔ 放錢出去 ➔ 擴張；央行賣 ➔ 收錢回來 ➔ 緊縮。",th:"央行買國庫券要付錢給市場，市場上的錢變多。",tr:"央行做的是貨幣政策，不是財政政策。"},
 {f:2,s:"114-2",tag:"貨幣政策",q:"存款準備率的高低與銀行資金成本呈：",o:["無關係","不一定","反比","正比"],a:3,
  fl:"準備率高 ➔ 能放款的錢少 ➔ 資金成本高 ➔ 正比。",th:"存款準備金不能拿去放款賺錢，比例越高，銀行越吃虧。",tr:"直接背正比。"},
 {f:2,s:"114-2",tag:"匯率",q:"上市公司進口原物料占生產成本 50%，產品出口比重亦為 50%，當新臺幣升值時，該公司可能會出現：",o:["匯兌收益","匯兌損失","存貨利潤","存貨損失"],a:1,
  fl:"升值 ➔ 外幣收入換回臺幣變少 ➔ 匯兌損失。",th:"出口收到美元，臺幣升值後換回來的臺幣變少。",tr:"進出口比例一樣是干擾，題目答案是匯兌損失。"},
 {f:2,s:"114-3",tag:"物價指標",q:"一般而言，發布未預期的物價大幅上漲，股價將：",o:["上漲","下跌","不一定上漲或下跌","先漲後跌"],a:1,
  fl:"通膨超預期 ➔ 預期升息 ➔ 股價下跌。",th:"物價大漲會讓央行升息，企業成本增加，股價下跌。",tr:"重點在「未預期」，市場來不及反應。"},
 {f:2,s:"114-3",tag:"匯率",q:"其他因素不變下，新臺幣升值會引起進口物價：",o:["上漲","下跌","不變","無關係"],a:1,
  fl:"升值 ➔ 進口變便宜。",th:"同樣的臺幣可以換更多外幣，買國外東西比較便宜。",tr:"跟上一題貶值的方向相反。"},
 {f:2,s:"115-1",tag:"景氣",q:"其他因素不變，失業率上升對國內消費需求產生何種影響？",o:["需求增加","需求減少","需求增減不定","選項 A、B、C 皆非"],a:1,
  fl:"失業率上升 ➔ 收入減少 ➔ 消費減少。",th:"沒工作的人變多，花錢的人就變少。",tr:"直覺題。"},
 {f:2,s:"115-2",tag:"景氣指標",q:"景氣指標中的領先指標不包含？",o:["外銷訂單動向指數","實質貨幣總計數 M1B","股價指數","失業率"],a:3,
  fl:"失業率 ➔ 落後指標。",th:"訂單、貨幣供給、股價都是領先指標。",tr:"和前面那題一樣，換句話考。"},
 {lv:"a",f:1,s:"114-3",tag:"景氣",q:"經濟的「痛苦指數」是指：",o:["工資上漲率與物價上漲率之和","匯率貶值率與物價上漲率之和","失業率與物價上漲率之和","工資上漲率與匯率貶值率之和"],a:2,
  fl:"痛苦指數 ➔ 失業率 ＋ 物價上漲率。",th:"失業和通膨是一般人最痛苦的兩件事。",tr:"工資上漲不會讓人痛苦。"},
 {lv:"a",f:1,s:"114-3",tag:"景氣",q:"所謂總體經濟分析，「不」包括下列哪項？",o:["利率","物價","匯率","公司接單情形"],a:3,
  fl:"公司接單 ➔ 個體分析。",th:"總體經濟看整個國家的指標。",tr:"反向題，選個別公司的那個。"},
 {lv:"a",f:1,s:"115-1",tag:"物價指標",q:"小何的資金過去一年賺取 8% 名目利率，同期通膨率 4%，實際購買力成長了多少？",o:["3.5%","3.3%","3.8%","3.6%"],a:2,
  fl:"實質利率 ➔（1 ＋ 名目）÷（1 ＋ 通膨）− 1。",th:"1.08 ÷ 1.04 − 1 ≈ 3.8%。",tr:"直接相減得到 4%，選項沒有，代表要用除的。"},
 {lv:"a",f:1,s:"115-1",tag:"匯率",q:"在一個固定時點下，日圓及歐元對美元貶值，我國以美元計算之外匯存底將：",o:["減少","不變","增加","難以計算"],a:0,
  fl:"持有的外幣貶值 ➔ 換算成美元變少。",th:"外匯存底裡的日圓、歐元換成美元後價值縮水。",tr:"外匯存底以美元計，非美元貨幣貶值就減少。"},
 {lv:"a",f:1,s:"115-2",tag:"貨幣供給",q:"其他因素不變下，中央銀行握有的外匯存底減少，貨幣供給額會：",o:["增加","不變","減少","無關係"],a:2,
  fl:"央行賣外匯 ➔ 收回臺幣 ➔ 貨幣供給減少。",th:"外匯存底減少代表央行賣出外幣、買回臺幣，市場上的臺幣變少。",tr:"方向容易想反，記住「央行收回臺幣」。"}

<script>
const FA1=[{"src": "11301-30", "f": 3, "s": "113-1", "tag": "綜合損益", "q": "下列敘述何者正確？", "o": ["綜合損益表中須列示綜合損益歸屬於普通股權益持有人之每股金額", "綜合損益金額會因其他綜合損益之重分類調整而變動", "綜合損益等於報導期間權益之變動（但排除與業主之交易及與該等交易直接相關之交易成本所產生之變動）", "綜合損益結帳後將累計於其他權益"], "a": 2, "fl": "綜合損益 ➔ 權益變動（排除與業主的交易）。", "th": "這期權益變多少，扣掉股東增資、發股利這類跟業主之間的交易，剩下的就是綜合損益。", "tr": "每股金額只列「本期淨利」，不列綜合損益；重分類調整只是在 OCI 和損益間搬家，總數不變。"}, {"src": "11301-31", "f": 3, "s": "113-1", "tag": "公允價值", "q": "下列敘述何者正確？", "o": ["使用價值屬於變現價值", "履約價值是指企業預期於其履行負債時，有義務移轉的現金或其他經濟資源的現值，包含承擔負債所發生的交易成本", "公允價值是指於衡量日市場參與者間，在有秩序之交易中出售某一資產所能收取或移轉某一負債所需支付之價格", "公允價值屬於現時價值的一種，履約價值屬於歷史成本的一種"], "a": 2, "fl": "公允價值 ➔ 衡量日、市場參與者、有秩序交易下的「出售價格」。", "th": "公允價值是站在賣方角度：今天在正常市場賣掉這項資產能拿到多少錢，或把負債轉給別人要付多少錢。", "tr": "履約價值「不含」交易成本；使用價值和履約價值都屬現時價值，不是歷史成本。"}, {"src": "11203-9", "f": 3, "s": "112-3", "tag": "會計原則", "q": "將一定金額以下的資本支出視為收益支出處理，是合乎：", "o": ["比例性原則", "成本原則", "客觀性原則", "重大性原則"], "a": 3, "fl": "一定金額以下直接當費用 ➔ 重大性原則。", "th": "金額小到不會影響投資人判斷，就不必分年攤提，直接列費用省事。", "tr": "成本原則是講「以取得成本入帳」，跟金額大小無關。"}, {"src": "11103-27", "f": 3, "s": "111-3", "tag": "資產負債表", "q": "在資產負債表中的各項資產是依何種順序排列？", "o": ["取得之時間先後", "金額之大小", "流動性之高低", "重大性之大小"], "a": 2, "fl": "資產排列順序 ➔ 流動性高低。", "th": "越容易變成現金的越排前面：現金、應收、存貨，最後才是廠房、無形資產。", "tr": "不是依金額大小，也不是依取得時間。"}, {"src": "11003-37", "f": 3, "s": "110-3", "tag": "四大報表", "q": "企業之主要財務報表為綜合損益表、資產負債表、權益變動表及現金流量表，其中動態報表有幾種：", "o": ["一種", "二種", "三種", "四種"], "a": 2, "fl": "動態報表 ➔ 3 種（只有資產負債表是靜態）。", "th": "綜合損益表、權益變動表、現金流量表都在講「一段期間」發生了什麼；資產負債表只看「某一天」。", "tr": "看到四張報表就直接選四種，會中招。"}, {"src": "11502-31", "f": 2, "s": "115-2", "tag": "公允價值", "q": "「公允價值層級」中的第三等級是指利用何者？", "o": ["市場報價的價格", "市場參考價格的調整值", "無法觀察到的輸入值", "最近成交的市場價值"], "a": 2, "fl": "公允價值第三等級 ➔ 無法觀察到的輸入值。", "th": "第一等級是活絡市場的報價，第二等級是可觀察的參考價格再調整，第三等級連市場資料都找不到，只能靠公司自己的假設估算。", "tr": "「市場參考價格的調整值」是第二等級，別看到「調整」就以為是最後一級。"}, {"src": "11502-2", "f": 2, "s": "115-2", "tag": "收入認列", "q": "某公司於 20X1 年 12 月 1 日與客戶簽訂一份合約，銷售一批商品，價格為$100,000，成本為 $60,000。合約規定客戶需於 20X1 年 12 月 15 日支付 50%的款項，剩餘款項於 20X2 年 1 月 15 日支付。商品於 20X1 年 12 月 10 日交付給客戶。根據 IFRS 15，該公司應於何時認列收入？", "o": ["20X1 年 12 月 1 日", "20X1 年 12 月 10 日", "20X1 年 12 月 15 日", "20X2 年 1 月 15 日"], "a": 1, "fl": "收入認列時點 ➔ 交貨（客戶取得控制權）那天。", "th": "IFRS 15 看的是商品控制權何時移轉，12 月 10 日交貨，那天就認列收入。", "tr": "簽約日、收款日都是干擾；收錢不等於賺到收入。"}, {"src": "11403-1", "f": 2, "s": "114-3", "tag": "金融工具", "q": "根據國際會計準則第 32 號「金融工具：表達」，當股票選擇權發行人可選擇以現金淨額交割或以本身股份交換現金方式交割時，該股票選擇權宜歸類為：", "o": ["金融資產", "金融負債", "權益", "一般資產"], "a": 1, "fl": "發行人可選擇交割方式的選擇權 ➔ 金融負債。", "th": "只要交割方式有選項（現金淨額或換股），依 IAS 32 就歸類為衍生性金融負債，不是權益。", "tr": "直覺會以為用自己股票交割就是權益，但「有交割選項」就是負債。"}, {"src": "11401-1", "f": 2, "s": "114-1", "tag": "財報要素", "q": "下列敘述何者錯誤？", "o": ["收益的認列可能與資產的原始認列同時發生", "負債帳面金額增加可能與費損的認列同時發生", "收益的除列通常於企業認列負債時發生", "資產的除列通常於企業喪失對已認列資產的控制時發生"], "a": 2, "fl": "「收益的除列」連到「認列負債」➔ 錯。", "th": "收益是權益增加的結果，通常跟資產增加或負債減少一起出現；說收益除列時會認列負債，方向完全不對。", "tr": "A、B、D 都是觀念架構原文，看起來很繞但都是對的，專心找方向錯的那一句。"}, {"src": "11202-26", "f": 2, "s": "112-2", "tag": "查核報告", "q": "下列敘述何者正確？", "o": ["關鍵查核事項是指依會計師專業判斷，對當期合併財務報表之查核最為重要之事項", "編製財務報表是治理單位的責任，管理階層負責監督財務報導流程", "查核意見之基礎段應在查核意見段之前", "不論是上市櫃公司或非上市櫃公司的查核報告，皆需包含關鍵查核事項段"], "a": 0, "fl": "關鍵查核事項 ➔ 會計師判斷當期查核最重要的事項。", "th": "財報是管理階層編的，治理單位負責監督；意見段在前、基礎段在後；只有上市櫃公司強制揭露關鍵查核事項。", "tr": "B 把管理階層和治理單位的責任對調了；D 的「不論上市櫃或非上市櫃」太絕對。"}, {"src": "11103-1", "f": 2, "s": "111-3", "tag": "品質特性", "q": "有用的財務資訊應同時具備攸關性與忠實表述兩項基本品質特性，下列何者屬於「攸關性」的內容？", "o": ["財務資訊能讓使用者用以預測未來結果", "讓使用者了解描述現象所須之所有資訊，包括所有必要之敘述及解釋", "財務資訊對經濟現象的描述，能讓各自獨立且具充分認知的經濟現象觀察者，達成對經濟現象的描述為忠實表述的共識", "財務資訊應清楚簡潔的分類、凸顯特性及表達"], "a": 0, "fl": "攸關性 ➔ 預測價值、確認價值、重大性。", "th": "攸關就是「對決策有用」，能幫人預測未來或確認過去的判斷，就是攸關。", "tr": "B 是完整性、C 是可驗證性、D 是可了解性，都不是攸關性。"}, {"src": "11403-26", "lv": "a", "f": 1, "s": "114-3", "tag": "品質特性", "q": "下列敘述何者錯誤？", "o": ["可比較性係指同一公司各年間均採相同的會計方法", "忠實表述係指會計資訊品質可確保免於錯誤", "攸關的會計資訊係指其具有改變決策的能力", "重大性係指公司規模可能影響投資人或債權人之決策"], "a": 1, "fl": "忠實表述 ➔ 不代表保證「完全沒有錯誤」。", "th": "忠實表述要求完整、中立、免於錯誤，但「免於錯誤」是指描述和過程沒有錯，不是保證每個數字都精準。", "tr": "A 其實比較像「一致性」，但官方答案是 B，考試照官方選。"}, {"src": "11402-26", "lv": "a", "f": 1, "s": "114-2", "tag": "會計恆等式", "q": "公司的價值等於：", "o": ["銷貨收入減銷貨成本", "現金流入減現金流出", "負債加上權益的價值", "有形不動產、廠房及設備加上無形資產的價值"], "a": 2, "fl": "公司的價值 ➔ 負債＋權益。", "th": "資產＝負債＋權益，公司所有資產都是由借來的錢和股東的錢撐起來的。", "tr": "D 只算到不動產廠房設備和無形資產，漏了流動資產。"}, {"src": "11402-3", "lv": "a", "f": 1, "s": "114-2", "tag": "調整分錄", "q": "關於調整分錄，下列敘述何者錯誤？", "o": ["於應計基礎下定期編製財務報表始須有調整分錄", "使用工作底稿後仍需另作調整分錄", "調整分錄應作而未作將造成現金項目之不實表達", "調整分錄之作成先於結帳分錄之作成"], "a": 2, "fl": "調整分錄 ➔ 處理應計與遞延，通常不碰現金。", "th": "調整分錄是把收入、費用歸到正確期間，例如應付利息、預付保險，不會造成現金不實。", "tr": "選「錯誤」的敘述，C 把調整分錄和現金扯在一起就是錯的。"}];
const FA2=[{"src": "11403-27", "f": 4, "s": "114-3", "tag": "預期信用損失", "q": "北投公司 X1 年 12 月 31 日應收帳款總額為$750,000，其中逾期 30 天以上之帳款共計 $200,000；該公司估計未逾期帳款之損失率為 2%，逾期 30 天以上之帳款損失率為 20%。若調整前備抵損失為貸餘$16,250，請問：該公司 X1 年度應提列多少預期信用損失於本期淨利？", "o": ["$34,750", "$38,750", "$51,000", "$67,250"], "a": 0, "fl": "應提列 ＝ 估計備抵餘額 − 調整前貸餘。", "th": "未逾期 550,000 × 2% = 11,000；逾期 200,000 × 20% = 40,000；應有備抵 51,000。調整前已有貸餘 16,250，只要再補 51,000 − 16,250 = 34,750。", "tr": "51,000 是期末備抵「餘額」，不是本期「提列數」。貸餘要減、借餘要加。"}, {"src": "11403-4", "f": 4, "s": "114-3", "tag": "票據貼現", "q": "前程公司由其客戶處收到一張面額$30,000，6 個月到期，利率 10%之票據。在收到二個月後因需要現金即持向某銀行貼現，貼現息為 12%，試問前程公司將自銀行收到多少現金？", "o": ["$30,870", "$30,300", "$30,280", "$30,240"], "a": 3, "fl": "貼現 ➔ 到期值 − 到期值 × 貼現率 × 剩餘月數。", "th": "到期值 = 30,000 × (1 + 10% × 6/12) = 31,500。已持有 2 個月，剩 4 個月；貼現息 = 31,500 × 12% × 4/12 = 1,260。拿到 31,500 − 1,260 = 30,240。", "tr": "貼現息要用「到期值」乘，不是用面額；月數用「剩下的」4 個月。"}, {"src": "11501-38", "f": 3, "s": "115-1", "tag": "存出保證金", "q": "存出保證金之性質為：", "o": ["資產", "負債", "收入", "費用"], "a": 0, "fl": "存出保證金 ➔ 資產（錢押在別人那裡，之後要拿回來）。", "th": "「存出」是我們把錢付出去當押金，將來可以收回，所以是資產；「存入保證金」才是負債。", "tr": "「存出」「存入」只差一個字，方向相反。"}, {"src": "11501-45", "f": 3, "s": "115-1", "tag": "進貨折扣", "q": "甲公司於 8 月 10 日向乙公司購貨，金額$42,000，授信條件是 2/10，n/30。甲公司在 8 月 19 日支付該筆款項，則下列何者為甲公司在 8 月 19 日正確的分錄？", "o": ["借記應收帳款$41,160", "貸記現金$41,160", "貸記應付帳款$41,160", "貸記現金$42,000"], "a": 1, "fl": "10 天內付款 ➔ 付 98%，貸記現金 41,160。", "th": "8/10 進貨，8/19 付款在折扣期內。42,000 × 98% = 41,160。分錄：借應付帳款 42,000，貸現金 41,160，貸進貨折扣 840。", "tr": "甲是買方，沒有應收帳款，A 直接刪；應付帳款是「借」記，不是貸記。"}, {"src": "11303-3", "f": 3, "s": "113-3", "tag": "零售價法", "q": "在採用零售價法評估期末存貨價值時，下列哪一項目會同時影響進貨的成本與零售價？", "o": ["進貨折扣", "進貨運費", "進貨退回", "正常損耗"], "a": 2, "fl": "同時影響成本與零售價 ➔ 進貨退回。", "th": "東西退回去，原本進來的成本少了，那批貨的標價也一起拿掉，兩邊都要扣。", "tr": "進貨折扣和進貨運費只動「成本」，正常損耗只動「零售價」。"}, {"src": "11501-36", "f": 2, "s": "115-1", "tag": "預期信用損失", "q": "天天公司有一筆應收帳款$1,000,000，天天公司認為該應收帳款自原始認列後信用風險已顯著增加，並估計其於未來 12 個月內的違約機率為 0.3%，於未來存續期間的違約機率為 0.5%，且若違約將損失總帳面金額 20%。天天公司於報導期間結束日應認列的備抵損失餘額應為？", "o": ["$6,000", "$600", "$1,000", "$10,000"], "a": 2, "fl": "信用風險顯著增加 ➔ 用「存續期間」違約率。", "th": "風險沒顯著增加用 12 個月違約率；已顯著增加改用存續期間。1,000,000 × 0.5% × 20% = 1,000。", "tr": "用 12 個月的 0.3% 會算出 600，正是陷阱 B。"}, {"src": "11402-21", "f": 2, "s": "114-2", "x": 1, "tag": "應收帳款", "q": "三重公司 X1 年度的銷貨金額為$5,000,000，其他財報資料如下：應收帳款總額減少 $100,000、備抵損失增加$10,000、提列預期信用減損損失$8,000。請問：該公司 X1 年度向客戶收取之現金為多少？", "o": ["$4,998,000", "$5,002,000", "$5,098,000", "$5,102,000"], "a": 3, "fl": "收現 ＝ 銷貨 ＋ 應收總額減少 ＋ 收回已沖銷帳款。", "th": "備抵增加 10,000，但只提列 8,000，表示沖銷數是 −2,000，也就是收回以前沖掉的帳 2,000。收現 = 5,000,000 + 100,000 + 2,000 = 5,102,000。", "tr": "直接用「銷貨 ＋ 應收減少」會選 B 的 5,100,000 附近；漏掉收回壞帳那 2,000。"}, {"src": "11102-1", "f": 2, "s": "114-1", "tag": "金融工具揭露", "q": "根據國際財務報導準則第 7 號「金融工具：揭露」之規定，因外幣匯率變動而導致金融工具之公允價值或未來現金流量波動之風險為：", "o": ["市場風險", "流動性風險", "信用風險", "利率風險"], "a": 0, "fl": "匯率變動造成公允價值波動 ➔ 市場風險。", "th": "IFRS 7 的市場風險包括匯率風險、利率風險和其他價格風險。", "tr": "有「利率風險」選項，但題目講的是匯率；匯率和利率都歸在市場風險底下。"}, {"src": "11401-3", "f": 2, "s": "114-1", "tag": "金融工具揭露", "q": "根據國際財務報導準則第 7 號「金融工具：揭露」之規定，對於以交付現金或其他金融資產清償之金融負債，企業履行與其相關之義務將面臨困難之風險為：", "o": ["信用風險", "流動性風險", "市場風險", "定價風險"], "a": 1, "fl": "還不出錢（履行金融負債有困難）➔ 流動性風險。", "th": "流動性風險是自己付不出錢；信用風險是別人欠我們錢不還。", "tr": "信用風險和流動性風險方向相反，看清楚是誰付不出來。"}, {"src": "11303-24", "f": 2, "s": "113-3", "tag": "存貨評價", "q": "嘉義公司 X1 年間投入成本$525,000 的原材料生產產品，尚須投入$420,000 完工為製成品，製成品估計售價及估計銷售費用分別為$980,000 及$17,500。若 X1 年底原材料重置成本降至$500,000，請問：原材料應提列多少「存貨跌價損失」？", "o": ["$0", "$17,500", "$35,000", "$70,000"], "a": 0, "fl": "製成品沒跌價 ➔ 原料不用提跌價損失。", "th": "製成品淨變現價值 980,000 − 17,500 = 962,500，總成本 525,000 + 420,000 = 945,000，成本低於淨變現價值，沒有損失，原料就不必減記。", "tr": "看到重置成本從 525,000 降到 500,000 就去算 25,000，是陷阱。原料要看製成品有沒有跌價。"}, {"src": "11303-13", "f": 2, "s": "113-3", "tag": "農業", "q": "青山牧場飼養乳牛於 X1 年初共生產牛奶 50,000 公升，每公升牛奶公允價值為$58，每公升牛奶出售成本為$6。若 X1 年當年發生飼料費用$200,000，採收牛奶工資$60,000，其他支出$90,000，請問該公司認列之「農產品-牛奶」(存貨)金額為多少？", "o": ["$2,250,000", "$2,340,000", "$2,400,000", "$2,600,000"], "a": 3, "fl": "農產品入帳 ➔ 數量 ×（公允價值 − 出售成本）。", "th": "50,000 × (58 − 6) = 2,600,000。飼料、工資這些費用直接列當期費用，不加進牛奶成本。", "tr": "把飼料、工資加減進去會算出其他選項，全部都是干擾數字。"}, {"src": "11203-35", "f": 2, "s": "112-3", "tag": "存貨成本", "q": "依國際財務報導準則規定，下列何者並非存貨成本的計算方法？", "o": ["個別認定法", "加權平均法", "後進先出法", "先進先出法"], "a": 2, "fl": "IFRS 禁用 ➔ 後進先出法。", "th": "IFRS 允許個別認定、先進先出、加權平均；後進先出已被禁止。", "tr": "選「並非」的那個，別選到先進先出。"}, {"src": "11003-6", "f": 2, "s": "110-3", "tag": "存貨錯誤", "q": "南投公司年底有批賒購的進貨漏未入帳，但期末存貨盤點正確，則該批進貨未入帳對當期財務報表之淨利、銷貨成本、應付帳款及保留盈餘影響各為何：", "o": ["高估、低估、低估、高估", "低估、高估、高估、低估", "高估、低估、高估、低估", "低估、高估、低估、高估"], "a": 0, "fl": "進貨漏記、存貨盤點正確 ➔ 淨利高估、銷貨成本低估、應付低估、保留盈餘高估。", "th": "進貨少記，銷貨成本就少算，淨利跟著多算，保留盈餘也多；賒購沒入帳，應付帳款少記。", "tr": "四個方向要一起對，記住銷貨成本和淨利方向一定相反。"}, {"src": "11403-11", "f": 1, "s": "114-3", "tag": "農業", "q": "初牛牧場 X3 年初以$130,000 購入一批蛋雞以生產雞蛋。X3 年飼養人員薪資$14,000、飼料成本$120,000，期末評估之公允價值為$135,000，若出售將發生出售成本$110,000。試問 X3 年財務報表中此批蛋雞之帳列金額為何？", "o": ["$20,000", "$25,000", "$154,000", "$264,000"], "a": 1, "fl": "生物資產 ➔ 公允價值 − 出售成本。", "th": "135,000 − 110,000 = 25,000。購入成本、薪資、飼料都不影響期末帳列金額。", "tr": "一步代入就好，別被 130,000、14,000、120,000 帶著跑。"}, {"src": "11501-4", "lv": "a", "f": 1, "s": "115-1", "tag": "存貨成本", "q": "在定期盤存制下，銷貨成本的計算方式為：", "o": ["期初存貨＋本期進貨", "期初存貨＋期末存貨＋本期進貨", "期初存貨－期末存貨＋本期進貨", "期末存貨－期初存貨＋本期進貨"], "a": 2, "fl": "定期盤存 ➔ 銷貨成本 ＝ 期初 ＋ 進貨 − 期末。", "th": "可供銷售的貨（期初＋進貨）扣掉月底還剩的，就是賣掉的成本。", "tr": "期末存貨要「減」，D 把期初和期末寫反了。"}, {"src": "11501-5", "lv": "a", "f": 1, "s": "115-1", "tag": "寄銷", "q": "乙公司將其製造的寄銷商品運至經銷商店甲公司，因而付出的運費，理論上應列為：", "o": ["甲公司的費用", "甲公司存貨成本", "乙公司的費用", "乙公司存貨成本"], "a": 3, "fl": "寄銷運費 ➔ 寄銷人（乙）的存貨成本。", "th": "寄銷品的所有權還在乙公司，送到店家的運費是讓存貨可供銷售的必要支出，算進乙的存貨成本。", "tr": "甲只是代賣，跟甲沒關係；也不是乙的銷貨運費（費用）。"}, {"src": "11403-18", "lv": "a", "f": 1, "s": "114-3", "x": 1, "tag": "存貨成本", "q": "大安公司 X1 年 8 月 1 日有存貨 60 件，每件成本價$60，當月進貨 90 件，銷售 105 件，採定期盤存制及加權平均成本公式。若 X1 年 8 月 31 日存貨成本為$2,538，請問：當月進貨單位成本為多少？", "o": ["$54", "$55", "$56.4", "$60"], "a": 0, "fl": "加權平均 ➔ 期末單價 ＝ 全部平均單價，倒推進貨成本。", "th": "期末件數 60 + 90 − 105 = 45 件，平均單價 2,538 ÷ 45 = 56.4。全部成本 56.4 × 150 = 8,460，扣期初 60 × 60 = 3,600，進貨 4,860 ÷ 90 = 54。", "tr": "56.4 是平均單價，不是進貨單價，正好是陷阱 C。"}, {"src": "11401-9", "lv": "a", "f": 1, "s": "114-1", "tag": "銀行調節", "q": "公司帳載銀行存款餘額為$80,000，發現下列事項：因進貨開立的支票$700，帳上記為$7,000；銀行代收票據$20,000，公司尚未入帳；未兌現支票$2,000。請問銀行存款正確的餘額應為多少？", "o": ["$91,700", "$93,700", "$104,300", "$106,300"], "a": 3, "fl": "公司帳調整 ➔ 加回記錯的 6,300 ＋ 代收票據 20,000；未兌現支票不調。", "th": "支票 700 誤記成 7,000，多扣了 6,300 要加回；銀行代收 20,000 公司還沒記，也要加。80,000 + 6,300 + 20,000 = 106,300。", "tr": "未兌現支票是調整「銀行對帳單」那一邊，不動公司帳。"}, {"src": "11401-5", "lv": "a", "f": 1, "s": "114-1", "x": 1, "tag": "票據貼現", "q": "甲公司於 7 月 1 日取得乙客戶之票據一紙，面額$72,000，附息 5%，5 個月到期。甲公司於 8 月 1 日持該票據向銀行貼現，貼現率為 8%。甲公司可自銀行取得多少現金？", "o": ["$71,180", "$71,240", "$71,540", "$71,680"], "a": 2, "fl": "到期值 × 貼現率 × 剩餘期間，再用到期值扣掉。", "th": "到期值 = 72,000 × (1 + 5% × 5/12) = 73,500。8/1 貼現，剩 4 個月；貼現息 = 73,500 × 8% × 4/12 = 1,960。73,500 − 1,960 = 71,540。", "tr": "剩餘期間是 4 個月不是 5 個月；用面額 72,000 算貼現息會選錯。"}, {"src": "11401-16", "lv": "a", "f": 1, "s": "114-1", "tag": "存貨", "q": "房地產公司購入而尚未出售之房屋應列為：", "o": ["無形資產", "不動產、廠房及設備", "基金與投資", "流動資產"], "a": 3, "fl": "建商買來要賣的房屋 ➔ 存貨（流動資產）。", "th": "對房地產公司來說，房子就是商品，要賣的東西就是存貨。", "tr": "看到「房屋」就選不動產廠房設備，是最常見的錯。"}];
const FA3=[{"src": "11301-48", "f": 4, "s": "113-1", "tag": "資產減損", "q": "X1 年底發生嚴重地震導致廠房毀損，其會計處理及表達為何？", "o": ["於附註中表達為非常損失", "於綜合損益表中表達為非常損失", "與一般廠房的會計處理方式相同，於報導期間結束日評估減損", "如經判斷該災害性質特殊且不常發生，始須於附註中表達為非常損失，反之則無須於附註中揭露"], "a": 2, "fl": "天災毀損 ➔ 跟一般廠房一樣，期末評估減損。", "th": "IFRS 已經沒有「非常損失」這個項目，天災造成的損害就照一般程序做減損測試。", "tr": "A、B、D 都在講「非常損失」，看到這四個字直接刪。"}, {"src": "11501-11", "f": 3, "s": "115-1", "tag": "投資性不動產", "q": "下列幾項屬投資性不動產？甲.目前尚未決定未來用途所持有之土地；乙.供員工使用之建築物；丙. 以融資租賃出租予另一企業之廠房；丁.以營業租賃出租予另一企業之建築物，且對租用該建築物之承租人提供清潔服務，該服務相較租賃合約不具重大性", "o": ["一項", "二項", "三項", "四項"], "a": 1, "fl": "投資性不動產 ➔ 未定用途的土地＋營業租賃出租（附屬服務不重大）。", "th": "甲：未決定用途的土地算。乙：自用，不算。丙：融資租賃出租，資產已轉給承租人，不算。丁：營業租賃出租、清潔服務不重大，算。共 2 項。", "tr": "丁附有清潔服務會讓人猶豫，但服務不重大就不影響分類。"}, {"src": "11403-37", "f": 3, "s": "114-3", "tag": "資產成本", "q": "太原公司最近由國外進口自動化機器一台，發票金額為$500,000，進口關稅$100,000，太原公司並支付了貨櫃運費$70,000，此機器估計耐用年限為 8 年、殘值為$20,000，請問此機器的可折舊成本為多少？", "o": ["$650,000", "$670,000", "$480,000", "$81,250"], "a": 0, "fl": "可折舊成本 ＝ 全部取得成本 − 殘值。", "th": "500,000 + 100,000 + 70,000 = 670,000，扣殘值 20,000 = 650,000。", "tr": "670,000 是取得成本；81,250 是每年折舊。題目問的是「可折舊成本」。"}, {"src": "11301-6", "f": 3, "s": "113-1", "tag": "折舊", "q": "甲公司 X1 年底，調整後有關機器之資料為：成本$500,000，累計折舊$400,000，估計使用年限為 6 年，且無殘值，採用直線法提列折舊。X2 年初加以翻修共花費$100,000，估計自 X2 年初起可再使用 8 年無殘值，則 X2 年度折舊費用為何？", "o": ["$20,000", "$18,750", "$15,000", "$25,000"], "a": 3, "fl": "翻修 ➔ 帳面金額 ＋ 翻修成本，再除以新的剩餘年限。", "th": "帳面 500,000 − 400,000 = 100,000，加翻修 100,000 = 200,000，再用 8 年攤：25,000。", "tr": "原本的 6 年耐用年限已經不用了，要改用新估計的 8 年。"}, {"src": "11103-9", "f": 3, "s": "111-3", "tag": "資產處分", "q": "金門公司在自有土地上拆除舊屋改建新屋。下列敘述何者正確？", "o": ["拆除費用應增加新屋之成本", "拆除費用應增加土地之成本", "拆除費用減舊屋殘值後之金額，應列入新屋之成本", "拆除費用減舊屋殘值後之金額，應列為舊屋之處分損益"], "a": 3, "fl": "自有土地拆舊屋 ➔ 拆除費減殘值列舊屋處分損益。", "th": "舊屋是自己原本就在用的，拆掉算處分；如果是「買地附舊屋」才把拆除費加進土地成本。", "tr": "跟「購入土地附舊屋」的題目長很像，答案完全不同。"}, {"src": "11501-41", "f": 2, "s": "115-2", "tag": "折舊方法", "q": "甲公司於 X1 年 1 月 1 日以$200,000 購入機器設備，並預計可使用 5 年，無殘值。若採用年數合計法計算折舊費用，則 X2 年的折舊費用為多少？", "o": ["$80,000", "$53,333", "$40,000", "$30,000"], "a": 1, "fl": "年數合計 ➔ 剩餘年數 ÷ 年數合計。", "th": "5 年的年數合計 = 15。第二年用 4/15：200,000 × 4/15 = 53,333。", "tr": "第一年才是 5/15 = 80,000，題目問 X2。"}, {"src": "11502-37", "f": 2, "s": "115-2", "tag": "折舊方法", "q": "甲公司於 X1 年初支付$800,000 購入一套系統，預計使用年限為 10 年，無殘值。若採用直線法折舊，但 X3 年改用雙倍餘額遞減法，則 X3 年的折舊費用為多少？", "o": ["$96,000", "$100,000", "$102,000", "$160,000"], "a": 3, "fl": "改折舊方法 ➔ 用當時帳面金額和剩餘年限往後算。", "th": "X1、X2 直線法各 80,000，X3 初帳面 640,000。剩 8 年，雙倍率 2/8 = 25%，640,000 × 25% = 160,000。", "tr": "用原本 10 年的 20% 會算出 128,000；要用「剩餘」年限。"}, {"src": "11502-38", "f": 2, "s": "115-2", "tag": "無形資產", "q": "根據國際財務報導準則(IFRS)，下列何者屬於「不可辨認無形資產」？", "o": ["專利權", "客戶關係", "軟體", "商譽"], "a": 3, "fl": "不可辨認無形資產 ➔ 商譽。", "th": "商譽無法單獨拿出來賣或授權，只能跟整個企業綁在一起，所以不可辨認。", "tr": "客戶關係、軟體、專利都可以單獨辨認。"}, {"src": "11501-25", "f": 2, "s": "115-1", "tag": "資產處分", "q": "處分設備之利益或損失係售價與下列何者之差？", "o": ["設備之成本", "設備之重置成本", "設備目前的淨變現價值", "設備之帳面金額"], "a": 3, "fl": "處分損益 ＝ 售價 − 帳面金額。", "th": "帳面金額就是成本扣累計折舊和減損，賣得比帳面高是利益，低是損失。", "tr": "用原始成本比較會漏掉累計折舊。"}, {"src": "11501-37", "f": 2, "s": "115-1", "tag": "金融資產", "q": "在 IFRS 9 實施之後，公司的資產負債表中不會出現：", "o": ["以成本衡量之金融資產", "透過損益按公允價值衡量之金融資產", "透過其他綜合損益按公允價值衡量之金融資產", "按攤銷後成本衡量之金融資產"], "a": 0, "fl": "IFRS 9 之後 ➔ 沒有「以成本衡量之金融資產」。", "th": "IFRS 9 只剩三類：按攤銷後成本、FVOCI、FVTPL。", "tr": "「攤銷後成本」還在，跟「成本」不一樣。"}, {"src": "11403-3", "f": 2, "s": "114-3", "tag": "資產成本", "q": "安康公司取得一項專利權，除支付現金$2,000,000 外，另開立一年期不附息票據 $3,500,000，又市場利率為 8%。此專利權之入帳成本為：", "o": ["$2,000,000", "$5,240,741", "$5,351,852", "$5,092,593"], "a": 1, "fl": "不附息票據 ➔ 用市場利率折現。", "th": "2,000,000 + 3,500,000 ÷ 1.08 = 2,000,000 + 3,240,741 = 5,240,741。", "tr": "直接加 3,500,000 會得到 5,500,000，忘了折現；也不是用 3,500,000 × 0.92。"}, {"src": "11103-35", "f": 2, "s": "114-3", "tag": "資產成本", "q": "武山公司購買汽車一部，付現$100,000 並開立一年期無息票據面額$500,000。若一般銀行貸款利率為 8%，則武山公司所購汽車之成本應為：", "o": ["$640,000", "$600,000", "$562,963", "$528,669"], "a": 2, "fl": "不附息票據 ➔ 面額 ÷ (1 ＋ 利率)。", "th": "100,000 + 500,000 ÷ 1.08 = 100,000 + 462,963 = 562,963。", "tr": "B 的 600,000 是沒有折現；D 是多折了一次。"}, {"src": "11402-9", "f": 2, "s": "114-2", "tag": "折舊方法", "q": "下列何種折舊方法所計算之第一年之折舊費用最大？", "o": ["直線法", "年數合計法", "雙倍數餘額遞減法", "不一定，視耐用年限而有不同"], "a": 2, "fl": "第一年折舊最大 ➔ 雙倍數餘額遞減法。", "th": "雙倍餘額遞減第一年用兩倍直線法的比率，乘上全部成本，所以第一年最多。", "tr": "年數合計法也是加速折舊，但第一年比雙倍餘額遞減少。"}, {"src": "11402-41", "f": 2, "s": "114-2", "tag": "金融資產", "q": "甲公司 X1 年初以$600,000 取得乙公司 20,000 股共計 10%之股權，並分類為透過其他綜合損益按公允價值衡量之金融資產。乙公司 X1 年間淨利為$300,000，支付股利$200,000，年末股價每股$31。甲公司資產負債表中投資乙公司股權之金額為何？", "o": ["$610,000", "$620,000", "$630,000", "$640,000"], "a": 1, "fl": "FVOCI 股票 ➔ 期末按公允價值列示。", "th": "20,000 股 × 31 = 620,000。被投資公司的淨利和股利不影響帳面金額。", "tr": "用權益法加減淨利、股利是錯的；持股 10% 沒有重大影響。"}, {"src": "11401-15", "f": 2, "s": "114-1", "tag": "資產交換", "q": "以帳面金額$2,000,000、公允價值$3,000,000 之房屋交換一公允價值$1,600,000 之較小房屋（與舊屋同作為辦公室用），並向對方收取現金$1,400,000，若此項交易不具商業實質，則此交換交易將產生利益若干？", "o": ["$0", "$600,000", "$800,000", "$1,000,000"], "a": 0, "fl": "不具商業實質 ➔ 不認列交換利益。", "th": "交換不具商業實質時，換入資產按換出資產帳面金額入帳，不認列利益，所以是 0。", "tr": "B、C、D 都是用公允價值算出來的利益，前提是「具」商業實質才會用。"}, {"src": "11001-11", "f": 2, "s": "114-1", "tag": "資產交換", "q": "公司於 109 年初以成本$4,000,000，累計折舊$2,500,000 之機器交換汽車，並收到現金$500,000，該項交易具商業實質，換入之汽車公允價值為$1,800,000，則換入汽車之成本為何？", "o": ["$1,000,000", "$1,200,000", "$1,500,000", "$1,800,000"], "a": 3, "fl": "具商業實質 ➔ 換入資產按公允價值入帳。", "th": "具商業實質的交換，換入汽車的成本就是它的公允價值 1,800,000。", "tr": "舊機器的帳面金額 1,500,000 和收到的現金都是干擾。"}, {"src": "11401-14", "f": 2, "s": "114-1", "tag": "資產交換", "q": "雨彤公司以帳面金額$4,500 之舊機器，加付現金$10,500，換得新機器，該項交易具商業實質，交換日舊、新機器之公允價值分別為$2,500 及$13,000，則新機器之入帳成本應為：", "o": ["$13,000", "$14,700", "$16,000", "$15,300"], "a": 0, "fl": "具商業實質 ➔ 換出公允價值 ＋ 付現。", "th": "2,500 + 10,500 = 13,000，剛好也等於新機器的公允價值。", "tr": "用舊機器帳面 4,500 加現金會算出 15,000，那是不具商業實質的算法。"}, {"src": "11303-11", "f": 2, "s": "113-3", "tag": "不動產廠房設備", "q": "下列何者應列於不動產、廠房及設備項下？", "o": ["購入土地，擬經整理後分區出售", "購入土地擬於價格較佳時轉手賺取價差", "購入土地擬作為廠房用地", "選項(A)(B)(C)皆是"], "a": 2, "fl": "土地自用（蓋廠房）➔ 不動產、廠房及設備。", "th": "要分區出售的是存貨，要賺價差的是投資性不動產，只有自己要用的才是不動產廠房設備。", "tr": "D「皆是」是陷阱，三種用途分類都不一樣。"}, {"src": "11303-42", "f": 2, "s": "113-3", "tag": "借款成本", "q": "甲公司自建廠房供自用，建造期間累積工程支出$750,000，該項建造支出符合借款成本資本化之條件，建造期間發生實際利息費用為$70,000，可免利息為$80,000。若外購則需花費$850,000，試計算該自建廠房入帳成本為：", "o": ["$750,000", "$810,000", "$820,000", "$850,000"], "a": 2, "fl": "自建資產 ➔ 支出 ＋ 實際利息與可免利息「取低」。", "th": "實際利息 70,000、可免利息 80,000，取低者 70,000。750,000 + 70,000 = 820,000。", "tr": "外購價 850,000 是干擾；用可免利息 80,000 會算出 830,000（不在選項）。"}, {"src": "11302-14", "f": 2, "s": "113-2", "tag": "資本支出", "q": "不動產、廠房及設備後續支出之當年度，若將資本支出誤列為收益支出，當年度財務報表將產生下列哪一種結果？", "o": ["資產多計，淨利多計", "資產少計，淨利少計", "資產多計，淨利少計", "資產少計，淨利多計"], "a": 1, "fl": "資本支出誤列費用 ➔ 資產少計、淨利少計。", "th": "應該列資產的錢被當成費用，資產少了，當年費用多了，淨利就少了。", "tr": "兩個都是「少計」，不要選成一多一少。"}, {"src": "11201-8", "f": 2, "s": "112-1", "tag": "折舊", "q": "永鈞公司以$21,000,000 購入房地，房屋估計可用 20 年無殘值，購入時土地與房屋之公允價值分別為$16,000,000 及$8,000,000，若採直線法提列折舊，則每年之折舊費用為：", "o": ["$250,000", "$300,000", "$350,000", "$150,000"], "a": 2, "fl": "整批購入 ➔ 依公允價值比例分攤，再算房屋折舊。", "th": "房屋占 8,000,000 ÷ 24,000,000 = 1/3，成本 21,000,000 × 1/3 = 7,000,000。7,000,000 ÷ 20 = 350,000。", "tr": "直接拿公允價值 8,000,000 ÷ 20 = 400,000 不在選項，但土地不能提折舊要記得。"}, {"src": "11201-7", "f": 2, "s": "112-1", "tag": "股權投資", "q": "投資公司擁有被投資公司 40%股權，其投資成本與股權淨值之差額，在投資公司之資產負債表上應：", "o": ["列為商譽", "列為「股權投資產生之商譽」", "包括於「股權投資」中", "列為「成本與股權淨值之差異」"], "a": 2, "fl": "權益法下的投資差額 ➔ 包含在「股權投資」裡，不單獨列。", "th": "持股 40% 用權益法，買價和股權淨值的差額（可能是商譽）都包在投資科目裡。", "tr": "商譽只有在合併報表才單獨列示。"}, {"src": "11103-22", "f": 2, "s": "111-3", "tag": "股權投資", "q": "丹尼爾公司發行每股面額$10 之普通股 6,000 股以取得秀賢公司 80%股份並對秀賢公司具有控制，丹尼爾公司所發行普通股的公允價值為$132,000。丹尼爾公司帳上應作的分錄何者錯誤？", "o": ["借記商譽$60,000", "借記採用權益法之投資$132,000", "貸記股本$60,000", "貸記資本公積$72,000"], "a": 0, "fl": "母公司帳上 ➔ 不記商譽，只記「採用權益法之投資」。", "th": "母公司自己的帳：借 採用權益法之投資 132,000，貸 股本 60,000、資本公積 72,000。商譽要到合併報表才會出現。", "tr": "選「錯誤」的分錄；商譽在個體帳上不會單獨出現。"}, {"src": "11103-10", "f": 2, "s": "111-3", "x": 1, "tag": "折舊方法", "q": "子瑜公司以$55,000 購入一台生產零件的機器，估計耐用年限 4 年，殘值$5,000，若採用雙倍餘額遞減法提列折舊，第三年和第四年應提列之折舊費用為何？", "o": ["$6,250；$6,250", "$6,875；$6,875", "$6,875；$1,875", "$6,875；$3,438"], "a": 2, "fl": "雙倍餘額遞減 ➔ 每年 50%，最後一年只提到殘值。", "th": "年限 4 年，比率 50%。第一年 27,500，剩 27,500；第二年 13,750，剩 13,750；第三年 6,875，剩 6,875；第四年只能提到殘值 5,000，所以是 1,875。", "tr": "第一年計算基礎不扣殘值；但最後一年要停在殘值，不能再提 3,438。"}, {"src": "11502-11", "f": 1, "s": "115-2", "tag": "折舊", "q": "甲公司在 X1 年購買一台機器設備，成本為$500,000，安裝費用為$50,000，運輸費用為 $20,000。公司估計該設備的殘值為$70,000，耐用年限為 10 年，使用直線法計算折舊費用，則第一年的折舊費用應為多少？", "o": ["$45,000", "$48,000", "$50,000", "$55,000"], "a": 2, "fl": "直線法 ➔（成本 ＋ 安裝 ＋ 運費 − 殘值）÷ 年限。", "th": "(500,000 + 50,000 + 20,000 − 70,000) ÷ 10 = 50,000。", "tr": "忘記扣殘值會算出 57,000；漏加運費會算出 48,000。"}, {"src": "11502-13", "f": 1, "s": "115-2", "tag": "金融資產", "q": "甲公司持有一項按公允價值衡量且其變動計入其他綜合損益的股權投資，該投資的初始成本為 $500,000。X2 年底公允價值為$550,000，X3 年底公允價值為$520,000。請問在 X3 年應認列多少其他綜合損益？", "o": ["$20,000", "-$20,000", "-$30,000", "-$50,000"], "a": 2, "fl": "FVOCI 當年 OCI ＝ 今年底 − 去年底公允價值。", "th": "520,000 − 550,000 = −30,000。", "tr": "跟原始成本比會算出 +20,000，那是累計數不是當年數。"}, {"src": "11502-33", "f": 1, "s": "115-2", "tag": "資產減損", "q": "雲林公司在 X1 年底進行金融資產的減損測試，該資產的帳面金額為$100,000，未來現金流量現值為 $85,000，公允價值減去處分成本的價值為$80,000。試問：該公司應認列的減損損失為多少？", "o": ["$20,000", "$15,000", "$25,000", "$5,000"], "a": 1, "fl": "減損 ＝ 帳面 − 可回收金額（使用價值、淨公允價值取高）。", "th": "可回收金額取 85,000 和 80,000 的高者 = 85,000。100,000 − 85,000 = 15,000。", "tr": "取低者會算出 20,000。可回收金額一律「取高」。"}, {"src": "11501-22", "f": 1, "s": "115-1", "tag": "資產成本", "q": "公司於 X1 年購買設備，總成本$300,000，另支付安裝費$50,000，員工訓練費用$10,000。設備成本應記為多少？", "o": ["$300,000", "$350,000", "$360,000", "$370,000"], "a": 1, "fl": "設備成本 ➔ 買價 ＋ 安裝費；訓練費是費用。", "th": "300,000 + 50,000 = 350,000。員工訓練費不是讓設備達到可用狀態的必要支出。", "tr": "把訓練費 10,000 加進去會選 C。"}, {"src": "11501-9", "f": 1, "s": "115-1", "tag": "資產成本", "q": "某機器設備定價$1,000,000，購入時現金折扣為$50,000，支付運費$40,000，安裝費$80,000，搬運不慎發生損壞而付出修理費$20,000，則該機器設備之帳面成本應為：", "o": ["$1,000,000", "$1,050,000", "$1,070,000", "$1,090,000"], "a": 2, "fl": "機器成本 ➔ 定價 − 現金折扣 ＋ 運費 ＋ 安裝費；搬壞修理費是費用。", "th": "1,000,000 − 50,000 + 40,000 + 80,000 = 1,070,000。", "tr": "搬運不慎的修理費 20,000 不能資本化。"}, {"src": "11502-10", "lv": "a", "f": 1, "s": "115-2", "x": 1, "tag": "折舊", "q": "甲公司於 X1 年初支付$900,000 購入一台設備，該設備的使用年限為 10 年，無殘值，甲公司採用直線法折舊。於 X4 年初，甲公司決定對設備進行改良，成本共計$200,000，並將剩餘使用年限重新估計為 7 年。請問甲公司 X4 年的折舊費用為何？", "o": ["$117,369", "$122,568", "$118,571", "$142,633"], "a": 2, "fl": "改良後 ➔（帳面 ＋ 改良成本）÷ 新的剩餘年限。", "th": "每年折舊 90,000，三年後帳面 630,000，加改良 200,000 = 830,000，再除以 7 = 118,571。", "tr": "用原成本 900,000 加改良去除會算錯。"}, {"src": "11502-18", "lv": "a", "f": 1, "s": "115-2", "tag": "投資性不動產", "q": "甲公司在 X1 年初以$600,000 購入一棟投資物業，採用公允價值模式進行後續計量。X3 年底公允價值為$650,000，X4 年底公允價值降至$620,000。該公司應在 X4 年財務報表中認列的損益為多少？", "o": ["$0", "$30,000 損失", "$30,000 收益", "$50,000 損失"], "a": 1, "fl": "公允價值模式 ➔ 當年公允價值變動直接進損益。", "th": "X3 底 650,000 降到 X4 底 620,000，X4 認列 30,000 損失。", "tr": "跟原始成本 600,000 比會以為還有利益。"}, {"src": "11502-6", "lv": "a", "f": 1, "s": "115-2", "tag": "權益法", "q": "萬能公司對其持有 35%股權的被投資公司具有重大影響，該被投資公司宣告並發放股利對投資公司的影響為何？", "o": ["流動比率改變", "每股盈餘改變", "投資收入改變", "每股帳面金額改變"], "a": 0, "fl": "權益法收到股利 ➔ 現金增加、投資減少 ➔ 流動比率改變。", "th": "收到現金股利，流動資產（現金）變多，非流動的投資變少，流動比率跟著變。", "tr": "權益法下股利不是收入，所以每股盈餘、投資收入都不變。"}, {"src": "11501-13", "lv": "a", "f": 1, "s": "115-1", "x": 1, "tag": "資產減損", "q": "甲公司於 X1 年初以$800,000 購入一項設備，預計使用年限為 8 年，殘值為$50,000，採直線法提列折舊。X3 年底進行減損測試時，該設備的可回收金額為$300,000。則應認列的減損損失為多少？", "o": ["$0", "$178,500", "$285,500", "$218,750"], "a": 3, "fl": "減損 ＝ 3 年後帳面 − 可回收金額。", "th": "每年折舊 (800,000 − 50,000) ÷ 8 = 93,750，三年 281,250。帳面 518,750 − 300,000 = 218,750。", "tr": "只扣兩年折舊會選到其他數字；X1 到 X3 是三年。"}, {"src": "11403-30", "lv": "a", "f": 1, "s": "114-3", "tag": "無形資產", "q": "大華工具機公司於X2年取得專門生產新機器手臂的專利，申請專利時支付了$1,200,000的法律與申請費用。此外，該公司於X2年期間，因控告其他公司違反專利權法，故產生了$4,800,000的法律訴訟費，這筆費用將於X3年支付。此項專利於X2年12月31日生效，大華公司估計這項專利將為公司未來五年期間帶來經濟利益，該公司的政策是在取得專利的當年度不予攤銷無形資產。對於其他公司侵犯專利權的行為，若大華公司已成功地捍衛其專利權。試問：大華工具機公司於X3年底的財務狀況表中，專利權的帳面金額為多少？", "o": ["$1,200,000", "$4,800,000", "$6,000,000", "$5,600,000"], "a": 2, "fl": "勝訴訴訟費 ➔ 資本化；專利成本 ＝ 申請費 ＋ 訴訟費。", "th": "專利成本 1,200,000 加上成功捍衛專利的訴訟費 4,800,000，共 6,000,000。官方解答直接以 6,000,000 作為 X3 年底帳面金額，沒有扣 X3 的攤銷。", "tr": "照一般算法 X3 要攤 1/5，會得到 B 的 4,800,000；但官方答案是 C，考試遇到原題請選 C。敗訴的訴訟費才列費用。"}, {"src": "11403-8", "lv": "a", "f": 1, "s": "114-3", "tag": "權益法", "q": "彥洪公司X1年1月1日以現金$1,000,000投資煙草公司有投票權的股份40%，當時煙草公司的股東權益為$200,000。投資當年度彥洪公司收到現金股利 $50,000，煙草公司X1 年度盈餘為$5,000,000，試問彥洪公司X1年12月31日帳上採用權益法之投資的餘額為多少？", "o": ["$2,950,000", "$3,000,000", "$5,500,000", "$3,050,000"], "a": 0, "fl": "權益法 ➔ 成本 ＋ 持股 × 被投資公司淨利 − 收到股利。", "th": "1,000,000 + 40% × 5,000,000 − 50,000 = 2,950,000。", "tr": "收到股利要「減」投資，不是列收入。"}, {"src": "11402-32", "lv": "a", "f": 1, "s": "114-2", "tag": "無形資產", "q": "下列何者不屬於無形資產定義之無形項目所須具備的條件？", "o": ["具可辨認性", "能為企業帶來未來經濟效益", "公允價值能可靠衡量", "為企業所控制"], "a": 2, "fl": "無形資產三條件 ➔ 可辨認、可控制、有未來經濟效益。", "th": "定義只要求這三項；「公允價值能可靠衡量」不是定義條件。", "tr": "認列條件講的是「成本」能可靠衡量，不是公允價值。"}, {"src": "11402-40", "lv": "a", "f": 1, "s": "114-2", "tag": "無形資產", "q": "下列何者屬無形資產？", "o": ["預付費用", "應收帳款", "商標權", "研究支出"], "a": 2, "fl": "無形資產 ➔ 商標權。", "th": "預付費用、應收帳款是流動資產；研究支出要直接列費用。", "tr": "研究支出不能資本化，發展支出符合條件才能。"}, {"src": "11402-19", "lv": "a", "f": 1, "s": "114-2", "tag": "資產處分", "q": "佳山公司擁有一超級市場，最近因應營業需要，將此超級市場的舊有房屋結構拆除，並在原地蓋一新的超級市場建築，則佳山公司應將此舊有房屋結構帳面金額作何處理？", "o": ["以其他損失處理", "以舊屋之處分損益處理", "納入土地成本", "納入新的超級市場之建築成本"], "a": 1, "fl": "自有舊屋拆掉重蓋 ➔ 舊屋處分損益。", "th": "舊屋是公司原本在用的資產，拆除就是報廢，帳面金額轉為處分損失。", "tr": "不能加進新建築成本，也不能加進土地成本。"}, {"src": "11402-8", "lv": "a", "f": 1, "s": "114-2", "tag": "資產成本", "q": "甲公司最近購入一筆土地及附帶舊屋，此舊屋已不堪使用，該舊屋在賣方的帳面金額為 $750,000。甲公司並發生各項支出：土地及舊屋價款$22,500,000；代書費$375,000；舊屋拆除費$450,000；舊屋拆除期間工人意外傷害賠償$150,000。則該公司應記錄土地成本多少？", "o": ["$23,025,000", "$22,875,000", "$23,325,000", "$23,475,000"], "a": 2, "fl": "土地成本 ➔ 價款 ＋ 代書費 ＋ 舊屋拆除費；意外賠償是費用。", "th": "22,500,000 + 375,000 + 450,000 = 23,325,000。", "tr": "賣方帳面 750,000 跟買方無關；工人傷害賠償不能資本化。"}];
const FA4=[{"src": "11203-3", "f": 4, "s": "112-3", "tag": "負債準備", "q": "下列何者屬於負債準備？", "o": ["公司債發行溢價部分", "可轉換公司債", "產品售後服務保證負債", "應付租賃款"], "a": 2, "fl": "負債準備 ➔ 產品售後服務保證（保固）。", "th": "負債準備是金額或時間不確定、要用估計的負債，保固最典型。", "tr": "公司債溢價、可轉債、應付租賃款金額都確定，不是負債準備。"}, {"src": "11403-2", "f": 3, "s": "114-3", "tag": "負債準備", "q": "關於負債準備之敘述何者有誤？", "o": ["保固承諾需估列負債準備", "固定賠償金額之死亡保險，其支付金額確定但支付時點不確定，為負債準備", "負債準備並非負債", "某些負債之金額僅可藉由估計加以衡量，或其支付之時點不確定，此類負債稱為負債準備"], "a": 2, "fl": "「負債準備並非負債」➔ 錯，它就是負債的一種。", "th": "負債準備是時點或金額不確定的負債，照樣列在資產負債表的負債項下。", "tr": "B 的死亡保險：金額確定但時點不確定，也算負債準備，不要誤殺。"}, {"src": "11403-6", "f": 2, "s": "114-3", "x": 1, "tag": "負債準備", "q": "石門公司為自動光學檢測(AOI)設備商，TMT檢測量測機出售時附有兩年的維護保固，根據過去經驗，發生故障維修的機率為0.25%，維修成本$4,000，發生零件更換的機率為0.5%，維修成本 $6,000。若X1年及X2年分別售出1,400及2,000台，實際發生修理費分別為$64,000及$72,000，請問：X2年底保固之負債準備餘額為多少？", "o": ["$4,000", "$7,200", "$8,000", "$10,000"], "a": 2, "fl": "每台預期保固成本 40 元；當年估計不夠就認列費用，餘額不會是負的。", "th": "每台：0.25% × 4,000 + 0.5% × 6,000 = 40 元。X1 估 1,400 × 40 = 56,000，實際 64,000，不夠的 8,000 直接列費用，年底餘額 0。X2 估 2,000 × 40 = 80,000，實際 72,000，年底剩 8,000。", "tr": "兩年合併計算會得到 0，不在選項，所以要逐年算。"}, {"src": "11303-10", "f": 2, "s": "113-3", "tag": "公司債", "q": "若以有效利率法（Effective Interest Method）攤銷公司債之折價，則每期所攤銷之折價金額為：", "o": ["遞增", "遞減", "不變", "不一定"], "a": 0, "fl": "有效利率法攤折價 ➔ 攤銷數遞增。", "th": "折價債帳面金額越來越大，利息費用（帳面 × 有效利率）越來越多，付現固定，所以攤銷數一年比一年多。", "tr": "溢價攤銷也是遞增，不要以為溢價就遞減。"}, {"src": "11302-15", "f": 2, "s": "113-2", "tag": "流動負債", "q": "長期負債若將於 12 個月內到期，並將以現金或另創流動負債償還之部分：", "o": ["仍列長期負債，不必特別處理", "仍列長期負債，另設「一年內到期長期負債」科目", "轉列流動負債", "以上作法皆非"], "a": 2, "fl": "一年內到期、要用流動資產還的長期負債 ➔ 轉列流動負債。", "th": "12 個月內要用現金或新的流動負債去還，就是流動負債。", "tr": "如果是要用償債基金或再融資長期借款來還，才繼續列長期負債。"}, {"src": "11301-22", "f": 2, "s": "113-1", "tag": "可轉債", "q": "宏碁乙是一種：", "o": ["特別股", "普通股", "可轉換公司債", "可轉換公司債轉換股票之權證"], "a": 3, "fl": "「○○乙」➔ 可轉換公司債轉換股票之權證（債換股權利證書）。", "th": "可轉債申請轉換後、新股發行前，先發給投資人一張可交易的權利證書，股名後面加「乙」。", "tr": "不是特別股；特別股通常是「○○甲」「○○特」。"}, {"src": "11203-40", "f": 2, "s": "112-3", "tag": "借款回存", "q": "長期借款合約中規定之借款回存，在財務報表上應如何表達？", "o": ["列為流動資產中之銀行存款", "列為流動資產，但非屬銀行存款", "列為長期投資或其他資產", "自長期負債中減除"], "a": 2, "fl": "長期借款規定的回存 ➔ 長期投資或其他資產。", "th": "這筆錢在借款期間都不能動用，不能當流動資產。", "tr": "不是銀行存款，也不能直接從負債扣掉。"}, {"src": "11202-35", "f": 2, "s": "112-2", "tag": "公司債", "q": "關於折價買入並持有至到期之公司債，下列敘述何者正確？", "o": ["持有人於買入當期之現時收益率(Current Yield)低於票面利率", "持有人於持有期間各期之到期收益率(Yield to Maturity)不變（以會計資料計算）", "持有人於持有期間各期所收取現金之總額高於買入價格加計各期利息收入之總額", "持有人於持有期間各期所收取現金之總額低於買入價格加計各期利息收入之總額"], "a": 1, "fl": "有效利率法 ➔ 各期到期收益率不變。", "th": "用有效利率法攤銷，每期都用買入時的到期收益率計息，所以各期報酬率固定。", "tr": "折價買入時現時收益率會「高於」票面利率；收現總額會等於買價加利息收入，不會一高一低。"}, {"src": "11202-8", "f": 2, "s": "112-2", "x": 1, "tag": "分期付款票據", "q": "甲公司 X2 年 1 月 1 日發行$272,325，5%，3 年到期抵押票據，每年年底付一次現金$100,000，共支付三年，請問第二年利息費用為：", "o": ["$5,000", "$9,225", "$9,297", "選項(A)(B)(C)皆錯誤"], "a": 2, "fl": "第二年利息 ＝ 第一年底剩餘本金 × 5%。", "th": "第一年利息 272,325 × 5% = 13,616，還本 100,000 − 13,616 = 86,384，剩 185,941。第二年利息 185,941 × 5% ≈ 9,297。", "tr": "B 的 9,225 是四捨五入算錯的陷阱；A 的 5,000 是亂套面額。"}, {"src": "11201-20", "f": 2, "s": "112-1", "tag": "公司債", "q": "某企業因計畫興建廠房，發行 10 年期長期公司債，發行時票面利率低於市場利率故折價發行，其帳上應該如何處理？", "o": ["一次認列折價總額為利息費用", "一次認列折價總額為利息收入", "折價總額應列為長期負債的減項再分期攤銷", "折價總額應列為長期負債的加項再分期攤銷"], "a": 2, "fl": "折價 ➔ 長期負債的減項，分期攤銷。", "th": "折價發行等於少收錢，這個差額之後要分期攤成利息費用，帳上列為應付公司債的減項。", "tr": "溢價才是加項；也不能一次認列。"}, {"src": "11103-48", "f": 2, "s": "111-3", "tag": "短期資金", "q": "一般公司最常應付短期資金不足的方式為：", "o": ["發行特別股", "向銀行借款", "發行公司債", "發行普通股"], "a": 1, "fl": "短期缺錢 ➔ 向銀行借款。", "th": "短期資金缺口最快、最便宜的方法是銀行短期借款；發股票、發公司債是長期資金。", "tr": "「最常」用的方法，不要選長期籌資工具。"}, {"src": "11102-33", "f": 2, "s": "111-2", "tag": "公司債", "q": "下列何者決定公司債每期債息的現金支出金額？", "o": ["市場利率水準", "債券的折現率", "債券的票面利率", "有效的實質利率"], "a": 2, "fl": "每期付多少債息 ➔ 面額 × 票面利率。", "th": "付給債權人的現金固定是票面利率乘面額；市場利率只影響發行價格和利息費用。", "tr": "有效利率決定的是「利息費用」，不是「付現金額」。"}, {"src": "11003-5", "f": 2, "s": "110-3", "tag": "附加科目", "q": "下列哪一項目在財務報表中是列為資產或負債的附加科目？", "o": ["累計折舊", "備抵損失", "處分廠房設備利益", "應付公司債溢價"], "a": 3, "fl": "附加科目（加項）➔ 應付公司債溢價。", "th": "溢價是加在公司債面額上的，讓帳面金額變大；累計折舊、備抵損失是「減項」（抵銷科目）。", "tr": "附加和抵銷方向相反，別看到「備抵」「累計」就選。"}, {"src": "11502-4", "lv": "a", "f": 1, "s": "115-2", "tag": "或有負債", "q": "如果企業在財務報表中揭露了一筆訴訟，該訴訟有可能導致重大的資金外流，這應屬於哪種負債？", "o": ["假定負債", "或有負債", "已確定負債", "估計負債"], "a": 1, "fl": "訴訟可能流出、只揭露 ➔ 或有負債。", "th": "可能但不確定會賠錢，金額也不一定估得出來，就在附註揭露為或有負債。", "tr": "「估計負債」需要很可能發生且能可靠估計，就會變負債準備入帳。"}, {"src": "11403-43", "lv": "a", "f": 1, "s": "114-3", "tag": "可轉債", "q": "下列何者會增加可轉換公司債的價值？", "o": ["凍結期間變長", "股票價格波動變大", "股票股息的發放多", "轉換期間短"], "a": 1, "fl": "可轉債價值 ↑ ➔ 股價波動變大（換股權更值錢）。", "th": "可轉債 = 債券 + 買權，波動越大買權越值錢。", "tr": "凍結期間變長、轉換期間短、發很多股息都會讓價值下降。"}, {"src": "11403-49", "lv": "a", "f": 1, "s": "114-3", "tag": "可轉債", "q": "轉換公司債的價值可視為一般公司債價值加上下列何者為宜？", "o": ["買權價值", "賣權價值", "附認股權證標的股票價值", "權證的履約價格"], "a": 0, "fl": "可轉債 ＝ 一般公司債 ＋ 買權。", "th": "可轉債讓投資人有權用轉換價格買股票，就是附了一個買權。", "tr": "不是賣權；認股權證是另一種商品。"}, {"src": "11402-38", "lv": "a", "f": 1, "s": "114-2", "tag": "公司債", "q": "關於溢價發行之公司債，下列敘述何者正確？", "o": ["發行公司於發行期間之各期利息費用將逐期增加", "發行公司於發行期間之各期有效利率不變", "發行公司於發行期間各期所償付現金之總額高於發行價格加計各期利息費用之總額", "發行公司於發行期間各期所償付現金之總額低於發行價格加計各期利息費用之總額"], "a": 1, "fl": "有效利率法 ➔ 各期有效利率不變。", "th": "溢價發行的帳面金額逐期變小，利息費用逐期減少，但有效利率固定。", "tr": "利息費用是「逐期減少」，A 剛好相反；付現總額會等於發行價加利息費用。"}, {"src": "11402-2", "lv": "a", "f": 1, "s": "114-2", "tag": "流動負債", "q": "辨別一項負債是否為流動負債的時間長短，是以一年或一個營業週期：", "o": ["取短者為判斷", "取長者為判斷", "取一年或一個營業週期兩者之平均", "無法判斷"], "a": 1, "fl": "流動 vs 非流動 ➔ 一年或一個營業週期「取長者」。", "th": "有些行業營業週期超過一年（例如營建業），就用營業週期判斷。", "tr": "不是取短，也不是平均。"}, {"src": "11401-26", "lv": "a", "f": 1, "s": "114-1", "tag": "可轉債", "q": "力麒公司於 20X4 年初以面額發行 2,000 張、每張 1,000 元的三年期可轉換公司債，票面利率為 6%，每年付息一次，每張公司債可轉換 30 股、每股面額 10 元的普通股。若該公司債發行時，條件相同但不可轉換的公司債之發行價格為$1,900,000，試問：力麒公司於 20X4 年初發行時應付公司債的帳面金額為多少？", "o": ["$2,000,000", "$1,800,000", "$2,200,000", "$1,900,000"], "a": 3, "fl": "可轉債發行 ➔ 負債部分 ＝ 不可轉換同類債的價格。", "th": "可轉債要拆成負債和權益（轉換權），負債組成部分就是一般公司債的價格 1,900,000，剩下 100,000 列資本公積。", "tr": "選面額 2,000,000 就是忘了拆分。"}];
const FA5=[{"src": "11202-37", "f": 5, "s": "114-2", "tag": "股利", "q": "密西根公司宣告並發放現金股利，將使其：", "o": ["流動比率不變", "投資活動的現金流入量增加", "淨值報酬率下降", "負債總額不變"], "a": 3, "fl": "宣告＋發放現金股利 ➔ 負債總額最後不變。", "th": "宣告時負債增加，發放時負債又減回來，兩步合在一起負債不變，只有現金和保留盈餘減少。", "tr": "流動比率會變；現金流量是籌資活動流出，不是投資活動。"}, {"src": "11402-4", "f": 4, "s": "114-2", "tag": "股利", "q": "公司宣告並發放現金股利，則：", "o": ["純益增加", "營運現金流量增加", "現金減少", "資產總額不變"], "a": 2, "fl": "宣告並發放現金股利 ➔ 現金減少。", "th": "錢付出去了，現金和資產總額都減少，保留盈餘也減少。", "tr": "不影響淨利，也不是營業活動現金流量（是籌資活動）。"}, {"src": "11501-23", "f": 3, "s": "115-1", "tag": "股利", "q": "下列敘述何者錯誤？", "o": ["發放普通股股票股利會降低普通股每股帳面金額", "股票股利發放後，企業現金會減少", "積欠累積優先股股利不須入帳，僅附註揭露", "股票分割會降低普通股每股帳面金額"], "a": 1, "fl": "股票股利 ➔ 現金不變。", "th": "發的是股票，沒有付錢，現金一毛都不會少。", "tr": "股票股利和股票分割都會讓每股帳面金額下降；積欠的累積特別股股利只附註揭露。"}, {"src": "11403-23", "f": 3, "s": "114-3", "tag": "庫藏股", "q": "保安公司權益的帳面金額資料如下：普通股股本（面額為$10）$100,000、資本公積 $104,000、保留盈餘$200,000、庫藏股（成本法）$50,000，合計$354,000，假設公司再以每股$15 的價錢出售庫藏股 5,000 股，則股本的金額將為：", "o": ["$50,000", "$75,000", "$100,000", "$175,000"], "a": 2, "fl": "賣庫藏股 ➔ 股本不變。", "th": "成本法下買回、賣出庫藏股都不動股本，差額記在資本公積或保留盈餘。", "tr": "題目給一堆數字讓你去算，其實股本原封不動是 100,000。"}, {"src": "11403-17", "f": 3, "s": "114-3", "tag": "股利收益率", "q": "某企業流通在外普通股共20,000股，原始發行價格為每股15元，目前普通股每股帳面金額為25元，每股市價為40元，今年度宣告的普通股股利共有80,000元，請問該公司股票的收益率（DividendYield）為多少？", "o": ["7.5%", "10%", "8%", "13.3%"], "a": 1, "fl": "股利收益率 ＝ 每股股利 ÷ 市價。", "th": "每股股利 80,000 ÷ 20,000 = 4 元，4 ÷ 40 = 10%。", "tr": "分母用市價 40，不是帳面金額 25 或發行價 15。"}, {"src": "11403-40", "f": 3, "s": "114-3", "x": 1, "tag": "每股帳面", "q": "累積特別股 5%面額$100（核准發行 1,000 股），帳面上特別股折價為$3,000、積欠股利 $7,000，普通股每股面額$40，核准發行 10,000 股，已發行 8,000 股，普通股溢價為 $68,000，累積盈餘為$30,000，特別股收回價格為$110，則普通股每股帳面金額為？", "o": ["$49.5", "$50.125", "$49.75", "$63.25"], "a": 2, "fl": "普通股權益 ＝ 權益總額 −（特別股收回價 ＋ 積欠股利）。", "th": "權益總額：特別股 100,000 − 折價 3,000 + 普通股 320,000 + 溢價 68,000 + 盈餘 30,000 = 515,000。特別股要拿 1,000 × 110 + 7,000 = 117,000。普通股 398,000 ÷ 8,000 = 49.75。", "tr": "用核准股數 10,000 或忘記加積欠股利都會選錯。"}, {"src": "11402-10", "f": 3, "s": "114-2", "tag": "權益變動", "q": "下列何者交易發生時會影響權益之帳面金額？甲.宣告現金股利；乙.宣告股票股利；丙.買入庫藏股；丁.以低於成本之價格出售庫藏股", "o": ["僅甲、乙、丙", "僅甲、乙、丁", "僅甲、丙、丁", "甲、乙、丙、丁"], "a": 2, "fl": "影響權益總額 ➔ 有現金或負債進出的（現金股利、買賣庫藏股）。", "th": "甲：宣告現金股利產生負債，權益減少。乙：股票股利只是權益內部搬家，總額不變。丙：買庫藏股付現，權益減少。丁：賣庫藏股收現，權益增加。", "tr": "丁是「低於成本」出售，還是有收到錢，權益照樣增加。"}, {"src": "11401-31", "f": 3, "s": "114-1", "tag": "股利", "q": "發放股票股利，將使：", "o": ["流動比率上升", "投資活動的現金流入量增加", "淨值報酬率下降", "流動在外股數增加"], "a": 3, "fl": "發放股票股利 ➔ 流通在外股數增加。", "th": "股票股利就是發新股給股東，股數變多，資產、負債、權益總額都不變。", "tr": "流動比率、淨值報酬率都不變。"}, {"src": "11501-47", "f": 2, "s": "115-1", "tag": "資本結構", "q": "下列何種金融工具不會改變一公司的資本結構？", "o": ["認股權證", "實施庫藏股，辦理減資", "由其他證券公司發行該公司的股票認購權證", "特別股"], "a": 2, "fl": "別家券商發行的認購權證 ➔ 不影響公司資本結構。", "th": "認購權證是證券商發行的，履約時由券商交付市場上的股票，公司股數和負債都不變。", "tr": "公司自己發的認股權證會增加股數；庫藏股減資、特別股都會改變結構。"}, {"src": "11501-42", "f": 2, "s": "115-1", "tag": "股利收益率", "q": "赫洙公司發放普通股現金股利$500,000，股價$20，每股盈餘$5，共發行 500,000 股，則該公司現金收益率為何？", "o": ["5%", "7.5%", "10%", "20%"], "a": 0, "fl": "現金收益率 ＝ 每股現金股利 ÷ 股價。", "th": "每股股利 500,000 ÷ 500,000 = 1 元，1 ÷ 20 = 5%。", "tr": "EPS 5 元是干擾；1 ÷ 5 = 20% 是股利支付率。"}, {"src": "11403-19", "f": 2, "s": "114-3", "tag": "每股淨值", "q": "下列有關普通股每股淨值的敘述，何者正確？甲、每股淨值不能低於每股之面額；乙、每股淨值不能為負值；丙、每股淨值為總資產除以流通在外股數；丁、每股淨值等於普通股權益除以流通在外股數", "o": ["僅甲和乙", "僅乙和丙", "僅乙和丁", "僅丁"], "a": 3, "fl": "每股淨值 ➔ 普通股權益 ÷ 流通在外股數；可以低於面額、也可以是負的。", "th": "公司虧損嚴重時，每股淨值會低於面額，甚至變成負數。分子是普通股權益，不是總資產。", "tr": "甲、乙看起來很像規定，其實都不對。"}, {"src": "11401-18", "f": 2, "s": "114-1", "tag": "股利", "q": "「待分配股票股利」在資產負債表上應列於？", "o": ["資產", "負債", "權益", "選項(A)(B)(C)皆非"], "a": 2, "fl": "待分配股票股利 ➔ 權益。", "th": "股票股利發的是公司自己的股票，不用付現金，所以不是負債，宣告後先放在權益項下。", "tr": "「應付現金股利」才是負債，兩個很容易搞混。"}, {"src": "11401-38", "f": 2, "s": "114-1", "tag": "特別股", "q": "下列的會計處理，何者正確？", "o": ["公司宣布發放股票股利時，分錄中「待分配股票股利」已列入負債科目", "處分不動產、廠房及設備的收益，應以稅後淨額轉入資本公積，不列為當年度的營業外收入", "投資以後年度收到被投資公司所發放的股票股利時，以股利收入入帳，列為營業外收入", "公司發行累積特別股，其積欠股利未列入負債，僅以附註揭露"], "a": 3, "fl": "累積特別股積欠股利 ➔ 不入帳，只附註揭露。", "th": "還沒宣告就沒有法律義務，所以不是負債，只要在附註說明。", "tr":
