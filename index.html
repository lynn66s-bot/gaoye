體盤查之減碳目標？", "o": ["2023 年", "2025 年", "2027 年", "2029 年"], "a": 1, "fl": "資本額 100 億以上 ➔ 2025 年揭露減碳目標。", "th": "金管會永續路徑：資本額 100 億以上公司先做，2025 年要揭露溫室氣體盤查及減碳目標。", "tr": "全體上市櫃公司是 2027 年，兩個常一起出。"}, {"src": "11303-47", "f": 3, "s": "113-3", "tag": "永續揭露", "q": "我國全體上市櫃公司最晚須在何時完成溫室氣體盤查之資訊揭露？", "o": ["2023 年", "2025 年", "2027 年", "2029 年"], "a": 2, "fl": "全體上市櫃公司 ➔ 2027 年完成溫室氣體盤查揭露。", "th": "分階段推動：大公司先做，所有上市櫃公司最晚 2027 年。", "tr": "2025 年是 100 億以上的大公司。"}, {"src": "11102-12", "f": 3, "s": "112-3", "tag": "股權質押", "q": "公開發行公司持股超過百分之十之股東，其持有之公司股票經設定質權者，出質人應即通知公司；公司則應於其質權設定後若干日內，將其出質情形，向主管機關申報並公告之？", "o": ["3 日內", "5 日內", "10 日內", "15 日內"], "a": 1, "fl": "持股 10% 大股東設質 ➔ 公司於質權設定後 5 日內申報公告。", "th": "證交法：董監、經理人、10% 大股東設質，出質人要立刻通知公司，公司 5 日內向主管機關申報公告。", "tr": "公司法下董事設質是 15 日內；證交法是 5 日內。"}, {"src": "11203-1", "f": 3, "s": "112-3", "tag": "股權質押", "q": "依「公司法」規定，董事之股份設定或解除質權者，應即通知公司，公司應於質權設定或解除後幾日內，將其質權變動情形，向主管機關申報並公告之？", "o": ["五日", "十日", "十五日", "三十日"], "a": 2, "fl": "依「公司法」董事股份設質 ➔ 公司 15 日內申報公告。", "th": "公司法第 197 條之 1：董事股份設定或解除質權，公司應於 15 日內申報並公告。", "tr": "題目寫「公司法」選 15 日；寫「證交法」選 5 日。"}, {"src": "11203-49", "f": 3, "s": "112-3", "tag": "公開收購", "q": "有關公開收購之條件，下列敘述何者為錯誤？", "o": ["公開收購開始後不得調降公開收購價格", "公開收購人得依對象不同以不同收購條件為公開收購", "公開收購開始後，不得降低預定公開收購有價證券之數量", "公開收購開始後，公開收購人不得於集中交易市場或證券商營業所，或任何場所購買同種類之有價證券"], "a": 1, "fl": "公開收購條件 ➔ 必須一律平等，不得因對象不同而不同。", "th": "公開收購要給所有應賣人相同條件。", "tr": "不得調降價格、不得減少數量、不得在市場另外買，這些都是對的。"}, {"src": "11201-11", "f": 3, "s": "112-1", "tag": "庫藏股", "q": "下列敘述何者正確？", "o": ["依「證券交易法」規定，買回股份均應於六個月內辦理變更登記", "買回股份除可供質押外，不得享有股東權利", "上市櫃公司除依「證券交易法」第二十八條之二規定於集中交易市場或店頭市場買回外，尚可依公開收購辦法於集中交易市場或店頭市場外收購", "公司買回股份，未於二個月內執行完畢者，得申報延長一個月為之"], "a": 2, "fl": "上市櫃公司買回股份 ➔ 集中市場、店頭市場之外，也可以公開收購。", "th": "買回股份可以在市場買，也可以依公開收購辦法在市場外收購。", "tr": "維護信用買回的股份要 6 個月內銷除；未執行完畢要重新申報，不能延長。"}, {"src": "11502-28", "f": 2, "s": "115-2", "tag": "財務報告", "q": "公開發行公司各期間財務報告之規範，以下何者正確？", "o": ["年度財務報告須於會計年度終了後 1 個月內公告", "各季財務報告僅須會計師核閱即可公告", "各季財務報告應於每季終了後 30 日公告", "第 1、第 2 及第 3 季財務報告應於每季終了後 45 日公告"], "a": 3, "fl const LAW4=[{"src": "11402-13", "f": 5, "s": "114-2", "tag": "有價證券定義", "q": "下列何者為證券交易法所稱之有價證券？甲、政府債券；乙、新股認購權利證書；丙、公司股票；丁、商業本票", "o": ["僅甲、乙、丙", "僅乙、丙、丁", "僅甲、丙、丁", "僅甲、乙、丁"], "a": 0, "fl": "證交法有價證券 ➔ 政府債券、公司股票、公司債、新股認購權利證書、受益憑證；商業本票「不是」。", "th": "商業本票是短期票券，歸票券金融管理法管。", "tr": "舊題選項寫「甲、乙、丙」，新題寫「僅甲、乙、丙」，答案一樣。"}, {"src": "11102-21", "f": 5, "s": "114-2", "tag": "有價證券定義", "q": "下列何者非為「證券交易法」所規範之有價證券？", "o": ["公司債券", "公司股票", "存託憑證", "商業本票"], "a": 3, "fl": "不是證交法有價證券 ➔ 商業本票。", "th": "商業本票屬票券金融管理法。", "tr": "存託憑證是證交法的有價證券，別刪錯。"}, {"src": "11402-17", "f": 3, "s": "114-2", "tag": "申報生效", "q": "發行人募集與發行海外有價證券，依規定檢齊相關書件提出申報，於金融監督管理委員會及其指定之機構收到申報書即日起屆滿幾個營業日申報生效？", "o": ["5 個營業日", "12 個營業日", "15 個營業日", "30 個營業日"], "a": 1, "fl": "海外有價證券 ➔ 12 個營業日生效。", "th": "募集發行海外有價證券，一樣是 12 個營業日。", "tr": "5 個、15 個、30 個都是干擾；海外、國內現金增資都是 12 個營業日。"}, {"src": "11203-37", "f": 3, "s": "112-3", "tag": "ETF", "q": "關於 ETF 折溢價風險，何者錯誤？", "o": ["折價是市價低於淨值，可能因市場需求不足造成", "買賣前應注意 ETF 的折溢價，儘量避免交易市價偏離淨值過大的 ETF", "溢價是市價高於淨值，溢價表示買盤熱絡，應該趕快跟著搶購", "ETF 達發行額度上限，發行人無法再受理申購時，ETF 可能會持續溢價"], "a": 2, "fl": "ETF 溢價 ➔ 市價高於淨值，買了等於買貴，不該搶進。", "th": "溢價代表買貴了，價格可能回到淨值。", "tr": "選錯誤的；C 鼓勵搶購是錯的。"}, {"src": "11502-4", "f": 2, "s": "115-2", "tag": "交換公司債", "q": "所謂交換公司債，係指公開發行公司得發行以其持有期限至少在幾年以上之其他上市或上櫃公司股票為償還標的之公司債？", "o": ["5 年", "3 年", "2 年", "1 年"], "a": 2, "fl": "交換公司債 ➔ 用持有 2 年以上的他公司上市櫃股票當償還標的。", "th": "公開發行公司以持有 2 年以上的其他上市櫃股票作為交換標的。", "tr": "1 年、3 年都錯；記「交換要放 2 年」。"}, {"src": "11502-5", "f": 2, "s": "115-2", "tag": "總括申報", "q": "上市公司發行新股擬採總括申報，應同時符合多項條件，其中申報時市值門檻為何？", "o": ["應達新臺幣十億元以上", "應達新臺幣二十億元以上", "應達新臺幣三十億元以上", "應達新臺幣五十億元以上"], "a": 1, "fl": "上市公司發行新股總括申報 ➔ 市值 20 億元以上。", "th": "總括申報是給體質好的公司的便利，所以設有市值門檻。", "tr": "10 億、30 億是干擾。"}, {"src": "11502-9", "f": 2, "s": "115-2", "tag": "公司債", "q": "依現行「公司法」規定，發行擔保公司債之總額，不得超過公司現有全部資產減去全部負債之餘額的多少？", "o": ["一倍", "二分之一", "三分之一", "三分之二"], "a": 0, "fl": "擔保公司債總額 ➔ 不超過資產減負債的「1 倍」；無擔保 ➔ 1/2。", "th": "有擔保比較安全，額度高；無擔保只能發一半。", "tr": "兩個數字常一起考。"}, {"src": "11103-49", "f": 2, "s": "115-1", "tag" const LAW5=[{"src": "11003-6", "f": 3, "s": "115-2", "tag": "營業保證金", "q": "證券商每設置一分支機構，應增提多少營業保證金？", "o": ["新臺幣一百萬元", "新臺幣二百萬元", "新臺幣五百萬元", "新臺幣三千萬元"], "a": 2, "fl": "每設一分支機構 ➔ 增提營業保證金 500 萬元。", "th": "分支機構多，風險也多，要多存保證金。", "tr": "資本額則要增加 3,000 萬元，兩個常被對調。"}, {"src": "11502-26", "f": 3, "s": "115-2", "tag": "分支機構", "q": "證券商每多設置一家簡易分支機構，其最低實收資本額應增加多少？", "o": ["免增加", "新臺幣五百萬元", "新臺幣一千萬元", "新臺幣三千萬元"], "a": 3, "fl": "每多設一家（簡易）分支機構 ➔ 實收資本額增加 3,000 萬元。", "th": "分支機構越多，資本要求越高。", "tr": "營業保證金才是 500 萬元。"}, {"src": "11502-13", "f": 3, "s": "115-2", "tag": "自營業務", "q": "證券商除由金融機構兼營者依有關法令規定外，其經營自行買賣有價證券業務者，持有任一本國公司股份之總額不得超過該公司已發行股份總額之___；持有任一本國公司所發行有價證券之成本總額，並不得超過該證券商淨值之___。", "o": ["5%；10%", "5%；20%", "10%；15%", "10%；20%"], "a": 3, "fl": "自營商持股任一公司 ➔ 不超過該公司股份 10%；成本不超過淨值 20%。", "th": "避免自營商集中投資單一公司。", "tr": "5%、15% 是干擾。"}, {"src": "11402-8", "f": 3, "s": "114-2", "tag": "最低資本額", "q": "綜合證券商之最低實收資本額應為新臺幣（沒有分支機構）：", "o": ["3 億元", "10 億元", "20 億元", "30 億元"], "a": 1, "fl": "綜合證券商 ➔ 10 億元。", "th": "承銷 4 億＋自營 4 億＋經紀 2 億＝10 億。", "tr": "公司制證交所 5 億、證金公司 40 億、只做虛擬通貨的自營商 1 億。"}, {"src": "11203-24", "f": 3, "s": "114-2", "tag": "最低資本額", "q": "公司制證券交易所之最低實收資本額為新臺幣：", "o": ["15 億元", "10 億元", "5 億元", "1 億元"], "a": 2, "fl": "公司制證券交易所 ➔ 5 億元。", "th": "證交法規定公司制證交所最低實收資本額 5 億。", "tr": "10 億是綜合證券商。"}, {"src": "11301-21", "f": 3, "s": "113-1", "tag": "特別盈餘公積", "q": "某證券商為專營證券業務之上櫃公司，且其特別盈餘公積尚未達實收資本額，則該證券商應於每年稅後盈餘項下，提存多少比例之特別盈餘公積？", "o": ["百分之十", "百分之二十", "百分之三十", "百分之五十"], "a": 1, "fl": "證券商特別盈餘公積 ➔ 稅後盈餘提 20%。", "th": "證券商除了法定盈餘公積，還要多提特別盈餘公積增加安全性。", "tr": "一般公司法定盈餘公積是 10%。"}, {"src": "11203-15", "f": 3, "s": "112-3", "tag": "消極資格", "q": "甲為持有 X 證券商已發行股份總數 10%之大股東，甲若具有下列何種情事時，不得充任 X 證券商之董事、監察人或經理人？", "o": ["受證券交易法第 56 條及第 66 條第 2 款解除職務之處分，已滿三年", "最近三年內在金融機構有拒絕往來或喪失債信之紀錄", "依證券交易法之規定，受罰金以上刑之宣告，執行完畢、緩刑期滿或赦免後已滿三年", "曾任法人宣告破產時之董事、監察人、經理人或其他地位相等之人，其破產終結已滿三年"], "a": 1, "fl": "不得任證券商董監經理人 ➔ 最近 3 年內有拒絕往來紀錄。", "th": "其他選項都已經「滿三年」，可以擔任。", "tr": "看清楚「已滿三年」和「三年內」。"}, {"src": "11502-14", "f": 2, "s": "115-2", "tag": "財務報告", "q": "證券商財務報告的編製基礎為：", "o": ["現金發生制", "權責發生制", "現金發生制與權責發生制並行", "選項(A)、(B)二者擇一"], "a": 1, "fl": "證券商財報 ➔ 權責發生制。", "th": "跟一般公司一樣用應計基礎。", "tr": "不能用現金制。"}, {"src": "11502-21", "f": 2, "s": "115-2", "tag": "人員訓練", "q": "初任及離職滿三年再任之證券商業務人員應於到職後多久之內參加職前訓練？", "o": ["1 個月", "3 個月", "半年", "1 年"], "a": 2, "fl": "初任或離職滿 3 年再任 ➔ 到職後半年內參加職前訓練。", "th": "新進或回鍋的人員要先上課。", "tr": "在職訓練是每 3 年。"}, {"src": "11501-21", "f": 2, "s": "115-1", "tag": "自營商", "q": "對於證券自營商之規定，下列何項敘述錯誤？", "o": ["證券自營商不得接受投資人之委託於市場內買賣", "證券自營商除自行於市場內買賣有價證券外，並得委託其他經紀商代為買賣", "對同一證券，自營商申報價格與經紀商相同時，以經紀商之買賣優先成交", "證券自營商不得申報賣出其未持有之有價證券"], "a": 1, "fl": "自營商 ➔ 只能自己在市場內買賣，不得委託其他經紀商。", "th": "自營商用自己的帳戶自己下單。", "tr": "同價時經紀商優先成交；自營商不得賣出未持有的證券。"}, {"src": "11003-20", "f": 2, "s": "114-2", "tag": "最低資本額", "q": "若證券自營商僅經營自行買賣具證券性質之虛擬通貨業務者，其最低實收資本額應為新臺幣 (無分支機構):", "o": ["1 億元", "3 億元", "5 億元", "10 億元"], "a": 0, "fl": "自營商只做具證券性質虛擬通貨 ➔ 1 億元。", "th": "業務範圍窄，資本門檻較低。", "tr": "綜合證券商才是 10 億。"}, {"src": "11302-22", "f": 2, "s": "113-2", "tag": "資金運用", "q": "某一證券商淨值為 20 億，若經主管機關核准將其資金用於股權性質之投資，則其投資取得成本總額不得超過：", "o": ["6 億", "8 億", "10 億", "15 億"], "a": 0, "fl": "淨值 20 億、股權性質投資 ➔ 上限 6 億（淨值 30%）。", "th": "證券商資金用於股權性質投資，取得成本總額有上限。", "tr": "轉投資總額上限是淨值 40%，別混。"}, {"src": "11301-39", "f": 2, "s": "113-1", "tag": "資本適足", "q": "證券商應按月編造資本適足明細申報表一份，於次月何日前送達證交所？", "o": ["三日", "七日", "十日", "十五日"], "a": 2, "fl": "資本適足明細表 ➔ 按月編造，次月 10 日前送證交所。", "th": "每個月檢查一次資本夠不夠。", "tr": "7 日、15 日是干擾。"}, {"src": "11203-17", "f": 2, "s": "112-3", "tag": "解職處分", "q": "證券商營業員因違反法令受解職處分，則未滿下列何期限不得再從事證券業務？", "o": ["1 年", "2 年", "3 年", "5 年"], "a": 2, "fl": "營業員被解職 ➔ 3 年內不得再從事證券業務。", "th": "違法被解職的人要隔一段時間才能回來。", "tr": "1 年、5 年都是干擾。"}, {"src": "11101-25", "f": 2, "s": "111-1", "tag": "人員訓練", "q": "證券商之在職人員應每幾年參加在職訓練？", "o": ["1 年", "2 年", "3 年", "4 年"], "a": 2, "fl": "在職訓練 ➔ 每 3 年一次。", "th": "證券商業務人員要定期進修。", "tr": "職前訓練是到職後半年內。"}, {"src": "11001-12", "f": 2, "s": "110-2", "tag": "業務人員", "q": "證券商業務人員辦理下列何種事項之人員，不得辦理登記範圍以外之業務或由其他業務人員兼辦？", "o": ["辦理結算交割人員", 4-2", "tag": "外國衍生品", "q": "對證券商從事有關外國衍生性金融商品交易規範，下列敘述何者正確？", "o": ["得擇定任何外國金融機構辦理", "結匯事宜應向銀行局申報", "應向中央銀行許可或指定之國內外金融機構辦理交易", "應向投審會申報交易月報表"], "a": 2, "fl": "證券商做外國衍生品 ➔ 向央行許可或指定的金融機構辦理。", "th": "涉及外匯，要透過央行許可的機構。", "tr": "不能任意選擇外國金融機構。"}, {"src": "11402-44", "lv": "a", "f": 1, "s": "114-2", "tag": "線上開戶", "q": "證券商為客戶線上開戶，其作業除應確定其身分為本人及留存相關證明文件外，應先經下列何方式確認身分？", "o": ["經線上傳送可同時辨識國民身分證及臉部之照片，並輔以證券商交割專戶客戶分戶帳指定出金帳戶", "經由行動身分識別(Mobile ID)方式確認", "經由金融行動身分識別標準化機制(金融 Fast-ID)確認", "選項(A)(B)(C)任一皆可"], "a": 3, "fl": "線上開戶確認身分 ➔ 雙證件照＋指定帳戶、Mobile ID、Fast-ID 任一即可。", "th": "三種方式都被認可。", "tr": "全選。"}, {"src": "11401-19", "lv": "a", "f": 1, "s": "114-1", "tag": "營業保證金", "q": "綜合證券商之最低應向金融監督管理委員會所指定之銀行提存營業保證金為新臺幣（沒有分支機構）？", "o": ["三千萬元", "五千萬元", "八千萬元", "一億元"], "a": 3, "fl": "綜合證券商營業保證金 ➔ 1 億元。", "th": "承銷 4,000 萬＋自營 1,000 萬＋經紀 5,000 萬＝1 億。", "tr": "資本額是 10 億，保證金是 1 億。"}, {"src": "11401-9", "lv": "a", "f": 1, "s": "114-1", "tag": "集中保管", "q": "集中保管之有價證券不包括下列何者？", "o": ["上市之可轉換公司債", "證券商營業處所買賣（櫃檯買賣）之債券", "上市之受益憑證", "短期票券"], "a": 3, "fl": "集中保管不包括 ➔ 短期票券。", "th": "短期票券由票券集保系統處理，不是證券集保。", "tr": "可轉債、櫃買債券、受益憑證都能集保。"}];
const LAW6=[{"src": "11001-29", "f": 3, "s": "114-2", "tag": "洽商銷售", "q": "採洽商銷售之承銷案件，除經主管機關核准者外，普通公司債案件每一認購人認購數量不得超過該次承銷總數之百分之幾？", "o": ["10%", "20%", "30%", "50%"], "a": 3, "fl": "洽商銷售：普通公司債每人 ➔ 不超過 50%。", "th": "公司債的投資人多為法人，額度可以放寬。", "tr": "權證、ETN、附認股權公司債是 10%。"}, {"src": "11402-46", "f": 3, "s": "114-2", "tag": "洽商銷售", "q": "採洽商銷售承銷之認購(售)權證、指數投資證券、附認股權公司債案件，每一認購人認購數量不得超過該次承銷總數之：", "o": ["5%", "10%", "20%", "30%"], "a": 1, "fl": "洽商銷售：權證、ETN、附認股權公司債 ➔ 每人不超過 10%。", "th": "有股權或槓桿性質的商品要分散給較多人。", "tr": "普通公司債是 50%。"}, {"src": "11303-43", "f": 3, "s": "113-3", "tag": "上市條件", "q": "一般公開發行公司初次申請股票上市條件，公司「獲利能力」標準之一為稅前淨利占年度決算之財務報告所列示股本比率，最近二個會計年度均需達多少者，始合乎獲利能力標準？", "o": ["3%以上", "5%以上", "6%以上", "10%以上"], "a": 2, "fl": "上市獲利能力 ➔ 稅前淨利占股本最近二年均 6% 以上（或其他組合）。", "th": "上市要有一定獲利能力。", "tr": "上櫃是 4%，別混。"}, {"src": "11203-40", "f": 3, "s": "112-3", "tag": "承銷方式", "q": "依據證券交易法規定，證券承銷方式不包含下列哪一種型態？", "o": ["全額包銷", "代銷", "居間銷售", "餘額包銷"], "a": 2, "fl": "證交法承銷方式 ➔ 包銷（全額、餘額）和代銷；沒有「居間銷售」。", "th": "包銷是承銷商自己吃下，代銷是賣不完退回。", "tr": "居間是仲介概念，不在證交法裡。"}, {"src": "11502-31", "f": 2, "s": "115-2", "tag": "過額配售", "q": "股票初次上市(櫃)之承銷案件，發行公司採行過額配售辦理承銷作業者，主辦承銷商應於該案件掛牌之日起幾個交易日內，執行穩定價格之機制？", "o": ["三日", "五日", "七日", "十日"], "a": 1, "fl": "過額配售穩定價格 ➔ 掛牌日起 5 個交易日內。", "th": "新股剛上市容易大跌，承銷商用超額配售的股票護盤。", "tr": "3 日、10 日是干擾。"}, {"src": "11502-40", "f": 2, "s": "115-2", "tag": "不宜上市", "q": "申請股票上市之發行公司雖符合上市審查準則之上市條件，但有以下何種情況，經證交所認為不宜上市，得不同意其股票上市？", "o": ["有足以影響公司財務業務正常營運之重大勞資糾紛或污染環境情事，但已經改善", "有重大非常規交易，但已經改善", "申請公司或其現任董事、總經理或實質負責人於最近十年前有違反誠信原則", "有虛偽不實或違法情事，足以影響其上市後之證券價格，而及於市場秩序或損害公益之虞"], "a": 3, "fl": "不宜上市 ➔ 有虛偽不實或違法情事，影響市場秩序。", "th": "其他選項都寫「已經改善」或「十年前」，不構成理由。", "tr": "看到「已經改善」就刪。"}, {"src": "11502-43", "f": 2, "s": "115-2", "tag": "資訊申報", "q": "依據資訊申報作業辦法，上櫃公司應於每月幾日前申報該公司及其股票未於國內公開發行之子公司從事衍生性商品交易資訊？", "o": ["每月五日", "每月十日", "每月十五日", "每月月底"], "a": 1, "fl": "衍生性商品交易資訊 ➔ 每月 10 日前申報。", "th": "上一個月的資訊在次月 10 日前申報。", "tr": "每月 5 日、15 日是干擾。"}, {"src": "11501-46", "f": 2, "s": "115-1", "tag": "金控子公司", "q": "已於國內上櫃之金融控股公司，其持股逾多少比率之子公司，國內申請股票上櫃前，需先降低持股？", "o": ["25%", "50%", "70%", "90%"], "a": 2, "fl": "上櫃金控子公司申請上櫃 ➔ 持股超過 70% 要先降低。", "th": "確保子公司股權有一定分散。", "tr": "50%、90% 都是干擾。"}, {"src": "11403-47", "f": 2, "s": "114-3", "tag": "興櫃", "q": "以下敘述何者錯誤？", "o": ["只有本國公司可在申請登錄興櫃併送簡易公開發行，外國公司不可以", "本國公司及外國公司均可在申請登錄興櫃併送一般公開發行", "本國已公開發行公司可再申請登錄興櫃", "外國發行人申請登錄興櫃，須已設置獨立董事，且至少一名獨立董事為本國籍"], "a": 0, "fl": "興櫃併送簡易公開發行 ➔ 本國、外國公司都可以。", "th": "A 說外國公司不可以，是錯的。", "tr": "外國發行人登錄興櫃要已設獨董，至少一名本國籍。"}, {"src": "11302-28", "f": 2, "s": "113-2", "tag": "創新板", "q": "以下哪項「非」創新板公司上市後，承銷商持續協助法遵作業之職責範圍？", "o": ["每年實地訪察委任公司重要營業據點或子公司", "協助委任公司在中華民國境內辦理法人說明會", "重大訊息記者會前提供諮詢建議", "協助編製財務預測"], "a": 3, "fl": "創新板承銷商持續協助法遵 ➔ 不含「協助編製財務預測」。", "th": "承銷商協助的是實地訪察、法說會、重訊諮詢。", "tr": "選「非」的那個。"}, {"src": "11203-50", "f": 2, "s": "112-3", "tag": "興櫃", "q": "發行人申請登錄興櫃一般板，應提出股份由其輔導推薦證券商認購，每一輔導推薦證券商各應認購幾萬股以上？", "o": ["2 萬股", "3 萬股", "5 萬股", "10 萬股"], "a": 3, "fl": "登錄興櫃一般板 ➔ 每家推薦證券商認購 10 萬股以上。", "th": "推薦券商要持有股票，才能在興櫃報價。", "tr": "3 萬股、5 萬股都是干擾。"}, {"src": "11102-35", "f": 2, "s": "111-2", "tag": "上櫃審查", "q": "依證券櫃檯買賣中心審查有價證券上櫃作業程序初次申請上櫃案件之審查，於簽訂輔導契約後，未有相當期間進行輔導評估，即送件申請上櫃者，應加強審查：", "o": ["推薦證券商評估報告", "內部控制制度及其聲明書與會計師內部控制制度專案審查報告", "會計師查核報告", "選項(A)(B)(C)皆是"], "a": 3, "fl": "輔導不足即申請上櫃 ➔ 加強審查推薦券商報告、內控、會計師報告。", "th": "沒有充分輔導，三種報告都要更仔細看。", "tr": "全選。"}, {"src": "11102-50", "f": 2, "s": "111-2", "tag": "子公司持股", "q": "上櫃公司幾年內降低重要子公司之持股比例累積達多少比例以上，應事先委請獨立專家出具意見書？", "o": ["3 年累積 5%以上", "3 年累積 10%以上", "5 年累積 10%以上", "5 年累積 20%以上"], "a": 1, "fl": "降低重要子公司持股 ➔ 3 年累積 10% 以上要找獨立專家意見。", "th": "避免掏空子公司價值，要有專家把關。", "tr": "5 年、20% 是干擾。"}, {"src": "11101-42", "f": 2, "s": "111-1", "tag": "上市程序", "q": "某初次申請上市公司，於證交所函知同意上市後，擬辦理公開承銷，惟遭股市大跌之影響，擬申請延後上市買賣，如何辦理？", "o": ["有正當理由，但僅有一個月緩衝期", "有正當理由，得延長至承銷商規劃上市買賣之日期", "不得延長", "有正當理由，得延長三個月，延長以一次為限"], "a": 3, "fl": "同意上市後申請延後掛牌 ➔ 正當理由可延 3 個月，以 1 次為限。", "th": "市場不好可以晚一點上市，但只能延一次。", "tr": "不是一個月，也不是無限期。"}, {"src": "11003-36", "f": 2, "s": "110-3", "tag": "配售方式", "q": "引進詢價圈購及競價拍賣之配售方式，其功能為何？甲.提高法人參與初級市場比重；乙.發揮承銷商配售功能；丙.使資金募集更具效益", "o": ["僅甲、乙", "僅乙、丙", "僅甲、丙", "甲、乙、丙皆是"], "a": 3, "fl": "詢價圈購、競價拍賣 ➔ 提高法人比重、發揮承銷商配售、募資更有效益，全對。", "th": "引進這兩種方式是為了讓價格更合理、資金募得更有效率。", "tr": "全選。"}, {"src": "11003-39", "f": 2, "s": "110-3", "tag": "上櫃審查", "q": "股票初次申請上櫃案件，於收文次週起多久之內櫃買中心原則上將提報上櫃審議委員會審議之？", "o": ["兩週內", "四週內", "六週內", "八週內"], "a": 2, "fl": "初次申請上櫃 ➔ 收文次週起 6 週內提報審議。", "th": "櫃買中心審查作業有固定時程。", "tr": "兩週、八週是干擾。"}, {"src": "11502-23", "lv": "a", "f": 1, "s": "115-2", "tag": "上市條件", "q": "創業投資公司申請上市實收資本額門檻為何？", "o": ["達新臺幣十億元以上且募集發行普通股股數達七千股以上", "達新臺幣十五億元以上且募集發行普通股股數達七千五百萬股以上", "達新臺幣二十億元以上且募集發行普通股股數達七千五百萬股以上", "達新臺幣二十五億元以上且募集發行普通股股數達七千五百萬股以上"], "a": 1, "fl": "創投公司上市 ➔ 實收資本額 15 億、7,500 萬股以上。", "th": "創投公司資本門檻較高。", "tr": "10 億、20 億是干擾。"}, {"src": "11502-46", "lv": "a", "f": 1, "s": "115-2", "tag": "上櫃", "q": "下列何者申請其股票為櫃檯買賣，需取得金管會同意函？", "o": ["保險業", "物流業", "電子業", "上市轉上櫃之證券業"], "a": 0, "fl": "申請上櫃需金管會同意函 ➔ 保險業（金融業）。", "th": "特許行業要目的事業主管機關同意。", "tr": "一般產業不用。"}, {"src": "11502-42", "lv": "a", "f": 1, "s": "115-2", "tag": "外國企業", "q": "外國發行人申請普通股股票第一上櫃者，關於最近期經會計師查核簽證或核閱之淨值須達多少？", "o": ["新臺幣一億元以上", "新臺幣三億元以上", "新臺幣五億元以上", "新臺幣十億元以上"], "a": 0, "fl": "外國發行人第一上櫃 ➔ 淨值 1 億元以上。", "th": "第一上櫃的淨值門檻。", "tr": "3 億、5 億是干擾。"}, {"src": "11501-33", "lv": "a", "f": 1, "s": "115-1", "tag": "競價拍賣", "q": "下列何者不得參與競價拍賣之投標？", "o": ["成年之中華民國國民", "發行公司直屬總經理之部門主管", "本國法人募集之證券投資信託基金", "外國專業投資機構"], "a": 1, "fl": "不得參與競價拍賣 ➔ 發行公司內部人（例如總經理直屬部門主管）。", "th": "內部人知道公司資訊，不能參與。", "tr": "一般成年國民、投信基金、外國機構都可以。"}, {"src": "11501-43", "lv": "a", "f": 1, "s": "115-1", "tag": "推薦證券商", "q": "公開發行公司與推薦證券商若有下列何種情事，證券櫃檯買賣中心可拒絕接受該推薦證券商所出具之評估報告，且不同意其有價證券上櫃？", "o": ["雙方互為有價證券初次上櫃或上市評估報告之評估", "有證券商管理規則不得為主辦承銷商之情事", "屬同一集團企業", "選項(A)(B)(C)皆是"], "a": 3, "fl": "可拒絕推薦券商評估報告 ➔ 互為評估、不得為主辦承銷商、同一集團。", "th": "推薦券商要有獨立性。", "tr": "全選。"}, {"src": "11403-26", "lv": "a", "f": 1, "s": "114-3", "tag": "詢價圈購", "q": "證券商辦理初次上市、上櫃承銷案件，受理詢價圈購之對象，如有下列何者參與詢價圈購，應拒絕之？", "o": ["發行公司之員工", "承銷商本身之董事、監察人", "發行公司之董事長或總經理", "選項(A)(B)(C)皆應拒絕"], "a": 3, "fl": "詢價圈購應拒絕 ➔ 發行公司員工、承銷商董監、發行公司董事長或總經理。", "th": "內部人不能參與，避免利益衝突。", "tr": "全選。"}, {"src": "11403-46", "lv": "a", "f": 1, "s": "114-3", "tag": "集保", "q": "屬科技事業之發行公司，申請股票上櫃時，其持有已發行股份總數下列何項之比例者，應按規定辦理集中保管及屆期領回？", "o": ["1%以上之股東", "3%以上之股東", "5%以上之股東", "10%以上之股東"], "a": 2, "fl": "科技事業申請上櫃 ➔ 持股 5% 以上股東要集保。", "th": "科技事業風險高，大股東股票要先鎖住。", "tr": "1%、10% 是干擾。"}, {"src": "11402-34", "lv": "a", "f": 1, "s": "114-2", "tag": "上櫃審查", "q": "初次申請股票上櫃案除經審議委員會作成退件決議之情事外，應有出席審議委員多少以上表決同意行之？", "o": ["1/4 以上", "1/3 以上", "2/3 以上", "3/4 以上"], "a": 2, "fl": "上櫃審議委員會通過 ➔ 出席委員 2/3 以上同意。", "th": "重大審查要高門檻。", "tr": "不是 1/2 或 3/4。"}];
const LAW7=[{"src": "11402-31", "f": 5, "s": "114-2", "tag": "零股交易", "q": "上市有價證券零股交易盤後買賣之申報時間為何？", "o": ["13:40~14:30", "13:00~14:00", "14:30~15:00", "9:00~13:00"], "a": 0, "fl": "盤後零股申報時間 ➔ 13:40～14:30。", "th": "收盤後再開一段時間給零股申報，14:30 一次撮合。", "tr": "盤中零股從 9:00 開始，9:10 第一次撮合。"}, {"src": "11401-36", "f": 4, "s": "114-1", "tag": "集合競價", "q": "我國股市「開盤價」以何種方式決定及開盤時在同價位情況下，成交優先順序如何決定？", "o": ["採集合競價，同價位以時間決定", "採集合競價，同價位以電腦隨機排序決定", "採逐筆交易，同價位以時間決定", "採逐筆交易，同價位以電腦隨機排序決定"], "a": 1, "fl": "開盤價 ➔ 集合競價；同價位 ➔ 電腦隨機排序。", "th": "開盤和收盤都用集合競價，同價位用隨機排序決定先後。", "tr": "盤中逐筆交易才是價格優先、時間優先。"}, {"src": "11203-46", "f": 4, "s": "112-3", "tag": "零股交易", "q": "下列有關證券零股交易買賣之敘述何者錯誤？", "o": ["委託人需開立集保帳戶始得買賣", "申報時間僅可於 13:40~14:30", "以集合競價撮合成交", "申報截止前會揭示未成交最高買進及最低賣出之價格"], "a": 1, "fl": "盤後零股 13:40～14:30；盤中零股 9:00～13:30 ➔ 不是「只能」13:40～14:30。", "th": "現在有盤中零股，所以「僅可」這個說法錯了。", "tr": "選錯誤的；舊題寫「僅可為」，新題寫「僅可於」，答案相同。"}, {"src": "11501-38", "f": 3, "s": "115-1", "tag": "零股交易", "q": "盤中零股交易第一次撮合時間為？", "o": ["09:00", "09:05", "09:10", "09:30"], "a": 2, "fl": "盤中零股第一次撮合 ➔ 9:10。", "th": "9:00 開始收單，9:10 第一次撮合，之後每分鐘撮合。", "tr": "9:00、9:05 是干擾。"}, {"src": "11501-44", "f": 3, "s": "115-1", "tag": "電話委託", "q": "櫃檯買賣證券經紀商接受客戶以電話委託者，應同步錄音，對無爭議之電話錄音應至少保存多久期限？", "o": ["無限期", "一年", "三年", "五年"], "a": 1, "fl": "櫃買電話委託錄音 ➔ 無爭議保存 1 年。", "th": "跟集中市場一樣。", "tr": "3 年、5 年是干擾。"}, {"src": "11403-35", "f": 3, "s": "114-3", "tag": "交割", "q": "有價證券在證交所市場之買賣，除法令另有規定外，以下列何種交割方式為之？", "o": ["以期貨交割為之", "以違約交割為之", "以現款現貨交割為之", "以欠款欠貨交割為之"], "a": 2, "fl": "證交所市場買賣 ➔ 現款現貨交割。", "th": "跟上一題同一個考點。", "tr": "期貨、欠款欠貨都不行。"}, {"src": "11401-42", "f": 3, "s": "114-1", "tag": "手續費", "q": "有關證券經紀商手續費敘述，以下何者正確？", "o": ["只對賣出收取", "收取上限為 3.0‰", "只對買進收取", "可以有折扣空間"], "a": 3, "fl": "經紀商手續費 ➔ 上限 1.425‰，可以打折。", "th": "買賣各收一次，上限千分之 1.425，券商可以給折扣。", "tr": "B 的 3‰ 是證交稅；舊題答案是「買進與賣出各計算一次」。"}, {"src": "11401-28", "f": 3, "s": "114-1", "tag": "存託憑證", "q": "台灣積體電路公司（台積電）在美國市場上市所發行之存託憑證稱之為何？", "o": ["臺灣存託憑證（TDR）", "美國存託憑證（ADR）", "歐洲存託憑證（EDR）", "全球存託憑證（GDR）"], "a": 1, "fl": "台積電在美國上市 ➔ ADR。", "th": "國內公司到美國掛牌，發的是美國存託憑證。", "tr": "TDR 是外國公司來臺灣。"}, {"src": "11502-22", "f": 2, "s": "115-2", "tag": "鉅額交易", "q": "凡一次買賣同一上市證券數量相當於多少交易單位以上者，為單一證券鉅額買賣？", "o": ["五百", "一千", "五千", "一萬"], "a": 0, "fl": "單一證券鉅額 ➔ 500 個交易單位以上。", "th": "一次買賣 50 萬股以上（或金額 1,500 萬以上）就是鉅額。", "tr": "1,000、5,000 是干擾。"}, {"src": "11502-32", "f": 2, "s": "115-2", "tag": "外國債券", "q": "有關證券商經營特定外國債券業務，以下哪些債券可列入特定外國債券範圍？甲.信用評等一定等級以上之外國中央政府債券乙.信用評等一定等級以上之外國公司債券丙.可轉換公司債丁.不動產抵押貸款債券", "o": ["僅甲", "僅甲、乙", "僅甲、乙、丙", "甲、乙、丙、丁皆可"], "a": 1, "fl": "特定外國債券 ➔ 一定評等以上的外國政府債券、公司債。", "th": "可轉債有股權性質、MBS 結構複雜，不在範圍。", "tr": "只選甲會少一個。"}, {"src": "11302-46", "f": 2, "s": "115-1", "tag": "交易單位", "q": "第一上櫃外國股票之交易單位為：", "o": ["一萬股", "一千股", "二百個交易單位", "一百個交易單位"], "a": 1, "fl": "第一上櫃外國股票 ➔ 1,000 股一個交易單位。", "th": "跟國內股票一樣以 1,000 股為一單位。", "tr": "一萬股是干擾。"}, {"src": "11501-39", "f": 2, "s": "115-1", "tag": "交易單位", "q": "在證券集中交易市場為第一上市之外國股票交易單位為何？", "o": ["一股", "一百股", "一千股", "外國股票原流通市場之交易單位"], "a": 2, "fl": "第一上市外國股票 ➔ 1,000 股。", "th": "第一上市、第一上櫃都是 1,000 股。", "tr": "存託憑證是 1,000 單位。"}, {"src": "11403-29", "f": 2, "s": "114-3", "tag": "外國有價證券", "q": "證券商受託買進外國有價證券，除另有規定者外，一般應如何進行保管？", "o": ["以證券商名義寄託於交易當地保管機構保管", "以複受託金融機構名義寄託於交易當地保管機構保管", "委由臺灣集中保管結算所股份有限公司保管", "選項(A)(B)(C)皆可"], "a": 3, "fl": "受託買進外國證券保管 ➔ 證券商名義、複受託機構名義、集保都可以。", "th": "三種保管方式都合法。", "tr": "全選。"}, {"src": "11403-31", "f": 2, "s": "114-3", "tag": "虛擬資產ETF", "q": "證券商接受委託買賣外國虛擬資產 ETF，應建立適當之虛擬資產 ETF 商品適合度制度，其內容至少應包括：", "o": ["商品屬性評估", "瞭解客戶程序", "客戶屬性評估", "選項(A)(B)(C)皆應包括"], "a": 3, "fl": "虛擬資產 ETF 適合度 ➔ 商品屬性、瞭解客戶、客戶屬性全包含。", "th": "KYC 和 KYP 都要做。", "tr": "全選。"}, {"src": "11403-34", "f": 2, "s": "114-3", "tag": "虛擬資產ETF", "q": "證券商接受委託買賣外國虛擬資產 ETF，投資人以下列何種類型為限？", "o": ["一般自然人", "專業投資人", "機構投資人", "尚未開放買賣外國虛擬資產 ETF"], "a": 1, "fl": "外國虛擬資產 ETF ➔ 限專業投資人。", "th": "風險高，只開放給專業投資人。", "tr": "一般自然人不行。"}, {"src": "11403-42", "f": 2, "s": "114-3", "tag": "瞬間價格穩定", "q": "現行股票集中市場交易制度中實施所謂之「瞬間價格穩定措施」，在下列何者情況不適用？", "o": ["個股收盤前 10 分鐘", "個股開盤參考價低於 1 元者", "初次上市普通股採無升降幅度限制期間", "選項(A)(B)(C)皆是"], "a": 3, "fl": "不適用瞬間價格穩定措施 ➔ 收盤前 10 分鐘、參考價低於 1 元、新上市無漲跌幅期間。", "th": "三種情況都不適用。", "tr": "全選。"}, {"src": "11403-20", "f": 2, "s": "114-3", "tag": "交割", "q": "在證券交易所上市或證券商營業處所買賣之有價證券之給付或交割應以下列何者為之？甲、現貨；乙、現款；丙、帳簿劃撥；丁、支票", "o": ["僅甲、乙", "僅丙、丁", "僅甲、丙", "僅乙、丁"], "a": 0, "fl": "上市櫃交割 ➔ 現款、現貨。", "th": "交割要真錢真貨。", "tr": "帳簿劃撥是交付方式，不是這題的答案；支票不行。"}, {"src": "11402-49", "f": 2, "s": "114-2", "tag": "開戶", "q": "投資人因證券交易違背契約，經證交所或櫃買中心轉知各證券經紀商後未結案且未滿幾年者，證券商應拒絕接受開戶？", "o": ["三年", "五年", "七年", "一年"], "a": 1, "fl": "違約交割未結案未滿 5 年 ➔ 拒絕開戶。", "th": "違約紀錄要過 5 年才能再開戶。", "tr": "3 年是其他消極資格常用數字。"}, {"src": "11102-31", "f": 2, "s": "113-3", "tag": "證交稅", "q": "在櫃檯買賣中心買賣政府債券，其證券交易稅稅率為多少？", "o": ["千分之一點五", "千分之三", "千分之一點四五", "免稅"], "a": 3, "fl": "政府債券 ➔ 免證交稅。", "th": "債券交易稅停徵。", "tr": "千分之 1.5 是當沖。"}, {"src": "11303-31", "f": 2, "s": "113-3", "tag": "證交稅", "q": "買賣公司債及金融債券，其證券交易稅稅率為？", "o": ["免稅", "千分之一", "千分之二", "千分之三"], "a": 0, "fl": "公司債、金融債 ➔ 免稅。", "th": "債券類證交稅停徵。", "tr": "ETF 是千分之 1。"}, {"src": "11303-45", "f": 2, "s": "113-3", "tag": "電話委託", "q": "關於經紀商對於客戶電話委託下單，下述說明何者為是？", "o": ["主管機關依個案處理其是否必須同步錄音", "法令對券商並未規定其必須進行同步錄音", "券商必須進行同步錄音，並至少保存二年", "券商必須進行同步錄音，並至少保存一年"], "a": 3, "fl": "電話委託 ➔ 同步錄音，保存至少 1 年。", "th": "有爭議時才有證據。", "tr": "有爭議的要保存到爭議結束；2 年是干擾。"}, {"src": "11302-50", "f": 2, "s": "113-2", "tag": "外國有價證券", "q": "證券商受託買賣外國有價證券契約，如有下列情事之一者，證券商不得接受其開戶，已開戶者應取消其開戶？", "o": ["受破產之宣告經復權", "法人委託開戶未能提出該法人授權開戶之證明", "曾經違反證券交易法規定，受罰金以上刑之宣告，執行完畢、緩刑期滿或赦免後滿三年", "選項(A)(B)(C)皆是"], "a": 1, "fl": "不得開戶 ➔ 法人未提出授權開戶證明。", "th": "法人要有授權證明才能確認是本人意思。", "tr": "破產已復權、刑期已滿 3 年都可以開戶；舊題選「皆是」是因為選項不同。"}, {"src": "11202-50", "f": 2, "s": "112-2", "tag": "證交稅", "q": "國內現行當日沖銷交易之股票課徵稅率為：", "o": ["千分之一", "千分之一點五", "千分之一點四二五", "千分之三"], "a": 1, "fl": "當沖證交稅 ➔ 千分之 1.5（減半）。", "th": "一般股票證交稅千分之 3，當沖減半為 1.5。", "tr": "1.425 是手續費上限。"}, {"src": "11201-42", "f": 2, "s": "112-1", "tag": "逐筆交易", "q": "逐筆交易制度中，若委託不能全部成交時，則全數取消不予成交，此委託方式為？", "o": ["ROD", "IOC", "FOK", "ICO"], "a": 2, "fl": "不能全部成交就全部取消 ➔ FOK。", "th": "FOK（Fill or Kill）要嘛全成交，要嘛全取消。", "tr": "IOC 可以部分成交，剩下取消。"}, {"src": "11201-20", "f": 2, "s": "112-1", "tag": "開戶", "q": "證券商受託買賣有價證券，對客戶應建立下列何項資料？甲、姓名、住所及通訊處所；乙、資產之狀況；丙、投資經驗；丁、客戶學經歷", "o": ["甲、乙、丙", "甲、乙、丁", "乙、丙、丁", "甲、丙、丁"], "a": 0, "fl": "客戶資料 ➔ 姓名住所、資產狀況、投資經驗；學經歷不用。", "th": "了解客戶是為了評估適合度。", "tr": "丁「學經歷」不是必要項目。"}, {"src": "11102-36", "f": 2, "s": "111-2", "tag": "零股交易", "q": "零股交易盤中申報撮合成交，其買賣成交之順序何者最先成交？", "o": ["一般投資者申報者優先", "證券經紀商申報者優先", "採時間優先原則", "採價格優先原則，同價位者依時間優先原則決定"], "a": 3, "fl": "盤中零股 ➔ 價格優先，同價位時間優先。", "th": "盤中零股也是價格優先原則。", "tr": "不看投資人身分。"}, {"src": "11101-35", "f": 2, "s": "111-1", "tag": "存託憑證", "q": "在美國紐約證券交易所上市交易之存託憑證為：", "o": ["全球存託憑證", "臺灣存託憑證", "新加坡存託憑證", "美國存託憑證"], "a": 3, "fl": "在美國上市的存託憑證 ➔ ADR。", "th": "在哪裡上市就叫什麼：美國 ADR、臺灣 TDR、全球 GDR。", "tr": "GDR 在歐洲等多個市場。"}, {"src": "11003-33", "f": 2, "s": "110-3", "tag": "逐筆交易", "q": "逐筆交易制度中，何種委託方式為委託單在當日沒有成交或投資人自行撤銷之前，委託單會留存在委託簿中，直至當日收盤仍未成交，該筆委託單則視為無效單？", "o": ["ROD", "IOC", "FOK", "ICO"], "a": 0, "fl": "當日有效、收盤沒成交就作廢 ➔ ROD。", "th": "ROD（Rest of Day）掛一整天。", "tr": "IOC 是立即成交否則取消（可部分成交）；FOK 是全部成交否則取消。"}, {"src": "11002-24", "f": 2, "s": "110-2", "tag": "受託契約", "q": "證券商受託契約經解除或終止後，至少需保存多久？", "o": ["3 年", "5 年", "10 年", "永久保存"], "a": 1, "fl": "受託契約解除或終止後 ➔ 至少保存 5 年。", "th": "留存資料供日後查核。", "tr": "電話錄音是 1 年。"}, {"src": "11002-18", "f": 2, "s": "110-2", "tag": "高資產客戶", "q": "證券商受託買賣外國有價證券管理規則所稱之高資產客戶，下列何者非為須符合的條件？", "o": ["提供可投資資產淨值及保險商品價值達等值新臺幣一億元以上之財力證明，並提供持有等值新臺幣一億元以上可投資資產淨值及保險商品價值之財力聲明書", "經證券商確認該自然人具備充分之金融商品專業知識、交易經驗，並確認該自然人具備充分之風險承擔能力", "客戶充分了解證券商提供金融商品或服務予高資產客戶與相關法令有關專業投資人之自然人或法人或專業客戶之自然人或法人得免除之責任後，同意簽署為高資產客戶", "未經法人授權辦理交易之人具備充分之金融商品專業知識、交易經驗，惟確認其具備充分之風險承擔能力"], "a": 3, "fl": "高資產客戶 ➔ 財力 1 億元以上＋專業知識＋簽署同意。", "th": "法人要由授權辦理交易的人具備專業知識。", "tr": "D 寫「未經法人授權」是錯的。"}, {"src": "11501-7", "lv": "a", "f": 1, "s": "115-1", "tag": "外國債券", "q": "證券商得為自行買賣特定外國債券之買賣斷交易，以下敘述何者錯誤？", "o": ["以外幣計價之外國政府相關債券、金融債券及公司債為限", "得為附條件交易", "應以固定利率或正浮動利率方式計息", "不得包括具股權性質之債券"], "a": 1, "fl": "特定外國債券買賣斷 ➔ 不得做  "甲公司之股票雖在證券櫃檯買賣中心掛牌，但是嗣後經營發生困難，並經法院裁定宣告破產確定，證券櫃檯買賣中心應如何處理？", "o": ["通知甲公司停止該公司有價證券之櫃檯買賣交易", "報請主管機關撤銷甲公司之有價證券櫃檯買賣契約", "逕行終止甲公司有價證券櫃檯買賣", "得終止甲公司有價證券櫃檯買賣，並報請主管機關備查"], "a": 3, "fl": "上櫃公司破產確定 ➔ 櫃買中心「得」終止，並報主管機關備查。", "th": "櫃買中心先處理，再報主管機關備查。", "tr": "不是「逕行終止」，也不是報請撤銷。"}, {"src": "11301-46", "f": 2, "s": "114-1", "tag": "附條件交易", "q": "證券自營商為債券附條件買賣時，其交易餘額不得超過之淨值倍數及約定期限最長者為：", "o": ["二倍及三個月", "二倍及六個月", "四倍及一年", "六倍及一年"], "a": 3, "fl": "自營商債券附條件交易 ➔ 餘額不超過淨值 6 倍，期限最長 1 年。", "th": "附條件交易有槓桿，所以限制倍數和期限。", "tr": "兩倍、四倍是干擾。"}, {"src": "11401-27", "f": 2, "s": "114-1", "tag": "附條件交易", "q": "證券自營商為債券附條件買賣時，其交易餘額不得超過該證券商之淨值幾倍？", "o": ["一倍", "二倍", "三倍", "六倍"], "a": 3, "fl": "債券附條件交易餘額 ➔ 淨值 6 倍。", "th": "同上題，只問倍數。", "tr": "期限是 1 年。"}, {"src": "11303-38", "f": 2, "s": "113-3", "tag": "終止櫃買", "q": "以下何者為「櫃買中心證券商營業處所買賣有價證券業務規則」所規定證券櫃檯買賣中心得終止櫃檯買賣之情事？", "o": ["已在臺灣證券交易所上市", "金融機構經目的事業主管機關依法指派接管", "公司營運全面停頓逾六個月", "選項(A)(B)(C)皆是"], "a": 3, "fl": "櫃買中心得終止 ➔ 已上市、被接管、營運停頓 6 個月都會。", "th": "三種情形都可以終止櫃檯買賣。", "tr": "全選。"}, {"src": "11302-9", "f": 2, "s": "113-2", "tag": "交割結算基金", "q": "因有價證券集中交易市場買賣所生之債權，甲、證券交易所；乙、證券經紀商、證券自營商；丙、委託人，三者對交割結算基金有優先受償之權，其優先順序如何？", "o": ["甲、乙、丙", "甲、丙、乙", "丙、甲、乙", "丙、乙、甲"], "a": 1, "fl": "優先受償順序 ➔ 證交所 → 委託人 → 證券商。", "th": "先保障交易所，其次保護投資人，最後才是券商。", "tr": "委託人排在證券商前面。"}, {"src": "11103-8", "f": 2, "s": "111-3", "tag": "交割結算基金", "q": "我國現行交割結算基金係採何種制度？", "o": ["個別責任制", "共同責任制", "折衷制", "兼採個別責任與共同責任制"], "a": 1, "fl": "交割結算基金 ➔ 共同責任制。", "th": "所有證券商一起分擔違約風險。", "tr": "櫃買的給付結算基金也是共同責任制。"}, {"src": "11502-37", "lv": "a", "f": 1, "s": "115-2", "tag": "申報單位", "q": "在證券交易集中市場對申報買賣之價格單位，係以：", "o": ["股票以一股為準", "公債及公司債以面額百元為準", "受益憑證以每受益權單位為準", "選項(A)(B)(C)皆正確"], "a": 3, "fl": "價格單位 ➔ 股票每股、債券面額百元、受益憑證每單位。", "th": "三個都對。", "tr": "全選。"}, {"src": "11502-45", "lv": "a", "f": 1, "s": "115-2", "tag": "黃金現貨", "q": "櫃買中心黃金現貨交易平台，造市商每營業日交易時間內，須就其造市之黃金現貨為買進及賣出之報價，買進與賣出報價間之差距不得逾賣出報價之___。", "o": ["1%", "3%", "5%", "無限制"], "a": 2, "fl": "黃金造市商買賣報價差 ➔ 不超過賣出報價 5%。", "th": "確保造市報價合理。", "tr": "1%、3% const LAW9=[{"src": "11403-15", "f": 4, "s": "115-2", "tag": "轉投資", "q": "證券商轉投資總金額不得超過其淨值百分之多少？", "o": ["百分之二十", "百分之四十", "百分之五十", "百分之百"], "a": 1, "fl": "證券商轉投資總額 ➔ 不超過淨值 40%。", "th": "控制證券商把資金拿去投資其他事業的比例。", "tr": "單一股票融資 10%、單一股票融券加出借 5%。"}, {"src": "11303-20", "f": 3, "s": "115-2", "tag": "融資融券限額", "q": "證券商辦理有價證券買賣融資融券，對每種證券之融資總金額，不得超過其淨值百分之多少？", "o": ["百分之三", "百分之十", "百分之四十", "無限制"], "a": 1, "fl": "每種證券融資總額 ➔ 不超過證券商淨值 10%。", "th": "避免券商把融資集中在單一股票。", "tr": "融券加出借是 5%；轉投資是 40%。"}, {"src": "11502-17", "f": 3, "s": "115-2", "tag": "融資融券限額", "q": "對單一股票的融券與出借之總金額，不得超過證券商淨值的多少？", "o": ["百分之三", "百分之五", "百分之七", "百分之十"], "a": 1, "fl": "單一股票融券＋出借總額 ➔ 不超過淨值 5%。", "th": "融券風險比融資高，限額比較低。", "tr": "融資是 10%。"}, {"src": "11501-50", "f": 3, "s": "115-1", "tag": "強制回補", "q": "融券人遇標的證券公司有下列哪種情況不用強制回補？", "o": ["臨時股東會", "除權", "股東常會", "減資"], "a": 0, "fl": "不用強制回補 ➔ 臨時股東會（不涉及停止過戶分配權益時）。", "th": "股東常會、除權、減資都要強制回補，因為要確認股東身分或權益變動。", "tr": "臨時會一般不用回補。"}, {"src": "11502-18", "f": 2, "s": "115-2", "tag": "融資融券標的", "q": "下列何者非為上櫃公司普通股得為融資融券交易標的之要件？", "o": ["普通股上櫃滿 6 個月", "每股淨值高於票面(面額為新臺幣十元)", "公司設立登記屆滿 3 年以上", "無面額或面額非屬新臺幣十元者，最近一會計年度決算無累積虧損"], "a": 2, "fl": "上櫃股票得融資融券 ➔ 上櫃滿 6 個月、每股淨值高於面額；「設立滿 3 年」不是要件。", "th": "信用交易看的是上櫃時間和財務體質。", "tr": "選「非」要件的那個。"}, {"src": "11402-39", "f": 2, "s": "114-2", "tag": "融資融券標的", "q": "證券商辦理有價證券買賣融資融券，以下列何項為限？", "o": ["經證交所或櫃買中心公告得為融資融券之有價證券所為之普通交割買賣", "零股交易", "鉅額交易", "全額交割股票"], "a": 0, "fl": "融資融券 ➔ 限公告得信用交易之有價證券的普通交割買賣。", "th": "零股、鉅額、全額交割股都不能融資融券。", "tr": "一定要「普通交割」。"}, {"src": "11303-44", "f": 2, "s": "113-3", "tag": "期信ETF", "q": "因累積跌幅達一定比例被暫停融資融券交易、停止有價證券借貸及當日沖銷交易之期信 ETF，當連續__ 營業日之基金每日單位淨資產價值較其最初單位淨資產價值累積跌幅均未達___，可於公告後次一營業日起恢復融資融券交易、停止有價證券借貸及當日沖銷交易？", "o": ["10 個、50%", "10 個、65%", "30 個、50%", "30 個、65%"], "a": 3, "fl": "期信 ETF 恢復信用交易 ➔ 連續 30 個營業日跌幅均未達 65%。", "th": "跌幅過大的 ETF 要等淨值穩定一段時間才能恢復。", "tr": "10 個營業日、50% 是干擾。"}, {"src": "11201-44", "f": 2, "s": "112-1", "tag": "信用帳戶", "q": "開立信用帳戶之委託人，連續多久無融資融券交易紀錄者，證券商即註銷其信用帳戶？", "o": ["五年", "一年", "二年", "三年"], "a": 3, "fl": "信用帳戶連續 3 年沒有融資融券 ➔ 註銷。", "th": "太久沒用就註銷，避免帳戶閒置。", "tr": "1 年、5 年是干擾。"}, {"src": "11502-38", "lv": "a", "f": 1, "s": "115-2", "tag": "借券", "q": "有價證券借貸規定，出借費率以不超過該種有價證券收盤價格多少為限？", "o": ["10%", "7%", "5%", "2%"], "a": 1, "fl": "有價證券借貸出借費率 ➔ 不超過收盤價 7%。", "th": "限制出借成本。", "tr": "5%、10% 是干擾。"}, {"src": "11502-47", "lv": "a", "f": 1, "s": "115-2", "tag": "ETF信用交易", "q": "指數股票型證券投資信託基金(ETF)受益憑證通常須上市滿多久，才能進行融資融券交易？", "o": ["3 個月", "6 個月", "12 個月", "無限制"], "a": 3, "fl": "ETF 上市 ➔ 次日起就能融資融券（無期間限制）。", "th": "ETF 分散風險，不需要等待期間。", "tr": "一般股票上市要滿 6 個月。"}, {"src": "11501-48", "lv": "a", "f": 1, "s": "115-1", "tag": "私募基金", "q": "證券投資信託事業所經理之私募證券投資信託基金，基金保管機構得申請開立信用帳戶，其融資融券額度不得超過基金規模多少比例？", "o": ["25%", "50%", "75%", "100%"], "a": 1, "fl": "私募投信基金信用帳戶 ➔ 融資融券額度不超過基金規模 50%。", "th": "私募基金可以用信用交易，但有上限。", "tr": "25%、100% 是干擾。"}, {"src": "11501-8", "lv": "a", "f": 1, "s": "115-1", "tag": "證券金融", "q": "證券金融事業必須以股份有限公司之組織方式成立，其實收資本額最低應達下列何項標準？", "o": ["新臺幣 10 億元", "新臺幣 20 億元", "新臺幣 30 億元", "新臺幣 40 億元"], "a": 3, "fl": "證券金融事業最低資本額 ➔ 40 億元。", "th": "證金公司要提供大量融資，資本門檻最高。", "tr": "綜合證券商是 10 億。"}, {"src": "11403-44", "lv": "a", "f": 1, "s": "114-3", "tag": "當日沖銷", "q": "投資人進行當日沖銷時，相抵部分：", "o": ["須付融資利息", "不必付融券手續費", "須付融券利息", "不必付融資利息"], "a": 3, "fl": "當沖相抵部分 ➔ 不必付融資利息。", "th": "當天買賣相抵，沒有真正借錢過夜。", "tr": "融券手續費還是要付。"}, {"src": "11402-21", "lv": "a", "f": 1, "s": "114-2", "tag": "融資融券資格", "q": "證券商辦理融資融券，其淨值應達新臺幣多少元？", "o": ["2 億", "3 億", "5 億", "10 億"], "a": 0, "fl": "證券商辦理融資融券 ➔ 淨值 2 億元以上。", "th": "證券商要有一定淨值才能辦信用交易。", "tr": "3 億、5 億是干擾。"}, {"src": "11402-40", "lv": "a", "f": 1, "s": "114-2", "tag": "信用交易架構", "q": "臺灣信用交易的業務屬於下列何種架構？", "o": ["一段式（由券商直接融通）", "兩段式（僅由券商代理證金公司融通）", "獨占式（僅由證金公司承做）", "雙軌式（由證金公司及券商兩者併行融通）"], "a": 3, "fl": "臺灣信用交易 ➔ 雙軌制（證金公司和證券商並行）。", "th": "可以找證金公司，也可以找有自辦的券商。", "tr": "不是一段式或獨占式。"}, {"src": "11402-43", "lv": "a", "f": 1, "s": "114-2", "tag": "借券", "q": "下列何者不得為證券商辦理有價證券出借業務之借券之費率(年利率)？", "o": ["3.5%", "5%", "18%", "選項(A)(B)(C)皆可以"], "a": 2, "fl": "借券費率 ➔ 18% 超過上限，不得使用。", "th": "借券費率有上限，3.5%、5% 都在範圍內，18% 太高。", "tr": "3.5%、5% 都可以。"}, {"src": "11401-48", "lv": "a", "f": 1, "s": "114-1", "tag": "信用額度", "q": "證券商對客戶融資買進或融券賣出成交者，應每日核算客戶信用帳戶融資融券餘額，超過額度部分，應如何處理？", "o": ["申報客戶違約", "申報錯帳", "通知客戶以現款現券交割", "代墊款券"], "a": 2, "fl": "融資融券超過額度 ➔ 通知客戶以現款現券交割。", "th": "超過額度的部分不能再用信用交易，要改用現金或現股交割。", "tr": "不是直接申報違約。"}, {"src": "11401-50", "lv": "a", "f": 1, "s": "114-1", "tag": "融資利息", "q": "證券金融公司應向委託人收取融資利息，依下列哪一種方式計收？", "o": ["融資成交日後第一營業日迄清償日之日數計算", "融資成交日後第二營業日迄清償日之日數計算", "融資成交日後第一營業日迄清償日前一日之日數計算", "融資成交日後第二營業日迄清償日前一日之日數計算"], "a": 3, "fl": "融資利息 ➔ 成交日後第 2 營業日起算，到清償日前一日止。", "th": "T+2 交割當天券商才真正出錢，所以從那天開始算。", "tr": "四個選項只差起訖日。"}];
const LAW10=[{"src": "11203-43", "f": 5, "s": "112-3", "tag": "信託契約", "q": "下列何者不是金管會訂定證券投資信託契約記載之各項費用及所受報酬計算上限之項目？", "o": ["購買受益憑證之費用", "受益人請求買回受益憑證之費用", "基金保管機構收取保管費之上限", "證券投資信託收益分配"], "a": 3, "fl": "金管會訂費用上限 ➔ 申購費、買回費、保管費；收益分配不在內。", "th": "收益分配不是費用。", "tr": "選「不是」的。"}, {"src": "11502-20", "f": 4, "s": "115-2", "tag": "境外基金", "q": "下列何者得擔任境外基金之總代理人？甲、證券投資信託事業；乙、證券投資顧問事業；丙、證券經紀商；丁、信託業", "o": ["僅乙、丙", "僅甲、乙、丙", "僅甲、乙", "甲、乙、丙、丁皆可"], "a": 1, "fl": "境外基金總代理人 ➔ 僅投信、投顧、證券經紀商（信託業不行）。", "th": "總代理人負責在國內代理境外基金的募集銷售，限三種業者。", "tr": "修法題：舊題（112 年問銷售機構）答案是「甲、乙、丙、丁皆可」，含信託業；現在總代理人只有甲、乙、丙。"}, {"src": "11402-22", "f": 4, "s": "114-2", "tag": "基金淨值", "q": "證券投資信託事業應於何時公告基金每受益權單位之淨資產價值？", "o": ["依證券投資信託事業與投資人雙方契約約定", "每一營業日公告前一營業日", "每一周公告前一周", "每一月公告前一月"], "a": 1, "fl": "基金淨值公告 ➔ 每營業日公告前一營業日淨值。", "th": "每天都要讓投資人知道基金值多少。", "tr": "不是每週或每月。"}, {"src": "11402-10", "f": 4, "s": "114-2", "tag": "信託契約", "q": "下列何者非為證券投資信託契約應記載事項？", "o": ["證券投資信託基金之名稱及其存續期間", "基金及受益權單位淨資產價值之計算", "基金保管機構之義務與責任", "基金投資組合之未來展望"], "a": 3, "fl": "信託契約不必記載 ➔ 未來展望、成立以來報酬率（行銷內容）。", "th": "契約記載權利義務：名稱、存續期間、淨值計算、保管機構責任。", "tr": "舊題答案是「基金成立以來報酬率」，新題是「投資組合之未來展望」，都是行銷性質。"}, {"src": "11202-45", "f": 4, "s": "112-2", "tag": "基金存續", "q": "一般而言，投資信託基金之存續期間為何？", "o": ["由受益人會議決定", "依證券投資信託契約約定", "由投信投顧公會擬訂", "由主管機關指定"], "a": 1, "fl": "基金存續期間 ➔ 依證券投資信託契約約定。", "th": "契約自己約定，不是主管機關或公會決定。", "tr": "受益人會議是處理重大變更。"}, {"src": "11501-10", "f": 3, "s": "115-1", "tag": "處分", "q": "證券投資信託事業違反「證券投資信託及顧問法」或依該法所發布之命令者，除依證券投資信託及顧問法處罰外，金融監督管理委員會並得視情節輕重，為何處分？", "o": ["警告", "命令該證券投資信託事業解除其董、監或經理人職務", "六個月以下停業", "選項(A)(B)(C)皆是"], "a": 3, "fl": "投信違法 ➔ 警告、解除董監經理人職務、6 個月以下停業都可以。", "th": "主管機關可以視情節輕重選擇處分。", "tr": "全選。"}, {"src": "11403-21", "f": 3, "s": "114-3", "tag": "基金買回", "q": "受益憑證之買回價格，以請求買回書面到達證券投資信託事業或其代理機構之何時之基金淨資產核算？", "o": ["到達前 1 營業日", "到達當日或次 1 營業日", "到達次 2 營業日", "到達日起計算之第 3 日"], "a": 1, "fl": "買回價格 ➔ 書面到達當日或次 1 營業日淨值。", "th": "跟上一題同一考點。", "tr": "前 1 營業日、次 2 營業日都是干擾。"}, {"src": "11202-37", "f": 3, "s": "114-2", "tag": "基金分類", "q": "基金依其法律關係之不同可區分為哪兩種？", "o": ["外資型及法人型", "成長型及穩定型", "公司型及契約型", "股票型及債券型"], "a": 2, "fl": "依「法律關係」分 ➔ 公司型、契約型。", "th": "看基金是用公司形式還是信託契約成立。", "tr": "依「流通交易方式」才是開放式、封閉式。"}, {"src": "11402-33", "f": 3, "s": "114-2", "tag": "基金分類", "q": "基金依其流通交易方式可區分為哪兩種？", "o": ["委託型及受益型", "開放式及封閉式", "公司型及契約型", "公開型及隱含型"], "a": 1, "fl": "依「流通交易方式」分 ➔ 開放式、封閉式。", "th": "能不能隨時申購贖回，決定開放或封閉。", "tr": "法律關係分類是公司型、契約型。"}, {"src": "11502-49", "f": 2, "s": "115-2", "tag": "開放式基金", "q": "下列何種有價證券並不在證券集中市場或證券商營業處所買賣流通交易？", "o": ["封閉式基金之受益憑證", "開放式基金", "認購權證", "轉換公司債"], "a": 1, "fl": "不在交易所買賣 ➔ 開放式基金。", "th": "開放式基金直接向投信申購贖回。", "tr": "封閉式基金在交易所交易。"}, {"src": "11501-34", "f": 2, "s": "115-1", "tag": "基金投資限制", "q": "證券投資信託事業募集之基金，投資於任一公司所發行無擔保公司債之總額，不得超過該公司所發行無擔保公司債總額之多少？", "o": ["3%", "5%", "10%", "15%"], "a": 2, "fl": "投資任一公司無擔保公司債 ➔ 不超過該公司無擔保債總額 10%。", "th": "分散投資，避免集中風險。", "tr": "5%、15% 是干擾。"}, {"src": "11501-23", "f": 2, "s": "115-1", "tag": "受益人會議", "q": "以下何者無需經受益人會議決議後，始得為之？", "o": ["更換基金保管機構", "變更基金之投資範圍", "調降經理公司之報酬", "基金改型"], "a": 2, "fl": "免開受益人會議 ➔ 調降經理費、保管費。", "th": "降費對受益人有利，不用開會。", "tr": "更換保管機構、改投資範圍、基金改型都要開會。"}, {"src": "11403-32", "f": 2, "s": "114-3", "tag": "境外基金", "q": "境外基金募集及銷售案件，主管機關得委託以下何單位受理申請案件？", "o": ["證券投資信託暨顧問商業同業公會", "證交所", "集保結算所", "不得委託其他單位受理"], "a": 2, "fl": "境外基金申請案受理 ➔ 主管機關委託集保結算所。", "th": "集保結算所負責境外基金的受理與資訊平台。", "tr": "不是投信投顧公會或證交所。"}, {"src": "11403-24", "f": 2, "s": "114-3", "tag": "全權委託", "q": "依「證券投資信託事業證券投資顧問事業經營全權委託投資業務管理辦法」規定，證券投資信託事業或證券投資顧問事業以委任方式經營全權委託投資業務，有關資產保管之方式下列何者正確？", "o": ["應由證券投資信託事業或證券投資顧問事業將資產委託全權委託保管機構保管", "應由客戶將資產信託移轉予保管機構", "應由客戶將資產委託證券投資信託事業", "應由客戶將資產委託證券投資顧問事業"], "a": 1, "fl": "委任方式全權委託 ➔ 客戶把資產信託移轉給保管機構。", "th": "錢不能交給投信投顧，要交給保管機構。", "tr": "不能把資產直接交給投信或投顧。"}, {"src": "11403-23", "f": 2, "s": "114-3", "tag": "信託業兼營", "q": "信託業可申請兼營下列哪些業務？", "o": ["以委任方式辦理全權委託投資業務", "以信託方式辦理全權委託投資業務", "證券投資顧問業務", "選項(A)(B)(C)皆可"], "a": 3, "fl": "信託業可兼營 ➔ 委任或信託方式全權委託、投顧業務。", "th": "三種都可以申請。", "tr": "全選。"}, {"src": "11401-40", "f": 2, "s": "114-2", "tag": "主動式ETF", "q": "證券投資信託事業基於特定投資方針運用基金投資，主動分析作成決策，並在證券交易市場交易，且申購、買回採實物或依據證券投資信託契約規定方式交付之基金，稱為：", "o": ["主動式交易所交易基金", "被動式多資產 ETF", "槓桿型 ETF", "反向型 ETF"], "a": 0, "fl": "主動分析決策＋在交易所交易 ➔ 主動式交易所交易基金。", "th": "有「主動分析作成決策」就是主動式 ETF。", "tr": "追蹤指數的才是指數股票型。"}, {"src": "11402-29", "f": 2, "s": "114-2", "tag": "ETF", "q": "以追蹤、模擬或複製標的指數表現，並在證券市場交易，且申購、買回採實物或依據證券投資信託契約規定方式交付之基金稱為：", "o": ["組合型基金", "多重資產型基金", "指數股票型基金", "平衡型基金"], "a": 2, "fl": "追蹤、模擬、複製指數＋交易所交易 ➔ 指數股票型基金（ETF）。", "th": "被動追蹤指數就是 ETF。", "tr": "跟主動式 ETF 只差「主動決策」四個字。"}, {"src": "11402-23", "f": 2, "s": "114-2", "tag": "投顧規範", "q": "關於證券投資顧問事業執行業務，下列敘述何者正確？", "o": ["得代理他人從事有價證券投資或證券相關商品交易行為", "得以詐欺、脅迫或其他不正當方式簽訂委任契約", "不得與客戶為投資有價證券收益共享或損失分擔之約定", "得保管或挪用客戶之有價證券、款項、印鑑或存摺"], "a": 2, "fl": "投顧 ➔ 不得與客戶約定收益共享或損失分擔。", "th": "投顧只能提供建議，不能代客操作、保管客戶資產或分享損益。", "tr": "A、B、D 都是禁止行為，寫成「得」就是錯。"}, {"src": "11401-39", "f": 2, "s": "114-1", "tag": "基金買回", "q": "開放式基金受益人要求贖回受益憑證，其買回價格之計算為：", "o": ["按面額", "按契約公式", "依買回請求到達之當日或次一營業日基金淨值計算", "依買回請求當日基金淨值計算"], "a": 2, "fl": "買回價格 ➔ 請求到達當日或次一營業日的淨值。", "th": "依契約約定採到達當日或次一營業日計算。", "tr": "不是按面額。"}, {"src": "11401-24", "f": 2, "s": "114-1", "tag": "保管機構", "q": "下列有關基金保管機構之敘述何者正確？", "o": ["指本於信託關係，擔任證券投資信託契約委託人", "指本於信託關係，擔任證券投資信託契約受託人", "依法及證券投資信託契約辦理相關基金保管業務之保險公司", "依法及證券投資信託契約辦理相關基金保管業務之券商"], "a": 1, "fl": "基金保管機構 ➔ 信託關係中的受託人。", "th": "投信是委託人，保管機構是受託人，投資人是受益人。", "tr": "委託人和受託人別對調；保管機構是銀行，不是券商或保險公司。"}, {"src": "11401-23", "f": 2, "s": "114-1", "tag": "基金交易", "q": "下列有關證券投資信託基金投資有價證券之規定，何者錯誤？", "o": ["應委託證券經紀商交易", "指示基金保管機構辦理交割", "持有投資資產應登記於基金保管機構名下之基金專戶", "得使用信用卡付款"], "a": 3, "fl": "基金投資有價證券 ➔ 不得使用信用卡付款。", "th": "基金要透過經紀商交易、由保管機構交割，資產登記在基金專戶。", "tr": "選錯誤的。"}, {"src": "11303-33", "f": 2, "s": "113-3", "tag": "境外基金", "q": "境外基金管理機構得在國內委任多少個總代理人代理其銷售基金？", "o": ["限一個", "限二個", "限五個", "沒有個數限制"], "a": 0, "fl": "境外基金機構在國內 ➔ 只能委任 1 個總代理人。", "th": "一家境外基金公司在臺灣只能有一個總代理人，方便管理與究責。", "tr": "銷售機構可以有很多家，總代理人只能一家。"}, {"src": "11302-20", "f": 2, "s": "113-2", "tag": "基金規範", "q": "下列敘述何者正確？", "o": ["平衡型基金應於基金名稱中標明平 const LAW11=[{"src": "11502-3", "f": 4, "s": "115-2", "tag": "公開說明書", "q": "發行人公開說明書因隱匿內容致善意相對人生損害者，其民事責任為：", "o": ["單獨賠償責任", "區別賠償責任", "連帶賠償責任", "懲罰性賠償責任"], "a": 2, "fl": "公開說明書隱匿不實 ➔ 連帶賠償責任。", "th": "證交法第 32 條：相關人員負連帶賠償責任。", "tr": "不是懲罰性賠償。"}, {"src": "11401-10", "f": 4, "s": "114-1", "tag": "罰鍰", "q": "依「證券交易法」規定，證券商、第十八條第一項所定之事業、證券商同業公會、證券交易所或證券櫃檯買賣中心，對於主管機關命令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕，處各該事業或公會新臺幣___元以上 ___元以下罰鍰？", "o": ["二十萬；五百萬", "二十萬；六百萬", "三十萬；五百萬", "三十萬；六百萬"], "a": 3, "fl": "帳簿屆期不提出、規避檢查 ➔ 30 萬以上 600 萬以下罰鍰。", "th": "證券商、證交所、櫃買中心等對主管機關要求的帳簿資料不提出或妨礙檢查，處事業或公會 30 萬～600 萬元罰鍰。", "tr": "修法題：舊答案是 24 萬～480 萬（110、111 年考題），現在改為 30 萬～600 萬。一般違反申報公告義務仍是 24 萬～480 萬，別混。"}, {"src": "11502-11", "f": 3, "s": "115-2", "tag": "內線交易", "q": "公開發行公司之內部人(如董監、經理人等)喪失其身分後，未滿多久前仍受「證券交易法」第一百五十七條之一(內線交易)的規範？", "o": ["3 個月", "6 個月", "9 個月", "12 個月"], "a": 1, "fl": "內部人喪失身分後 ➔ 未滿 6 個月仍受內線交易規範。", "th": "離職後 6 個月內還可能掌握內部消息。", "tr": "3 個月是干擾；短線交易歸入權也是看 6 個月內買賣。"}, {"src": "11501-17", "f": 3, "s": "115-1", "tag": "法人處罰", "q": "法人違反「證券交易法」之規定者，依該法規定之罰則，應如何處罰？", "o": ["處罰該法人", "處罰其行為之負責人", "一律處罰其董事", "處罰其股東"], "a": 1, "fl": "法人違反證交法 ➔ 處罰行為負責人。", "th": "法人不能坐牢，所以處罰實際做出行為的負責人。", "tr": "不是一律處罰董事或股東。"}, {"src": "11403-13", "f": 3, "s": "114-3", "tag": "內線交易", "q": "違反內線交易規定，損害賠償額度之計算標準，就消息未公開前或公開後多少小時內，其買入或賣出該股票之價格與消息公開後十個營業日收盤平均價格的差額？", "o": ["12", "24", "18", "13"], "a": 2, "fl": "內線交易賠償計算 ➔ 消息公開後 18 小時內。", "th": "消息公開後還要等 18 小時，市場才充分消化。", "tr": "12、13、24 小時都是干擾。"}, {"src": "11403-5", "f": 3, "s": "114-3", "tag": "公開說明書", "q": "公開說明書主要內容有虛偽不實記載，對於善意投資人之損失，下列何者原則上不與公司負連帶賠償責任？", "o": ["發行人及其負責人", "承銷該證券之證券承銷商", "買賣該證券之證券經紀商", "會計師、律師等專業者簽名其上以證實所載內容"], "a": 2, "fl": "公開說明書不實 ➔ 證券經紀商不負連帶責任。", "th": "負連帶責任：發行人、負責人、承銷商、簽證的會計師律師。經紀商只是代客買賣。", "tr": "承銷商要負責，經紀商不用。"}, {"src": "11001-25", "f": 3, "s": "113-3", "tag": "重大消息", "q": "何種重大消息係指「證券交易法」第一百五十七條之一第五項及第六項所稱涉及該證券之市場供求，對其股價有重大影響之消息？", "o": ["公司買回庫藏股", "公司取得或處分重大資產", "公司股票有被進行公開收購者", "公司辦理重整"], "a": 2, "fl": "涉及「市場供求」的重大消息 ➔ 被 "投保法", "q": "未經登錄興櫃交易之初次上市、櫃案件，承銷商辦理對外公開銷售時應先保留普通股一千股由以下何機構認購？", "o": ["證券暨期貨市場發展基金會", "證券投資人及期貨交易人保護中心", "證券商業同業公會", "金融法制暨犯罪防制中心"], "a": 1, "fl": "未登錄興櫃初次上市櫃 ➔ 先保留 1,000 股給投資人保護中心。", "th": "保護中心當股東，必要時可以代表投資人行使權利。", "tr": "不是證基會或公會。"}, {"src": "11403-6", "f": 2, "s": "114-3", "tag": "會計師處分", "q": "依現行證券交易法規定，會計師辦理證交法第 36 條財務報告之查核簽證，發生錯誤或疏漏時，主管機關得為之處分，試問下列何者為錯誤？", "o": ["警告", "停止其二年以內辦理證交法所定之簽證", "撤銷簽證之核准", "申誡"], "a": 3, "fl": "會計師簽證缺失 ➔ 警告、停止 2 年以內簽證、撤銷核准；沒有「申誡」。", "th": "證交法第 37 條規定的三種處分。", "tr": "舊題問「何者可處分」答「甲、丙、丁」，同一考點。"}, {"src": "11403-25", "f": 2, "s": "114-3", "tag": "投保法", "q": "為使保護機構得以順利進行訴訟，以爭取投資人、交易人之權利，投保法特別在裁判費與擔保費用方面給予優遇，如依「證券投資人及期貨交易人保護法」§35 規定，訴訟標的金額或價額超過新臺幣___元者，超過部分暫免繳裁判費？", "o": ["一千萬", "二千萬", "三千萬", "四千萬"], "a": 2, "fl": "保護機構訴訟 ➔ 標的超過 3,000 萬元部分暫免裁判費。", "th": "投保法第 35 條，減輕保護機構的訴訟成本。", "tr": "1,000 萬、2,000 萬是干擾。"}, {"src": "11402-19", "f": 2, "s": "114-2", "tag": "內線交易", "q": "依照證交法之規定，下列何者非為內線交易規範主體？", "o": ["持有該公司之股份百分之五之股東", "該公司之法人董事代表人", "該公司離職三個月的董事", "從董事長獲悉消息之董事長司機"], "a": 0, "fl": "內線交易主體 ➔ 持股「超過 10%」的大股東；持股 5% 不算。", "th": "內部人包括董監經理人、10% 大股東、法人董事代表人、離職未滿 6 個月者、消息受領人。", "tr": "5% 是大量持股申報門檻，不是內部人門檻。"}, {"src": "11303-10", "f": 2, "s": "113-3", "tag": "刑責", "q": "會計師未依有關法規規定與一般公認審計準則查核公司財務報告，而於內容有重大虛偽不實或錯誤情事未予敘明者，可處幾年以下有期徒刑？", "o": ["1 年", "3 年", "5 年", "10 年"], "a": 2, "fl": "會計師查核不實未敘明 ➔ 5 年以下有期徒刑。", "th": "證交法第 174 條第 2 項。", "tr": "3～10 年是操縱、內線、違約交割。"}, {"src": "11302-10", "f": 2, "s": "113-2", "tag": "爭議處理", "q": "有關證券交易爭議之仲裁，在法律上適用優先順序為何？", "o": ["「仲裁法」優先於「證券交易法」", "「證券交易法」優先於「仲裁法」", "「民法」優先於「證券交易法」", "「民事訴訟法」優先於「證券交易法」"], "a": 1, "fl": "證券爭議仲裁 ➔ 證交法優先於仲裁法。", "th": "證交法是特別法，先適用。", "tr": "仲裁法是普通法。"}, {"src": "11302-21", "f": 2, "s": "113-2", "tag": "財報不實", "q": "公司財務報告之主要內容有虛偽或隱匿之情事時，下列何者不須負賠償責任？", "o": ["公司董事長", "簽證會計師", "未曾在財務報告上簽名的公司職員", "選項(A)(B)(C)皆是"], "a": 2, "fl": "財報不實免賠 ➔ 未在財報上簽名的公司職員。", "th": "負賠償責任的是發行人、負責人、簽名的職員和會計師。", "tr": "舊題問「應負賠償責任」答「皆是」，題目方向相反。"}, {"src": "11202-23", "f": 2, "s": "112-2", "tag": "刑責", "q": "違反證券交易法第 155 條之「操縱股價行為」，其犯罪所得在新臺幣一億元以下者，其刑事責任為何？", "o": ["一年以下有期徒刑，得併科新臺幣二萬元以下罰金", "二年以下有期徒刑，得併科新臺幣五萬元以下罰金", "五年以下有期徒刑，得併科新臺幣一千萬元以下罰金", "處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金"], "a": 3, "fl": "操縱股價（所得 1 億以下）➔ 3～10 年，併科 1,000 萬～2 億罰金。", "th": "證交法第 171 條：操縱、內線、背信等重罪。犯罪所得 1 億以上刑度提高到 7 年以上。", "tr": "5 年以下是會計師簽證不實。"}, {"src": "11202-20", "f": 2, "s": "112-2", "tag": "內線交易", "q": "關於「證券交易法」第一百五十七條之一所定內線交易禁止規定，下列敘述何者正確？", "o": ["適用對象為具有股權性質之有價證券", "規範對象以他人之名義買入或賣出，亦構成內線交易", "該重大影響股價之消息，若已公開超過十八小時，即非屬內線交易", "選項(A)(B)(C)皆正確"], "a": 3, "fl": "內線交易 ➔ 股權性質證券、以他人名義也算、消息公開 18 小時內不得買賣。", "th": "三個敘述都正確。", "tr": "全選；18 小時是常考數字。"}, {"src": "11103-20", "f": 2, "s": "111-3", "tag": "內部人交易", "q": "下列有關內部人交易規範之敘述何者正確？", "o": ["可能包括公司內部人之短線交易及利用內部消息買賣圖利之情形", "短線交易所獲利益所有權直接屬於公司，不須另由他人請求", "所規範之行為主體僅限於公司內部人", "只有利用內部消息獲利之人須負刑事責任"], "a": 0, "fl": "內部人交易 ➔ 包括短線交易和內線交易。", "th": "短線交易利益要由公司請求歸入；規範對象不限內部人（消息受領人也算）。", "tr": "B、C、D 都把規定說得太絕對。"}, {"src": "11003-27", "f": 2, "s": "110-3", "tag": "重大訊息", "q": "發生下列何事項，上市公司無須發布重大訊息？", "o": ["上市公司負責人發生存款不足之退票", "董事及監察人之持股變動情形", "上市公司進行重整或破產之程序", "上市公司非屬簽證會計師事務所內部調整之變動簽證會計師者"], "a": 1, "fl": "不用發重大訊息 ➔ 董監持股變動（每月申報即可）。", "th": "董監持股變動是每月例行申報，不是重大訊息。", "tr": "負責人退票、重整破產、更換會計師都要發重訊。"}, {"src": "11501-12", "lv": "a", "f": 1, "s": "115-1", "tag": "調處", "q": "下列各項民事爭議中，依證券投資人及期貨交易人保護法申請調處，將不予受理？", "o": ["已在第一審法院言詞辯論終結者", "與證券發行人產生之民事爭議者", "證券投資人提起之民事爭議者", "有具體相對人之民事爭議者"], "a": 0, "fl": "調處不受理 ➔ 已在第一審言詞辯論終結。", "th": "法院快判了，就不再調處。", "tr": "有具體相對人的民事爭議可以調處。"}, {"src": "11501-3", "lv": "a", "f": 1, "s": "115-1", "tag": "財報不實", "q": "發行人公告申報之財務報告主要內容有虛偽之情事者，對所發行證券之善意取得人、出賣人因而所受之損害負賠償責任，但下列何者得舉證免責？", "o": ["發行人之董事長", "發行人之總經理", "簽證會計師", "發行人之會計主管"], "a": 2, "fl": "財報不實「得舉證免責」➔ 簽證會計師。", "th": "發行人本身負無過失責任；會計師能證明自己已盡相當注意、沒有過失，就可以免責。依官方答案選會計師。", "tr": "董事長、總經理、會計主管都是財報簽名的負責人，題目不選他們。"}, {"src": "11501-9", "lv": "a", "f": 1, "s": "115-1", "tag": "投信人員", "q": "證券投資信託事業之董事、監察人、經理人、業務人員及其他受僱人員，不得為下列何種行為？", "o": ["以職務上所知悉之消息洩漏予他人", "為虛偽、詐欺或其他足致他人誤信之行為", "運用證券投資信託基金買賣有價證券及其相關商品時，收取證券商退還手續費", "選項(A)(B)(C)皆不得為之"], "a": 3, "fl": "投信人員不得 ➔ 洩漏消息、虛偽詐欺、收取手續費退佣。", "th": "三個都是禁止行為。", "tr": "全選。"}, {"src": "11402-15", "lv": "a", "f": 1, "s": "114-2", "tag": "證券商處分", "q": "依「證券交易法」規定，主管機關發現證券商之董事、監察人及受僱人有違背本法或其他有關法令之行為，足以影響證券業務之正常執行者，得隨時命令該證券商停止其幾年以下業務之執行或解除其職務？", "o": ["1 年", "2 年", "3 年", "4 年"], "a": 0, "fl": "證券商董監受僱人違法 ➔ 命令停止 1 年以下業務或解除職務。", "th": "證交法第 56 條。", "tr": "2 年是會計師停止簽證期限。"}, {"src": "11402-6", "lv": "a", "f": 1, "s": "114-2", "tag": "損害賠償", "q": "「證券交易法」規定之發行人財務報告記載不實之詐欺損害賠償請求權，經多少期間不行使而消滅？", "o": ["自得行使時起一年", "自有請求權人知有得受賠償之原因時起三年", "自募集、發行或買賣之日起逾五年", "自損失發生時起十年"], "a": 2, "fl": "財報不實請求權時效 ➔ 知悉後 2 年，或募集發行買賣之日起 5 年。", "th": "兩個期間任一個到了就消滅。", "tr": "1 年、10 年是干擾。"}, {"src": "11401-25", "lv": "a", "f": 1, "s": "114-1", "tag": "投保法", "q": "依「證券投資人及期貨交易人保護法」規定，保護機構為保護公益，於本法及其捐助章程所定目的範圍內，對於造成多數證券投資人或期貨交易人受損害之同一原因所引起之證券、期貨事件，得由 ___以上證券投資人或期貨交易人授與仲裁或訴訟實施權後，以___之名義，提付仲裁或起訴？", "o": ["二十人；保護機構", "二十人；證券投資人或期貨交易人", "三十人；保護機構", "三十人；證券投資人或期貨交易人"], "a": 0, "fl": "團體訴訟 ➔ 20 人以上授權，以保護機構名義起訴。", "th": "人數夠就由保護機構出面打官司。", "tr": "30 人、以投資人名義都是干擾。"}];

 {f:4,s:"114-1",tag:"基金",q:"有關避險基金（Hedge Fund）之敘述，何者正確？甲.以勝過大盤指數為操作目標；乙.只運用買進標的之投資策略；丙.通常為私募；丁.流動性低",o:["僅甲、乙","僅乙、丙","僅丙、丁","僅甲、乙、丙"],a:2,
  fl:"看到「避險基金」➔ 秒選含「私募、流動性低、絕對報酬、對沖」的組合。",th:"避險基金是給有錢人的私人基金：門檻高、不公開募集、錢不能隨時拿回來。它不跟大盤比，只追求不管漲跌都賺錢，所以會又買又放空。",tr:"「以勝過大盤為目標」是共同基金在比的；避險基金追求的是「絕對報酬」，不是相對大盤。"},
 {f:4,s:"115-2",tag:"ETF",q:"有關投資 ETF 之敘述何者「不正確」？",o:["ETF 的投資報酬有兩類，買賣價差及持有 ETF 所派發的股息收入","投資 ETF 可能有市場風險、被動式投資風險及追蹤誤差風險","ETF 屬於被動式管理","投資 ETF 可以規避市場風險"],a:3,
  fl:"「可以規避市場風險」➔ 一定錯。",th:"ETF 可以分散個股的非系統風險，但整個市場一起跌時，ETF 也會跌。市場風險（系統風險）無法靠分散消除。",tr:"出題委員把「分散非系統風險」偷換成「規避市場風險」。"},
 {f:4,s:"112-1",tag:"市場分類",q:"何者屬於貨幣市場之工具？甲.可轉讓銀行定期存單；乙.可轉換公司債；丙.國庫券；丁.商業本票",o:["僅甲、乙","僅丙、丁","僅乙、丙、丁","僅甲、丙、丁"],a:3,
  fl:"貨幣市場 ➔ 國庫券、商業本票、NCD、附條件、承兌匯票。",th:"這些都是一年以內到期的短期工具。",tr:"「可轉讓定存單」和「可轉換公司債」只差兩個字，後者是長期債券，屬於資本市場。"},
 {f:3,s:"115-1",tag:"基金",q:"採定期定額投資共同基金時，下列敘述何者正確？甲.當股價愈高時，可購得之基金單位數愈多；乙.當股價愈高時，可購得之基金單位數愈少；丙.當股價下跌時，可購得之基金單位數愈多；丁.當股價下跌時，可購得之基金單位數愈少",o:["僅甲、丙","僅乙、丙","僅甲、丁","僅乙、丁"],a:1,
  fl:"定期定額 ➔ 貴時買少、便宜時買多。",th:"每次投入的金額固定。價格高，同樣的錢能買的單位就少；價格低，能買的單位就多，長期平均成本會被拉低。",tr:"甲和丁是把方向反過來的陷阱。只要記住「錢固定」，單位數一定跟價格反向。"},
 {f:3,s:"114-2",tag:"貨幣市場",q:"假設一 90 天期國庫券的面額為 100 萬元，報價為 95.30，請問投資人欲買進時，須支付多少金額？（一年以 365 天計算）",o:["953,000 元","988,411 元","986,931 元","992,274 元"],a:1,
  fl:"國庫券報價 ➔ 100 − 報價 = 年貼現率，再乘 90/365，用面額扣掉。",th:"100 − 95.30 = 4.7%，這是年利率。持有只有 90 天，所以折扣 = 100 萬 × 4.7% × 90/365 ≈ 11,589 元。買價 = 100 萬 − 11,589 = 988,411 元。",tr:"直接選 953,000 是把報價當成價格；報價代表的是年貼現率，一定要換算成天數。"},
 {f:3,s:"114-1",tag:"基金",q:"投資共同基金之好處為：甲.可分散投資風險；乙.可保證獲取高於市場平均之報酬率；丙.可透過專家操作管理；丁.基金市價往往高於其淨值，可創造價值",o:["僅甲、乙","僅甲、丙","僅乙、丙","僅甲、丙、丁"],a:1,
  fl:"共同基金好處 ➔ 分散風險＋專家管理。",th:"一筆小錢就能買到一籃子股票，達到分散；再交給基金經理人操作。基金不可能保證報酬。",tr:"看到「保證」兩個字就刪掉。這題在 113 年第 2 次、114 年第 1 次官方都送分，合理答案是「甲、丙」。"},
 {f:3,s:"115-2",tag:"基金",q:"下列何者不是開放型基金之特點？",o:["發行規模固定","透過銀行、投信投顧公司管道進行買賣","基金規模可隨時視市場狀況增加或縮減","可隨時向基金公司以淨值贖回"],a:0,
  fl:"「規模固定」➔ 封閉型，不是開放型。",th:"開放型基金隨時有人申購、有人贖回，規模一定會變動。",tr:"選項 C 和 A 互相矛盾，代表其中一個就是答案。"},
 {f:3,s:"115-1",tag:"特別股",q:"下列有關特別股的敘述何者正確？",o:["公司發行特別股有可能造成經營權易主","公司清算時，普通股之受償順序優先於特別股","特別股之流動性通常較普通股差","公司發放股利，會優先發給普通股"],a:2,
  fl:"特別股 ➔ 發行少、交易少、流動性差。",th:"特別股通常沒有投票權，所以不影響經營權；但分股利和清算時都排在普通股前面。",tr:"B 和 D 把「優先」的方向對調了：優先的是特別股，不是普通股。"},
 {f:3,s:"114-3",tag:"ETF",q:"ETN 和 ETF 的比較，下列何者有誤？",o:["兩者都追蹤標的指數為主","ETN 理論上沒有追蹤誤差，而 ETF 會有追蹤誤差","ETN 是由券商發行，ETF 是由投信發行","ETN 可以用實物或現金申購贖回，而 ETF 只能用現金申購贖回"],a:3,
  fl:"ETN ➔ 只能用現金；ETF ➔ 可以用實物（一籃子股票）。",th:"ETN 是券商開的「報酬保證單」，手上不一定持有股票，所以只能用現金結算；ETF 真的持有成分股，才能用股票換。",tr:"D 把兩者的申購方式對調。記住：ETN 的 N 是 Note（票據），只有現金。"},
 {f:3,s:"114-2",tag:"ETF",q:"下列有關指數投資證券（ETN）的敘述何者正確？",o:["無到期日","由投信公司發行","為主動型投資","ETN 不得從事當沖交易"],a:3,
  fl:"ETN ➔ 券商發行、有到期日、被動追蹤、不能當沖。",th:"ETN 是券商發行的債務憑證，有到期日，到期依指數表現用現金結算。",tr:"「由投信發行」是 ETF 的特徵，用來混淆兩者。"},
 {f:3,s:"113-2",tag:"基金",q:"下列何種共同基金的風險相對較高？",o:["貨幣型基金","成長型基金","債券型基金","保本型基金"],a:1,
  fl:"風險最高 ➔ 成長型；風險最低 ➔ 貨幣型。",th:"成長型基金投資高成長、高波動的股票；貨幣型基金投資短期票券，最穩定。",tr:"「保本型」看起來最安全，但題目問的是風險最高。"},
 {f:3,s:"114-3",tag:"特別股",q:"下列有關優先權特別股的敘述何者有誤？",o:["公司發放股利，會優先發給普通股","普通股的清算受償順位在優先特別股之後","特別股沒有贖回壓力","公司發行特別股不會影響經營權"],a:0,
  fl:"「優先發給普通股」➔ 錯，優先的是特別股。",th:"特別股的「特別」就在於分股利、清算都排在普通股前面，代價是沒有投票權。",tr:"出題委員只把「特別股」換成「普通股」，一字之差。"},
 {f:2,s:"115-2",tag:"貨幣市場",q:"以下有關附條件交易的敘述，何者「不正確」？",o:["附賣回利率會高於附買回利率","公司債附買回交易的利率會低於公債附賣回的利率","屬於貨幣市場工具","目前以政府公債為主要標的"],a:1,
  fl:"附條件交易 ➔ 附賣回（RS）利率 ＞ 附買回（RP）利率。",th:"券商用 RP 向你借錢，付低利率；用 RS 把錢借給你，收高利率，中間的利差就是券商的收入。公司債風險比公債高，所以公司債的利率應該比較高。",tr:"B 把「公司債」和「公債」對調，又把 RP、RS 混在一起比，故意讓人看不清楚。"},
 {f:2,s:"115-2",tag:"基金",q:"一般而言，何種股票型共同基金的分散風險的效果最大？",o:["大型股基金","中小型基金","全球基金","亞洲基金"],a:2,
  fl:"分散風險最大 ➔ 範圍最廣的「全球」。",th:"投資範圍越廣，涵蓋的國家、產業、公司越多，個別風險越能互相抵銷。",tr:"「亞洲基金」也是跨國，但範圍比全球小，是用來混淆的選項。"},
 {f:2,s:"115-1",tag:"存託憑證",q:"發行海外存託憑證（GDR）會使該公司之淨值總額如何變化？",o:["增加","減少","不變","不一定"],a:2,
  fl:"發行存託憑證 ➔ 淨值不變。",th:"存託憑證背後是公司拿出來的等量既有股票，只是換個形式到國外交易，公司沒有多收錢，也沒有少錢。",tr:"容易誤以為「到國外募資」就會增加淨值。只有發行新股增資，淨值才會增加。"},
 {f:2,s:"115-1",tag:"ETF",q:"當 ETF 之市價大於淨值，存在套利機會時，套利者應如何操作？甲.買進一籃子股票；乙.賣出一籃子股票；丙.於市場上賣出 ETF；丁.於市場上買進 ETF",o:["僅甲、丙","僅乙、丁","僅乙、丙","僅甲、丁"],a:0,
  fl:"ETF 市價 ＞ 淨值（溢價）➔ 買股票、賣 ETF。",th:"套利就是買便宜的、賣貴的。ETF 比較貴，就在市場上賣 ETF；同時買進便宜的成分股，再用實物申購換成 ETF 交割。",tr:"折價時要反過來操作：買 ETF、賣股票。先判斷哪一邊比較貴。"},
 {f:2,s:"114-3",tag:"市場分類",q:"何者「不是」資本市場之工具？",o:["政府債券","國庫券","一般公司債","存託憑證"],a:1,
  fl:"國庫券 ➔ 貨幣市場（一年以內）。",th:"一年以內的短期工具屬於貨幣市場，例如國庫券、商業本票、附條件交易、NCD、銀行承兌匯票。超過一年的股票和債券屬於資本市場。",tr:"「政府債券」和「國庫券」都是政府發的，但期限不同。債券是長期，國庫券是短期。"},
 {f:2,s:"114-1",tag:"基金",q:"封閉型與開放型基金的敘述，何者「不正確」？甲.封閉型基金以淨值交易；乙.封閉型基金的規模不會改變，開放型則會；丙.封閉型基金可轉型成開放型基金；丁.開放型基金在集中市場交易、封閉型基金則否",o:["僅甲、丙","僅乙、丙","僅丙、丁","僅甲、丁"],a:3,
  fl:"封閉型 ➔ 規模固定、在集中市場以市價交易；開放型 ➔ 向基金公司以淨值申購贖回。",th:"封閉型基金像股票，發行後份數不變，只能在交易所買賣，價格由市場決定；開放型隨時可以申購贖回，所以規模會變。",tr:"甲和丁把兩者的特性互換了：以淨值交易的是開放型，在集中市場交易的是封閉型。"},
 {f:2,s:"113-2",tag:"貨幣市場",q:"老王以 1,000 萬元之公債用面額與證券公司承作附賣回（RS）交易，雙方約定利率為 6%，並於 30 天後向證券公司買回，屆時老王應支付證券公司之利息為何？（一年以 365 天計算）",o:["$49,315","$44,770","$48,770","$42,185"],a:0,
  fl:"附條件利息 ➔ 本金 × 利率 × 天數 / 365。",th:"1,000 萬 × 6% × 30/365 = 49,315 元。一步就能算出來。",tr:"把 365 換成 360，答案就會跑掉。題目寫 365 就用 365。"},
 {f:2,s:"113-1",tag:"ETF",q:"假設滬深 300 指數單日大跌 8.7%，則有關其反向型 ETF 的表現，下列何者正確？",o:["漲幅限制為 10%","漲幅可能高於 8.7%，但不會超過 10%","漲幅不可能低於 8.7%","無漲跌幅限制"],a:3,
  fl:"追蹤國外指數的 ETF ➔ 無漲跌幅限制。",th:"成分股在國外的 ETF，標的本身就沒有臺灣的 10% 限制，所以這類 ETF 在臺灣交易也不設漲跌幅。",tr:"看到 10% 很容易直接套用臺股規則。關鍵字是「滬深 300」，代表國外成分股。"},
 {f:2,s:"112-1",tag:"貨幣市場",q:"小何購買 90 天商業本票，面額 1,000 萬元，成交價為 995 萬元，則其實質利率為何？（一年以 365 天計算）",o:["8.28%","6.18%","8.11%","2.04%"],a:3,
  fl:"商業本票利率 ➔ 利息 ÷ 成交價 × 365 / 天數。",th:"利息 = 1,000 萬 − 995 萬 = 5 萬。5 萬 ÷ 995 萬 ≈ 0.5025%，再乘 365/90 ≈ 2.04%。",tr:"分母要用實際付出的 995 萬，不是面額。8% 左右的選項是忘了換算天數或亂乘出來的。"},
 {f:2,s:"112-1",tag:"ETF",q:"ETF 和開放股票型基金特性比較，何者為「非」？",o:["股票型基金交易成本較 ETF 低","ETF 可以在市場上放空","股票型基金通常是採用主動投資策略","ETF 是以追蹤大盤或是標的指數為主"],a:0,
  fl:"交易成本最低 ➔ ETF（被動管理、管理費最低）。",th:"ETF 照著指數買，不用請團隊選股，所以費用最低；股票型基金是主動選股，管理費比較高。",tr:"A 把「較高」偷換成「較低」，是典型的反向題陷阱。"},
 {f:2,s:"111-2",tag:"貨幣市場",q:"甲銀行以 96 的價格標得 90 天期國庫券，面額 100 萬元，請問其須支付多少金額來取得此國庫券？（一年以 365 天計算）",o:["985,205 元","987,671 元","1,000,000 元","990,137 元"],a:3,
  fl:"國庫券 ➔ 100 − 報價 = 年貼現率，乘 90/365 後從面額扣掉。",th:"100 − 96 = 4%，100 萬 × 4% × 90/365 ≈ 9,863 元。買價 = 100 萬 − 9,863 = 990,137 元。",tr:"買國庫券一定低於面額，1,000,000 元直接刪掉。"},
 {f:2,s:"115-1",tag:"ETF",q:"有關臺灣 50 單日正向 2 倍證券投資信託基金，以下敘述何者不正確？",o:["為槓桿型 ETF","漲跌幅限制為 10%","為指數股票型 ETF","追蹤標的為臺灣 50 指數"],a:1,
  fl:"槓桿型 2 倍 ETF ➔ 漲跌幅是 20%，不是 10%。",th:"它追蹤指數單日漲跌的 2 倍，指數可以漲跌 10%，所以 ETF 本身最多是 20%。",tr:"直覺套用臺股 10% 規則就會被騙。"},
 {lv:"a",f:1,s:"115-2",tag:"特別股",q:"下列何者為特別股的名稱？",o:["中鋼甲特","台積電元大 2A 購 21","元大臺灣 50 反 1","聯電二"],a:0,
  fl:"名稱有「特」字 ➔ 特別股。",th:"臺灣特別股的命名習慣是在公司名稱後面加上「甲特、乙特」。",tr:"「購」是認購權證，「反」是反向 ETF，「聯電二」是公司債。"},
 {lv:"a",f:1,s:"114-2",tag:"存託憑證",q:"有關我國買賣存託憑證和股票之敘述何者「正確」？甲.手續費相同；乙.證券交易稅相同；丙.價格跳動單位相同；丁.存託憑證可限價及市價委託，股票僅能限價",o:["甲、乙、丙、丁均對","僅甲、丙、丁","僅甲、丙","僅乙、丙、丁"],a:2,
  fl:"存託憑證 vs 股票 ➔ 手續費、跳動單位相同；證交稅不同。",th:"TDR 的證交稅是千分之一，股票是千分之三；兩者的委託方式相同。",tr:"乙看起來合理，但稅率不同；丁是捏造的差異。"},
 {lv:"a",f:1,s:"113-3",tag:"存託憑證",q:"有關臺灣存託憑證持有者的敘述，何者「正確」？甲.可享有原股外國公司之股利分配權利；乙.可享有原股外國公司之剩餘財產分配權利；丙.可直接參與原股外國公司之股東會",o:["僅甲","僅丙","僅甲、乙","僅甲、丙"],a:2,
  fl:"TDR 持有人 ➔ 有錢的權利（股利、剩餘財產），沒有直接開會的權利。",th:"TDR 由存託機構代持外國股票，經濟利益會轉給你，但你不是外國公司的直接股東，所以不能直接參加股東會。",tr:"「直接參與股東會」就是陷阱。"},
 {lv:"a",f:1,s:"114-2",tag:"基金",q:"組合型基金的優點為：甲.減少挑選基金的複雜性；乙.分散單一基金操作績效不佳的風險；丙.在資產配置上較不受限制",o:["僅甲、乙","僅乙、丙","僅甲、丙","甲、乙、丙皆是"],a:3,
  fl:"組合型基金優點 ➔ 三個全選。",th:"組合型基金就是「買基金的基金」：幫你挑基金、分散經理人風險，也能跨資產配置。",tr:"丙的「較不受限制」看起來像缺點，其實是優點。"},
 {lv:"a",f:1,s:"112-2",tag:"基金",q:"有關國內共同基金管理費率的敘述何者不正確？",o:["債券型基金的管理費率小於股票基金","管理費率的多寡與基金規模有關","指數型基金的管理費率通常較低","管理費率必定與基金績效有關"],a:3,
  fl:"看到「必定」➔ 選它。",th:"管理費是按基金規模的固定比例收取，不管績效好壞都要付。",tr:"考題中「必定」「保證」「一律」通常就是錯誤選項。"},
 {lv:"a",f:1,s:"111-3",tag:"基金",q:"國內的共同基金依成立的法源基礎劃分者皆為：",o:["契約型","股份型","公司型","合夥型"],a:0,

const KEY="gaoye-drill-v1",PKEY="gaoye-drill-pending",FKEY="gaoye-fav-v1",POSKEY="gaoye-pos-v1";

/* 作答紀錄 rec[題號] = 累計錯誤次數×2 + 最近一次結果（1 對、0 錯）。舊資料 1＝對、0＝錯一次，可直接相容。 */
let rec=ls.get(KEY,{});

const FAV="__fav",HOT="__hot",ORDER=["law","inv","fin"];

const $=id=>document.getElementById(id);
const chapters=()=>BANK[sub].chapters;
const isLv=q=>level==="all"||(q.lv||"k")==="k";
const qid=(c,i)=>c.id+"-"+i;

const done=id=>rec[id]!==undefined;
const last=id=>rec[id]===undefined?undefined:rec[id]%2;          // 1 對 / 0 錯
const errs=id=>{const v=rec[id];if(v===undefined)return 0;const e=Math.floor(v/2);return v%2===0&&e===0?1:e};
const setRec=(id,lastOk,e)=>{rec[id]=Math.max(0,e)*2+(lastOk?1:0)};
const sev=e=>e>=3?"e3":e===2?"e2":e===1?"e1":"";

/* 題目清單：章節／收藏夾／重災區 */
function items(){
  if(chap===FAV||chap===HOT){const out=[];chapters().forEach(c=>c.qs.forEach((q,i)=>{const id=qid(c,i);if(chap===FAV?fav.has(id):errs(id)>=2)out.push({c,i,q})}));return out}
  const c=chapters().find(x=>x.id===chap);return c.qs.map((q,i)=>({c,i,q})).filter(t=>isLv(t.q));
}
function chapStat(c){let n=0,d=0;c.qs.forEach((q,i)=>{if(!isLv(q))return;n++;if(done(qid(c,i)))d++});
  return{n,d,state:!d?"idle":d>=n?"done":"doing"}}
const countWhere=f=>chapters().reduce((a,c)=>a+c.qs.filter((q,i)=>f(qid(c,i))).length,0);
const favCount=()=>countWhere(id=>fav.has(id));
const hotCount=()=>countWhere(id=>errs(id)>=2);

/* ---------- 中斷點 ---------- */
function savePos(){
  if(!window.__ready)return;
  const it=items(),k=list[idx];if(k===undefined||!it[k])return;
  pos={sub,chap,level,q:qid(it[k].c,it[k].i),t:Date.now()};ls.set(POSKEY,pos);markDirty("pos",true);
}
function restorePos(p){
  if(!p||!BANK[p.sub])return false;
  sub=p.sub;level=p.level==="all"?"all":"k";
  const ok=p.chap===FAV||p.chap===HOT||chapters().some(c=>c.id===p.chap&&c.qs.length);
  chap=ok?p.chap:chapters().find(c=>c.qs.length).id;
  syncLevelTabs();buildTabs();
  const it=items();list=it.map((t,k)=>k);
  let k=it.findIndex(t=>qid(t.c,t.i)===p.q);
  if(k<0&&chap!==FAV&&chap!==HOT){level="all";syncLevelTabs();const it2=items();list=it2.map((t,j)=>j);k=it2.findIndex(t=>qid(t.c,t.i)===p.q)}
  idx=Math.max(0,list.indexOf(k));
  buildChips();render();
  setTimeout(()=>{toTop(true);const n=$("resume");if(n){n.hidden=false;setTimeout(()=>n.hidden=true,3500)}},60);
  return true;
}

function buildTabs(){

}
let lastDone=new Set();
function buildChips(){

  chapters().forEach(c=>{if(!c.qs.length)return;const s=chapStat(c);const pop=s.state==="done"&&!lastDone.has(c.id)&&window.__ready;
    h+=`<button class="chipb ${s.state}${pop?" pop":""}" type="button" data-c="${c.id}" aria-pressed="${c.id===chap}" title="${esc(c.name)}"><span class="cn">${short(c.name)}</span><span class="ct">${esc(c.name.split(" ").slice(1).join(" "))}</span><span class="cp">${s.d} / ${s.n}${s.state==="done"?" 完成":""}</span></button>`});
  $("chips").innerHTML=h;

  const cur=$("chips").querySelector('[aria-pressed="true"]');if(cur)cur.scrollIntoView({block:"nearest",inline:"nearest"});
  if(chap===FAV)$("chead").innerHTML=`<b>⭐ 我的最愛</b><span class="badge ${fc?"doing":"idle"}">${fc} 題・跨章節抽考</span>`;

  else{const c=chapters().find(x=>x.id===chap),s=chapStat(c);
    const lab=s.state==="done"?`🏅 ${s.d} / ${s.n} 完成・已通關`:s.state==="doing"?`刷題中 ${s.d} / ${s.n}`:`未開始 0 / ${s.n}`;

}
function rebuild(keep){

  if(!keep)idx=0;if(idx>=list.length)idx=Math.max(0,list.length-1);

}
function stats(){

  <div class="resume" id="resume" hidden>↩ 已接續上次中斷的題目</div>
  <div class="meta"><span class="qno">${String(k+1).padStart(2,"0")} / ${it.length}</span><span class="tag">${esc(q.tag)}</span>${lv}${q.x?`<span class="hot">❌ 魔王題・時間不夠可放生</span>`:""}<span class="from">${short(c.name)}</span>${q.s&&q.s!=="筆記"?`<span>最近：${q.s}</span>`:""}</div>
  ${errTag(e)}
  <p class="stem">${q.q}</p>
  <div class="opts">${q.o.map((o,j)=>`<button class="opt" type="button" data-j="${j}"><span class="let">${"ABCD"[j]}</span><span class="tx">${o}</span></button>`).join("")}</div>
  <div id="after"></div>
  <div class="nav"><button class="btn ghost" type="button" id="prev" ${idx===0?"disabled":""}>上一題</button><button class="btn" type="button" id="next">${idx===list.length-1?"回到第一題":"下一題"}</button></div>`;
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  $("star").onclick=()=>toggleFav(id);

let answered=false,autoT=null,navAt=0;
function goNext(force){
  const now=Date.now();if(!force&&now-navAt<300)return;navAt=now;clearTimeout(autoT);
  if(window.__ready)userMoved=true;
  if((chap===HOT||wrongOnly)){
    const it=items(),cur=it[list[idx]],curId=cur&&qid(cur.c,cur.i);
    const fresh=items(),nl=fresh.map((t,k)=>k).filter(k=>!wrongOnly||last(qid(fresh[k].c,fresh[k].i))===0);
    const stillIn=nl.some(k=>qid(fresh[k].c,fresh[k].i)===curId);
    list=nl;idx=stillIn?idx+1:idx;if(idx>=list.length)idx=0;buildChips();render();toTop();return;
  }
  idx=idx===list.length-1?0:idx+1;render();toTop();
}
function goPrev(){
  const now=Date.now();if(now-navAt<300||idx<=0)return;navAt=now;clearTimeout(autoT);
  if(window.__ready)userMoved=true;idx--;render();savePos();toTop();
}
function answer(j){
  if(answered||Date.now()-navAt<300)return;
  const it0=items();if(!list.length||!it0[list[idx]])return;answered=true;
  const it=it0,{c,i,q}=it[list[idx]],id=qid(c,i),ok=j===q.a,before=chap===FAV||chap===HOT?null:chapStat(c).state;
  $("card").querySelectorAll(".opt").forEach(b=>{const n=+b.dataset.j;b.disabled=true;if(n===q.a)b.classList.add("ok");else if(n===j)b.classList.add("no")});
  let e=errs(id);
  if(!ok)e++;else if(chap===HOT&&e>0)e--;
  setRec(id,ok,e);if(!ok){const wk=c.id+"-w",w=rec[wk]&&typeof rec[wk]==="object"?rec[wk]:{};w[i]=((w[i]||"")+"ABCD"[j]).slice(-12);rec[wk]=w}save();markDirty(c.id);
  const card=$("card");card.className="card q "+sev(e);
  const t=$("errt");t.outerHTML=errTag(e);
  const nowDone=before&&before!=="done"&&chapStat(c).state==="done";
  const hotMsg=chap!==HOT?"":ok?(e<2?`<div class="hotmsg out">✅ 錯誤降到 ${e} 次，這題已移出重災區。</div>`:`<div class="hotmsg">錯誤次數扣 1，剩 ${e} 次，再答對 ${e-1} 次就移出重災區。</div>`):`<div class="hotmsg bad">錯誤累計 ${e} 次，繼續留在重災區。</div>`;
  const newHot=chap!==HOT&&!ok&&e===2?`<div class="hotmsg bad">🔥 這題已錯 2 次，自動送進「重災區」。</div>`:"";
  if(ok&&autoNext&&!nowDone){
    $("after").innerHTML=`<div class="quick"><span class="verdict ok">✅ 答對</span><p>⚡ ${q.fl}</p><div class="cd"></div></div>${hotMsg}`;
    stats();grid();buildChips();savePos();
    autoT=setTimeout(()=>goNext(true),800);return;
  }
  $("after").innerHTML=`<div class="panel"><div class="verdict ${ok?"ok":"no"}">${ok?"答對了":"答錯了，正確答案是 "+"ABCD"[q.a]}</div>
   ${hotMsg}${newHot}
   <div class="pi f"><b>⚡ 秒殺反射</b><p>${q.fl}</p></div>
   <div class="pi t"><b>🧠 思考思路</b><p>${q.th}</p></div>
   <div class="pi w"><b>⚠️ 陷阱注意</b><p>${q.tr}</p></div>
   ${nowDone?`<div class="clear"><span class="medal">🏅</span><b>${esc(c.name)} 通關！</b><span>本章題目全部刷完，換下一章吧。</span></div>`:""}</div>`;
  stats();grid();buildChips();savePos();
  if(!ok)setTimeout(()=>{const p=$("after");if(p&&p.getBoundingClientRect().top>innerHeight*.75)p.scrollIntoView({behavior:"smooth",block:"nearest"})},30);
}
function toggleFav(id){
  if(fav.has(id))fav.delete(id);else fav.add(id);saveFav();markDirty("fav");
  const on=fav.has(id),b=$("star");b.setAttribute("aria-pressed",on);b.textContent=on?"★":"☆";b.title=b.ariaLabel=on?"取消收藏":"加入我的最愛";

/* ---------- 匯出錯題給教練 ---------- */
function exportText(){
  const d=new Date(),ds=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  const parts=[];let total=0;
  ORDER.forEach(k=>{if(!BANK[k])return;const sp=[];
    BANK[k].chapters.forEach(c=>{const w=rec[c.id+"-w"]||{};const qs=[];
      c.qs.forEach((q,i)=>{const id=qid(c,i),e=errs(id);if(e<1)return;
        const picks=(typeof w==="object"&&w[i])||"";let common="";
        if(picks){const cnt={};for(const ch of picks)cnt[ch]=(cnt[ch]||0)+1;const top=Object.entries(cnt).sort((x,y)=>y[1]-x[1]);
          common=top.map(([L,n])=>`${L}. ${q.o["ABCD".indexOf(L)]}（${n} 次）`).join("；")}
        qs.push({e,i,q,common})});
      if(!qs.length)return;qs.sort((x,y)=>y.e-x.e||x.i-y.i);
      sp.push(`■ ${c.name}`);
      qs.forEach(({e,i,q,common})=>{total++;
        sp.push(`${total}. 第 ${i+1} 題［錯 ${e} 次${e>=3?"・頑固魔王":e===2?"・高頻死穴":""}］${q.q}`);
        sp.push(`   正確：${"ABCD"[q.a]}. ${q.o[q.a]}`);
        sp.push(`   常錯：${common||"（更新前答錯，未記錄選項）"}`)});
      sp.push("")});
    if(sp.length)parts.push(`【${BANK[k].name}】`,...sp)});
  if(!total)return"";
  return `高業錯題紀錄（${ds} 匯出，共 ${total} 題，依錯誤次數排序）\n\n`+parts.join("\n").trim();
}
function copyText(t){
  return (navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{
    const ta=$("exptext");ta.value=t;ta.focus();ta.select();ta.setSelectionRange(0,t.length);
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}
    if(!ok)throw new Error("manual")});
}
function toast(m,ms){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),ms||1800)}
$("export").onclick=()=>{
  const t=exportText(),box=$("expbox"),ta=$("exptext");
  if(!t){box.hidden=true;toast("目前沒有答錯過的題目 💪");return}
  const n=(t.match(/^\d+\. /mg)||[]).length;
  box.hidden=false;ta.value=t;$("expmsg").textContent="";
  copyText(t).then(()=>{box.hidden=true;toast(`📋 已複製錯題（${n} 題）`)})
    .catch(()=>{$("expmsg").textContent=`瀏覽器不允許自動複製，已全選 ${n} 題，請按「拷貝」（手機長按→拷貝）。`;ta.focus();ta.select();toast("請手動拷貝",2500)});
};
let armT=null;
$("wipe").onclick=()=>{
  const b=$("wipe");
  if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="⚠️ 確定要清除？5 秒內再按一次";clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove("armed");b.textContent="清除所有做題紀錄"},5000);return}

/* ---------- 控制面板：頂部滑出／漢堡抽屜 ---------- */
const bar=$("bar"),burger=$("burger"),scrim=$("scrim");

/* ---------- 盲操：點任意處／鍵盤／滑動 ---------- */
document.addEventListener("click",e=>{
  if(e.target.closest("#bar,#burger,#toast,#gridcard"))return;

let tX=0,tY=0,tT=0;

},{passive:true});

/* ---------- 雲端同步：Google 版用 Apps Script，GitHub 版用私人 Gist ---------- */
const isGoogle=()=>typeof google!=="undefined"&&google.script&&google.script.run;
const GHK="gaoye-gh-v1",GFN="gaoye-progress.json",GDESC="高業刷題進度（gaoye-progress，請勿刪除）";
let gh=ls.get(GHK,null); // {tok,gid,login}
async function ghApi(path,opt){opt=opt||{};
  const r=await fetch("https://api.github.com"+path,{method:opt.method||"GET",cache:"no-store",keepalive:!!opt.keep,
    headers:Object.assign({Authorization:"Bearer "+gh.tok,Accept:"application/vnd.github+json"},opt.body?{"Content-Type":"application/json"}:{}),
    body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok){const er=new Error("HTTP "+r.status);er.status=r.status;throw er}
  return r.status===204?null:r.json()}
async function ghRead(){const g=await ghApi("/gists/"+gh.gid);const f=g.files&&g.files[GFN];if(!f)return{};
  let t=f.content;if(f.truncated)t=await (await fetch(f.raw_url,{cache:"no-store"})).text();try{return JSON.parse(t||"{}")}catch(e){return{}}}
const backend={
  on(){return isGoogle()||!!(gh&&gh.tok&&gh.gid)},
  load(ok,fail){
    if(isGoogle()){google.script.run.withSuccessHandler(ok).withFailureHandler(fail).loadAll();return}
    ghRead().then(d=>ok({data:d})).catch(fail)},
  save(payload,ok,fail){
    if(isGoogle()){google.script.run.withSuccessHandler(ok).withFailureHandler(fail).saveChapters(JSON.stringify(payload));return}
    ghRead().then(d=>{Object.assign(d,payload);return ghApi("/gists/"+gh.gid,{method:"PATCH",keep:true,body:{files:{[GFN]:{content:JSON.stringify(d)}}}})}).then(ok).catch(fail)}
};
const hasServer=()=>backend.on();
let syncTimer=null,syncing=false;
function setSync(t,cls){const el=$("sync");if(el){el.textContent=t;el.className="sync "+(cls||"")}}
function block(ch){if(ch==="fav")return[...fav];if(ch==="pos")return pos||{};const o={},p=ch+"-";for(const k in rec)if(k.startsWith(p))o[k]=rec[k];return o}
function markDirty(ch,quiet){pending[ch]=(pending[ch]||0)+1;savePending();if(!hasServer())return;if(!quiet)setSync("尚未同步","wait");clearTimeout(syncTimer);syncTimer=setTimeout(push,quiet?3000:800)}
function failMsg(er){return er&&er.status===401?"同步密碼失效，請到 ☰ 重新連結":"同步失敗，15 秒後重試"}
function push(){
  if(!hasServer()||syncing)return;const chs=Object.keys(pending);if(!chs.length){setSync("已同步","ok");return}
  const payload={},stamp={};chs.forEach(ch=>{payload[ch]=block(ch);stamp[ch]=pending[ch]});
  syncing=true;setSync("同步中…","wait");
  backend.save(payload,()=>{syncing=false;chs.forEach(ch=>{if(pending[ch]===stamp[ch])delete pending[ch]});savePending();if(Object.keys(pending).length)push();else setSync("已同步","ok")},
    er=>{syncing=false;setSync(failMsg(er),"err");if(er&&er.status===401)return;clearTimeout(syncTimer);syncTimer=setTimeout(push,15000)});
}
let syncHooks=false;
function initSync(){
  ghPanel();
  if(!hasServer()){setSync(isGoogle()?"":"只存在這台裝置","wait");return}
  setSync("讀取雲端紀錄…","wait");
  backend.load(r=>{
      const server=(r&&r.data)||{};
      if(!Object.keys(server).length){Object.keys(rec).forEach(k=>pending[k.replace(/-(\d+|w)$/,"")]=1);if(fav.size)pending.fav=1;if(pos)pending.pos=1}
      const merged={};for(const ch in server){if(ch==="fav"||ch==="pos"||pending[ch])continue;Object.assign(merged,server[ch])}
      for(const ch in pending)if(ch!=="fav"&&ch!=="pos")Object.assign(merged,block(ch));
      if(!pending.fav&&Array.isArray(server.fav))fav=new Set(server.fav);
      rec=merged;save();saveFav();savePending();
      const sp=server.pos&&server.pos.t?server.pos:null;
      if(sp&&(!pos||sp.t>pos.t)&&!userMoved){pos=sp;ls.set(POSKEY,pos);restorePos(pos)}else rebuild(true);
      push()},
    er=>{setSync(er&&er.status===401?"同步密碼失效，請到 ☰ 重新連結":"讀取雲端失敗，先用本機紀錄","err");if(er&&er.status===401)return;clearTimeout(syncTimer);syncTimer=setTimeout(initSync,15000)});
  if(!syncHooks){syncHooks=true;window.addEventListener("pagehide",push);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")push()})}
}
/* GitHub 同步設定面板 */
function ghPanel(){
  const box=$("ghbox");if(!box)return;box.hidden=isGoogle();
  const on=!!(gh&&gh.gid);$("ghon").hidden=!on;$("ghoff").hidden=on;
  if(on)$("ghwho").textContent=gh.login||"GitHub";
}
async function ghConnect(){
  const tok=$("ghtok").value.trim(),msg=$("ghmsg");
  if(!tok){msg.textContent="請先貼上同步密碼。";return}
  msg.textContent="連結中…";gh={tok};
  try{
    const me=await ghApi("/user");let gid="";
    for(let p=1;p<=5&&!gid;p++){const ls2=await ghApi("/gists?per_page=100&page="+p);const hit=ls2.find(g=>g.files&&g.files[GFN]);if(hit)gid=hit.id;if(ls2.length<100)break}
    if(!gid){const g=await ghApi("/gists",{method:"POST",body:{description:GDESC,public:false,files:{[GFN]:{content:"{}"}}}});gid=g.id}
    gh={tok,gid,login:me.login};ls.set(GHK,gh);$("ghtok").value="";msg.textContent="✅ 連結成功，開始同步。";
    initSync();
  }catch(er){gh=null;ls.set(GHK,null);ghPanel();
    msg.textContent=er.status===401?"❌ 同步密碼不對或已過期，請重新產生一組。":er.status===403||er.status===404?"❌ 這組密碼沒有 gist 權限，產生時要勾選 gist。":"❌ 連不到 GitHub，請確認網路。"}
}
if($("ghgo")){
  $("ghgo").onclick=ghConnect;
  $("ghunlink").onclick=()=>{gh=null;ls.set(GHK,null);ghPanel();setSync("只存在這台裝置","wait");$("ghmsg").textContent="已取消連結，紀錄仍保留在這台裝置。"};
}
/* 進度碼：在不同網址的版本之間搬移紀錄 */
if($("pexp")){
  $("pexp").onclick=()=>{
    const code="GAOYE1:"+JSON.stringify({rec,fav:[...fav],pos});const ta=$("pcode");ta.value=code;
    (navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast("📦 進度碼已複製"),()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}toast(ok?"📦 進度碼已複製":"已全選，請手動拷貝",2200)})};
  $("pimp").onclick=()=>{
    const t=$("pcode").value.trim();let d;
    try{if(!t.startsWith("GAOYE1:"))throw 0;d=JSON.parse(t.slice(7))}catch(e){toast("❌ 進度碼格式不對，請整段貼上",2500);return}
    Object.assign(rec,d.rec||{});(d.fav||[]).forEach(x=>fav.add(x));
    if(d.pos&&d.pos.t&&(!pos||d.pos.t>pos.t))pos=d.pos;
    save();saveFav();ls.set(POSKEY,pos);
    Object.keys(rec).forEach(k=>markDirty(k.replace(/-(\d+|w)$/,""),true));markDirty("fav",true);markDirty("pos",true);
    $("pcode").value="";closeBar();if(!restorePos(pos))rebuild();
    toast(`✅ 已匯入 ${Object.keys(d.rec||{}).filter(k=>!k.endsWith("-w")).length} 題紀錄`,2500);
  };
}
let userMoved=false;
["tabs","chips","lvTabs","grid","card"].forEach(id=>$(id).addEventListener("click",()=>{if(window.__ready)userMoved=true},true));

chap=chapters().find(c=>c.qs.length).id;
buildTabs();
if(!restorePos(pos))rebuild();
window.__ready=true;initSync();
