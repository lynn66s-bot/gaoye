"待分配股票股利是權益；處分資產利益是營業外收入；收到股票股利不認列收入，只增加股數。"}, {"src": "11401-32", "f": 2, "s": "114-1", "tag": "庫藏股", "q": "公司購入庫藏股，對其每股盈餘與權益有何影響？", "o": ["兩者皆增加", "兩者皆減少", "沒有影響", "前者增加，後者減少"], "a": 3, "fl": "買庫藏股 ➔ EPS 增加、權益減少。", "th": "流通股數變少，EPS 分母變小所以變大；付現金買回，權益減少。", "tr": "不要以為股數少了 EPS 就一起變少。"}, {"src": "11303-12", "f": 2, "s": "113-3", "x": 1, "tag": "權益變動", "q": "豪景公司 X1 年底之流動比率為 1.3，負債比率為 0.375。流動資產為$1,000,000，總資產為 $4,000,000。若該公司 X1 年之淨利為$750,000 並曾宣告$250,000 之現金股利、$250,000 之股票股利，且無其他影響權益之交易，則該公司 X1 年初之權益金額為：", "o": ["$1,750,000", "$2,000,000", "$2,250,000", "$2,500,000"], "a": 1, "fl": "期初權益 ＝ 期末權益 − 淨利 ＋ 現金股利（股票股利不影響）。", "th": "負債 = 4,000,000 × 0.375 = 1,500,000，期末權益 2,500,000。本期增加 750,000 − 250,000 = 500,000，期初 = 2,000,000。", "tr": "股票股利 250,000 只是權益內部移轉，不能扣。"}, {"src": "11302-27", "f": 2, "s": "113-2", "tag": "保留盈餘", "q": "下列何者分錄與保留盈餘有關？", "o": ["宣告發放現金股利", "實際發放現金股利", "宣告作股票分割", "實際作股票分割"], "a": 0, "fl": "宣告現金股利 ➔ 借保留盈餘。", "th": "宣告日：借保留盈餘、貸應付股利。發放日：借應付股利、貸現金，不碰保留盈餘。", "tr": "「實際發放」那天保留盈餘已經減過了。股票分割完全不用分錄。"}, {"src": "11302-34", "f": 2, "s": "113-2", "tag": "特別股", "q": "立力公司有 35,000 股普通股流通在外，發行面額為$10。另有按面額$100 發行之 5%累積特別股 5,000 股流通在外。立力公司過去四年及今年皆未發放股利，若本年度預宣告發放 $100,000 之股利，則今年底分配給特別股之股利是多少？", "o": ["$150,000", "$125,000", "$360,000", "$100,000"], "a": 3, "fl": "宣告多少就發多少 ➔ 先滿足累積特別股，最多 100,000。", "th": "每年特別股股利 5,000 × 100 × 5% = 25,000，積欠 4 年加今年共 125,000，但公司只宣告 100,000，全部給特別股還不夠。", "tr": "B 的 125,000 是應得數，不是實際能分到的。"}, {"src": "11001-48", "f": 2, "s": "113-1", "tag": "權益項目", "q": "下列何者不屬於權益項目？", "o": ["股本", "應付現金股利", "保留盈餘", "資本公積"], "a": 1, "fl": "應付現金股利 ➔ 負債，不是權益。", "th": "宣告現金股利後公司就欠股東錢，變成流動負債。", "tr": "股本、保留盈餘、資本公積都是權益。"}, {"src": "11301-8", "f": 2, "s": "113-1", "tag": "權益項目", "q": "下列何者非為權益項目？", "o": ["庫藏股", "特別盈餘公積", "償債基金", "保留盈餘"], "a": 2, "fl": "償債基金 ➔ 資產（存起來還債的錢）。", "th": "償債基金是為了還公司債提撥的資金，屬於非流動資產。", "tr": "庫藏股是權益的減項，仍在權益區；特別盈餘公積也是權益。"}, {"src": "11301-36", "f": 2, "s": "113-1", "tag": "庫藏股", "q": "下列敘述何者正確？", "o": ["庫藏股交易可能減少淨利但不可能增加淨利", "庫藏股交易可能減少保留盈餘但不可能增加保留盈餘", "購入庫藏股並不影響每股盈餘", "成本法下買回庫藏股將使法定資本減少"], "a": 1, "fl": "庫藏股交易 ➔ 只可能減少保留盈餘，不可能增加。", "th": "賣庫藏股賺錢記資本公積；賠錢先沖資本公積，不夠才沖保留盈餘。所以保留盈餘只會減不會增。", "tr": "庫藏股交易「不影響」淨利；買回庫藏股會讓 EPS 上升。"}, {"src": "11301-18", "f": 2, "s": "113-1", "tag": "每股帳面", "q": "請由以下通宵企業的財務資料，計算出該企業普通股的每股權益帳面金額：總資產$250,000、淨值 $170,000、普通股股本$50,000（5,000 股）、特別股股本$10,000（1,000 股）", "o": ["$34", "$30", "$24", "$32"], "a": 3, "fl": "普通股每股帳面 ＝（淨值 − 特別股）÷ 普通股股數。", "th": "(170,000 − 10,000) ÷ 5,000 = 32 元。", "tr": "直接用 170,000 ÷ 5,000 = 34 會選 A。"}, {"src": "11301-35", "f": 2, "s": "113-1", "tag": "資本公積", "q": "股票發行溢價列為：", "o": ["負債", "資產之減項", "權益", "利益"], "a": 2, "fl": "股票發行溢價 ➔ 權益（資本公積）。", "th": "股東多付的錢也是股東投入的資本，列在權益。", "tr": "不是利益，不能進損益表。"}, {"src": "11203-24", "f": 2, "s": "112-3", "tag": "股利支付率", "q": "普通股市價下降，其股利支付率將：（假設其他一切條件不變）", "o": ["不變", "不一定", "上升", "下降"], "a": 0, "fl": "股利支付率 ＝ 每股股利 ÷ EPS ➔ 跟股價無關。", "th": "公式裡沒有股價，市價怎麼變都不影響。", "tr": "受股價影響的是「股利收益率」，別搞混。"}, {"src": "11201-23", "f": 2, "s": "112-1", "tag": "庫藏股", "q": "由經濟的角度來看，公司購買自己的股票最像：", "o": ["發行新股", "支付股票股利", "支付現金股利", "股票分割"], "a": 2, "fl": "公司買回自己股票 ➔ 經濟上像發現金股利。", "th": "兩者都是公司把現金還給股東，公司資產和權益一起減少。", "tr": "股票股利和股票分割都沒有現金流出。"}, {"src": "11103-20", "f": 2, "s": "111-3", "tag": "股利", "q": "仁德公司的股利分配率預定為 40%，EPS＝8 元，則其每股現金股利將為何？", "o": ["6.4 元", "1.6 元", "0.4 元", "3.2 元"], "a": 3, "fl": "每股股利 ＝ EPS × 股利分配率。", "th": "8 × 40% = 3.2 元。", "tr": "B 的 1.6 是用 20% 算的，A 的 6.4 是用 80% 算的。"}, {"src": "11103-39", "f": 2, "s": "111-3", "tag": "股利收益率", "q": "某上市的公司之股價為 780 元，每股股利為 13 元，請計算公司的股利收益率為何？", "o": ["16.70%", "12.90%", "1.67%", "1.28%"], "a": 2, "fl": "股利收益率 ＝ 每股股利 ÷ 股價。", "th": "13 ÷ 780 = 1.67%。", "tr": "A 的 16.70% 小數點錯一位。"}, {"src": "11101-14", "f": 2, "s": "111-3", "tag": "股利支付率", "q": "某公司之股價為 100 元，每股現金股利為 3 元，每股盈餘為 5 元，股利支付率為何？", "o": ["50%", "60%", "75%", "80%"], "a": 1, "fl": "股利支付率 ＝ 每股股利 ÷ EPS。", "th": "3 ÷ 5 = 60%。", "tr": "股價 100 元是干擾；用股價會算出股利收益率 3%。"}, {"src": "11101-31", "f": 2, "s": "111-1", "tag": "庫藏股", "q": "下列敘述何者正確？", "o": ["庫藏股交易可能減少但不會增加保留盈餘", "庫藏股交易可能減少但不會增加資本公積", "庫藏股交易可能減少但不會增加本期淨利", "庫藏股成本應列為保留盈餘之加項"], "a": 0, "fl": "庫藏股交易 ➔ 保留盈餘只減不增。", "th": "賣價高於成本記資本公積，低於成本先沖資本公積再沖保留盈餘。", "tr": "資本公積可能增加也可能減少；庫藏股成本是權益的減項，不是保留盈餘的加項。"}, {"src": "11502-43", "f": 1, "s": "115-2", "tag": "每股帳面", "q": "股本$1,000,000，股本溢價$400,000，法定盈餘公積$100,000，未分配盈餘$500,000，若股票有 15,000 股，則每股帳面金額？", "o": ["$103.33", "$113.33", "$123.33", "$133.33"], "a": 3, "fl": "每股帳面 ＝ 權益總額 ÷ 股數。", "th": "1,000,000 + 400,000 + 100,000 + 500,000 = 2,000,000，÷ 15,000 = 133.33。", "tr": "漏加法定盈餘公積會算出 126.67。"}, {"src": "11502-36", "lv": "a", "f": 1, "s": "115-2", "tag": "股利", "q": "某企業每股面額為 X 元，今年宣布發放 X 元股票股利，下列敘述何者為真？", "o": ["公司的核定股本會增加一倍", "股票的面額會等比例往下調整", "除權後每股市價不會改變", "全體股東持有的總股數會增加一倍"], "a": 3, "fl": "發放面額 100% 的股票股利 ➔ 股數加倍。", "th": "每股面額 X 元又發 X 元股票股利，等於每 1 股配 1 股，持股數變兩倍。", "tr": "核定股本不會自動增加；面額不變；除權後股價會下跌。"}, {"src": "11501-10", "lv": "a", "f": 1, "s": "115-1", "tag": "股本", "q": "普通股發行股數與每股面額之乘積為：", "o": ["保留盈餘", "資本公積", "普通股股本", "權益總數"], "a": 2, "fl": "股數 × 面額 ➔ 股本。", "th": "發行價格超過面額的部分才是資本公積。", "tr": "資本公積是溢價部分，不是股數乘面額。"}, {"src": "11403-16", "lv": "a", "f": 1, "s": "114-3", "tag": "保留盈餘", "q": "下列何種事項不會造成保留盈餘減少？", "o": ["前期折舊費用低估之錯誤更正", "本期淨損", "宣告分配股票股利", "公司分配清算股利"], "a": 3, "fl": "清算股利 ➔ 退還股本（沖資本），不減保留盈餘。", "th": "清算股利是把股東投入的資本還回去，借記資本公積或股本。", "tr": "前期折舊低估、淨損、股票股利都會讓保留盈餘減少。"}, {"src": "11403-9", "lv": "a", "f": 1, "s": "114-3", "tag": "股利", "q": "下列何者非為宣告並發放股票股利之影響？", "o": ["流通在外股數增加", "保留盈餘減少", "資本公積增加", "資產總額減少"], "a": 3, "fl": "股票股利 ➔ 資產總額不變。", "th": "股票股利不付現，股數增加、保留盈餘轉到股本和資本公積，資產沒有變動。", "tr": "選「非影響」的那個。"}, {"src": "11403-39", "lv": "a", "f": 1, "s": "114-3", "x": 1, "tag": "保留盈餘", "q": "甲公司X2年初流通在外普通股為1,000,000股，每股面額$10，X2年4月1日發放10%股票股利，X2年7月1日買入庫藏股150,000股，每股成本$20，X2年9月1日出售庫藏股60,000股，每股售價$22。甲公司於X2年12月20日宣告現金股利，每股$1.4，該現金股利於X3年1月 30日支付給股東。上述交易使甲公司X2年保留盈餘減少多少金額？", "o": ["$0", "$1,000,000", "$1,414,000", "$2,414,000"], "a": 3, "fl": "保留盈餘減少 ＝ 股票股利 ＋ 現金股利；賣庫藏股賺錢不碰保留盈餘。", "th": "股票股利 100,000 股 × 10 = 1,000,000。宣告現金股利時流通股數 1,100,000 − 150,000 + 60,000 = 1,010,000，× 1.4 = 1,414,000。合計 2,414,000。", "tr": "現金股利以宣告日認列，雖然隔年才付；用 1,000,000 股算會選 C。"}, {"src": "11403-10", "lv": "a", "f": 1, "s": "114-3", "tag": "資本公積", "q": "受領股東贈與之資產在財務報表上應如何表達？", "o": ["按成本列為資產", "按取得時公允價值列為資產", "不必入帳僅附註說明", "按成本列為營業外收入"], "a": 1, "fl": "股東贈與資產 ➔ 以公允價值列資產（貸資本公積）。", "th": "沒有付出成本，就用取得時的公允價值入帳，屬於股東投入的資本。", "tr": "不是營業外收入，也不能不入帳。"}, {"src": "11402-20", "lv": "a", "f": 1, "s": "114-2", "tag": "保留盈餘", "q": "下列敘述何者正確？", "o": ["保留盈餘帳戶中的金額，即當年度損益表上之淨利結轉數", "公司處分設備的損益應以稅後淨額列於損益表的繼續營業單位損益之下", "前期損益調整會使保留盈餘產生增減變動", "企業每年度至少要發放某種股利一次，虧損的公司才會發放股票股利"], "a": 2, "fl": "前期損益調整 ➔ 直接調保留盈餘。", "th": "發現以前年度的錯誤，不進本期損益，直接調整期初保留盈餘。", "tr": "保留盈餘是歷年累積，不是當年淨利；處分設備損益不是稅後列示。"}, {"src": "11402-18", "lv": "a", "f": 1, "s": "114-2", "tag": "求償順序", "q": "在企業面臨清算時，財產求償權較優先者為何？", "o": ["存託憑證（DR）持有人", "特別股股東", "普通股股東", "債權人"], "a": 3, "fl": "清算求償 ➔ 債權人最優先。", "th": "順序：債權人 → 特別股 → 普通股（存託憑證本質上也是股票）。", "tr": "特別股優先於普通股，但仍在債權人之後。"}, {"src": "11401-48", "lv": "a", "f": 1, "s": "114-1", "x": 1, "tag": "權益變動", "q": "台南公司 X1 年初成立，發生下列與股票發行相關交易：年初以現金每股$30 發行 20,000 股；年中發行 10,000 股，取得土地市價$400,000；以每股$20 取得 1,000 股庫藏股。X1 年淨利 $90,000，發放股利$10,000。公司股票每股面額$10，請問該公司年底下列金額，何者不正確？", "o": ["年底股本$300,000", "年底資本公積$700,000", "年底保留盈餘$80,000", "年底權益$1,080,000"], "a": 3, "fl": "年底權益 ＝ 股本 ＋ 資本公積 ＋ 保留盈餘 − 庫藏股。", "th": "股本 30,000 股 × 10 = 300,000；資本公積 400,000 + 300,000 = 700,000；保留盈餘 90,000 − 10,000 = 80,000；庫藏股 20,000。權益 = 1,060,000，D 寫 1,080,000 不對。", "tr": "選「不正確」的；最常忘記扣庫藏股 20,000。"}, {"src": "11401-23", "lv": "a", "f": 1, "s": "114-1", "x": 1, "tag": "負債比率", "q": "某公司僅發行一種股票，X1 年每股盈餘$10，每股股利$5，除淨利與發放股利之結果使保留盈餘增加$200,000 外，權益無其他變動。若 X1 年底每股帳面金額$30，負債總額$1,200,000，則負債比率為何？", "o": ["60%", "57.14%", "75%", "50%"], "a": 3, "fl": "先用保留盈餘增加數倒推股數，再算權益和負債比率。", "th": "每股保留 10 − 5 = 5 元，200,000 ÷ 5 = 40,000 股。權益 = 40,000 × 30 = 1,200,000，負債 1,200,000，負債比率 = 1,200,000 ÷ 2,400,000 = 50%。", "tr": "分母是總資產（負債＋權益），用權益當分母會算出 100%。"}];
const FA6=[{"src": "11501-44", "f": 4, "s": "115-1", "tag": "毛利率", "q": "甲公司去年度銷貨毛額為 700 萬元，銷貨退回 50 萬元，已知其期初存貨與期末存貨皆為 110 萬元，本期進貨 300 萬元，另有銷售費用 50 萬元，管理費用 62 萬元，銷貨折扣 50 萬元，請問其銷貨毛利率是多少？", "o": ["30%", "40%", "50%", "60%"], "a": 2, "fl": "銷貨淨額 ＝ 毛額 − 退回 − 折扣；期初期末存貨相同，銷貨成本 ＝ 進貨。", "th": "銷貨淨額 700 − 50 − 50 = 600 萬，銷貨成本 300 萬，毛利 300 萬，毛利率 50%。", "tr": "銷售費用、管理費用是干擾；忘了扣銷貨折扣會算出約 46%。"}, {"src": "11402-16", "f": 4, "s": "114-2", "x": 1, "tag": "營業利益", "q": "公司去年度進貨成本為 280 萬元，期末存貨比期初存貨少了 40 萬元，該公司的銷貨毛利為銷貨的 20%，銷售費用為 20 萬元，一般管理費用為 20 萬元，利息費用為 20 萬元，利息收入為 10 萬元，請問去年度該公司的營業利益為多少？", "o": ["50 萬元", "40 萬元", "30 萬元", "20 萬元"], "a": 1, "fl": "銷貨成本 ＝ 進貨 ＋ 存貨減少；銷貨 ＝ 銷貨成本 ÷（1 − 毛利率）；營業利益不含利息。", "th": "銷貨成本 = 280 + 40 = 320 萬，銷貨 = 320 ÷ 80% = 400 萬，毛利 80 萬，扣銷售費用 20、管理費用 20，營業利益 40 萬。", "tr": "利息費用、利息收入是營業外，算進去會選 C 的 30 萬。"}, {"src": "11103-14", "f": 4, "s": "114-2", "tag": "銷貨收入", "q": "某公司去年度淨進貨 200 萬元，進貨運費 60 萬元，期末存貨比期初存貨多出 50 萬元，該公司的銷貨毛利為銷貨的 25%，營業費用有 20 萬元，問去年度該公司的銷貨收入為多少？", "o": ["200 萬元", "262.5 萬元", "280 萬元", "300 萬元"], "a": 2, "fl": "銷貨成本 ＝ 淨進貨 ＋ 進貨運費 − 存貨增加；再除以（1 − 毛利率）。", "th": "200 + 60 − 50 = 210 萬，210 ÷ 75% = 280 萬。", "tr": "期末存貨「多」，表示有貨沒賣掉，要減；營業費用 20 萬是干擾。"}, {"src": "11502-21", "f": 3, "s": "115-2", "tag": "淨利", "q": "民雄公司去年底財務報表上列有銷貨毛利 6,000 萬元，營業費用 1,000 萬元，營業外收入 200 萬元，營業外費用 2,000 萬元，遞延所得稅 1,000 萬元，所得稅費用 500 萬元，則其稅後淨利為：", "o": ["2,700 萬元", "1,700 萬元", "2,300 萬元", "3,200 萬元"], "a": 0, "fl": "稅後淨利 ＝ 毛利 − 營業費用 ＋ 營業外收入 − 營業外費用 − 所得稅費用。", "th": "6,000 − 1,000 + 200 − 2,000 = 3,200 萬，扣所得稅費用 500 萬 = 2,700 萬。", "tr": "遞延所得稅 1,000 萬已經包含在所得稅費用裡，不能再扣一次。"}, {"src": "11502-39", "f": 3, "s": "115-2", "tag": "會計錯誤", "q": "甲公司於 20X4 年期初存貨為$50,000，期末存貨為$0，會計人員誤將當年度進貨運費$100,000 認列為銷貨運費，則此項錯誤對 20X4 年度損益造成的影響為何？(不考慮所得稅)", "o": ["銷貨毛利少計$100,000", "銷貨成本多計$50,000", "營業費用少計$100,000", "無影響"], "a": 3, "fl": "期末存貨 0、費用分類錯 ➔ 淨利不受影響。", "th": "進貨運費應列銷貨成本，被列成銷貨運費（營業費用），期末沒存貨，全部成本都進當期，所以總損益不變。", "tr": "毛利其實是「多計」，A 寫少計也錯；題目問損益，答無影響。"}, {"src": "11402-39", "f": 3, "s": "114-2", "tag": "營業外損益", "q": "可轉換公司債提前清償所產生之損益應列為：", "o": ["營業損益", "營業外損益", "保留盈餘之調整", "銷貨成本"], "a": 1, "fl": "可轉債提前清償損益 ➔ 營業外損益。", "th": "跟一般公司債提前清償一樣，屬於非主要營業活動。", "tr": "不是保留盈餘調整，也不是銷貨成本。"}, {"src": "11402-1", "f": 3, "s": "114-2", "tag": "所得稅", "q": "奈川公司 111 年度申報所得稅時有營業虧損$30,000，若該公司以前年度皆無虧損且預估 112 年度課稅所得將大於$30,000，則於 111 年底可認列何種項目？", "o": ["應收退稅款", "遞延所得稅資產", "預付 111 年度所得稅", "不能認列任何資產"], "a": 1, "fl": "虧損可扣抵未來所得 ➔ 遞延所得稅資產。", "th": "今年虧損，以後賺錢時可以拿來抵稅，未來少繳的稅就是遞延所得稅資產。", "tr": "不是應收退稅款，也不是預付所得稅。"}, {"src": "11303-18", "f": 3, "s": "113-3", "tag": "損益結構", "q": "下列何者不影響毛利率，但使稅前淨利率下降？", "o": ["認列存貨跌價損失", "提高產品售價", "認列機器處分利益", "認列較高的廣告費用"], "a": 3, "fl": "毛利不變、稅前淨利下降 ➔ 營業費用增加（廣告費）。", "th": "廣告費是營業費用，在毛利下面才扣，所以毛利率不動、稅前淨利率下降。", "tr": "存貨跌價損失列銷貨成本，會動到毛利率；處分利益會讓淨利上升。"}, {"src": "11303-2", "f": 3, "s": "113-3", "tag": "收入認列", "q": "下列收入認列的順序何者正確？甲、決定交易價格；乙、辨認合約中之履約義務；丙、將交易價格分攤至合約中之履約義務；丁、於滿足履約義務時認列收入；戊、辨認客戶合約：", "o": ["乙→戊→甲→丙→丁", "戊→乙→甲→丙→丁", "甲→乙→丙→戊→丁", "甲→戊→乙→丙→丁"], "a": 1, "fl": "五步驟 ➔ 合約 → 履約義務 → 交易價格 → 分攤 → 認列。", "th": "先確認有合約（戊），再找出要做哪些事（乙），決定總價（甲），把價格分給每件事（丙），做完一件認列一件（丁）。", "tr": "記口訣「合、履、價、分、認」。"}, {"src": "11303-19", "f": 3, "s": "113-3", "tag": "營業外損益", "q": "企業提前清償公司債所造成的損益，在綜合損益表中的報導方式為：", "o": ["列為營業費用的調整項目，因為這是營業活動之一", "列為營業外損益，因為這不是主要營業項目", "列為營業淨利的調整項目，因為會計原則的規定如此", "因為其性質特殊且不常發生，應以稅後淨額表達，列於停業單位損益之下"], "a": 1, "fl": "提前清償公司債損益 ➔ 營業外損益。", "th": "還債不是公司主要營業活動，損益列營業外。", "tr": "IFRS 沒有非常損益，也不是停業單位。"}, {"src": "11502-19", "f": 2, "s": "115-2", "tag": "淨利", "q": "大林公司去年度的銷貨毛利為 2,000 萬元，毛利率為 20%，稅前純益率為 10%，企業的所得稅率為 17%，該公司去年度的淨利為：", "o": ["622.5 萬元", "102 萬元", "124.5 萬元", "830 萬元"], "a": 3, "fl": "銷貨 ＝ 毛利 ÷ 毛利率；淨利 ＝ 銷貨 × 稅前純益率 ×（1 − 稅率）。", "th": "銷貨 = 2,000 ÷ 20% = 10,000 萬，稅前 1,000 萬，稅後 1,000 × 83% = 830 萬。", "tr": "直接拿毛利 × 10% 會得到錯的數字。"}, {"src": "11501-17", "f": 2, "s": "115-1", "tag": "銷貨成本", "q": "某公司帳上期初存貨$150,000，期末盤點時剩下$100,000，已知本期淨進貨共$100,000，進貨折扣共 $1,000，進貨運費共$2,000，銷貨運費共$3,000，銷貨收入共$300,000，請問該公司本期的銷貨成本應為多少？", "o": ["$210,000", "$151,000", "$90,000", "$120,000"], "a": 1, "fl": "銷貨成本 ＝ 期初 ＋ 進貨（− 折扣 ＋ 進貨運費）− 期末。", "th": "150,000 + 100,000 − 1,000 + 2,000 − 100,000 = 151,000。", "tr": "銷貨運費 3,000 是營業費用，不算銷貨成本。"}, {"src": "11402-46", "f": 2, "s": "114-2", "tag": "毛利率", "q": "本年度銷貨收入$1,005,000，銷貨退回$5,000，銷貨成本$600,000，銷貨毛利率為：", "o": ["19.9%", "35.0%", "30.0%", "40.0%"], "a": 3, "fl": "毛利率 ＝（銷貨淨額 − 銷貨成本）÷ 銷貨淨額。", "th": "銷貨淨額 1,005,000 − 5,000 = 1,000,000，毛利 400,000，毛利率 40%。", "tr": "分母要用扣掉退回後的淨額。"}, {"src": "11402-17", "f": 2, "s": "114-2", "tag": "會計錯誤", "q": "某公司的會計人員發現去年度有一筆$50,000 文具用品費用誤記為水電費用，請問這項錯誤的更正會：", "o": ["影響本期淨利", "不影響本期淨利，但影響前期損益", "不影響本期淨利，也不影響前期損益或保留盈餘", "不影響本期淨利，但影響保留盈餘"], "a": 2, "fl": "費用科目之間互記錯 ➔ 不影響淨利，也不影響保留盈餘。", "th": "文具費和水電費都是費用，總費用不變，淨利不變，只要重新分類就好。", "tr": "看到「去年度錯誤」就想到調整保留盈餘，這題不用。"}, {"src": "11402-44", "f": 2, "s": "114-2", "tag": "營業外損益", "q": "泰偉公司在 111 年因泰銖貶值發生未實現匯兌利得(Unrealized Foreign Exchange Gains)5,000 萬元，其影響為：", "o": ["銷貨毛利會增加", "營業費用會減少", "營業外收入會增加", "選項(A)(B)(C)皆非"], "a": 2, "fl": "匯兌利得 ➔ 營業外收入。", "th": "匯率變動不是本業賺的錢，列營業外收入。", "tr": "不影響毛利，也不會減少營業費用。"}, {"src": "11401-10", "f": 2, "s": "114-1", "tag": "損益表項目", "q": "下列會計項目何者不得列報於綜合損益表作為本期淨利之一部分？", "o": ["非常損失", "財務成本", "停業單位損失", "除列按攤銷後成本衡量之金融資產淨損益"], "a": 0, "fl": "IFRS 禁止 ➔ 非常損失。", "th": "IFRS 不允許在損益表單獨列「非常項目」。財務成本、停業單位損益、除列攤銷後成本金融資產損益都要列。", "tr": "停業單位損失還是要列，只是單獨表達。"}, {"src": "11303-33", "f": 2, "s": "113-3", "tag": "會計錯誤", "q": "泰山公司於 111 年第一季末發現 110 年底存貨低列了$500,000，已知該公司適用的稅率均為 20%，則：", "o": ["110 年度損益表應予重編，增加銷貨成本$500,000 及減少所得稅費用$100,000", "110 年度損益表應予重編，直接調整淨利$400,000", "111 年第一季的期初保留盈餘金額應調整增加$400,000", "110 年度的錯誤會在 111 年度自動抵銷，故不需任何調整"], "a": 2, "fl": "去年期末存貨低列 ➔ 去年淨利低估，今年調增期初保留盈餘（稅後）。", "th": "存貨少 500,000，去年銷貨成本多算 500,000，稅後淨利少 400,000。發現時直接調增期初保留盈餘 400,000。", "tr": "「會自動抵銷」是兩年後的事，發現時還是要更正。"}, {"src": "11303-46", "f": 2, "s": "113-3", "tag": "營業費用", "q": "新隆工業財務報表的營業費用包含銷售費用與一般管理費用兩大項，以下那一個部門的費用最有可能被列在一般管理費用項下？", "o": ["打光工程組", "出納科", "工程品管課", "工業工程課"], "a": 1, "fl": "一般管理費用 ➔ 行政部門（出納科）。", "th": "出納管錢，屬行政管理部門。打光、品管、工業工程都是生產相關，列製造成本。", "tr": "四個選項都是部門名稱，挑「最不像工廠」的那個。"}, {"src": "11302-7", "f": 2, "s": "113-2", "tag": "所得稅", "q": "紐約公司 109 年度帳列稅前盈餘為$1,400,000，其中包括免稅利息收入$300,000，該公司另可享受$100,000 之投資抵減。假設所得稅率為 20%，則紐約公司 109 年度之有效稅率（Effective Tax Rate）為：", "o": ["33.33%", "30.91%", "40.00%", "8.57%"], "a": 3, "fl": "有效稅率 ＝ 應納稅額 ÷ 帳列稅前盈餘。", "th": "課稅所得 1,400,000 − 300,000 = 1,100,000，稅額 220,000，扣投資抵減 100,000 = 120,000。120,000 ÷ 1,400,000 = 8.57%。", "tr": "分母用帳列稅前盈餘 1,400,000，不是課稅所得 1,100,000。"}, {"src": "11201-39", "f": 2, "s": "112-1", "tag": "營業成本", "q": "泰安企業一年的採購經費是 5 億元，透過網際網路進行採購，可以輕鬆省下 1,000 萬元。也就是說，網際網路採購服務，可以幫助降低泰安企業的：", "o": ["營業成本", "研究發展費用", "折舊費用", "推銷費用"], "a": 0, "fl": "採購費用降低 ➔ 營業成本降低。", "th": "採購的是原料商品，省下的錢反映在銷貨成本（營業成本）。", "tr": "推銷費用是賣東西的費用，不是買東西。"}, {"src": "11103-4", "f": 2, "s": "111-3", "x": 1, "tag": "營業淨利率", "q": "馬祖公司 X9 年度進貨$7,000,000，進貨運費為$1,000,000，X9 年底期末存貨比期初存貨多 $2,000,000，銷貨毛利率為 60%，營業費用合計$3,000,000。馬祖公司 X9 年度營業淨利率為：", "o": ["25%", "30%", "35%", "40%"], "a": 3, "fl": "銷貨成本 → 銷貨 → 毛利 → 營業淨利 → 除以銷貨。", "th": "銷貨成本 = 7,000,000 + 1,000,000 − 2,000,000 = 6,000,000；銷貨 = 6,000,000 ÷ 40% = 15,000,000；毛利 9,000,000，扣營業費用 3,000,000 = 6,000,000；6,000,000 ÷ 15,000,000 = 40%。", "tr": "毛利率 60%，銷貨成本率是 40%，不要直接用 60% 去除。"}, {"src": "11501-20", "f": 1, "s": "115-1", "tag": "銷貨成本", "q": "某公司的稅後淨利為 60 萬元，已知銷貨毛利率為 35%，純益率為（稅後淨利率）15%，請問該公司的銷貨成本為多少？", "o": ["260 萬元", "280 萬元", "480 萬元", "300 萬元"], "a": 0, "fl": "銷貨 ＝ 淨利 ÷ 淨利率；銷貨成本 ＝ 銷貨 ×（1 − 毛利率）。", "th": "60 ÷ 15% = 400 萬，400 × 65% = 260 萬。", "tr": "用毛利率 35% 去乘會算出毛利 140 萬，不是成本。"}, {"src": "11502-41", "lv": "a", "f": 1, "s": "115-2", "tag": "營業槓桿", "q": "甲公司去年度的銷售金額$40,000,000，其毛利率為 40%，若今年度估計銷售金額將成長 10%，其它毛利率及成本費用數字均不變，則其稅後淨利率有何變化？", "o": ["將成長 10%", "將成長 4%", "成長將大於 10%", "成長將小於 10%"], "a": 2, "fl": "有固定成本、營收成長 10% ➔ 淨利成長大於 10%。", "th": "成本中有一部分是固定的，營收增加時固定成本不跟著漲，淨利成長幅度會超過營收成長幅度。", "tr": "這就是營業槓桿效果；以為淨利照比例成長 10% 會選 A。"}, {"src": "11501-46", "lv": "a", "f": 1, "s": "115-1", "tag": "每股盈餘", "q": "公司的每股盈餘會因下列何種情事而下降？", "o": ["結清應付帳款", "認列處分房屋損失", "銷貨收入上升", "減少現金股利發放"], "a": 1, "fl": "EPS 下降 ➔ 認列損失。", "th": "處分房屋損失讓淨利減少，EPS 跟著降。", "tr": "還應付帳款不影響損益；少發現金股利也不影響 EPS。"}, {"src": "11501-19", "lv": "a", "f": 1, "s": "115-1", "tag": "折舊", "q": "四海企業刻意多提列生產部門機器設備的折舊費用，其影響是：", "o": ["總資產增加", "營業活動所造成現金流量減少", "毛利率降低", "營運資金減少"], "a": 2, "fl": "生產設備折舊 ➔ 製造成本 ➔ 毛利率下降。", "th": "生產部門的折舊算進銷貨成本，多提就讓毛利率降低。", "tr": "折舊不用付現，不影響營業現金流量；資產會減少，不是增加。"}, {"src": "11403-5", "lv": "a", "f": 1, "s": "114-3", "tag": "收入認列", "q": "下列何者不是企業與客戶訂定合約時依 IFRS15 認列收入之必要條件？", "o": ["該合約具商業實質", "移轉之商品生產完成可供出售", "企業對移轉之商品或勞務能辨認付款條件", "企業能辨別每一方對將移轉之商品或勞務之權利"], "a": 1, "fl": "IFRS 15 合約條件 ➔ 不包括「商品已生產完成」。", "th": "合約要具商業實質、各方權利可辨認、付款條件可辨認、雙方已核准。商品有沒有做好不是條件。", "tr": "選「不是」條件的那個。"}, {"src": "11403-36", "lv": "a", "f": 1, "s": "114-3", "tag": "銷貨成本", "q": "下列哪一項不算在銷貨成本當中？", "o": ["公司生產機器設備所購買的保險", "企業生產部門廠長的年薪", "企業零售店面的折舊費用", "工廠廠房的租金"], "a": 2, "fl": "零售店面折舊 ➔ 推銷費用，不是銷貨成本。", "th": "生產用的保險、廠長薪水、廠房租金都算製造成本；賣東西的店面算營業費用。", "tr": "看「生產」還是「銷售」部門就能分。"}, {"src": "11403-25", "lv": "a", "f": 1, "s": "114-3", "tag": "經營績效", "q": "相對而言，下列哪一項目較適合用來評估一個企業的經營績效？", "o": ["每股盈餘金額", "淨利率", "營業利益率", "毛利率"], "a": 2, "fl": "評估本業經營績效 ➔ 營業利益率。", "th": "營業利益只看本業，排除了營業外和稅的影響，最能看出經營好壞。", "tr": "淨利率和 EPS 會被營業外損益影響；毛利率還沒扣營業費用。"}, {"src": "11403-38", "lv": "a", "f": 1, "s": "114-3", "tag": "匯兌損益", "q": "莎拉公司除了一筆 1 億美元的海外公司債，其他資產負債都是以新臺幣為收付標的，其功能性貨幣也是新臺幣，如果某年度新臺幣（對美元）升值，則莎拉公司會有：", "o": ["利息收入增加", "利息費用減少", "匯兌利得", "匯兌損失"], "a": 2, "fl": "欠美元、新臺幣升值 ➔ 要還的臺幣變少 ➔ 匯兌利得。", "th": "美元負債折成新臺幣後變少，負債減少就是利得。", "tr": "利息費用不變，要看的是本金的換算。"}, {"src": "11402-47", "lv": "a", "f": 1, "s": "114-2", "tag": "營業外損益", "q": "綜合損益表之營業外（或其他）收入與損失不包括下列何項目？", "o": ["利息費用", "出售不動產、廠房及設備利益", "股利收入", "推銷費用"], "a": 3, "fl": "推銷費用 ➔ 營業費用，不是營業外。", "th": "利息費用、處分利益、股利收入都是營業外；推銷費用是本業的營業費用。", "tr": "利息費用屬於營業外（財務成本），別誤刪。"}];
const FA7=[{"src": "11502-16", "f": 3, "s": "115-2", "tag": "邊際貢獻", "q": "假設其他一切不變，下列財務比率何者通常愈高愈佳？", "o": ["負債比率", "固定成本比率", "邊際貢獻率", "應收帳款週轉天數"], "a": 2, "fl": "愈高愈好 ➔ 邊際貢獻率。", "th": "邊際貢獻率越高，每多賣一元能拿來 cover 固定成本和賺錢的越多。", "tr": "負債比率、固定成本比率、應收帳款週轉天數都是越低越好。"}, {"src": "11502-23", "f": 3, "s": "115-2", "tag": "損益兩平", "q": "在產品售價不變的情況下，若生產某商品的總固定成本與單位變動成本都下降，對其邊際貢獻率與損益兩平銷貨收入有何影響？", "o": ["邊際貢獻率下降，損益兩平點上升", "邊際貢獻率上升，損益兩平點下降", "邊際貢獻率下降，損益兩平點下降", "邊際貢獻率不變，損益兩平點上升"], "a": 1, "fl": "變動成本降 ➔ 邊際貢獻率升；固定成本也降 ➔ 損益兩平點降。", "th": "損益兩平銷貨 = 固定成本 ÷ 邊際貢獻率。分子變小、分母變大，兩平點一定下降。", "tr": "兩個方向都對公司有利，答案一定是「好消息」組合。"}, {"src": "11501-21", "f": 3, "s": "115-1", "tag": "營業槓桿", "q": "若公司僅生產並銷售單一產品，其營運槓桿程度為 2.0，銷售量變動 6%，則：", "o": ["EBIT 變動 15%", "EBIT 變動 12%", "每股盈餘變動 3%", "淨利變動 12%"], "a": 1, "fl": "EBIT 變動 ＝ DOL × 銷售變動。", "th": "2.0 × 6% = 12%。", "tr": "EPS、淨利要再乘財務槓桿才知道，題目沒給。"}, {"src": "11101-41", "f": 3, "s": "115-1", "tag": "財務槓桿", "q": "若南勢公司的財務槓桿程度為 1.9，EBIT 變動 10%，則：", "o": ["銷售量變動 10%", "每股盈餘變動 19%", "淨利變動 18%", "營業毛利變動 10%"], "a": 1, "fl": "EPS 變動 ＝ DFL × EBIT 變動。", "th": "1.9 × 10% = 19%。", "tr": "財務槓桿連結的是 EBIT 和 EPS，不是銷售量。"}, {"src": "11502-40", "f": 2, "s": "115-2", "tag": "槓桿", "q": "金寶公司 X1 年度營業利益變動 18%，其營業槓桿度 1.6，財務槓桿度 2.8，則其每股盈餘變動多少？", "o": ["25%", "45%", "50.4%", "無法判斷"], "a": 2, "fl": "已知營業利益變動 ➔ 只要乘 DFL。", "th": "營業利益（EBIT）已經變動 18%，EPS 變動 = 18% × 2.8 = 50.4%。", "tr": "再乘營業槓桿 1.6 就重複算了；營業槓桿是從銷售量推到 EBIT。"}, {"src": "11301-44", "f": 2, "s": "113-1", "tag": "成本習性", "q": "下列各項成本中那一項應歸類為變動成本？", "o": ["繳納商品的貨物稅", "應客戶之要求先墊付的聯邦快遞運費", "工廠警衛所領的值班費", "廠房設備的折舊費用"], "a": 0, "fl": "變動成本 ➔ 跟著賣多少走（貨物稅）。", "th": "貨物稅按商品數量或金額課，賣越多繳越多，是變動成本。", "tr": "警衛值班費、廠房折舊是固定成本；幫客戶墊付的運費會向客戶收回，不是公司成本。"}, {"src": "11301-21", "f": 2, "s": "113-1", "tag": "信用槓桿", "q": "某一投資組合部位的信用槓桿倍數為 2 倍，若此一投資組合的現金部位可創造 5%的獲利，則其槓桿組合的投資收益為何？", "o": ["10%", "8%", "6%", "5%"], "a": 0, "fl": "槓桿收益 ＝ 槓桿倍數 × 現金部位報酬。", "th": "2 × 5% = 10%。", "tr": "不用考慮其他成本，題目只要直接相乘。"}, {"src": "11203-21", "f": 2, "s": "112-3", "tag": "損益兩平", "q": "要求出損益兩平的銷售金額，我們需要知道總固定成本與：", "o": ["每單位變動成本", "每單位售價", "每單位變動成本佔售價比率", "每單位售價減去平均每單位固定成本"], "a": 2, "fl": "損益兩平銷貨金額 ＝ 固定成本 ÷ 邊際貢獻率 ➔ 需要變動成本率。", "th": "邊際貢獻率 = 1 − 變動成本率，有了變動成本占售價的比率就能算。", "tr": "問的是「金額」不是「數量」；要算數量才需要單位售價和單位變動成本。"}, {"src": "11102-21", "f": 2, "s": "111-2", "tag": "邊際貢獻", "q": "因為新臺幣大幅貶值，奇奇皮鞋進口的高級女鞋每雙成本增加 200 元，故皮鞋被迫每雙售價也提高 200 元，在該鞋店的固定成本不變的情況下，請問此舉會造成該店的：", "o": ["邊際貢獻金額增加", "邊際貢獻金額減少", "邊際貢獻比率不變", "損益兩平的皮鞋銷售件數不變"], "a": 3, "fl": "售價和變動成本加一樣多 ➔ 每單位邊際貢獻不變 ➔ 損益兩平件數不變。", "th": "單位邊際貢獻 = 售價 − 變動成本，兩邊都加 200 元，差額不變；固定成本也不變，所以損益兩平件數不變。", "tr": "邊際貢獻「率」會下降（分母變大），C 是陷阱。"}, {"src": "11501-18", "f": 1, "s": "115-1", "tag": "損益兩平", "q": "雪見公司所生產的礦泉水每瓶售價$20，其中變動成本占 80%，已知目前每年產量為 50,000 瓶，該公司剛好損益兩平，請問其固定成本約為多少？", "o": ["$80,000", "$200,000", "$240,000", "$160,000"], "a": 1, "fl": "損益兩平 ➔ 固定成本 ＝ 總邊際貢獻。", "th": "單位邊際貢獻 = 20 × 20% = 4 元，50,000 瓶 × 4 = 200,000。", "tr": "用 80% 去乘會算出變動成本總額 800,000，不是固定成本。"}, {"src": "11501-28", "lv": "a", "f": 1, "s": "115-1", "tag": "營業槓桿", "q": "有兩家製造相同產品的公司，營業槓桿程度高的公司較槓桿度低的公司：", "o": ["其每股盈餘較不受營業額的影響", "其營業利益較不受營業額的影響", "其成本線的截距較高", "其成本線的斜率較高"], "a": 2, "fl": "營業槓桿高 ➔ 固定成本高 ➔ 成本線截距高。", "th": "總成本線 = 固定成本 + 變動成本 × 數量，固定成本就是截距。營業槓桿高代表固定成本比例高。", "tr": "營業槓桿高的公司，營業利益「更」受營業額影響。"}, {"src": "11402-49", "lv": "a", "f": 1, "s": "114-2", "tag": "安全邊際", "q": "安全邊際係指：", "o": ["銷貨收入－變動成本", "銷貨收入－固定成本", "銷貨收入－損益兩平銷貨收入", "銷貨收入－銷貨成本"], "a": 2, "fl": "安全邊際 ＝ 實際銷貨 − 損益兩平銷貨。", "th": "代表銷貨還可以掉多少才會開始虧錢。", "tr": "A 是邊際貢獻，D 是銷貨毛利。"}, {"src": "11402-48", "lv": "a", "f": 1, "s": "114-2", "x": 1, "tag": "目標利潤", "q": "某企業今年度的銷貨收入為 300 萬元，變動成本為 180 萬元，固定成本為 90 萬元，預估明年度固定成本為 120 萬元，邊際貢獻率不變，但企業希望明年度的淨利能達 50 萬元，請問其目標銷貨收入成長率應為多少？", "o": ["16.7%", "41.7%", "0%", "33.3%"], "a": 1, "fl": "目標銷貨 ＝（固定成本 ＋ 目標淨利）÷ 邊際貢獻率。", "th": "邊際貢獻率 = (300 − 180) ÷ 300 = 40%。目標銷貨 = (120 + 50) ÷ 40% = 425 萬，成長率 = 125 ÷ 300 = 41.7%。", "tr": "固定成本要用明年的 120 萬，不是今年的 90 萬。"}, {"src": "11401-41", "lv": "a", "f": 1, "s": "114-1", "tag": "財務槓桿", "q": "當企業的財務槓桿程度增加，其公司債價值通常會有何變化？", "o": ["增加", "減少", "不變", "不一定"], "a": 1, "fl": "財務槓桿上升 ➔ 違約風險上升 ➔ 公司債價值下降。", "th": "借越多錢，還不出來的機率越高，債權人要求更高報酬，債券價格下跌。", "tr": "對股東可能有利，但對債權人是壞消息。"}];
const FA8=[{"src": "11501-43", "f": 4, "s": "115-1", "tag": "本益比", "q": "某公司的權益報酬率為 19%，市價淨值比為 1.9 倍，則公司的本益比為：", "o": ["10", "14", "19", "36.1"], "a": 0, "fl": "本益比 ＝ 股價淨值比 ÷ ROE。", "th": "1.9 ÷ 19% = 10。", "tr": "1.9 × 19 = 36.1 是乘錯方向。"}, {"src": "11403-34", "f": 3, "s": "114-3", "tag": "股價淨值比", "q": "熊本公司本益比為 30，當年度平均普通股權益$250,000，淨利$60,000，特別股股利 $10,000，則該公司之股價淨值比率為何？", "o": ["8", "10", "6", "14.4"], "a": 2, "fl": "股價淨值比 ＝ 本益比 × ROE。", "th": "普通股淨利 60,000 − 10,000 = 50,000，ROE = 50,000 ÷ 250,000 = 20%。30 × 20% = 6。", "tr": "忘記扣特別股股利會得到 ROE 24%、答案 7.2。"}, {"src": "11302-38", "f": 3, "s": "113-2", "tag": "本益比", "q": "無塵晶圓現有本益比為 30，今市場傳出幾項分析師預測，假設其他情形不變，請問以下哪一項預測，對其本益比會有負面影響？", "o": ["預測無塵股票的系統性風險係數會下降", "預測無塵的營業槓桿率下降", "預測無塵的每股盈餘將會繼續成長，但是成長率由原先的 25%降為 20%", "預測無塵的財務槓桿率下降"], "a": 2, "fl": "成長率下降 ➔ 本益比下降。", "th": "雖然 EPS 還在成長，但成長速度變慢，投資人願意付的倍數就降低。", "tr": "系統風險、營業槓桿、財務槓桿下降都代表風險降，對本益比是正面消息。"}, {"src": "11203-25", "f": 3, "s": "112-3", "tag": "稀釋每股盈餘", "q": "林內公司流通在外之普通股共 100,000 股，且在當年度沒有發生應調整股數事項；其認購權證的履約價格為每股 50 元；當期普通股的每股平均市價為 100 元。所有認購權證履約可取得普通股總股數為 10,000 股。則其用以計算稀釋每股盈餘之約當股數為：", "o": ["20,000 股", "85,000 股", "100,000 股", "105,000 股"], "a": 3, "fl": "庫藏股法 ➔ 增加股數 ＝ 認購股數 ×（1 − 履約價 ÷ 市價）。", "th": "履約可得 10,000 股，收到 10,000 × 50 = 500,000，用市價 100 可買回 5,000 股。淨增加 5,000 股，100,000 + 5,000 = 105,000。", "tr": "直接加 10,000 股會得到 110,000（不在選項）。"}, {"src": "11203-45", "f": 3, "s": "112-3", "tag": "稀釋每股盈餘", "q": "石龜公司 X7 年的基本每股盈餘為$4.50，本年度其具稀釋作用之證券並無轉換或行使權利之情形，若假設認股權於本年度行使權利，則每股盈餘為$4.40，若再假設可轉換特別股轉換為普通股，則每股盈餘將由$4.40 變為$4.42。試問石龜公司於 X7 年財務報表應如何列示每股盈餘之資訊？", "o": ["$4.40", "$4.42", "$4.50", "$4.50 及$4.40"], "a": 3, "fl": "有稀釋 ➔ 列基本 EPS 和最稀釋的那個；反稀釋的不算。", "th": "認股權讓 EPS 降到 4.40，有稀釋；可轉換特別股讓 EPS 回升到 4.42，是反稀釋要排除。所以列 4.50 和 4.40。", "tr": "只列 4.40 不夠，基本每股盈餘也一定要列。"}, {"src": "11502-44", "f": 2, "s": "115-2", "tag": "每股盈餘", "q": "每股盈餘之計算公式為：", "o": ["普通股股利／普通股期末流通在外股數", "保留盈餘／普通股期末流通在外股數", "普通股享有之淨利／加權平均流通在外普通股股數", "普通股享有之淨利／普通股期末流通在外股數"], "a": 2, "fl": "EPS ＝ 普通股淨利 ÷ 加權平均流通在外股數。", "th": "一整年股數會變動，要用加權平均才公平。", "tr": "D 用「期末」股數是陷阱。"}, {"src": "11402-23", "f": 2, "s": "114-2", "tag": "本益比", "q": "大方公司 20X4 年度稅後淨利為$100,000，股東權益包含：8%不可轉換特別股 50,000 股、每股面額$10 以及普通股 100,000 股、每股面額$30，兩種股票均全年流通在外。當普通股每股市價為$60 時，則該公司 20X4 年度的本益比為多少？", "o": ["0.01", "0.6", "50", "100"], "a": 3, "fl": "EPS 要先扣特別股股利，本益比 ＝ 市價 ÷ EPS。", "th": "特別股股利 50,000 × 10 × 8% = 40,000，普通股淨利 60,000 ÷ 100,000 股 = 0.6 元，60 ÷ 0.6 = 100。", "tr": "沒扣特別股股利會算出 EPS 1 元、本益比 60（不在選項）。"}, {"src": "11401-27", "f": 2, "s": "114-1", "tag": "本益比", "q": "下列敘述何者為非？", "o": ["兩公司今年本益比相同，不代表兩公司成長性一樣", "產業成長性低的公司，其本益比會較高", "公司面臨風險的改變會影響本益比變動", "會計方法變動會影響本益比"], "a": 1, "fl": "成長性低 ➔ 本益比「低」。", "th": "投資人願意付高本益比，是因為看好未來成長；成長低的公司本益比通常較低。", "tr": "選「為非」的；B 把方向寫反了。"}, {"src": "11401-25", "f": 2, "s": "114-1", "tag": "本益比", "q": "大分公司本益比為 60，股利支付率為 75%，今知每股股利為$8，則普通股每股市價應為多少？", "o": ["$32", "$240", "$640", "$480"], "a": 2, "fl": "EPS ＝ 每股股利 ÷ 支付率；股價 ＝ 本益比 × EPS。", "th": "EPS = 8 ÷ 75% = 10.67，股價 = 60 × 10.67 = 640。", "tr": "60 × 8 = 480 是直接用股利，錯。"}, {"src": "11401-40", "f": 2, "s": "114-1", "tag": "盈餘預測", "q": "基於以下哪一項假設性的消息，投資人可能會調高其對善化商業銀行盈餘預測值？", "o": ["中時頭條：經建會預測明年起國內經濟成長將趨緩", "善化銀行月刊頭條：會計師陳君指出：「為了顧及帳務處理的簡便，在沒有違反重要性原則的前提下，去年度善化銀行有幾項資本支出被逕行列記為費用」", "工商頭條：央行宣布大幅調升貼現率", "經濟頭條：存款準備率下限將進一步降低"], "a": 3, "fl": "存款準備率降低 ➔ 銀行可放貸的錢變多 ➔ 調高盈餘預測。", "th": "準備金少押一點，銀行能借出去賺利息的錢就變多。", "tr": "經濟趨緩、升息對銀行盈餘不利；B 把資本支出列費用會讓去年盈餘偏低，不是調高今年預測的理由。"}, {"src": "11103-19", "f": 2, "s": "113-3", "tag": "盈餘品質", "q": "下列何者是影響盈餘品質的因素？", "o": ["會計政策之選擇", "任意性成本", "管理者操控", "選項(A)(B)(C)皆會有影響"], "a": 3, "fl": "影響盈餘品質 ➔ 會計政策、任意性成本、管理者操控全都會。", "th": "會計方法選擇、可以自由增減的研發廣告費、經理人刻意調盈餘，都會讓盈餘失真。", "tr": "看到「皆會有影響」別怕，這題就是全選。"}, {"src": "11303-48", "f": 2, "s": "113-3", "tag": "盈餘預測", "q": "對於作盈餘預測，如果已經有綜合損益表、現金流量表、資產負債表與權益變動表在手邊，哪些有可能有增額或邊際資訊內涵（Incremental Information Content）？甲、年度經營報告書；乙、財務報表附註資料；丙、公司負責人致股東函", "o": ["僅乙、丙", "僅甲", "僅甲、丙", "甲、乙、丙"], "a": 3, "fl": "增額資訊 ➔ 經營報告、附註、致股東函都有。", "th": "四大報表之外，附註和管理階層的說明都可能透露報表上看不到的資訊。", "tr": "別以為只有附註才有用。"}, {"src": "11302-19", "f": 2, "s": "113-2", "tag": "每股盈餘", "q": "甲公司 X1 年底有關資料如下：10%累積特別股，每股面額$10；總面額$900,000；普通股，每股面額$10；總面額$1,000,000；稅前淨利$600,000；所得稅率 25%。若甲公司當年度流通在外股數無變動，則每股盈餘為多少？", "o": ["$3.6", "$4.5", "$5.1", "$6.3"], "a": 0, "fl": "EPS ＝（稅後淨利 − 特別股股利）÷ 普通股股數。", "th": "稅後淨利 600,000 × 75% = 450,000，特別股股利 900,000 × 10% = 90,000，(450,000 − 90,000) ÷ 100,000 股 = 3.6。", "tr": "用稅前淨利或沒扣特別股股利都會選錯。"}, {"src": "11203-19", "f": 2, "s": "112-3", "tag": "本益比", "q": "其他條件不變下，下列何種情況有最高的本益比？", "o": ["預期未來盈餘成長高且企業經營風險高", "預期未來盈餘成長低且企業經營風險低", "預期未來盈餘成長低且企業經營風險高", "預期未來盈餘成長高且企業經營風險低"], "a": 3, "fl": "本益比最高 ➔ 成長高、風險低。", "th": "本益比 ≈ 股利支付率 ÷ (要求報酬 − 成長率)。成長越高、風險越低（要求報酬低），本益比越高。", "tr": "「成長高但風險高」只對一半。"}, {"src": "11202-19", "f": 2, "s": "112-2", "tag": "盈餘品質", "q": "一公司盈餘循環性大是指：", "o": ["其售價較高", "其固定成本較高", "其財務槓桿程度高", "營收型態與經濟循環關係大"], "a": 3, "fl": "盈餘循環性大 ➔ 營收跟景氣循環高度相關。", "th": "景氣好就大賺、景氣差就大虧，盈餘起伏跟著經濟循環走。", "tr": "固定成本高、財務槓桿高會放大波動，但不是「循環性」的定義。"}, {"src": "11202-45", "f": 2, "s": "112-2", "x": 1, "tag": "每股盈餘", "q": "甲公司 20X1 年年初流通在外之股份計有普通股 180,000 股（面額$10）與不可轉換之累積特別股 30,000 股（面額$100，5%），並於當年 9 月 1 日按市價現金增資發行普通股 60,000 股。若甲公司 20X1 年本期淨利$400,000，且當年度未宣告發放任何股利，甲公司 20X1 年每股盈餘為：", "o": ["$1.04", "$1.25", "$1.67", "$2.00"], "a": 1, "fl": "累積特別股股利沒宣告也要扣；新股按月數加權。", "th": "特別股股利 30,000 × 100 × 5% = 150,000，普通股淨利 250,000。股數 180,000 + 60,000 × 4/12 = 200,000。250,000 ÷ 200,000 = 1.25。", "tr": "沒扣特別股股利會算出 2.00；用期末 240,000 股會算出 1.04。"}, {"src": "11202-17", "f": 2, "s": "112-2", "tag": "每股盈餘", "q": "甲公司 X3 年度淨利$800,000，全年度加權平均流通在外普通股股數為 240,000 股，X3 年底普通股股數為 300,000 股，另當年度尚發行 80,000 股的累積特別股，與特別股股東持有人約定每年每股發放$1 的特別股股利。試求甲公司 X3 年基本每股盈餘為何？", "o": ["$3.33", "$3", "$2.4", "$2"], "a": 1, "fl": "基本 EPS ＝（淨利 − 特別股股利）÷ 加權平均股數。", "th": "特別股股利 80,000 × 1 = 80,000，(800,000 − 80,000) ÷ 240,000 = 3。", "tr": "用年底 300,000 股會算出 2.4，要用加權平均。"}, {"src": "11502-20", "f": 1, "s": "115-2", "tag": "本益比", "q": "永靖企業 X2 年 12 月 31 日普通股的市價為 36 元，該公司全年流通在外普通股共 100,000 股，每股面額 10 元，該公司當年度結帳前帳上權益總額為$2,800,000，本期淨利為$600,000，X2 年中曾支付 3 元的普通股股利，請問永靖企業當天的本益比為多少？", "o": ["6", "3.6", "3", "2.4"], "a": 0, "fl": "本益比 ＝ 股價 ÷ EPS。", "th": "EPS = 600,000 ÷ 100,000 = 6 元，36 ÷ 6 = 6。", "tr": "權益總額、股利都是干擾。"}, {"src": "11402-14", "f": 1, "s": "114-2", "tag": "本益比", "q": "東京公司 X1 年度每股盈餘為$4.5，每股可配股利$3，東京公司 X1 年底每股帳面金額為 $36，每股市價為$45，則東京公司股票的本益比為：", "o": ["5", "10", "7.5", "15"], "a": 1, "fl": "本益比 ＝ 股價 ÷ EPS。", "th": "45 ÷ 4.5 = 10。", "tr": "每股股利、帳面金額都是干擾。"}, {"src": "11403-42", "lv": "a", "f": 1, "s": "114-3", "tag": "盈餘品質", "q": "甲、暫時性盈餘；乙、企業風險；丙、會計政策，哪些會影響盈餘的品質？", "o": ["僅甲及乙", "僅乙及丙", "僅甲及丙", "甲、乙、丙"], "a": 3, "fl": "影響盈餘品質 ➔ 暫時性盈餘、企業風險、會計政策都會。", "th": "一次性的盈餘不能持續，風險高的盈餘不穩定，會計政策選擇會讓數字失真。", "tr": "全部都會影響。"}, {"src": "11403-20", "lv": "a", "f": 1, "s": "114-3", "tag": "每股盈餘", "q": "大南公司之資料如下，X1年度純益$6,000,000，所得稅率17%，普通股400,000股，全年流通在外，每股面額$10。另有5%累積可轉換特別股600,000股，每股面額$100，可轉換成普通股3股；可轉換公司債$6,000,000，票面利率6%，平價發行，每$1,000面額可轉換成普通股20股。試問其基本每股盈餘為何？", "o": ["$7.5", "$5", "$8.775", "$6.6"], "a": 0, "fl": "基本 EPS ➔ 扣累積特別股股利，不考慮轉換。", "th": "特別股股利 600,000 × 100 × 5% = 3,000,000，(6,000,000 − 3,000,000) ÷ 400,000 = 7.5。", "tr": "可轉換公司債、特別股轉換是「稀釋」EPS 才考慮。"}, {"src": "11403-41", "lv": "a", "f": 1, "s": "114-3", "x": 1, "tag": "稀釋每股盈餘", "q": "甲公司 X3 年 1 月 1 日有普通股 300,000 股流通在外，4 月 1 日甲公司給予公司高級主管認股選擇權，當日成為既得，可按每股$40 認購普通股 120,000 股，至 X3 年底均未行使。甲公司普通股自 X3 年 4 月初至年底平均市價為每股$50，X3 年淨利為$477,000，則甲公司 X3 年度之稀釋每股盈餘為何？", "o": ["$1.59", "$1.50", "$1.47", "$1.22"], "a": 1, "fl": "庫藏股法增加股數 × 流通月數比例，加到分母。", "th": "認購 120,000 股收 4,800,000，按 50 元可買回 96,000 股，淨增 24,000 股。4 月起算 9 個月：24,000 × 9/12 = 18,000。477,000 ÷ 318,000 = 1.50。", "tr": "忘記乘 9/12 會得到 1.47。"}, {"src": "11402-22", "lv": "a", "f": 1, "s": "114-2", "tag": "本益比", "q": "本益比可作下列何種分析？", "o": ["投資報酬率分析", "資本結構分析", "短期償債能力分析", "資金運用效率分析"], "a": 0, "fl": "本益比 ➔ 投資報酬率分析。", "th": "本益比是股價相對於盈餘的倍數，用來衡量投資划不划算。", "tr": "不是資本結構、償債能力或資金運用效率。"}, {"src": "11401-36", "lv": "a", "f": 1, "s": "114-1", "tag": "每股盈餘", "q": "計算基本每股盈餘之分子時，下列項目何者是無論公司當期是否宣告發放股利，都必須自本期純益減除者？", "o": ["所有特別股之股利", "參加特別股之股利", "累積特別股之股利", "可轉換公司債之利息"], "a": 2, "fl": "不管有沒有宣告都要扣 ➔ 累積特別股股利。", "th": "累積特別股的股利今年沒發，以後也要補，所以每年都要扣。", "tr": "非累積特別股只有宣告時才扣。"}, {"src": "11401-37", "lv": "a", "f": 1, "s": "114-1", "tag": "本益比", "q": "在既定之本益比及股利支付數額下，股利支付率愈高者，表示其股票之市價：", "o": ["無影響", "愈高", "愈低", "不一定"], "a": 2, "fl": "股利固定、支付率高 ➔ EPS 小 ➔ 股價低。", "th": "股利支付率 = 股利 ÷ EPS，股利固定時支付率越高代表 EPS 越小；本益比固定，股價 = 本益比 × EPS 就越低。", "tr": "直覺以為多發股利股價就高，這題是公式推導題。"}];
const FA9=[{"src": "11403-7", "f": 4, "s": "115-2", "tag": "利息付現", "q": "奧蘭多公司 113 年度認列利息費用$9,000，已知期末應付利息比期初增加$4,000，另有公司債溢價攤銷$1,000。假設無利息資本化情況，則奧蘭多公司 113 年度支付利息的現金金額為：", "o": ["$6,000", "$7,000", "$10,000", "$11,000"], "a": 0, "fl": "付現利息 ＝ 利息費用 − 應付利息增加 ＋ 溢價攤銷。", "th": "9,000 − 4,000 + 1,000 = 6,000。溢價攤銷讓利息費用比付現少，要加回；應付利息增加代表還沒付，要減。", "tr": "溢價和折價方向相反，溢價要「加」。"}, {"src": "11502-34", "f": 4, "s": "115-2", "tag": "利息費用", "q": "西雅圖公司 X1 年度利息費用付現金額為$8,000，已知期末應付利息比期初增加$2,500，另有 $1,000 應付公司債折價攤銷。假設無利息資本化情況，則西雅圖公司 X1 年度損益表中的利息費用金額為：", "o": ["$8,500", "$9,500", "$10,500", "$11,500"], "a": 3, "fl": "利息費用 ＝ 付現 ＋ 應付利息增加 ＋ 折價攤銷。", "th": "8,000 + 2,500 + 1,000 = 11,500。", "tr": "這題是倒過來從付現推費用，加減方向跟奧蘭多那題相反。"}, {"src": "11501-7", "f": 4, "s": "115-1", "tag": "活動分類", "q": "企業收回借出的款項，應列為現金流量表上的哪一個項目？", "o": ["籌資活動之現金流入", "投資活動之現金流入", "籌資活動之現金流出", "投資活動之現金流出"], "a": 1, "fl": "收回借出去的錢 ➔ 投資活動流入。", "th": "借錢給別人是投資活動流出，收回本金就是投資活動流入。", "tr": "自己借錢、還錢才是籌資活動。"}, {"src": "11003-10", "f": 4, "s": "115-1", "tag": "活動分類", "q": "現金流量表上最能衡量企業繼續經營能力的資訊為何？", "o": ["來自營業活動之現金流量", "來自投資活動之現金流量", "來自籌資活動之現金流量", "不影響現金之投資活動或籌資活動"], "a": 0, "fl": "繼續經營能力 ➔ 營業活動現金流量。", "th": "本業能不能自己賺到現金，決定公司能不能長期活下去。", "tr": "投資、籌資活動是一時的資金進出。"}, {"src": "11303-37", "f": 4, "s": "114-2", "tag": "投資活動", "q": "甲公司 X3 年出售土地獲得現金$360,000，出售設備獲得現金$400,000，發行普通股獲得現金 $280,000，購買設備支付現金$210,000，支付現金股利$240,000，請問該公司 X3 年度投資活動現金流量為多少？", "o": ["$550,000", "$590,000", "$830,000", "$310,000"], "a": 0, "fl": "投資活動 ➔ 只算買賣長期資產。", "th": "出售土地 360,000 + 出售設備 400,000 − 購買設備 210,000 = 550,000。", "tr": "發行普通股、付現金股利是籌資活動，不能算進去。"}, {"src": "11402-7", "f": 4, "s": "114-2", "tag": "投資活動", "q": "竹圍公司 X1 年度的會計事項如下：支付所得稅$300,000、發放現金股利$560,000、購買設備支付現金$892,500、發行普通股獲得現金$1,000,000、出售土地獲得現金$1,312,500、出售設備獲得現金$995,000。請問：該公司 X1 年度投資活動現金流量為多少？", "o": ["$855,000", "$1,315,000", "$1,415,000", "$1,885,000"], "a": 2, "fl": "投資活動 ➔ 買賣設備、土地。", "th": "−892,500 + 1,312,500 + 995,000 = 1,415,000。", "tr": "所得稅是營業活動，股利和發行股票是籌資活動。"}, {"src": "11401-12", "f": 4, "s": "114-1", "x": 1, "tag": "支付供應商", "q": "台東公司 X1 年銷貨收入淨額為$3,200,000，銷貨毛利為$800,000；年初應收帳款$2,400,000，存貨$2,560,000，應付帳款$800,000；而年底應收帳款$1,920,000，存貨$2,880,000，應付帳款 $480,000，請問台東公司 X1 年度支付給供應商的現金數額為：", "o": ["$1,760,000", "$2,720,000", "$3,040,000", "$3,200,000"], "a": 2, "fl": "銷貨成本 → 進貨 → 付現。", "th": "銷貨成本 = 3,200,000 − 800,000 = 2,400,000。進貨 = 2,400,000 + 2,880,000 − 2,560,000 = 2,720,000。付現 = 2,720,000 + 800,000 − 480,000 = 3,040,000。", "tr": "應收帳款是干擾；B 的 2,720,000 只算到進貨。"}, {"src": "11302-11", "f": 4, "s": "113-2", "tag": "活動分類", "q": "依 IAS7「現金流量表」之彈性規定，利息費用付現得列於現金流量表中之何項活動？", "o": ["營業活動或投資活動", "投資活動或籌資活動", "營業活動或籌資活動", "不影響現金流量之投資及籌資活動"], "a": 2, "fl": "利息支付 ➔ 營業或籌資（二擇一）。", "th": "IAS 7 給彈性：付利息可以列營業活動，也可以列籌資活動。", "tr": "收到利息、股利才是「營業或投資」，別記反。"}, {"src": "11502-5", "f": 3, "s": "115-2", "tag": "現金流量比率", "q": "已知甲公司 X1 年度自由現金流量為$25,000，當年度資本支出共$25,000，無任何現金股利，當年度平均流動負債$100,000、平均流動資產$80,000，假設無其他攸關項目下，請問該公司當年度營業淨現金流量對流動負債比率為若干？", "o": ["0.56", "0.5", "0.39", "0.28"], "a": 1, "fl": "營業現金流量 ＝ 自由現金流量 ＋ 資本支出。", "th": "25,000 + 25,000 = 50,000，÷ 平均流動負債 100,000 = 0.5。", "tr": "流動資產 80,000 是干擾。"}, {"src": "11403-28", "f": 3, "s": "114-3", "tag": "間接法", "q": "品妍公司於 X3 年度曾出售一批不動產、廠房及設備，其原始成本為$500,000，出售時的累計折舊為$250,000，而售得之價款為$350,000。上述事項在間接法現金流量表中應如何列示？", "o": ["從稅前淨利中減除$100,000，並從投資活動增加$350,000 現金流量", "從稅前淨利中減除$100,000，並從籌資活動減少$350,000 現金流量", "從稅前淨利中加回$350,000，並從投資活動增加$250,000 現金流量", "從稅前淨利中加回$250,000，並從籌資活動減少$350,000 現金流量"], "a": 0, "fl": "出售資產 ➔ 淨利減利益，投資活動列售價。", "th": "帳面金額 500,000 − 250,000 = 250,000，售價 350,000，利益 100,000。間接法從淨利扣掉 100,000，投資活動流入 350,000。", "tr": "出售資產屬投資活動，不是籌資活動。"}, {"src": "11103-8", "f": 3, "s": "114-1", "x": 1, "tag": "支付供應商", "q": "傑克遜公司 X9 年期初存貨$200,000、期末存貨$800,000、X9 年度存貨週轉率 5.2 次。該公司 X9 年度之銷貨淨額為$4,000,000、X9 年初應付帳款為$120,000、X9 年底應付帳款為 $280,000，則 X9 年度支付供應商之現金數若干？", "o": ["$4,160,000", "$3,840,000", "$3,360,000", "$3,040,000"], "a": 3, "fl": "週轉率 × 平均存貨 ＝ 銷貨成本 → 進貨 → 付現。", "th": "平均存貨 500,000 × 5.2 = 2,600,000。進貨 = 2,600,000 + 800,000 − 200,000 = 3,200,000。付現 = 3,200,000 + 120,000 − 280,000 = 3,040,000。", "tr": "銷貨淨額 4,000,000 是干擾，不要拿來算。"}, {"src": "11001-9", "f": 3, "s": "113-2", "tag": "活動分類", "q": "承租人的租金付現數於現金流量表上可如何分類：", "o": ["營業活動、投資活動", "營業活動、籌資活動", "投資活動、籌資活動", "只有營業活動"], "a": 1, "fl": "承租人付租金 ➔ 本金籌資、利息營業（或籌資）。", "th": "IFRS 16 下，租金拆成還本金（籌資活動）和付利息（營業或籌資），短期或低價值租賃列營業。", "tr": "不會出現投資活動。"}, {"src": "11301-33", "f": 3, "s": "113-2", "tag": "活動分類", "q": "編製母公司之現金流量表時，為取得子公司股權所支付之現金為：", "o": ["營業活動", "投資活動", "籌資活動", "不影響現金流量之投資或籌資活動"], "a": 1, "fl": "取得子公司付現 ➔ 投資活動。", "th": "買別家公司的股權是長期投資，列投資活動流出。", "tr": "不是籌資活動，雖然金額很大。"}, {"src": "11301-34", "f": 3, "s": "113-1", "tag": "現金流量表功能", "q": "下列何者並非現金流量表之功能？", "o": ["評估公司盈餘的品質", "評估對外部資金的依賴程度", "評估公司的財務彈性", "評估資產的管理效能"], "a": 3, "fl": "評估資產管理效能 ➔ 不是現金流量表的功能（那是週轉率）。", "th": "現金流量表看盈餘品質、對外部資金依賴、財務彈性；資產用得好不好要看週轉率。", "tr": "選「並非」的那個。"}, {"src": "11502-17", "f": 2, "s": "115-2", "tag": "活動分類", "q": "波特蘭公司從公開市場中買入該公司已發行之股票，這一交易在現金流量表中應列為：", "o": ["營業活動", "投資活動", "籌資活動", "減資活動"], "a": 2, "fl": "買回自己的股票（庫藏股）➔ 籌資活動。", "th": "跟股東之間的資金往來都是籌資活動。", "tr": "買「別人」的股票才是投資活動。"}, {"src": "11501-6", "f": 2, "s": "115-1", "tag": "間接法", "q": "以間接法編製現金流量表，請問下列何種狀況是現金流量的加項？", "o": ["存貨增加", "應付帳款減少", "發放現金股利", "應收帳款減少"], "a": 3, "fl": "流動資產減少 ➔ 加；流動負債減少 ➔ 減。", "th": "應收帳款減少代表收回現金，加回。存貨增加、應付帳款減少都是減項；發現金股利是籌資活動。", "tr": "資產和負債的加減方向相反，記「資產減少加，負債減少減」。"}, {"src": "11501-8", "f": 2, "s": "115-1", "tag": "間接法", "q": "採用間接法編製現金流量表時，下列何項在現金流量表中應自稅前淨利減除，以求得來自營業活動的現金流量？", "o": ["折舊費用", "稅後利息費用", "應付公司債溢價攤銷", "應付公司債折價攤銷"], "a": 2, "fl": "應付公司債溢價攤銷 ➔ 減項。", "th": "溢價攤銷讓利息費用比實際付的現金少，淨利偏高，要減回來。折價攤銷剛好相反，是加項。", "tr": "折舊、折價攤銷都是加項。"}, {"src": "11402-6", "f": 2, "s": "114-2", "tag": "現金流量型態", "q": "下列何種情況最可能出現在一個新成立且急速擴充的企業之現金流量表？", "o": ["投資活動現金流量淨額大於 0；籌資活動現金流量淨額小於 0", "投資活動現金流量淨額小於 0；籌資活動現金流量淨額大於 0", "投資活動現金流量淨額小於 0；籌資活動現金流量淨額小於 0", "投資活動現金流量淨額大於 0；籌資活動現金流量淨額大於 0"], "a": 1, "fl": "新公司急速擴充 ➔ 投資流出（＜0）、籌資流入（＞0）。", "th": "一直買廠房設備，投資活動大量付錢；錢不夠就借錢、增資，籌資活動流入。", "tr": "成熟公司才會投資少、還債多（籌資＜0）。"}, {"src": "11401-17", "f": 2, "s": "114-1", "tag": "直接法與間接法", "q": "下列敘述何者為真？", "o": ["每股現金流量其值通常較每股盈餘為低", "短期借款之增減屬於投資活動之現金流量", "資金流量分析為一種靜態分析", "不論採用直接法或間接法表達營業活動之現金流量，投資活動及籌資活動之現金流量皆為相同"], "a": 3, "fl": "直接法、間接法 ➔ 只差在營業活動的表達，投資、籌資一樣。", "th": "兩種方法只是營業活動現金流量的呈現方式不同，投資和籌資活動完全相同。", "tr": "短期借款屬籌資活動；資金流量分析是動態分析。"}, {"src": "11203-7", "f": 2, "s": "112-3", "x": 1, "tag": "間接法", "q": "安可公司 111 年度淨利$150,000、折舊費用$50,000、專利權攤銷費用$15,000、存貨減少數$18,000、應收帳款增加數$45,000、應付帳款減少數$20,000、出售設備損失$10,000（帳面金額$30,000，減現金收入$20,000），則 111 年度來自營運活動的淨現金流量為：", "o": ["$158,000", "$178,000", "$168,000", "$136,000"], "a": 1, "fl": "淨利 ＋ 非現金費用 ＋ 處分損失 ± 營運資金變動。", "th": "150,000 + 50,000 + 15,000 + 10,000 = 225,000；存貨減少 +18,000，應收增加 −45,000，應付減少 −20,000。225,000 + 18,000 − 45,000 − 20,000 = 178,000。", "tr": "出售設備的現金 20,000 是投資活動，不加進營業活動。"}, {"src": "11201-28", "f": 2, "s": "112-1", "tag": "間接法", "q": "以間接法編製現金流量表中的「來自營業活動的現金流量」時，下列何項敘述正確？", "o": ["應加入存貨增加之金額", "應減除預付費用減少之金額", "應減除清償公司債之利益", "應加入再發行庫藏股之金額"], "a": 2, "fl": "間接法 ➔ 處分、清償的「利益」要減除。", "th": "清償公司債的利益是籌資活動造成的，不是營業現金，所以從淨利扣掉。", "tr": "存貨增加要減、預付費用減少要加，A、B 方向都寫反了；再發行庫藏股是籌資活動。"}, {"src": "11003-9", "f": 2, "s": "110-3", "tag": "間接法", "q": "在間接法編製的現金流量表中，應單獨揭露哪些項目之現金流出？", "o": ["利息支付金額", "所得稅支付金額", "選項(A)、(B)都需揭露", "在間接法之下，現金流量表不應出現任何現金支付的項目"], "a": 2, "fl": "間接法 ➔ 利息和所得稅支付金額都要單獨揭露。", "th": "間接法看不出實際付了多少利息和稅，所以要另外揭露。", "tr": "D 說間接法不能出現現金支付項目，是錯的。"}, {"src": "11402-5", "f": 1, "s": "114-2", "tag": "投資活動", "q": "處分土地乙筆，成本$3,500、處分利益$500，則應於投資活動項下列入現金流入：", "o": ["$3,000", "$1,000", "$4,000", "$0"], "a": 2, "fl": "處分土地現金 ＝ 成本 ＋ 處分利益。", "th": "3,500 + 500 = 4,000。", "tr": "只看利益 500 或成本 3,500 都不對。"}, {"src": "11502-35", "lv": "a", "f": 1, "s": "115-2", "tag": "現金預測", "q": "一般而言，下列哪一項目和企業現金流量的預測最為密切？", "o": ["預測之進貨金額", "預測之銷貨金額", "預估資金成本", "預測之營業費用金額"], "a": 1, "fl": "現金流量預測 ➔ 先估銷貨。", "th": "銷貨決定收現，也決定要進多少貨、花多少費用，是所有預測的起點。", "tr": "進貨和營業費用都是跟著銷貨推出來的。"}, {"src": "11501-26", "lv": "a", "f": 1, "s": "115-1", "tag": "間接法", "q": "營業活動現金流量的增加不包括：", "o": ["應付帳款的增加", "應付所得稅的增加", "應收帳款的增加", "淨利的增加"], "a": 2, "fl": "應收帳款增加 ➔ 營業現金減少。", "th": "賣了東西還沒收到錢，應收增加，現金沒進來。", "tr": "應付帳款、應付所得稅增加都讓營業現金增加。"}, {"src": "11402-37", "lv": "a", "f": 1, "s": "114-2", "tag": "活動分類", "q": "下列何者非屬投資活動之現金流量？", "o": ["出售設備", "舉借債務", "貸款予其他企業", "購入按攤銷後成本衡量債券投資"], "a": 1, "fl": "舉借債務 ➔ 籌資活動。", "th": "出售設備、借錢給別人、買債券投資都是投資活動；自己借錢是籌資。", "tr": "「貸款予其他企業」是借出，屬投資活動。"}, {"src": "11401-11", "lv": "a", "f": 1, "s": "114-1", "tag": "營業現金流量", "q": "丹佛公司（非建築業）本年度淨利頗佳，惟營業活動之現金流量卻為負值，其可能原因為：", "o": ["應付帳款增加", "有一大部分淨利係來自處分不動產、廠房及設備", "存貨減少", "選項(A)(B)(C)皆是"], "a": 1, "fl": "淨利好、營業現金負 ➔ 淨利多半來自處分資產利益。", "th": "處分利益不是營業現金，間接法要從淨利扣掉，扣完營業現金就變負的。", "tr": "應付帳款增加、存貨減少都會讓營業現金變多，不是原因。"}];
const FA10=[{"src": "11502-7", "f": 3, "s": "115-2", "tag": "合併報表", "q": "母公司和子公司相互間持有債券，在合併報表中的處理方式為：", "o": ["視為發行公司收回債券處理", "不需要作任何沖銷，但合併報表中仍會出現債券項目", "以上(A)、(B)選項都有可能，視債券發行公司為母公司或子公司而定", "將債券列為權益的一部分"], "a": 0, "fl": "母子公司互持債券 ➔ 合併報表視為發行公司收回債券。", "th": "站在集團角度，自己買自己的債就等於把債贖回，債券和投資要互相沖銷。", "tr": "不論誰發行、誰持有都一樣處理。"}, {"src": "11302-1", "f": 3, "s": "113-2", "tag": "趨勢分析", "q": "趨勢分析最常用的基期是：", "o": ["固定基期", "變動基期", "最大基期", "平均基期"], "a": 0, "fl": "趨勢分析 ➔ 固定基期。", "th": "選一個年度當基期（100%），之後每年都跟它比，看長期走勢。", "tr": "變動基期是逐年比較（和上一年比），比較少用。"}, {"src": "11502-30", "f": 2, "s": "115-2", "tag": "報表使用者", "q": "在分析財務報表時，債權人最終目的為：", "o": ["瞭解企業未來的獲利能力", "瞭解企業的資本結構", "瞭解債務人是否有能力償還本息", "瞭解企業過去的財務狀況"], "a": 2, "fl": "債權人最在乎 ➔ 能不能還本付息。", "th": "債權人不分紅利，只要錢借出去能拿回來、利息照付。", "tr": "獲利能力、資本結構都是手段，最終目的是償債能力。"}, {"src": "11502-1", "f": 2, "s": "115-2", "tag": "期後事項", "q": "如果公司在財務報表結束日後發生重大資產出售事件之期後事項，應如何揭露？", "o": ["在損益表中認列", "在財務報表附註中揭露", "在資產負債表中認列", "不需要揭露"], "a": 1, "fl": "報導期間後才發生的重大事件 ➔ 附註揭露。", "th": "結束日之後才發生的事（非調整事項），不改報表數字，只在附註說明。", "tr": "結束日前就已存在的情況（調整事項）才要改報表金額。"}, {"src": "11502-29", "f": 2, "s": "115-2", "tag": "企業合併", "q": "根據 IFRS 3，廉價購買利益應如何處理？", "o": ["認列為當期損益", "計入其他綜合損益", "計入資本公積", "作為商譽的一部分"], "a": 0, "fl": "廉價購買利益 ➔ 當期損益。", "th": "買價低於取得淨資產的公允價值，差額直接認列為當期利益。", "tr": "不是商譽（商譽是買貴的部分），也不是資本公積。"}, {"src": "11502-8", "f": 2, "s": "115-2", "tag": "企業合併", "q": "甲公司發行每股面額$10 之普通股 100,000 股取得乙公司全部股份，乙公司的可辨認淨資產公允價值為$1,165,000，發行新股所發生的成本為$11,000，甲公司普通股每股之公允價值為$13.6。應如何計算合併交易中的商譽？", "o": ["$195,000", "$200,000", "$210,000", "$220,000"], "a": 0, "fl": "商譽 ＝ 移轉對價 − 可辨認淨資產公允價值；發行成本不算。", "th": "對價 100,000 × 13.6 = 1,360,000，減 1,165,000 = 195,000。發行新股成本沖資本公積，不影響商譽。", "tr": "把發行成本 11,000 加進去會算錯。"}, {"src": "11502-49", "f": 2, "s": "115-2", "tag": "企業合併", "q": "當收購者在企業合併中發行固定數量的股份作為或有對價時，應如何分類？", "o": ["分類為權益工具，且收購日後不得重新衡量", "分類為金融負債，且收購日後得重新衡量", "分類為其他綜合收益，並於收購日後得調整", "分類為短期負債"], "a": 0, "fl": "或有對價給固定股數 ➔ 權益工具，之後不重新衡量。", "th": "交付固定數量自己股票的義務屬於權益，收購日後不再按公允價值調整。", "tr": "如果分類為金融負債，後續公允價值變動才要進損益。"}, {"src": "11401-49", "f": 2, "s": "114-1", "tag": "外幣換算", "q": "功能性貨幣財務報表換算表達貨幣時，通常保留盈餘期末餘額之計算不包括：", "o": ["上期換算後保留盈餘之期末餘額", "按宣告日匯率換算之股利金額", "以歷史匯率換算之當期損益", "以上均包含於保留盈餘之計算"], "a": 2, "fl": "換算保留盈餘 ➔ 當期損益用「平均匯率」，不是歷史匯率。", "th": "期末保留盈餘 = 上期換算後餘額 + 當期損益（平均匯率） − 股利（宣告日匯率）。", "tr": "選「不包括」的；歷史匯率是用在股本。"}, {"src": "11303-32", "f": 2, "s": "113-3", "tag": "共同比分析", "q": "共同比（Common-size）損益表是以哪一個項目金額為 100%？", "o": ["本期淨利", "銷貨總額", "銷貨淨額", "賒銷總額"], "a": 2, "fl": "共同比損益表 ➔ 銷貨淨額 ＝ 100%。", "th": "每個損益項目都除以銷貨淨額，看各項目占營收的比例。", "tr": "共同比資產負債表才是用「資產總額」當 100%。"}, {"src": "11202-9", "f": 2, "s": "112-2", "tag": "待出售", "q": "母公司應採下列何種方法評價待出售子公司之資產與負債？", "o": ["可回收價值", "淨公允價值", "成本與淨公允價值選低者", "帳面金額與淨公允價值選低者"], "a": 3, "fl": "待出售 ➔ 帳面金額與淨公允價值「取低」。", "th": "準備賣掉的資產，帳上不能高估，取帳面和公允價值減出售成本的較低者。", "tr": "跟存貨的「成本與淨變現價值孰低」概念一樣。"}, {"src": "11003-45", "f": 2, "s": "110-3", "tag": "合併報表", "q": "萬能公司擁有百全公司 90%股權且無購買溢價，並採完全權益法處理其投資。若萬能公司與百全公司之合併損益表上控制權益淨利益為 X，萬能公司本身之損益表上淨利為 Y，則：", "o": ["X＞Y", "X＝Y", "X＜Y", "選項(A)(B)(C)皆非"], "a": 1, "fl": "完全權益法 ➔ 母公司淨利 ＝ 合併報表控制權益淨利。", "th": "完全權益法已經把子公司損益、內部交易都調好了，母公司個體淨利剛好等於合併報表歸屬母公司的淨利。", "tr": "權益法常被稱為「一行合併」，兩個數字會一樣。"}, {"src": "11002-26", "f": 2, "s": "110-2", "tag": "合併報表", "q": "甲公司擁有乙公司流通在外普通股 10,000,000 股中的 70%。其餘 3,000,000 股為丙公司所擁有。在甲公司所編製的合併報表上，應將丙公司視為：", "o": ["被投資公司", "非控制權益", "聯屬公司", "關係人"], "a": 1, "fl": "子公司其他股東 ➔ 非控制權益。", "th": "甲持有 70%，剩下 30% 屬於丙，在合併報表上就是非控制權益。", "tr": "丙沒有控制乙，不是關係人或聯屬公司的意思。"}, {"src": "11501-30", "f": 1, "s": "115-1", "tag": "企業合併", "q": "甲公司擬出價$80 購併乙公司，已知乙公司的價值為$50，甲公司的價值為$70，請問公司購併溢價為何？", "o": ["$20", "$30", "$50", "無法得知"], "a": 1, "fl": "購併溢價 ＝ 出價 − 被購併公司價值。", "th": "80 − 50 = 30。", "tr": "甲公司自己的價值 70 是干擾。"}, {"src": "11502-50", "lv": "a", "f": 1, "s": "115-2", "tag": "合併報表", "q": "根據我國採用的 IFRS 10「合併財務報表」，母公司如何在合併財務報表中表達非控制權益？", "o": ["在權益部分單獨列示", "在負債部分列示", "在資產部分列示", "不在合併報表中反映"], "a": 0, "fl": "非控制權益 ➔ 合併報表權益項下單獨列示。", "th": "非控制權益是子公司其他股東的權益，IFRS 10 規定放在權益區，和母公司業主權益分開列。", "tr": "不是負債。"}, {"src": "11502-9", "lv": "a", "f": 1, "s": "115-2", "tag": "商譽減損", "q": "甲公司在合併報表中，對於一項企業合併認列了$300,000 的商譽。於 X3 年進行減損測試，商譽的可回收金額為$250,000，應如何處理？", "o": ["認列減損損失$50,000", "將差額計入留存收益", "認列減損損失$300,000", "不需要任何調整"], "a": 0, "fl": "商譽減損 ＝ 帳面 − 可回收金額。", "th": "300,000 − 250,000 = 50,000。", "tr": "商譽不攤銷，但每年要做減損測試。"}, {"src": "11502-32", "lv": "a", "f": 1, "s": "115-2", "tag": "企業合併", "q": "若企業合併中的或有對價分類為金融負債，應如何處理後續的公允價值變動？", "o": ["認列為其他綜合收益", "調整商譽", "認列於當期損益", "不再進行任何後續調整"], "a": 2, "fl": "或有對價屬金融負債 ➔ 公允價值變動進當期損益。", "th": "負債類的或有對價每期按公允價值重新衡量，變動列損益。", "tr": "不能調整商譽。"}, {"src": "11501-1", "lv": "a", "f": 1, "s": "115-1", "tag": "報表使用者", "q": "一般而言，企業的長期債權人可能關心以下幾項？甲.企業短期財務狀況；乙.企業長期之獲利能力；丙.企業的資本結構是否穩固；丁.企業長期之資金流量", "o": ["一項", "兩項", "三項", "四項"], "a": 3, "fl": "長期債權人 ➔ 四項全部關心。", "th": "長期借款要很多年後才還，短期狀況、長期獲利、資本結構、長期資金流量都會影響還款能力。", "tr": "短期財務狀況也重要，公司短期倒了，長期債也收不回。"}, {"src": "11402-31", "lv": "a", "f": 1, "s": "114-2", "tag": "外幣換算", "q": "若國外子公司之功能性貨幣為當地貨幣，並以該功能性貨幣記帳，其財務報表在換算為母公司表達貨幣時，下列何者應以資產負債表日匯率換算？", "o": ["股本", "商譽", "股利", "保留盈餘"], "a": 1, "fl": "國外子公司換算 ➔ 資產負債（含商譽）用期末匯率。", "th": "資產和負債用資產負債表日匯率；股本用歷史匯率；股利用宣告日匯率；保留盈餘是累積算出來的。", "tr": "商譽被視為子公司的資產，用期末匯率。"}, {"src": "11401-2", "lv": "a", "f": 1, "s": "114-1", "tag": "比較分析", "q": "下列何者並非應用比較分析時可能產生的限制（無法計算）？", "o": ["基期為零", "基期為正，比較年為負", "基期為負數", "基期與比較年的金額相當接近"], "a": 3, "fl": "比較分析算不出來 ➔ 基期為 0、為負；金額接近照樣能算。", "th": "基期是 0 不能除；基期是負數或由正轉負，百分比沒有意義。", "tr": "選「並非限制」的那個。"}, {"src": "11401-4", "lv": "a", "f": 1, "s": "114-1", "tag": "共同比分析", "q": "編製共同比（Common-size）損益表時：", "o": ["每個損益表項目均以淨利的百分比表示", "每個損益表項目均以基期金額的百分比表示", "當季損益表項目的金額和以前年度同一季的相對金額比較", "每個損益表項目以銷貨淨額的百分比表示"], "a": 3, "fl": "共同比損益表 ➔ 每個項目 ÷ 銷貨淨額。", "th": "用營收當 100%，看成本和費用各吃掉多少。", "tr": "B 是趨勢分析；C 是季節性比較。"}];
const FA11=[{"src": "11401-22", "f": 5, "s": "114-1", "tag": "融資決策", "q": "關於公司提高負債比率之必然影響，下列敘述何者正確(假設其他因素不變)？甲.提高稅盾(Tax Shield)；乙.提高財務困難成本(Financial Distress Cost)；丙.提高加權平均資金成本(Weighted Average Cost of Capital)：", "o": ["僅甲、乙", "僅甲、丙", "僅乙、丙", "甲、乙、丙"], "a": 0, "fl": "提高負債比率必然 ➔ 稅盾增加、財務困難成本增加。", "th": "借越多，利息越多、稅盾越大；違約風險也越高。但 WACC 不一定上升，借得適當時反而會下降。", "tr": "丙「提高 WACC」不是必然，題目強調「必然」。"}, {"src": "11303-49", "f": 5, "s": "113-3", "tag": "內部報酬率", "q": "若一計畫的內部報酬率大於其資金成本率，則表示該計畫之淨現值：", "o": ["大於 0", "小於 0", "等於 0", "不一定大於或小於 0"], "a": 3, "fl": "沒說是典型現金流量 ➔ IRR ＞ 資金成本也「不一定」NPV ＞ 0。", "th": "非典型現金流量（中間又有大筆流出）可能有多個 IRR，IRR 大於資金成本不保證 NPV 為正。", "tr": "官方答案是 D，別被直覺選 A；加了「典型」兩字才會是大於 0。"}, {"src": "11501-48", "f": 4, "s": "115-1", "tag": "報酬率", "q": "假設你投資 500 萬於某一檔股票，3 年來的報酬率分別為 3%、-8%、+15%，3 年後總共的報酬率為：", "o": ["13%", "8.97%", "13.85%", "11.78%"], "a": 1, "fl": "多年總報酬 ➔ 連乘再減 1。", "th": "1.03 × 0.92 × 1.15 = 1.0897，總報酬 8.97%。", "tr": "直接相加 3 − 8 + 15 = 10% 不在選項；本金多少是干擾。"}, {"src": "11403-46", "f": 4, "s": "114-3", "tag": "資金成本", "q": "一投資方案的資金成本是：", "o": ["一個經過充分分散風險投資組合的期望報酬率", "投資方案貸款的利率", "投資人要求與該投資方案風險類似證券之期望報酬率", "銀行基本放款利率"], "a": 2, "fl": "資金成本 ➔ 風險類似證券的期望報酬率。", "th": "投資方案的資金成本就是投資人的機會成本：同樣風險的投資能賺多少。", "tr": "不是貸款利率，也不是銀行基本放款利率。"}, {"src": "11502-25", "f": 3, "s": "115-2", "tag": "選擇權", "q": "下列何者會使得股票賣權(Put Option)的價值增加？", "o": ["標的股票價格增加", "執行價格(Exercise Price)下降", "標的股票的波動性減少", "到期日變長"], "a": 3, "fl": "賣權價值 ↑ ➔ 股價跌、履約價高、波動大、到期長。", "th": "到期日越長，股價跌破履約價的機會越多，賣權越值錢。", "tr": "A、B、C 三個方向都會讓賣權價值「下降」。"}, {"src": "11501-29", "f": 3, "s": "115-1", "tag": "風險種類", "q": "企業無法支付舉債利息或償還本金之風險稱為：", "o": ["購買力風險", "企業風險", "市場風險", "財務風險"], "a": 3, "fl": "付不出利息或還不了本金 ➔ 財務風險。", "th": "財務風險來自舉債，借越多越高。", "tr": "企業風險是本業營運的不確定性。"}, {"src": "11403-44", "f": 3, "s": "114-3", "tag": "貝它", "q": "一般來說，我們會用統計上的迴歸方法來估計：", "o": ["無風險利率", "股票報酬率之共變數", "股票之β 值(Beta)", "股票報酬率之變異數"], "a": 2, "fl": "迴歸分析 ➔ 估 β 值。", "th": "把個股報酬對市場報酬做迴歸，斜率就是 β。", "tr": "變異數、共變數直接用公式算，不需要迴歸。"}, {"src": "11403-14", "f": 3, "s": "114-3", "tag": "融資決策", "q": "下列何者並非發行公司債取得資金的優點？", "o": ["享有稅盾利益", "資金成本低於普通股及特別股", "流動比率上升", "財務槓桿比率下降"], "a": 3, "fl": "發公司債 ➔ 財務槓桿「上升」，不是下降。", "th": "借錢的優點：利息可抵稅（稅盾）、成本比股票低、拿到現金讓流動比率上升。但負債增加，財務槓桿一定變高。", "tr": "選「並非優點」的那個。"}, {"src": "11403-22", "f": 3, "s": "114-3", "tag": "回收期間法", "q": "回收期限法（Payback Period Rule）：", "o": ["未考慮期初的投資", "考慮了一投資計畫所有的現金流量", "考慮了貨幣的時間價值", "在直接應用時不需要考慮資金成本"], "a": 3, "fl": "回收期間法 ➔ 不需要資金成本。", "th": "只算多久能回本，不折現，所以用不到資金成本。", "tr": "缺點是沒考慮時間價值和回本後的現金流量，B、C 都錯。"}, {"src": "11401-45", "f": 3, "s": "114-1", "tag": "貝它", "q": "一公司資產的價值為 500 萬元，負債的價值為 200 萬元，該公司負債的貝它（Beta）為 0.6，權益之貝它為 1.3，試問公司整體的貝它是多少？", "o": ["0.75", "1.14", "1.02", "1.20"], "a": 2, "fl": "公司 β ＝ 權益 β × 權益比重 ＋ 負債 β × 負債比重。", "th": "權益 = 500 − 200 = 300 萬。1.3 × 3/5 + 0.6 × 2/5 = 0.78 + 0.24 = 1.02。", "tr": "直接平均 (1.3 + 0.6) ÷ 2 = 0.95 不在選項，要加權。"}, {"src": "11303-50", "f": 3, "s": "113-3", "tag": "報酬率", "q": "假設你於一年前購得一股票，成本為$45，目前的價格為$48（已除息），而且你剛收到$7 的現金股利，請問報酬率為多少？", "o": ["20.00%", "22.22%", "15.00%", "18.00%"], "a": 1, "fl": "報酬率 ＝（期末價 − 成本 ＋ 股利）÷ 成本。", "th": "(48 − 45 + 7) ÷ 45 = 10 ÷ 45 = 22.22%。", "tr": "分母用買進成本 45，不是現價 48。"}, {"src": "11502-45", "f": 2, "s": "115-2", "tag": "會計報酬率", "q": "某投資計畫每年產生稅後盈餘 2,000 萬元，其投資成本為 1 億元，年限為 10 年，無殘值，其會計報酬率為：", "o": ["100%", "50%", "40%", "20%"], "a": 2, "fl": "會計報酬率 ＝ 平均稅後盈餘 ÷ 平均投資額。", "th": "平均投資 = 1 億 ÷ 2 = 5,000 萬，2,000 ÷ 5,000 = 40%。", "tr": "用原始投資 1 億當分母會選 D 的 20%。"}, {"src": "11501-27", "f": 2, "s": "115-1", "tag": "負債成本", "q": "永平公司決定在下年度發行票面利率等於 14%的債券，該公司認為，它可以按照某特定價格將債券賣給投資人，而在此一價格下，投資人能夠獲得 16%的收益率，假定稅率等於 17%，則永平公司的稅後負債成本為何？", "o": ["11.62%", "12.8%", "13.28%", "14.8%"], "a": 2, "fl": "稅後負債成本 ＝ 殖利率 ×（1 − 稅率）。", "th": "用投資人要求的 16%，不是票面利率 14%。16% × 83% = 13.28%。", "tr": "用 14% 算會選 A 的 11.62%。"}, {"src": "11403-48", "f": 2, "s": "114-3", "tag": "評價方法", "q": "以下哪種評價方法在評價時會將評價標的決策彈性納入考量？", "o": ["傳統淨現值法", "成本加成法", "實質選擇權法", "回收期間法"], "a": 2, "fl": "考慮決策彈性 ➔ 實質選擇權法。", "th": "實質選擇權把延後、擴充、放棄等管理彈性的價值算進去。", "tr": "傳統 NPV 假設決策一次定案，沒有彈性。"}, {"src": "11403-45", "f": 2, "s": "114-3", "tag": "貝它", "q": "假設某一股票之報酬率在市場報酬率為正時，其皆為負，且市場報酬率為負時，它皆為正，則此股票的β 值(Beta)：", "o": ["大於 0", "小於 0", "等於 0", "資料不足，無法判斷"], "a": 1, "fl": "跟市場反向 ➔ β ＜ 0。", "th": "β 衡量個股跟大盤一起動的程度；方向完全相反就是負值。", "tr": "β ＝ 0 是跟市場無關，不是反向。"}, {"src": "11403-47", "f": 2, "s": "114-3", "tag": "CAPM", "q": "根據資本資產定價模式，資產期望報酬率有差異的原因是在於下列何者不同？", "o": ["β 值(Beta)", "市場風險溢價", "無風險利率", "標準差"], "a": 0, "fl": "CAPM ➔ 期望報酬不同只因為 β 不同。", "th": "E(R) = 無風險利率 + β × 市場風險溢酬。無風險利率和市場溢酬對每個資產都一樣，只有 β 不同。", "tr": "標準差包含可分散風險，CAPM 不給補償。"}, {"src": "11402-25", "f": 2, "s": "114-2", "tag": "資本預算", "q": "假設某公司有一設備，帳面金額為$70,000，公司將其出售，利益為$60,000，所得稅率為 17%，試問此交易所產生之淨現金流入為：", "o": ["$119,800", "$60,000", "$101,500", "$130,000"], "a": 0, "fl": "出售資產淨現金 ＝ 售價 − 利益 × 稅率。", "th": "售價 = 70,000 + 60,000 = 130,000。利益要繳稅 60,000 × 17% = 10,200。淨流入 119,800。", "tr": "130,000 是忘了繳稅；60,000 只算利益。"}, {"src": "11402-24", "f": 2, "s": "114-2", "tag": "投資評估", "q": "評估投資計畫最好的方法為何？", "o": ["還本法", "IRR 法", "NPV 法", "利潤指數法"], "a": 2, "fl": "最好的方法 ➔ NPV。", "th": "NPV 考慮時間價值、全部現金流量，結果直接代表增加多少財富，還可以相加。", "tr": "IRR 可能有多重解或排序衝突。"}, {"src": "11401-50", "f": 2, "s": "114-1", "tag": "內部報酬率", "q": "使得淨現值為 0 之折現率稱為：", "o": ["資金成本率", "會計報酬率", "必要報酬率", "內部報酬率"], "a": 3, "fl": "讓 NPV ＝ 0 的折現率 ➔ IRR。", "th": "IRR 的定義就是讓未來現金流量現值剛好等於投資成本的折現率。", "tr": "資金成本率、必要報酬率是拿來跟 IRR 比的標準。"}, {"src": "11401-42", "f": 2, "s": "114-1", "tag": "投資評估", "q": "針對不同年限投資計畫的評估選擇，下列何種方法較適合？", "o": ["會計報酬率法", "內部報酬率法", "等值年金法", "獲利率指數法"], "a": 2, "fl": "年限不同的計畫 ➔ 等值年金法。", "th": "把 NPV 換成每年的等額現金流量，年限不同也能公平比較。", "tr": "獲利率指數法適合資金有限時排序。"}, {"src": "11302-47", "f": 2, "s": "113-2", "tag": "加權平均資金成本", "q": "若中洲電信公司權益資金成本是 20%，舉債利率是 10%，所得稅率是 17%，已知公司負債權益比率是 6：4，並知道公司將全部向銀行貸款來擴建新的機房，試問中洲電信公司之加權平均資金成本是（假設不考慮兩稅合一）：", "o": ["8.36%", "10.65%", "12.98%", "15%"], "a": 2, "fl": "WACC ＝ 負債比重 × 利率 ×（1 − 稅率）＋ 權益比重 × 權益成本。", "th": "60% × 10% × 83% + 40% × 20% = 4.98% + 8% = 12.98%。", "tr": "雖然這次全部用貸款，WACC 仍用目標資本結構 6：4。"}, {"src": "11203-47", "f": 2, "s": "112-3", "tag": "內部報酬率", "q": "在應用內部報酬率法（IRR）時，若面臨的是典型的現金流量型態之投資計畫，則接受投資的條件是當內部報酬率：", "o": ["大於 0 時", "等於 0 時", "小於資金成本率時", "大於資金成本率時"], "a": 3, "fl": "典型現金流量 ➔ IRR ＞ 資金成本就接受。", "th": "先流出後流入的典型專案，IRR 比資金成本高，代表報酬超過成本，NPV 為正。", "tr": "跟上一題對照：有「典型」就選大於資金成本。"}, {"src": "11203-30", "f": 2, "s": "112-3", "tag": "風險種類", "q": "企業在取得資產後，無法在需要賣出時出售或必須大幅降價出售之風險稱為：", "o": ["流動性風險", "財務風險", "企業風險", "購買力風險"], "a": 0, "fl": "想賣賣不掉、要大降價才能賣 ➔ 流動性風險。", "th": "資產變現能力差，就是流動性風險。", "tr": "財務風險是舉債付不出利息；購買力風險是通膨。"}, {"src": "11203-29", "f": 2, "s": "112-3", "tag": "破產成本", "q": "破產的間接成本主要是由誰來負擔？", "o": ["股東", "債權人", "政府", "競爭對手"], "a": 0, "fl": "破產間接成本 ➔ 股東負擔。", "th": "破產風險讓客戶、供應商不信任，營運受損，價值縮水最後由股東吸收。", "tr": "直覺以為債權人受害，但成本透過較高利率轉回給股東。"}, {"src": "11202-36", "f": 2, "s": "112-2", "tag": "融資決策", "q": "下列何者非為舉債可能導致之影響？", "o": ["利息費用增加", "負債比率提高", "營業情況佳時產生槓桿利益", "所得稅將提高"], "a": 3, "fl": "舉債 ➔ 利息抵稅，所得稅「降低」。", "th": "利息費用讓課稅所得變少，所得稅反而少繳。", "tr": "利息增加、負債比率提高、景氣好時有槓桿利益，都是舉債的影響。"}, {"src": "11202-25", "f": 2, "s": "112-2", "tag": "投資評估", "q": "評估投資專案時最應關切：", "o": ["現金流量", "稅前會計淨利", "稅後會計淨利", "折舊與重置成本"], "a": 0, "fl": "評估投資專案 ➔ 看現金流量，不看會計淨利。", "th": "錢是真的流進流出，會計淨利會受折舊方法等影響。", "tr": "稅前、稅後會計淨利都不是重點。"}, {"src": "11003-33", "f": 2, "s": "110-3", "tag": "金融市場", "q": "金融證券發行之市場稱為：", "o": ["初級市場", "次級市場", "三級市場", "基本市場"], "a": 0, "fl": "證券第一次發行 ➔ 初級市場。", "th": "發行公司直接把新證券賣給投資人是初級市場；之後投資人之間買賣是次級市場。", "tr": "沒有「三級市場」「基本市場」這種常見說法。"}, {"src": "11502-22", "f": 1, "s": "115-2", "tag": "投資組合", "q": "如果甲資產平均報酬率為 0.08，乙資產平均報酬率為 0.14，則投資組合包括甲與乙資產各 50%，其組合平均報酬率為何？", "o": ["0.095", "0.12", "0.11", "0.10"], "a": 2, "fl": "投資組合報酬 ＝ 加權平均。", "th": "0.08 × 50% + 0.14 × 50% = 0.11。", "tr": "投資組合「報酬」直接加權平均；投資組合「風險」才要考慮共變數。"}, {"src": "11403-21", "f": 1, "s": "114-3", "tag": "租賃", "q": "假設負債的利率為 15%，稅率為 17%，則在計算融資租賃價值時應用的折現率為多少？", "o": ["2.4%", "9.6%", "12.45%", "20%"], "a": 2, "fl": "融資租賃折現率 ➔ 稅後負債成本。", "th": "15% × (1 − 17%) = 12.45%。", "tr": "用稅前 15% 不在選項；9.6% 是亂乘的。"}, {"src": "11502-27", "lv": "a", "f": 1, "s": "115-2", "tag": "資本預算", "q": "下列何者不是資本預算的主要問題？", "o": ["互相排斥投資計畫選擇", "品質交換問題", "不同年限投資計畫選定", "資本額度或預算之分配"], "a": 1, "fl": "資本預算主要問題 ➔ 互斥選擇、年限不同、資金分配；沒有「品質交換」。", "th": "資本預算處理的是哪個計畫該做、資金怎麼分配。", "tr": "選「不是」的那個。"}, {"src": "11502-48", "lv": "a", "f": 1, "s": "115-2", "tag": "回收期間法", "q": "投資計畫採還本法評估其可行性，下列何者為其缺點？", "o": ["未考慮投資規模及還本後的現金流量", "未考慮風險", "未考慮貨幣時間價值", "選項(A)(B)(C)皆是"], "a": 3, "fl": "還本法缺點 ➔ 規模、回本後現金、風險、時間價值都沒考慮。", "th": "還本法只問多久回本，其他什麼都不看。", "tr": "全選。"}, {"src": "11502-46", "lv": "a", "f": 1, "s": "115-2", "tag": "貨幣時間價值", "q": "年金(Annuity)是指：", "o": ["在未來一段期間中一系列等額給付之現值", "在未來一段期間之期末定額之給付", "在未來一段期間中一系列等額之給付", "在未來一段期間中一系列金額遞增之給付"], "a": 2, "fl": "年金 ➔ 一段期間內一系列等額給付。", "th": "每期金額相同、間隔相同，就是年金。", "tr": "A 加了「現值」兩字就不是定義；遞增的是成長年金。"}, {"src": "11501-32", "lv": "a", "f": 1, "s": "115-1", "tag": "CAPM", "q": "一證券期望報酬率之高低與下列何者較無關係？", "o": ["可以分散的風險", "無風險利率", "影響證券風險高低因素之風險溢酬（Risk Premium）", "證券報酬率之風險"], "a": 0, "fl": "可分散的風險 ➔ 不影響期望報酬。", "th": "市場只補償不能分散的系統風險，可分散的風險自己分散掉就好。", "tr": "無風險利率、風險溢酬都會影響期望報酬。"}, {"src": "11403-24", "lv": "a", "f": 1, "s": "114-3", "tag": "資本預算", "q": "下列何者不影響每期淨現金流量？", "o": ["折舊方法的改變", "折現率變動", "期末資產處分損失", "收入變動"], "a": 1, "fl": "折現率 ➔ 影響現值，不影響各期淨現金流量。", "th": "折舊方法會改變稅負、處分損失有抵稅效果、收入變動直接影響現金，只有折現率是算現值時才用。", "tr": "折舊本身不付現，但會影響所得稅。"}, {"src": "11403-50", "lv": "a", "f": 1, "s": "114-3", "tag": "資本預算", "q": "評估投資計畫時，其年限應採下列何者為宜？", "o": ["長期資產經濟年限", "長期資產實體年限", "長期資產法定年限", "長期資產實體耐用年限"], "a": 0, "fl": "投資計畫年限 ➔ 經濟年限。", "th": "資產能帶來經濟效益的期間才是有意義的評估期間。", "tr": "實體年限、法定年限都可能比實際有用的期間長。"}, {"src": "11402-28", "lv": "a", "f": 1, "s": "114-2", "tag": "選擇權", "q": "下列何者可增加買權的價值？", "o": ["距到期日的時間縮短", "利率較高", "標的資產價值變動小", "選項(A)(B)(C)皆是"], "a": 1, "fl": "利率上升 ➔ 買權價值增加。", "th": "利率高時，履約價的現值變低，買權比較值錢。", "tr": "到期時間縮短、波動小都會讓買權價值下降。"}, {"src": "11402-29", "lv": "a", "f": 1, "s": "114-2", "tag": "CAPM", "q": "根據資本資產定價模式(CAPM)，樂樂公司股票的期望報酬率低於無風險利率，則下列敘述何者正確？", "o": ["樂樂公司股票的 β(貝他係數)值低於零", "樂樂公司的股票風險幾近於無限大", "樂樂公司股票價格嚴重被低估", "樂樂公司股票價格嚴重被高估"], "a": 0, "fl": "期望報酬低於無風險利率 ➔ β ＜ 0。", "th": "E(R) = Rf + β × (Rm − Rf)，要比 Rf 低，β 一定是負的。", "tr": "不能推出股價被高估或低估。"}, {"src": "11401-47", "lv": "a", "f": 1, "s": "114-1", "tag": "獲利率指數", "q": "利潤指數（Profitability Index）是：", "o": ["內部報酬率與資金成本率之比率", "總收入與總成本之比率", "內部報酬率與市場報酬率之比率", "現金流量現值對期初投資成本之比率"], "a": 3, "fl": "PI ＝ 未來現金流量現值 ÷ 期初投資。", "th": "PI ＞ 1 代表每投入 1 元能回收超過 1 元現值。", "tr": "不是 IRR 和資金成本的比。"}, {"src": "11401-46", "lv": "a", "f": 1, "s": "114-1", "tag": "淨現值", "q": "有關淨現值法的優點，下列敘述何者正確？甲、對現金流量折現時未考慮到貨幣的時間價值；乙、未考慮到投資計畫的全部現金流量；丙、不符合價值可加原則；丁、考慮了投資風險：", "o": ["僅乙、丙", "僅甲、丁", "僅甲、丙、丁", "僅丁"], "a": 3, "fl": "NPV 的優點 ➔ 考慮投資風險（只有丁對）。", "th": "NPV 考慮時間價值、全部現金流量，而且可以相加。甲、乙、丙都是反過來寫的缺點。", "tr": "三個錯誤敘述都在講「未考慮」「不符合」。"}];
const FA12=[{"src": "11402-42", "f": 6, "s": "114-2", "tag": "比率影響", "q": "淨值為正之企業，處分不動產、廠房及設備產生損失將使負債比率？", "o": ["降低", "提高", "不變", "不一定"], "a": 1, "fl": "處分損失 ➔ 資產、權益減少，負債不變 ➔ 負債比率提高。", "th": "賠錢賣設備，資產少了，負債沒動，負債占資產比例上升。", "tr": "淨值為正這個條件是在保證比率小於 1。"}, {"src": "11302-21", "f": 6, "s": "114-2", "tag": "比率影響", "q": "淨值為正之公司，以現金償還 5 年到期之公司債，將使權益比率：", "o": ["降低", "提高", "不變", "不一定"], "a": 1, "fl": "現金還公司債 ➔ 資產減少、權益不變 ➔ 權益比率提高。", "th": "權益比率 = 權益 ÷ 總資產，分母變小、分子不變，比率上升。", "tr": "負債比率則會下降。"}, {"src": "11401-21", "f": 6, "s": "114-2", "tag": "比率影響", "q": "淨值為正數之公司支付已宣告之現金股利將使負債比率：", "o": ["降低", "提高", "不變", "不一定"], "a": 0, "fl": "付已宣告股利 ➔ 負債、資產同額減少 ➔ 負債比率降低。", "th": "負債比率小於 1，分子分母減一樣多，比率下降。例如 40 ÷ 100 = 0.4，各減 10 變 30 ÷ 90 = 0.33。", "tr": "「已宣告」代表負債早就入帳了，發放時只動現金和應付股利。"}, {"src": "11103-41", "f": 6, "s": "113-2", "tag": "權益報酬率", "q": "進寶公司 X5 年度平均權益$150,000，平均負債$150,000，銷貨$150,000，其淨利$90,000，負債利息$10,000，稅率 10%，稅後淨利率 15%，則該公司權益報酬率為何？", "o": ["10.33%", "13.33%", "15%", "20%"], "a": 2, "fl": "用稅後淨利率求淨利，再除以平均權益。", "th": "稅後淨利 = 150,000 × 15% = 22,500，÷ 平均權益 150,000 = 15%。", "tr": "題目給的「淨利 90,000」跟淨利率對不起來，是干擾；依官方答案用淨利率算。"}, {"src": "11403-35", "f": 5, "s": "115-1", "tag": "權益報酬率", "q": "福德公司財務報表顯示：在 X1 年並無付息負債，淨利率為 8%、資產週轉率為 2、平均資產總額為$2,000,000、平均權益為$1,280,000。請問：該公司在 X1 年之權益報酬率為多少？", "o": ["16%", "25%", "36%", "64%"], "a": 1, "fl": "無付息負債 ➔ ROA ＝ 淨利率 × 週轉率；ROE ＝ 淨利 ÷ 權益。", "th": "淨利 = 2,000,000 × 2 × 8% = 320,000，÷ 1,280,000 = 25%。", "tr": "16% 是 ROA，不是 ROE。"}, {"src": "11403-31", "f": 5, "s": "114-3", "tag": "利息保障倍數", "q": "已知某公司的稅後淨利為$5,395,000，所得稅率為 17%，當期的利息費用$500,000 元，則其利息保障倍數為：", "o": ["13.5 倍", "9.24 倍", "10 倍", "14 倍"], "a": 3, "fl": "利息保障倍數 ＝（稅後淨利 ÷（1 − 稅率）＋ 利息）÷ 利息。", "th": "稅前 = 5,395,000 ÷ 83% = 6,500,000，加利息 = 7,000,000，÷ 500,000 = 14。", "tr": "直接用稅後淨利加利息會算出 11.79，要先還原成稅前。"}, {"src": "11501-16", "f": 4, "s": "115-1", "tag": "資產報酬率", "q": "岡山公司 X1 年的資產週轉率為 4 倍，當年度總銷貨收入$1,000,000。如果當年度的淨利為$80,000，請問該公司 X1 年的資產報酬率為（不考慮稅負）：", "o": ["16%", "24%", "32%", "40%"], "a": 2, "fl": "總資產 ＝ 銷貨 ÷ 週轉率；ROA ＝ 淨利 ÷ 總資產。", "th": "總資產 = 1,000,000 ÷ 4 = 250,000，80,000 ÷ 250,000 = 32%。", "tr": "80,000 ÷ 1,000,000 = 8% 是淨利率。"}, {"src": "11403-29", "f": 4, "s": "114-3", "x": 1, "tag": "利息保障倍數", "q": "台北公司 X1 年之平均資產總額為$1,160,000、利息費用$25,000，另外，資產週轉率為 2、淨利率為 6%、所得稅率為 20%。試問該公司 X1 年之利息保障倍數為何？", "o": ["4.82", "6.16", "7.96", "12"], "a": 2, "fl": "銷貨 → 淨利 → 稅前淨利 → 加利息 → 除利息。", "th": "銷貨 = 1,160,000 × 2 = 2,320,000，淨利 = 6% × 2,320,000 = 139,200，稅前 = 139,200 ÷ 80% = 174,000，加利息 = 199,000，÷ 25,000 = 7.96。", "tr": "用稅後淨利直接加利息會選 A 的 6.57 附近。"}, {"src": "11101-15", "f": 4, "s": "113-2", "tag": "資產報酬率", "q": "宮崎公司 110 年度平均總資產$150,000，銷貨$60,000，其淨利$3,000，稅率 25%，利息前淨利率 12.5%，則該公司總資產報酬率為何？", "o": ["10%", "8%", "5%", "4%"], "a": 2, "fl": "ROA ＝ 利息前淨利 ÷ 平均總資產。", "th": "利息前淨利 = 60,000 × 12.5% = 7,500，÷ 150,000 = 5%。", "tr": "用淨利 3,000 會算出 2%（不在選項）。"}, {"src": "11302-23", "f": 4, "s": "113-2", "tag": "權益報酬率", "q": "高知公司 X1 年度平均總資產$160,000，銷貨$50,000，其稅後淨利$25,000，稅率 25%，平均財務槓桿比率為 2，則該公司權益報酬率為何？", "o": ["18.75%", "31.25%", "12.5%", "25%"], "a": 1, "fl": "平均權益 ＝ 平均總資產 ÷ 財務槓桿比率。", "th": "權益 = 160,000 ÷ 2 = 80,000，ROE = 25,000 ÷ 80,000 = 31.25%。", "tr": "用總資產當分母會算出 15.6%。"}, {"src": "11302-22", "f": 4, "s": "113-2", "tag": "資本結構", "q": "某公司相關資料如下：流動負債 20 億元、長期負債 30 億元、不動產、廠房及設備 50 億元、長期資金占不動產、廠房及設備比率為 1.6，求公司的流動資產總額？", "o": ["50 億元", "60 億元", "70 億元", "80 億元"], "a": 0, "fl": "長期資金 ＝ 1.6 × 不動產廠房設備，倒推權益和總資產。", "th": "長期資金 = 1.6 × 50 = 80 億，權益 = 80 − 30 = 50 億。總資產 = 20 + 30 + 50 = 100 億，流動資產 = 100 − 50 = 50 億。", "tr": "長期資金是長期負債加權益，不含流動負債。"}, {"src": "11502-15", "f": 3, "s": "115-2", "tag": "杜邦分析", "q": "下列作法何者能使公司之權益報酬率(ROE)提高？(各作法為獨立情況) 甲.降低營業費用率；乙.提高資產使用率；丙.降低負債利率", "o": ["僅甲、乙", "僅甲、丙", "僅乙、丙", "甲、乙、丙"], "a": 3, "fl": "ROE 提高 ➔ 降費用率、提高資產使用率、降負債利率都可以。", "th": "降營業費用率和負債利率都讓淨利變多；提高資產使用率就是提高週轉率。", "tr": "三個都對。"}, {"src": "11502-28", "f": 3, "s": "115-2", "tag": "財務槓桿", "q": "乙公司的借款利率為 7.5%，總資產報酬率為 6.5%，所得稅率為 20%。若乙公司以此條件舉債投資新計畫，將使得權益報酬率如何變動？", "o": ["降低", "增加", "不變", "不一定"], "a": 1, "fl": "稅後借款利率 ＜ 總資產報酬率 ➔ 舉債會讓 ROE 增加。", "th": "稅後借款成本 = 7.5% × (1 − 20%) = 6%，低於總資產報酬率 6.5%，借來的錢賺得比成本多，ROE 上升。", "tr": "直接拿稅前 7.5% 比 6.5% 會以為 ROE 下降，要用稅後利率比。"}, {"src": "11203-2", "f": 3, "s": "115-1", "tag": "比率影響", "q": "流動比率大於 1 時，償還應付帳款將使流動比率：", "o": ["增加", "減少", "不變", "不一定"], "a": 0, "fl": "流動比率 ＞ 1，分子分母一起減 ➔ 比率上升。", "th": "例如 200 ÷ 100 = 2，各減 50 變 150 ÷ 50 = 3。", "tr": "流動比率 ＜ 1 時結果相反，要看題目給的條件。"}, {"src": "11402-43", "f": 3, "s": "114-2", "tag": "資產報酬率", "q": "下列何者無法使總資產報酬率提高？", "o": ["提高淨利率", "增加銷貨", "提高總資產週轉率", "降低不動產、廠房及設備對長期資金比率"], "a": 3, "fl": "ROA ＝ 淨利率 × 資產週轉率 ➔ 跟長期資金比率無關。", "th": "提高淨利率、增加銷貨、提高週轉率都能讓 ROA 上升；不動產廠房設備對長期資金比率是資本結構指標。", "tr": "選「無法提高」的那個。"}, {"src": "11203-14", "f": 3, "s": "114-2", "tag": "資產報酬率", "q": "下列何者無法使資產報酬率提高？", "o": ["提高權益比率", "提高資產週轉率", "提高淨利率", "增加銷貨"], "a": 0, "fl": "權益比率 ➔ 影響 ROE，不影響 ROA。", "th": "ROA = 淨利率 × 資產週轉率，跟資金來自負債還是權益無關。", "tr": "權益比率是槓桿面的指標。"}, {"src": "11402-12", "f": 3, "s": "114-2", "tag": "權益報酬率", "q": "富山公司於 113 年底宣告股票股利 2,000,000 股（每股面值$10），當時每股市價為$50。該公司 113 年度稅後利息費用為$1,260,000，淨利為$24,000,000，宣告股票股利前之平均權益為$200,000,000。該公司 113 年度之權益報酬率為：", "o": ["12.63%", "12.00%", "13.33%", "10.91%"], "a": 1, "fl": "股票股利不影響權益 ➔ ROE ＝ 淨利 ÷ 平均權益。", "th": "24,000,000 ÷ 200,000,000 = 12%。宣告股票股利是權益內部移轉。", "tr": "把稅後利息加回會算 ROA 的分子，題目問的是 ROE。"}, {"src": "11303-4", "f": 3, "s": "113-3", "tag": "比率影響", "q": "設流動比率為 3:1，速動比率為 1:1，如以部分現金償還應付帳款，則：", "o": ["流動比率下降", "流動比率不變", "速動比率下降", "速動比率不變"], "a": 3, "fl": "比率 ＝ 1 時分子分母同減 ➔ 不變；比率 ＞ 1 ➔ 上升。", "th": "速動比率 1：1，用現金還應付帳款，分子分母一樣減，還是 1。流動比率 3：1 會上升。", "tr": "A、B 錯在流動比率會上升。"}, {"src": "11201-12", "f": 3, "s": "113-2", "tag": "資本結構", "q": "福井公司的相關資料如下：流動負債 3,000 億元、流動資產 5,000 億元、不動產、廠房及設備 7,000 億元、自有資金比率為 60%，則該公司的長期負債為何？", "o": ["4,000 億元", "6,000 億元", "8,000 億元", "1,800 億元"], "a": 3, "fl": "長期負債 ＝ 總資產 ×（1 − 自有資金比率）− 流動負債。", "th": "總資產 5,000 + 7,000 = 12,000 億，負債 40% = 4,800 億，減流動負債 3,000 = 1,800 億。", "tr": "4,800 是全部負債，還沒扣流動負債。"}, {"src": "11302-20", "f": 3, "s": "113-2", "tag": "比率影響", "q": "山梨公司以現金償還長期借款（考量利息變動），則：", "o": ["速動比率下降", "利息保障倍數不變", "長期資金占不動產、廠房及設備之比率不變", "權益比率不變"], "a": 0, "fl": "現金還長期借款 ➔ 速動資產減少、流動負債不變 ➔ 速動比率下降。", "th": "現金是速動資產，長期借款不是流動負債，所以分子變小、分母不變。", "tr": "利息減少會讓利息保障倍數上升；權益比率也會上升。"}, {"src": "11301-16", "f": 3, "s": "113-1", "tag": "營運資金週轉", "q": "仁國公司 X3 年度平均流動資產$800,000，平均流動負債$350,000，銷貨收入淨額$150,000，銷貨成本$105,000，稅後淨利率 10%，則仁國公司營運資金週轉率為何？", "o": ["10%", "33.33%", "9%", "18.75%"], "a": 1, "fl": "營運資金週轉率 ＝ 銷貨淨額 ÷ 平均營運資金。", "th": "平均營運資金 = 800,000 − 350,000 = 450,000。150,000 ÷ 450,000 = 33.33%。", "tr": "銷貨成本、淨利率都是干擾。"}, {"src": "11203-43", "f": 3, "s": "113-1", "x": 1, "tag": "權益報酬率", "q": "假設芊芊公司 X1 年底平均資產總額為$2,800,000，平均負債總額為$1,600,000，利息費用為 $140,000，所得稅率為 20%，總資產報酬率為 12%，則權益報酬率為何？", "o": ["12.00%", "13.33%", "10.56%", "18.67%"], "a": 3, "fl": "淨利 ＝ ROA × 總資產 − 利息 ×（1 − 稅率）。", "th": "ROA 的分子含稅後利息：12% × 2,800,000 = 336,000，扣稅後利息 140,000 × 80% = 112,000，淨利 224,000。權益 2,800,000 − 1,600,000 = 1,200,000，ROE = 18.67%。", "tr": "直接 336,000 ÷ 1,200,000 = 28% 不在選項；別忘了扣稅後利息。"}, {"src": "11201-3", "f": 3, "s": "112-1", "tag": "營業循環", "q": "全智公司購買商品存貨均以現金付款，銷貨則採賒銷方式，該公司本年度之存貨週轉率為 12，應收帳款週轉率為 15，則其營業循環約為：（假設一年以 365 天計）", "o": ["13.5 天", "54.7 天", "30.4 天", "24.3 天"], "a": 1, "fl": "營業循環 ＝ 存貨週轉天數 ＋ 應收帳款週轉天數。", "th": "365 ÷ 12 = 30.4 天，365 ÷ 15 = 24.3 天，合計 54.7 天。", "tr": "C、D 分別只算了一半。"}, {"src": "11201-14", "f": 3, "s": "112-1", "tag": "比率影響", "q": "發放已宣告之現金股利對總資產報酬率與權益報酬率之影響分別為：", "o": ["增加，不變", "增加，減少", "不變，不變", "減少，不變"], "a": 0, "fl": "發放已宣告股利 ➔ 資產減少 ➔ ROA 增加；權益不變 ➔ ROE 不變。", "th": "宣告時權益已經減少；發放時只是現金和負債同時減少，總資產變小，ROA 上升，權益不受影響。", "tr": "如果題目是「宣告」股利，權益才會減少。"}, {"src": "11101-37", "f": 3, "s": "112-1", "tag": "比率影響", "q": "指撥保留盈餘與發放股票股利對權益報酬率之影響分別為何？", "o": ["降低，降低", "不變，降低", "降低，不變", "不變，不變"], "a": 3, "fl": "指撥保留盈餘、股票股利 ➔ 權益總額不變 ➔ ROE 不變。", "th": "兩者都是權益內部項目搬家，淨利和權益總額都沒變。", "tr": "不要以為保留盈餘減少 ROE 就會變。"}, {"src": "11502-14", "f": 2, "s": "115-2", "tag": "資產報酬率", "q": "偉鈞公司的總資產報酬率為 12%，淨利率為 6%，淨銷貨收入為$200,000，試問平均總資產為多少？(假設公司未舉債)", "o": ["$200,000", "$100,000", "$5,000", "$8,000"], "a": 1, "fl": "平均總資產 ＝ 淨利 ÷ ROA。", "th": "淨利 = 200,000 × 6% = 12,000，12,000 ÷ 12% = 100,000。", "tr": "沒舉債，ROA 不用調利息。"}, {"src": "11502-12", "f": 2, "s": "115-2", "tag": "比率影響", "q": "甲公司以現金方式銷售商品，存貨採永續盤存制，售價低於成本，則：", "o": ["流動資產不變", "速動比率增加", "固定支出保障倍數不變", "現金流量為固定支出之倍數不變"], "a": 1, "fl": "現金銷售（賠錢賣）➔ 現金增加、存貨減少 ➔ 速動比率上升。", "th": "收到的現金進入速動資產，減少的存貨不在速動資產內，所以速動比率上升；流動資產因為賠錢賣而減少。", "tr": "A 錯在流動資產其實減少了。"}, {"src": "11501-14", "f": 2, "s": "115-1", "tag": "比率影響", "q": "到期時償還應付帳款對利息保障倍數之影響為：", "o": ["增加", "減少", "不變", "不一定"], "a": 2, "fl": "還應付帳款 ➔ 利息和盈餘都不變 ➔ 利息保障倍數不變。", "th": "應付帳款不計息，還了也不影響損益。", "tr": "跟流動比率題長得很像，但問的是利息保障倍數。"}, {"src": "11501-15", "f": 2, "s": "115-1", "tag": "週轉率", "q": "淨銷貨為$200,000，期初總資產為$60,000，資產週轉率為 5，請問期末總資產為：", "o": ["$40,000", "$35,000", "$30,000", "$20,000"], "a": 3, "fl": "平均總資產 ＝ 銷貨 ÷ 週轉率，再倒推期末。", "th": "平均 = 200,000 ÷ 5 = 40,000，期末 = 40,000 × 2 − 60,000 = 20,000。", "tr": "40,000 是平均數，不是期末數。"}, {"src": "11403-15", "f": 2, "s": "114-3", "tag": "財務槓桿", "q": "羅斯福公司在無負債的狀況下，其稅前總資產報酬率為 22%。若不考慮稅負，且該公司負債與權益比率為 0.2，利率為 2%，則其權益報酬率為何？", "o": ["26%", "27.8%", "23.9%", "17.25%"], "a": 0, "fl": "ROE ＝ ROA ＋（ROA − 利率）× 負債／權益。", "th": "22% + (22% − 2%) × 0.2 = 22% + 4% = 26%。", "tr": "不考慮稅，直接代公式即可。"}, {"src": "11403-32", "f": 2, "s": "114-3", "tag": "利息保障倍數", "q": "某公司稅前純益為$200,000，第一優先債券利息費用為$30,000，第二優先債券利息費用 $10,000，第三優先債券利息費用$20,000，則第二優先債券盈餘支付利息倍數為何？", "o": ["5", "4", "3", "6.5"], "a": 3, "fl": "第二順位保障倍數 ➔ EBIT ÷（第一 ＋ 第二順位利息）。", "th": "EBIT = 200,000 + 30,000 + 10,000 + 20,000 = 260,000。260,000 ÷ 40,000 = 6.5。", "tr": "只除第二順位利息會高估；分子要先把所有利息加回。"}, {"src": "11402-33", "f": 2, "s": "114-2", "tag": "比率影響", "q": "哈利企業償還進貨帳款時獲得 20%之折扣，將使流動比率：", "o": ["增加", "減少", "無影響", "不一定"], "a": 3, "fl": "還應付帳款又拿折扣 ➔ 流動比率不一定。", "th": "流動資產和流動負債同時減少，原本流動比率大於 1 或小於 1 結果不同，再加上折扣影響，答案是不一定。", "tr": "題目沒說流動比率是多少，就是「不一定」的訊號。"}, {"src": "11303-17", "f": 2, "s": "113-3", "tag": "杜邦分析", "q": "某公司的權益報酬率為 15%，負債／權益比為 0.8，則總資產報酬率為：", "o": ["7.78%", "8%", "8.33%", "12%"], "a": 2, "fl": "ROA ＝ ROE ÷（1 ＋ 負債／權益）。", "th": "權益乘數 = 1 + 0.8 = 1.8，15% ÷ 1.8 = 8.33%。", "tr": "15% ÷ 0.8 或 × 0.8 都是錯的。"}, {"src": "11303-34", "f": 2, "s": "113-3", "tag": "速動比率", "q": "芳鄰公司的流動比率為 1，若芳鄰公司的流動負債為$10,000，流動資產包括現金、應收帳款、存貨及預付費用，已知存貨為$1,000、預付費用為$500，則其酸性比率（速動比率）應為何？", "o": ["0.8", "1.2", "0.85", "0.9"], "a": 2, "fl": "速動資產 ＝ 流動資產 − 存貨 − 預付費用。", "th": "流動資產 = 10,000，速動資產 = 10,000 − 1,000 − 500 = 8,500，÷ 10,000 = 0.85。", "tr": "只扣存貨會選 D 的 0.9。"}, {"src": "11001-16", "f": 2, "s": "113-2", "tag": "資本結構", "q": "某公司相關資料如下：流動負債 20 億元、長期負債 30 億元、流動資產 50 億元、不動產、廠房及設備 50 億元(無其他非流動資產)，求公司的長期資金占不動產、廠房及設備之比率？", "o": ["1", "1.3", "1.6", "1.9"], "a": 2, "fl": "長期資金 ÷ 不動產廠房設備 ＝（長期負債 ＋ 權益）÷ PPE。", "th": "總資產 100 億，負債 50 億，權益 50 億。(30 + 50) ÷ 50 = 1.6。", "tr": "權益要用總資產減總負債推出來。"}, {"src": "11302-24", "f": 2, "s": "113-2", "tag": "杜邦分析", "q": "巴黎公司與倫敦公司總資產報酬率相同，且已知前者淨利率較後者為高，試問哪一家可能為鋼鐵公司，而哪一家為電腦維修公司？", "o": ["因總資產報酬率一樣，兩者行業種類相同", "前者為電腦維修公司", "後者為電腦維修公司", "無法判斷"], "a": 2, "fl": "ROA 相同、淨利率高 ➔ 週轉率低 ➔ 資本密集（鋼鐵）。", "th": "鋼鐵業需要大量設備，週轉慢但單筆利潤高；電腦維修資產少、週轉快、淨利率低。所以巴黎是鋼鐵，倫敦是電腦維修。", "tr": "B 剛好反過來。"}, {"src": "11302-5", "f": 2, "s": "113-2", "tag": "速動比率", "q": "群馬公司速動比率為 1.5，存貨占流動資產的 1/5，無預付費用及其他流動資產，流動負債為 $600,000，則該公司之流動資產為若干？", "o": ["$1,125,000", "$900,000", "$875,000", "$750,000"], "a": 0, "fl": "速動資產 ＝ 1.5 × 流動負債 ＝ 流動資產 × 4/5。", "th": "速動資產 = 1.5 × 600,000 = 900,000，流動資產 = 900,000 ÷ 0.8 = 1,125,000。", "tr": "900,000 只是速動資產。"}, {"src": "11301-40", "f": 2, "s": "113-1", "tag": "利息保障倍數", "q": "宜蘭公司本期稅後淨利$664,000，所得稅率 17%，非流動負債$10,600,000，流動負債$1,800,000，利息費用$200,000，利率 10%。請問宜蘭公司本期之利息保障倍數為何？", "o": ["3.5 倍", "5 倍", "8 倍", "7 倍"], "a": 1, "fl": "稅後淨利先還原稅前，再加利息除利息。", "th": "664,000 ÷ 83% = 800,000，加 200,000 = 1,000,000，÷ 200,000 = 5。", "tr": "負債金額和利率是干擾，題目已給利息費用。"}, {"src": "11202-13", "f": 2, "s": "112-2", "x": 1, "tag": "權益報酬率", "q": "智平公司資產總額$4,000,000，負債總額$1,000,000，平均利率 6%，若總資產報酬率為 12%，稅率為 35%，則權益報酬率為若干？", "o": ["14%", "14.7%", "15%", "15.3%"], "a": 1, "fl": "淨利 ＝ ROA × 總資產 − 利息 ×（1 − 稅率）。", "th": "12% × 4,000,000 = 480,000，稅後利息 = 1,000,000 × 6% × 65% = 39,000，淨利 441,000。權益 3,000,000，ROE = 14.7%。", "tr": "忘記利息要稅後會算出 14%。"}, {"src": "11102-17", "f": 2, "s": "112-1", "tag": "杜邦分析", "q": "下列何者不會影響公司的權益報酬率？", "o": ["總資產週轉率", "淨利率", "平均財務槓桿比率", "選項(A)(B)(C)皆有影響"], "a": 3, "fl": "ROE ＝ 淨利率 × 總資產週轉率 × 財務槓桿 ➔ 三個都會影響。", "th": "杜邦分析把 ROE 拆成這三個乘數，任何一個變動 ROE 都跟著變。", "tr": "選「不會影響」，但三個都會，所以選 D。"}, {"src": "11201-35", "f": 2, "s": "112-1", "tag": "杜邦分析", "q": "阪新公司的權益報酬率在 111 年度大幅降低，可能的原因為何？", "o": ["淨利率下降", "總資產週轉率降低", "平均財務槓桿比率降低", "選項(A)(B)(C)皆有可能"], "a": 3, "fl": "ROE 下降 ➔ 淨利率、週轉率、財務槓桿任一下降都有可能。", "th": "三個乘數任何一個變小，ROE 都會變小。", "tr": "全選。"}, {"src": "11102-5", "f": 2, "s": "111-2", "tag": "經營效率", "q": "在公司營業呈穩定狀況下，應收帳款週轉天數的減少表示：", "o": ["公司實施降價促銷措施", "公司給予客戶較長的折扣期間及賒欠期限", "公司之營業額減少", "公司授信政策轉嚴"], "a": 3, "fl": "應收週轉天數減少 ➔ 授信變嚴（收款變快）。", "th": "給客戶的賒帳期間縮短，錢收得更快，天數就變少。", "tr": "給較長的賒欠期限會讓天數「增加」。"}, {"src": "11102-16", "f": 2, "s": "111-2", "tag": "資本結構", "q": "長期資金對不動產、廠房及設備的比率，可衡量企業以長期資金購買不動產、廠房及設備的能力。這裏所稱的長期資金是指：", "o": ["長期負債", "權益", "長期負債加權益", "權益減流動負債"], "a": 2, "fl": "長期資金 ➔ 長期負債 ＋ 權益。", "th": "長期資金是公司可以長期使用的錢，包括長期借款和股東資金。", "tr": "只有權益或只有長期負債都不完整。"}, {"src": "11403-13", "f": 1, "s": "114-3", "tag": "負債比率", "q": "山口公司 113 年相關資料如下：淨利$300,000、所得稅費用$150,000、利息費用 $150,000、流動負債$250,000、長期負債$500,000、資產總額$1,500,000、不動產、廠房及設備$750,000、特別股股利$80,000，該公司之負債比率為若干？", "o": ["60%", "50%", "40%", "42.86%"], "a": 1, "fl": "負債比率 ＝ 總負債 ÷ 總資產。", "th": "(250,000 + 500,000) ÷ 1,500,000 = 50%。", "tr": "只用長期負債或淨利、利息都是干擾。"}, {"src": "11403-33", "f": 1, "s": "114-3", "tag": "杜邦分析", "q": "甲公司今年的純益率為 11.4%，資產週轉率 1.34，權益比率 0.67，則該公司今年度的權益報酬率(ROE)為多少（假設公司未舉債）？", "o": ["15.28%", "10.23%", "22.80%", "12.70%"], "a": 2, "fl": "ROE ＝ 淨利率 × 週轉率 ÷ 權益比率。", "th": "11.4% × 1.34 = 15.28%（ROA），÷ 0.67 = 22.8%。", "tr": "15.28% 是 ROA；題目說未舉債又給權益比率 0.67，照公式除就好。"}, {"src": "11502-3", "lv": "a", "f": 1, "s": "115-2", "tag": "營運資金", "q": "營運資金不足，但企業仍能繼續經營之可能原因？", "o": ["營運週轉速度快", "企業不動產、廠房及設備及負債比例大", "企業股本很大", "選項(A)(B)(C)皆是"], "a": 0, "fl": "營運資金不足還能撐 ➔ 週轉速度快。", "th": "存貨和應收帳款很快變成現金，就能及時還短期債務。", "tr": "股本大、固定資產比例大都幫不上短期付款。"}, {"src": "11403-12", "lv": "a", "f": 1, "s": "114-3", "tag": "比率分類", "q": "負債比率、利息保障倍數、固定支出保障倍數等都是作為：", "o": ["負債管理比率", "流動性比率", "經營效率比率", "獲利能力比率"], "a": 0, "fl": "負債比率、利息保障、固定支出保障 ➔ 負債管理比率。", "th": "三個都在看公司借了多少、付不付得起利息。", "tr": "不是流動性比率（那是流動比率、速動比率）。"}, {"src": "11402-13", "lv": "a", "f": 1, "s": "114-2", "tag": "流動比率", "q": "甲公司速動比率為 1.4，預付費用為流動資產的 10%，存貨為流動資產的 20%，則流動比率為：", "o": ["2", "2.22", "1.75", "1.94"], "a": 0, "fl": "速動資產占流動資產 70% ➔ 流動比率 ＝ 速動比率 ÷ 0.7。", "th": "扣掉預付 10% 和存貨 20%，速動資產是流動資產的 70%。1.4 ÷ 0.7 = 2。", "tr": "只扣存貨會用 0.8 算出 1.75。"}, {"src": "11402-34", "lv": "a", "f": 1, "s": "114-2", "tag": "短期涵蓋比率", "q": "若武當山公司每年銷貨成本為$285,000，營業費用為$100,000（非現金費用為$20,000），其速動資產為$7,000，試問該公司短期涵蓋比率為何（假設一年為 365 天）？", "o": ["5", "6", "7", "8"], "a": 2, "fl": "短期涵蓋比率 ＝ 速動資產 ÷ 每日付現營業支出。", "th": "付現支出 = 285,000 + 100,000 − 20,000 = 365,000，每天 1,000。7,000 ÷ 1,000 = 7 天。", "tr": "非現金費用 20,000 要扣掉。"}, {"src": "11401-6", "lv": "a", "f": 1, "s": "114-1", "tag": "比率影響", "q": "下列何者不是流動比率降低的可能原因？", "o": ["存貨採零庫存方式", "給予客戶的信用條件轉趨嚴謹", "存貨過時造成損失", "壞帳確定無法收回"], "a": 3, "fl": "確定壞帳沖銷 ➔ 應收和備抵同減 ➔ 流動比率不變。", "th": "沖銷時借備抵、貸應收，應收帳款淨額不變。", "tr": "零庫存、授信變嚴（收現後再還債）、存貨損失都可能讓流動比率降低。"}, {"src": "11401-29", "lv": "a", "f": 1, "s": "114-1", "tag": "經營效率", "q": "某百貨公司年終舉行跳樓大拍賣，不計成本，出清存貨，請問其正面效果會是：", "o": ["改善銷貨毛利率", "改善營運資金的週轉能力", "提高每股盈餘", "改善淨值報酬率"], "a": 1, "fl": "不計成本出清存貨 ➔ 存貨變現金 ➔ 營運資金週轉改善。", "th": "賠錢賣會傷毛利、EPS 和 ROE，但存貨快速變成現金，週轉能力變好。", "tr": "題目問「正面」效果，其他三個都是負面。"}];

<script>
const LAW1=[{"src": "11502-7", "f": 3, "s": "115-2", "tag": "公司負責人", "q": "依公司法規定，下列何者股份有限公司人員，於執行職務範圍內，亦為負責人？甲、檢查人；乙、重整人；丙、發起人；丁、發言人", "o": ["僅甲、乙、丙", "僅乙、丙、丁", "僅甲、丙、丁", "僅甲、乙、丁"], "a": 0, "fl": "職務範圍內也是負責人 ➔ 檢查人、重整人、發起人（還有清算人、臨時管理人、經理人）。", "th": "公司法第 8 條第 2 項：經理人、清算人、臨時管理人、發起人、監察人、檢查人、重整人或重整監督人，在執行職務範圍內也是負責人。", "tr": "「發言人」不在名單裡，看到丁就刪。舊題寫「甲、乙、丙」，新題寫「僅甲、乙、丙」，答案相同。"}, {"src": "11502-1", "f": 2, "s": "115-2", "tag": "公司解散", "q": "依「公司法」規定，股份有限公司發生下列何種情事，應予解散？", "o": ["董事長決定之任何原因", "監察人決定之任何原因", "股東會為解散之決議", "法律無限制"], "a": 2, "fl": "股份有限公司「應予解散」➔ 股東會解散決議。", "th": "解散是公司存亡大事，只有股東會能決議；董事長、監察人沒有這個權限。", "tr": "「法律無限制」是亂槍打鳥的選項。"}, {"src": "11501-5", "f": 2, "s": "115-1", "tag": "申報平臺", "q": "因應公司法第 22 條之 1 之修正並促進公司資訊透明及落實洗錢防制作為，公司自民國 107 年 11 月 1 日起應依法於「公司負責人及主要股東資訊申報平臺」申報負責人及主要股東資訊，其有變動者，並應於變動後多少日內為之？", "o": ["15 日", "20 日", "30 日", "60 日"], "a": 0, "fl": "負責人及主要股東資訊有變動 ➔ 變動後 15 日內申報。", "th": "公司法第 22 條之 1 為了洗錢防制，公司要在「公司負責人及主要股東資訊申報平臺」申報，資料變動後 15 日內更新。", "tr": "15 日常和 30 日、60 日混淆；記「變動 15 天」。"}, {"src": "11403-2", "f": 2, "s": "114-3", "tag": "關係企業", "q": "公司持有他公司有表決權之股份，超過該他公司已發行有表決權之股份總數多少者，應於事實發生之日起多久以內，以書面通知該他公司？", "o": ["三分之一；十五日", "三分之一；一個月", "二分之一；五日", "二分之一；十日"], "a": 1, "fl": "持有他公司表決權股份「超過三分之一」➔ 1 個月內書面通知。", "th": "公司法關係企業章：持股超過他公司三分之一，就要在事實發生起一個月內，書面通知對方公司。", "tr": "三分之一配一個月；別和二分之一（控制從屬）、公開收購的 10 日、質權的 5 日／15 日混在一起。"}, {"src": "11502-8", "lv": "a", "f": 1, "s": "115-2", "tag": "法人股東", "q": "下列有關法人股東之敘述，何者錯誤？", "o": ["法人當選為董事或監察人者，應指定自然人代表行使職務", "代表人權限來自法人，故法人對代表權所加之限制，得對抗任何第三人", "法人股東之代表人得當選為公司之董事", "代表人得隨時改派補足原任期"], "a": 1, "fl": "法人對代表人權限的限制 ➔ 不得對抗善意第三人。", "th": "法人可以限制代表人的權限，但外人不知道，所以這個限制不能拿來對抗善意第三人。", "tr": "B 說「得對抗任何第三人」就是錯的；代表人可隨時改派、補足原任期是對的。"}, {"src": "11501-13", "lv": "a", "f": 1, "s": "115-1", "tag": "法規適用", "q": "有關「公司法」與「證券交易法」之敘述，下列何者正確？", "o": ["「公司法」僅規範未公開發行公司", "「公司法」乃「證券交易法」之特別法", "有價證券之募集發行與買賣事項，優先適用「證券交易法」", "「證券交易法」僅限規範上市上櫃公司"], "a": 2, "fl": "有價證券募集、發行、買賣 ➔ 優先適用證券交易法（特別法）。", "th": "證交法是公司法的特別法，證券相關事項先看證交法，沒規定才回到公司法。", "tr": "B 把特別法和普通法寫反；公司法也規範公開發行公司，A、D 都錯。"}, {"src": "11501-14", "lv": "a", "f": 1, "s": "115-1", "tag": "法規適用", "q": "證券交易法規範何種型態之公司？", "o": ["有限公司", "閉鎖性公司", "兩合公司", "股份有限公司"], "a": 3, "fl": "證券交易法規範 ➔ 股份有限公司。", "th": "只有股份有限公司能發行股票公開募集，證交法管的就是它。", "tr": "閉鎖性公司雖然也是股份有限公司的一種，但不能公開發行。"}, {"src": "11401-31", "lv": "a", "f": 1, "s": "114-1", "tag": "普通股", "q": "以下何者非普通股之基本特性？", "o": ["表彰公司之所有權", "無限清償責任", "投票權", "盈餘分配"], "a": 1, "fl": "普通股股東 ➔ 有限責任，不是「無限清償責任」。", "th": "股東只就出資額負責，公司倒了最多賠掉投資的錢。", "tr": "所有權、投票權、盈餘分配都是普通股的基本特性。"}];
const LAW2=[{"src": "11003-7", "f": 4, "s": "112-3", "tag": "審計委員會", "q": "依公開發行公司審計委員會行使職權辦法，審計委員會應至少__召開一次？", "o": ["每月", "每季", "每半年", "每年"], "a": 1, "fl": "審計委員會開會頻率 ➔ 至少「每季」一次。", "th": "審計委員會和董事會一樣，至少每季開會一次。", "tr": "每月、每半年、每年都是干擾；董事會也是每季。"}, {"src": "11203-6", "f": 4, "s": "112-3", "tag": "董事會", "q": "依現行法令規定，公開發行公司董事會應至少多久召開一次？", "o": ["每一季", "每四個月", "每半年", "每年"], "a": 0, "fl": "公開發行公司董事會 ➔ 至少「每季」召開一次。", "th": "董事會議事辦法規定公開發行公司董事會至少每季召開一次。", "tr": "「每四個月」是陷阱；審計委員會同樣是每季。"}, {"src": "11402-1", "f": 3, "s": "114-3", "tag": "股東會召集", "q": "公開發行公司股東臨時會之召集，公司應於多久前通知持有記名股票之股東？", "o": ["十日", "十五日", "二十日", "三十日"], "a": 1, "fl": "公開發行公司：常會 30 日前、臨時會 15 日前通知。", "th": "公開發行公司股東較多，通知期間比一般公司長。", "tr": "非公開發行公司是常會 20 日、臨時會 10 日；別和停止過戶的 60 日／30 日混。"}, {"src": "11403-3", "f": 3, "s": "114-3", "tag": "股東會召集", "q": "公開發行公司召集股東常會，應於多久前通知公司記名股東？", "o": ["五日", "十日", "三十日", "四十五日"], "a": 2, "fl": "公開發行公司常會 ➔ 30 日前通知。", "th": "常會 30 日、臨時會 15 日。", "tr": "選 45 日或 10 日都是記錯。"}, {"src": "11401-2", "f": 3, "s": "114-1", "tag": "特別決議", "q": "公開發行公司受讓他人全部營業或財產，對公司營運有重大影響者，得以有代表已發行股份總數多少股東出席股東會，以出席股東表決權三分之二以上之同意行之？", "o": ["五分之四", "四分之三", "三分之二", "過半數"], "a": 3, "fl": "公開發行公司特別決議 ➔ 過半數出席、出席 2/3 同意。", "th": "一般特別決議是 2/3 出席、出席過半同意；公開發行公司出席不足時，可以改用「過半數出席、出席 2/3 同意」。", "tr": "兩種門檻的分子分母剛好對調，最容易混。"}, {"src": "11103-1", "f": 3, "s": "113-1", "tag": "法定盈餘公積", "q": "股份有限公司於彌補虧損完納一切稅捐後，分派盈餘時，除了法定盈餘公積，已達實收資本額時外，依法應提出多少法定盈餘公積？", "o": ["百分之十", "百分之二十", "百分之三十", "百分之五十"], "a": 0, "fl": "法定盈餘公積 ➔ 提 10%，提到等於實收資本額為止。", "th": "公司賺錢先補虧損、繳稅，再提 10% 當法定盈餘公積。", "tr": "證券商的「特別盈餘公積」才是 20%，兩個很常被放在一起考。"}, {"src": "11201-47", "f": 3, "s": "112-1", "tag": "終止上市", "q": "上市櫃公司申請終止有價證券買賣，以下程序何者錯誤？", "o": ["須設置特別委員會進行審議", "須經董事會決議通過", "須提請股東會決議且經公司已發行股份總數 1/2 以上股東之同意", "以上皆正確"], "a": 2, "fl": "申請終止上市櫃 ➔ 股東會特別決議（2/3 出席、出席過半同意），還要特別委員會、董事會。", "th": "下市影響所有股東，所以要董事會決議、特別委員會審議，再經股東會「已發行股份總數三分之二以上」同意。", "tr": "選錯誤的敘述；C 寫成二分之一以上同意，應該是三分之二。"}, {"src": "11102-10", "f": 3, "s": "111-2", "tag": "停止過戶", "q": "公開發行公司股東名簿變更記載，應注意於股東臨時會開會前幾日內，不得為之？", "o": ["十日", "二十日", "三十日", "六十日"], "a": 2, "fl": "停止過戶：常會 60 日、臨時會 30 日（公開發行）。", "th": "股東名簿在開會前要凍結，才能確定誰有權出席。公開發行公司常會前 60 日、臨時會前 30 日內不得變更記載。", "tr": "非公開發行公司是常會 30 日、臨時會 15 日；別和召集通知期間搞混。"}, {"src": "11502-2", "f": 2, "s": "115-2", "tag": "發起人", "q": "股份有限公司之發起人訂立章程，應經過：", "o": ["發起人全體之同意", "發起人三分之二同意", "發起人四分之一同意", "發起人二分之一同意"], "a": 0, "fl": "發起人訂立章程 ➔ 全體同意。", "th": "章程是公司的根本大法，發起人要全體同意並簽名。", "tr": "三分之二、二分之一都是干擾。"}, {"src": "11401-4", "f": 2, "s": "114-1", "tag": "獨立董事", "q": "依「證券交易法」規定，下列何種企業應設置獨立董事？", "o": ["已公開發行之金融控股公司", "上市（櫃）電子公司", "已上市（櫃）之期貨商", "選項(A)(B)(C)均應設置"], "a": 3, "fl": "應設獨立董事 ➔ 金控、上市櫃公司、期貨商全部都要。", "th": "金管會規定上市櫃公司、金融控股公司、期貨商等都要設獨立董事。", "tr": "全選。"}, {"src": "11303-13", "f": 2, "s": "113-3", "tag": "獨立董事", "q": "已依我國證券交易法規定選任獨立董事公開發行股份有限公司，有重大之資產或衍生性商品交易事項於提董事會討論時，如獨立董事有反對意見或保留意見，請問應如何處理？", "o": ["董事會議不得為決議", "董事會議所為決議無效", "應於董事會議事錄記載", "董事會議所為決議得撤銷"], "a": 2, "fl": "獨立董事反對或保留 ➔ 記載於董事會議事錄。", "th": "獨立董事的反對意見要寫進議事錄，讓股東和主管機關看得到，但不影響決議效力。", "tr": "不是「不得決議」或「決議無效」。"}, {"src": "11303-28", "f": 2, "s": "113-3", "tag": "視訊股東會", "q": "公司召開實體股東會，並以視訊加以輔助，股東會議事手冊及會議補充資料，應如何發放？", "o": ["股東會現場發放", "以電子檔案傳送至視訊會議平台", "股東會現場發放，並以電子檔案傳送至視訊會議平台", "股東會現場發放，或以電子檔案傳送至視訊會議平台，二者擇一"], "a": 2, "fl": "實體＋視訊輔助 ➔ 議事手冊現場發放「並」傳到視訊平台。", "th": "兩種參加方式都要拿得到資料，所以兩邊都要提供。", "tr": "D 寫「二者擇一」是陷阱，要兩個都做。"}, {"src": "11303-42", "f": 2, "s": "113-3", "tag": "股東提案權", "q": "關於股東提案權之規定，下列敘述何者正確？", "o": ["董事會違法拒絕將股東之合法提案列入股東會議程者，將受到有期徒刑 1 年以下之處罰", "股東須繼續持有公司股份達 1 年以上，且比例達百分之一以上始有提案權", "持有無表決權股份之股東若總數達已發行股份總數百分之一以上者，亦有股東提案權", "股東提案權於股東常會及股東臨時會均得行使"], "a": 2, "fl": "股東提案權 ➔ 持股 1%（含無表決權股），只限股東常會。", "th": "持有已發行股份總數 1% 以上就能提案，不要求持有期間；只能在常會提。", "tr": "B 多加「繼續 1 年」；D 說臨時會也能提，錯。"}, {"src": "11303-5", "f": 2, "s": "113-3", "tag": "董事", "q": "有關董事之解任，下列敘述何者正確？", "o": ["董事訂有任期者，若任期未滿遭公司解任且無正當理由，該董事得請求公司賠償其損害", "董事在任期中轉讓超過選任當時持有之公司股份之三分之一時，董事當然解任", "董事執行業務有重大損害公司的行為，僅能由股東會決議將其解任", "選項(A)(B)(C)皆正確"], "a": 0, "fl": "任期未滿無正當理由被解任 ➔ 董事可請求公司賠償。", "th": "股東會可以隨時解任董事，但沒有正當理由解任，公司要賠償。", "tr": "公開發行公司董事任期中轉讓超過二分之一才當然解任，不是三分之一。"}, {"src": "11302-15", "f": 2, "s": "113-2", "tag": "董事會", "q": "試問公開發行公司除經主管機關核准者外，董事間應有如何比例之席次，不得具配偶或二等親以內之親屬關係？", "o": ["超過二分之一", "超過三分之一", "超過四分之一", "超過三分之二"], "a": 0, "fl": "董事間配偶或二親等 ➔ 不得超過「二分之一」席次。", "th": "為了避免家族把持，公開發行公司董事之間有配偶或二親等關係的不能超過半數。", "tr": "監察人之間或與董事間至少一席不得有此關係；別記成三分之一。"}, {"src": "11302-23", "f": 2, "s": "113-2", "tag": "假決議", "q": "下列何一事項，得適用假決議規定？", "o": ["變更章程", "公司資產負債表等會計表冊之承認", "董事競業行為之許可", "選項(A)(B)(C)皆可適用"], "a": 1, "fl": "可用假決議 ➔ 普通決議事項（例如承認會計表冊）。", "th": "出席不足但達三分之一時，可以先做假決議；只適用普通決議事項。", "tr": "變更章程、競業許可都是特別決議，不能用假決議。"}, {"src": "11301-17", "f": 2, "s": "113-1", "tag": "審計委員會", "q": "依「證券交易法」之規定，公開發行公司設置審計委員會者，應如何作成決議？", "o": ["應由審計委員會成員三分之二以上同意", "應由審計委員會成員三分之一以上同意", "應由審計委員會成員二分之一以上同意", "應由審計委員會成員全體同意"], "a": 2, "fl": "審計委員會決議 ➔ 全體成員「二分之一」以上同意。", "th": "審計委員會由全體獨立董事組成，決議門檻是全體成員過半數。", "tr": "董事會代行時才是三分之二。"}, {"src": "11301-2", "f": 2, "s": "113-1", "tag": "獨立董事", "q": "依現行法令規定，公開發行公司獨立董事之提名方式為何？", "o": ["依章程任意規定", "依章程載明之候選人提名制度", "依董事會推薦名單", "並無規定"], "a": 1, "fl": "獨立董事提名 ➔ 候選人提名制度（章程載明）。", "th": "獨立董事一定要採候選人提名制度，由股東從名單中選出。", "tr": "不是任意規定，也不是董事會推薦就好。"}, {"src": "11301-34", "f": 2, "s": "113-1", "tag": "庫藏股", "q": "股票已上市上櫃之公司，為維護公司信用得經下列何者之同意買回公司股份，不受「公司法」§167 第 1 項規定之限制？", "o": ["股東會決議", "股東特別決議", "假決議", "董事會特別決議"], "a": 3, "fl": "上市櫃公司為維護信用買回 ➔ 董事會特別決議（2/3 出席、出席過半同意）。", "th": "證交法第 28 條之 2：上市櫃公司買回股份經董事會三分之二以上出席、出席董事過半數同意即可，不受公司法限制。", "tr": "不需要股東會；「假決議」是股東會的概念。"}, {"src": "11301-7", "f": 2, "s": "113-1", "tag": "股利", "q": "公開發行公司發放股票股利，原則上應事前經下列何者之同意通過？", "o": ["股東會之普通決議", "董事會之普通決議", "股東會之特別決議", "董事長個人之決定"], "a": 2, "fl": "發放「股票」股利 ➔ 股東會特別決議。", "th": "用發新股的方式分盈餘會稀釋股權，要股東會特別決議（2/3 出席、出席過半同意）。", "tr": "現金股利可由董事會特別決議（章程授權）；股票股利一定要股東會。"}, {"src": "11203-2", "f": 2, "s": "112-3", "tag": "審計委員會", "q": "依「證券交易法」之規定，未經審計委員會全體成員二分之一以上同意之事項，得由全體董事多少比例以上同意行之？", "o": ["二分之一", "三分之二", "四分之三", "五分之四"], "a": 1, "fl": "未經審計委員會 1/2 同意 ➔ 可由全體董事 2/3 以上同意代替。", "th": "審計委員會不同意時，董事會還能用全體董事三分之二的高門檻通過，並在議事錄記載審計委員會的決議。", "tr":
